<script>
/* ===== HEXIS HUB GATE — έλεγχος entitlement (kostos) ===== */
(function(){
  var MODULE = 'kostos';
  var SB = 'https://oucqqudfdimccgowvpqp.supabase.co';
  var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im91Y3FxdWRmZGltY2Nnb3d2cHFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyNzQyNjIsImV4cCI6MjA5Njg1MDI2Mn0.7Am1tSulJrkWlsm_Vv9xz5RlvpxoYGYSL3237UaQ8S8';
  var CK = 'hx_gate_' + MODULE, TTL = 7 * 864e5; // offline χάρη 7 ημερών μετά από επιτυχή έλεγχο
  document.documentElement.style.visibility = 'hidden';
  function allow(){
    document.documentElement.style.visibility = '';
    try{ localStorage.setItem(CK, String(Date.now())); }catch(e){}
    try{
      var pl = JSON.parse(atob(tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
      fetch(SB + '/rest/v1/user_activity', {
        method: 'POST',
        headers: { apikey: KEY, Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates' },
        body: JSON.stringify({ user_id: pl.sub, last_seen: new Date().toISOString(), last_app: MODULE })
      }).catch(function(){});
    }catch(e){}
  }
  function deny(u){ location.replace(u); }
  function devId(){
    try{
      var d = localStorage.getItem('hx_device_id');
      if(!d){ d = (self.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + '-' + Math.random().toString(36).slice(2); localStorage.setItem('hx_device_id', d); }
      return d;
    }catch(e){ return 'ls-unavailable-' + MODULE; }
  }
  function denyDevices(){
    document.documentElement.style.visibility = '';
    document.body.innerHTML = '<div style="font-family:system-ui,sans-serif;padding:60px 20px;text-align:center;color:#1F2836;max-width:520px;margin:0 auto">'
      + '<h2 style="margin-bottom:8px">Όριο συσκευών (4/4)</h2>'
      + '<p style="color:#5B6675;margin-bottom:14px">Ο λογαριασμός σου είναι ήδη συνδεδεμένος σε 4 συσκευές. Αποσύνδεσε μια παλιά συσκευή από το HEXIS Hub (Λογαριασμός → Συσκευές) και δοκίμασε ξανά.</p>'
      + '<a href="hub.html" style="color:#E05A12;font-weight:700">&larr; Επιστροφή στο HEXIS Hub</a></div>';
  }
  function checkDevice(cb){
    fetch(SB + '/rest/v1/rpc/register_device', {
      method: 'POST',
      headers: { apikey: KEY, Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_device_id: devId(), p_label: (navigator.userAgent || '').slice(0, 120) })
    }).then(function(r){ return r.ok ? r.json() : true; })   // αν λείπει το RPC ακόμα: μην κλειδώσεις
      .then(function(ok){ cb(ok !== false); })
      .catch(function(){ cb(true); });                        // πρόβλημα δικτύου: καλύπτεται από offline cache
  }
  function cachedOk(){ try{ var t = +localStorage.getItem(CK); return t && (Date.now() - t) < TTL; }catch(e){ return false; } }
  function offlineMsg(){
    document.documentElement.style.visibility = '';
    document.body.innerHTML = '<div style="font-family:system-ui,sans-serif;padding:60px 20px;text-align:center;color:#1F2836">'
      + '<h2 style="margin-bottom:8px">Χρειάζεται σύνδεση στο internet</h2>'
      + '<p style="color:#5B6675;margin-bottom:20px">για τον έλεγχο πρόσβασης του εργαλείου.</p>'
      + '<a href="hub.html" style="color:#E05A12;font-weight:700">&larr; Επιστροφή στο HEXIS Hub</a></div>';
  }
  var raw = null; try{ raw = localStorage.getItem('sb-oucqqudfdimccgowvpqp-auth-token'); }catch(e){}
  var tok = '';
  if (raw) { try{ var s = JSON.parse(raw); tok = s.access_token || (s.currentSession && s.currentSession.access_token) || ''; }catch(e){} }
  if (!tok) { deny('login.html'); return; }
  fetch(SB + '/rest/v1/entitlements?select=module,active,expires_at&module=eq.' + MODULE, {
    headers: { apikey: KEY, Authorization: 'Bearer ' + tok }
  }).then(function(r){
    if (r.status === 401 || r.status === 403) { if (cachedOk()) { allow(); } else { deny('hub.html'); } return null; }
    return r.json();
  }).then(function(rows){
    if (rows === null) return;
    var ok = (rows || []).some(function(e){ return e.active && (!e.expires_at || new Date(e.expires_at) > new Date()); });
    if (ok) { checkDevice(function(devOk){ if (devOk) allow(); else denyDevices(); }); }
    else deny('tool.html?id=' + MODULE);
  }).catch(function(){
    if (cachedOk()) allow(); else offlineMsg();
  });
})();
</script>

/* ===== v1.13: Ιστορικό αναίρεσης ===== */
let HIST = [], HTIMER = null;
function histSnap(){ try{ const s = JSON.stringify(D); if(HIST[HIST.length-1] !== s){ HIST.push(s); if(HIST.length > 60) HIST.shift(); } }catch(_){} }
function histQueue(){ clearTimeout(HTIMER); HTIMER = setTimeout(histSnap, 900); }
function undo(){
 clearTimeout(HTIMER);
 const cur = JSON.stringify(D);
 let s = HIST.pop();
 if(s === cur) s = HIST.pop();
 if(!s){ alert("Δεν υπάρχει προηγούμενη κατάσταση για αναίρεση."); return; }
 D = JSON.parse(s);
 try{ localStorage.setItem("hx_adeia", s); }catch(_){}
 render();
}

function markFilled(scope){
 scope.querySelectorAll("input[data-k],textarea[data-k]").forEach(el=>{
  const f = el.type === "number" ? Math.abs(+el.value) > 0 : String(el.value).trim() !== "";
  el.classList.toggle("filled", f);
 });
}

 }catch(_){ return null; }

function totM2(){ return D.uses.reduce((a,x)=> a + (+x.m2||0), 0); }
function useBudget(x){
 const nv = (+x.m2||0) * (+D.eta||118) * (+x.se||1);
 if(!D.allagi) return nv;
 const oldSe = (x.oldIdx!=null && x.oldIdx>=0 && USES_CATALOG[x.oldIdx]) ? +USES_CATALOG[x.oldIdx].se : 0;
 const ov = (+x.m2||0) * (+D.eta||118) * oldSe;
 return Math.max(0, nv - ov); // διαφορά αλλαγής χρήσης, ελάχιστο 0 ανά γραμμή
}
function usesTotal(which){
 return D.uses.reduce((a,x)=>{

   ? ((x.oldIdx!=null && x.oldIdx>=0 && USES_CATALOG[x.oldIdx]) ? +USES_CATALOG[x.oldIdx].se : 0)
   : (+x.se||1);
  return a + (+x.m2||0) * (+D.eta||118) * se;
 }, 0);
}
function symbatikos(){ if(+D.eadeiesS > 0) return +D.eadeiesS; return D.uses.reduce((a,x)=> a + useBudget(x), 0); }

function beta(base, l, k, m){ if(base<=0||l<=0) return 0; return k + m/Math.cbrt(base/(1000*l)); } // ΤΕΕ: β = κ + μ/³√(Σ/233,68), 233,68 = 1000·λ
function feePart(base, l, k, m, bf){ return base * beta(base,l,k,m) / 100 * (bf||1); }

function amoivesCalc(){
 const S = symbatikos(), l = +D.lambda||0.23368;
 const incP = D.incProsthiki ? 1.30 : 1.00;
 let mel=0, epi=0; const rows=[];
 for(const st of D.studies){
  if(!st.on){ rows.push({...st, melF:0, epiF:0}); continue; }
  const base = S * ((+st.share||0)/100);
  let melF = feePart(base, l, +st.mk, +st.mm, +st.bf) * incP;
  if(st.aseismic) melF *= 1.80;            // αντισεισμικός: μελέτη στατικών +80% (τκ ΤΕΕ)
  let epiF = feePart(base, l, +st.ek, +st.em, +st.bf) * incP;
  if(st.aseismic) epiF *= 1.40;            // αντισεισμικός: επίβλεψη στατικών +40% (ανάλυση ΤΕΕ)
  mel += melF; epi += epiF;
  rows.push({...st, base, melF, epiF});
 }
 // ΚΕΝΑΚ (5601): όπως στο ΤΕΕ — ανά κλάδο, με τα κ/μ του 5601 (2.3/45) επί της βάσης του κλάδου, σε factor %
 const kenak = rows.filter(r=>r.on && [101,301,601,701,1101,1201,1001].includes(r.tM))
   .reduce((a,r)=> a + feePart(r.base, l, 2.3, 45, 1), 0) * ((+D.kenakPct||0)/100) * incP;
 mel += kenak;
 rows.push({s:"ΚΕΝΑΚ (Μελ. Ενεργειακής Απόδοσης)", tM:5601, on:true, melF:kenak, epiF:0, isKenak:true});
 // Τοπογραφικό (2001) — κατ' αποκοπή
 const topo = +D.topoFlat||0;
 mel += topo;
 rows.push({s:"Τοπογραφικό διάγραμμα", tM:2001, on:topo>0, melF:topo, epiF:0, isTopo:true});
 // Ελάχιστη συνολική νόμιμη αμοιβή: 5000×λ
 const minPay = 5000 * l;
 return {rows, mel, epi, sum: mel+epi, minPay, belowMin: (mel+epi) < minPay};
}
function prasinoCalc(){
 if(!D.ektosSxediou) return 0;
 // Άρθ.32 §1 ν.4759/2020 (εγκ. ΥΠΕΝ/ΔΑΟΚΑ): 5% επί ΣΥΜΒΑΤΙΚΟΥ ή 5‰ επί ΑΝΑΛΥΤΙΚΟΥ προϋπολογισμού
 const mode = D.prasMode || "p5";
 const base = mode==="m5" ? ((+D.analytP||0) > 0 ? +D.analytP : symbatikos()) : symbatikos();
 const p = base * (mode==="m5" ? 0.005 : 0.05);
 return Math.min(5000, Math.max(250, p));  // ελάχιστο 250 € — μέγιστο 5.000 €
}
/* ΑΕΚΚ — τυπική ποιοτική σύνθεση ανά είδος εργασίας (επί % κ.β., ενδεικτική πρακτική ΣΣΕΔ/ΕΜΠ) */
const EKA_NEW = [["17 01 01","Σκυρόδεμα",.40],["17 01 02","Τούβλα",.25],["17 01 03","Πλακίδια και κεραμικά",.10],["17 02 01","Ξύλο",.05],["17 04 07","Ανάμεικτα μέταλλα",.05],["17 08 02","Υλικά δομικών κατασκευών με βάση τον γύψο",.08],["17 09 04","Μεικτά απόβλητα δομικών κατασκευών",.07]];
const EKA_DEM = [["17 01 01","Σκυρόδεμα",.50],["17 01 02","Τούβλα",.25],["17 01 03","Πλακίδια και κεραμικά",.05],["17 04 07","Ανάμεικτα μέταλλα",.05],["17 02 01","Ξύλο",.03],["17 09 04","Μεικτά απόβλητα δομικών κατασκευών",.12]];
const EKA_REN = [["17 01 07","Μείγμα σκυροδέματος, τούβλων, πλακιδίων, κεραμικών",.45],["17 08 02","Υλικά δομικών κατασκευών με βάση τον γύψο",.15],["17 02 01","Ξύλο",.08],["17 02 03","Πλαστικά",.05],["17 04 07","Ανάμεικτα μέταλλα",.05],["17 09 04","Μεικτά απόβλητα δομικών κατασκευών",.22]];

function aekkCalc(){
 const A = D.aekk || (D.aekk = defAekk());
 const rows = [];
 const add = (eka, per, t) => {
  if(t <= 0.0005) return;
  const r = rows.find(x => x.eka === eka);
  if(r) r.t += t; else rows.push({eka, per, t});
 };
 // Εκσκαφές: όγκος × πυκνότητα, μείον επιτόπου αξιοποίηση (αυτοδιαχείριση χωμάτων)
 const excGross = A.excOn ? (+A.excM3||0) * (+A.excDens||0) : 0;
 const excReuse = A.excOn ? Math.min((+A.excReuseM3||0) * (+A.excDens||0), excGross) : 0;
 if(A.excOn) add("17 05 04", "Χώματα και πέτρες (εκτός 17 05 03)", excGross - excReuse);
 // Νέα κατασκευή: συνολικά μ² × kg/μ²
 if(A.newOn){ const t = totM2() * ((+D.aekkKg||0)/1000); EKA_NEW.forEach(([e,p,f]) => add(e, p, t*f)); }
 // Κατεδάφιση: μ² × t/μ²
 if(A.demOn){ const t = (+A.demM2||0) * (+A.demT||0); EKA_DEM.forEach(([e,p,f]) => add(e, p, t*f)); }
 // Ανακαίνιση: μ² × t/μ²
 if(A.renOn){ const t = (+A.renM2||0) * (+A.renT||0); EKA_REN.forEach(([e,p,f]) => add(e, p, t*f)); }

 const excT  = rows.filter(r => r.eka.startsWith("17 05")).reduce((a,r)=>a+r.t, 0);
 const restT = rows.reduce((a,r)=>a+r.t, 0) - excT;
 const tons  = excT + restT;
 const cost  = excT*(+A.excEur||0) + restT*(+D.aekkEur||0) + (+D.aekkEgy||0);
 // Εγγυητική ΚΥΑ 36259/2010 άρθ.7: 0,5% προϋπ. (κατασκευές/κατεδαφίσεις) · 0,2% (αποκλειστικά εκσκαφές)
 const P = symbatikos();
 const egy = A.egyMode==="man" ? (+A.egyManual||0) : P * (A.egyMode==="a02" ? 0.002 : 0.005);
 return {tons, cost, excT, restT, excGross, excReuse, egy, P, rows};
}
function foroCalc(){
 const a = amoivesCalc();
 const fpa = a.sum * (+D.fpa||0)/100;
 const parakr = a.sum * (+D.parakr||0)/100;
 const tee = a.sum * (+D.teeKrat||0)/1000;
 const prasino = prasinoCalc();
 const aekk = aekkCalc();
 const other = (+D.dimosFee||0) + (+D.eadeiesFee||0);
 return {a, fpa, parakr, tee, prasino, aekk, other, cash: a.sum + fpa + tee + prasino + aekk.cost + other};
}
function mzms(days){ // Μέσος Ζυγισμένος Μειωτικός Συντελεστής (εγκ. 13/99)
 if(days<=3000) return 1.00;

 if(days<=30000) return 0.85;
 return 0.80;
}
function efkaMatFor(mode){
 if(mode==="2a"){ if(!D.efkaMat2a) D.efkaMat2a = JSON.parse(JSON.stringify(DEF.efkaMat2a)); return D.efkaMat2a; }
 if(mode==="2b"){ if(!D.efkaMat2b) D.efkaMat2b = JSON.parse(JSON.stringify(DEF.efkaMat2b)); return D.efkaMat2b; }
 if(!D.efkaMat) D.efkaMat = JSON.parse(JSON.stringify(DEF.efkaMat));
 return D.efkaMat;
}
function efkaCalc(){
 const mode = D.efkaMode || "1";
 if(!D.efkaCols) D.efkaCols = DEF.efkaCols.slice();
 if(mode==="3"){
  if(!D.efka3) D.efka3 = JSON.parse(JSON.stringify(DEF.efka3));
  const rows = D.efka3.map(r=>{ const lab = (+r.b||0)*(+r.p||0)/100; return {w:r.w, b:+r.b||0, p:+r.p||0, lab}; });
  const labor = rows.reduce((a,r)=>a+r.lab,0);
  const days = (+D.tekmHm>0)? labor/(+D.tekmHm) : 0;
  const cost = labor * ((+D.efkaPct||0)/100);
  return {mode, rows3:rows, labor, days, k:1, raw:days, cost};
 }
 const mat = efkaMatFor(mode);
 const rows=[]; let raw=0;
 for(const r of mat){
  const m2 = +r.m2||0;
  const d = (r.c||[]).reduce((a,c)=> a + m2*(+c||0), 0);
  raw += d; rows.push({x:r.x, m2, d});
 }
 const k = mzms(raw);
 const days = raw * k;
 const cost = days * (+D.tekmHm||0) * ((+D.efkaPct||0)/100);
 return {mode, rows, raw, k, days, cost};
}

function engTotals(id, a){
 a = a || amoivesCalc();
 let mel=0, epi=0;
 for(let i=0;i<D.studies.length;i++){
  const st = D.studies[i], r = a.rows[i];

  if(+st.mEng===+id) mel += r.melF||0;
  if(+st.eEng===+id) epi += r.epiF||0;

 if(arch && +arch.mEng===+id && kenakRow) mel += kenakRow.melF||0;
 if(D.engineers[0] && +D.engineers[0].id===+id && topoRow) mel += topoRow.melF||0;
 return {mel, epi};
}

 <p><b>2. Αμοιβή.</b> Η αμοιβή συμφωνείται στο ποσό των <b>${eur(poso)}</b> πλέον ΦΠΑ ${num(D.fpa)}% (${eur(poso*(+D.fpa||0)/100)}), ήτοι συνολικά <b>${eur(poso*(1+(+D.fpa||0)/100))}</b>.</p>

function dl(name, content, type){
 const b = new Blob([content], {type});
 const a = document.createElement("a");
 a.href = URL.createObjectURL(b); a.download = name; a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
}

    system:"Είσαι βοηθός Έλληνα πολιτικού μηχανικού. Χρησιμοποίησε web search σε ΕΠΙΣΗΜΕΣ πηγές (ΕΦΚΑ εγκύκλιοι, ΤΕΕ, ΦΕΚ, e-Άδειες) και απάντησε ΣΥΝΟΠΤΙΚΑ με λίστα τιμών και την πηγή καθεμιάς.",
    messages:[{role:"user", content:"Δώσε μου τα ΤΡΕΧΟΝΤΑ (σήμερα) για οικοδομική άδεια στην Ελλάδα: 1) κατώτατο ημερομίσθιο εργατοτεχνίτη οικοδόμου (ΣΣΕ/ΕΓΣΣΕ) και τεκμαρτά ΕΦΚΑ, 2) συνολικό ποσοστό ασφαλιστικών εισφορών οικοδομικών ενσήμων (εργοδότη+ασφαλισμένου, με τις μειώσεις 2025-2026), 3) κρατήσεις/τέλη κατά την έκδοση άδειας στο e-Άδειες (ΤΕΕ, ΚΗ, παράβολα), 4) επιβεβαίωση συντελεστή λ ΤΕΕ και ΕΤΑ. Μορφή: αριθμός → τιμή → πηγή."}],
    tools:[{type:"web_search_20250305",name:"web_search"}]
   })});
  if(!res.ok || !res.body){ throw new Error("HTTP "+res.status); }
  const ct = res.headers.get("Content-Type")||"";
  if(!ct.includes("event-stream")){
   const data = await res.json();
   const txt = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
   out.innerHTML = '<div class="note" style="white-space:pre-wrap">'+esc(txt)+'</div>';
   return;
  }
  const reader = res.body.getReader(); const dec = new TextDecoder();
  let buf="", full="";
  for(;;){
   const {done,value} = await reader.read(); if(done) break;
   buf += dec.decode(value,{stream:true});
   const lines = buf.split("\n"); buf = lines.pop();
   for(const ln of lines){
    if(!ln.startsWith("data:")) continue;
    let ev; try{ ev = JSON.parse(ln.slice(5).trim()); }catch(_){ continue; }
    if(ev.type==="content_block_delta" && ev.delta && ev.delta.type==="text_delta"){
     full += ev.delta.text;
     out.innerHTML = '<div class="note" style="white-space:pre-wrap">'+esc(full)+'</div>';
    }
   }
  }
  out.innerHTML += '<div class="note">✅ Πέρασε τις τιμές στα αντίστοιχα πεδία — αποθηκεύονται αυτόματα.</div>';
 }catch(err){
  out.innerHTML = '<div class="note warn">Σφάλμα ('+esc(err.message)+'). Έλεγξε ότι το Edge Function nomothesia-ai είναι deployed και ότι υπάρχει δίκτυο.</div>';
 }
}
