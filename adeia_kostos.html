/* Εκτύπωση */
#printarea{display:none}
@media print{
 @page{margin:13mm 12mm}
 body.printing #printarea{display:block!important}
 body.printing > :not(#printarea){display:none!important}
 body.printing *{visibility:hidden!important}
 body.printing #printarea,body.printing #printarea *{visibility:visible!important}
 body.printing #printarea{position:absolute!important;left:0;top:0;width:100%;background:#fff;color:#111;font-family:Calibri,"Segoe UI",sans-serif;font-size:10.5pt;line-height:1.4}
 #printarea .phead{display:flex;align-items:center;gap:5mm;background:#14213D!important;border-radius:2.5mm;padding:4mm 6mm;margin-bottom:4mm;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
 #printarea .plogo{width:14mm;height:14mm}
 #printarea .pt1{font-size:15pt;font-weight:800;letter-spacing:2px;color:#fff!important}
 #printarea .pt1 span{color:#8FB4EE!important}
 #printarea .pt2{font-size:8pt;color:#93A5C6!important;margin-top:1mm}
 #printarea h1{font-size:14pt;color:#14213D;margin:0 0 2mm}
 #printarea h2{font-size:11.5pt;color:#1F4E9C;border-bottom:1.2pt solid #1F4E9C;padding-bottom:1mm;margin:5mm 0 2.5mm}
 #printarea table{width:100%;border-collapse:collapse;font-size:9.5pt;page-break-inside:auto}
 #printarea th,#printarea td{border:.6pt solid #999;padding:1.6mm 2mm}
 #printarea th{background:#EAF0FA!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
 #printarea td.num,#printarea th.num{text-align:right}
 #printarea .total td{background:#EEF6EE!important;font-weight:800;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
 #printarea .sig{display:flex;justify-content:space-between;margin-top:14mm;text-align:center;font-size:9.5pt}
 #printarea .sig div{width:44%;border-top:.6pt solid #333;padding-top:2mm}
 #printarea .doc p{margin:0 0 2.5mm;text-align:justify}
 #printarea .pfoot{border-top:.8pt solid #C9D6EE;margin-top:6mm;padding-top:2mm;font-size:8pt;color:#666;text-align:center}
 #printarea .pbreak{page-break-before:always}
}

h2{margin:8px 0 6px;font-size:16px}

/* Σημειώσεις: συμπτυγμένες σε 1 γραμμή — κλικ για ανάπτυξη */
.note{font-size:11.5px;padding:4px 8px;margin:5px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.note.open{white-space:normal;overflow:visible;text-overflow:clip}
.note::before{content:"ℹ️ "}
.note.warn::before{content:"⚠️ "}
/* Επισήμανση συμπληρωμένων τιμών — το μάτι πέφτει στις επιλογές */
input.filled,select.filled,textarea.filled{border-color:#E08A2E !important;background:#FFF4E3 !important;color:#7A4A00;font-weight:700}
label:has(>input[type=checkbox]:checked){color:#B25E00;font-weight:700}
tr:has(input.filled)>td:first-child{border-left:3px solid #E08A2E}

.wstep .wico{font-size:20px;line-height:1;margin-top:2px}
.wstep.ok{border-color:#BBE3C5;background:#F3FBF5}
.wstep.warn{border-color:#F2D9A6;background:#FFF9EE}
.wstep b{color:#14213D}
.wstep .wmsg{font-size:13px;color:#3D4B63;margin-top:2px}
.wstep .wgo{margin-left:auto;flex:0 0 auto}
/* ===== v1.18 modern refresh ===== */

body{-webkit-font-smoothing:antialiased}
#tabs{position:sticky;top:0;z-index:120;background:rgba(246,247,249,.92);backdrop-filter:blur(8px);
 padding:8px 10px;margin:0 -10px 10px;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}

table{border-radius:10px;overflow:hidden}

tr:nth-child(even) td{background:#FAFBFD}

<script>
/* ===== HEXIS HUB GATE — έλεγχος entitlement (kostos) ===== */
(function(){
  var MODULE = 'kostos';
  var SB = 'https://oucqqudfdimccgowvpqp.supabase.co';
  var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im91Y3FxdWRmZGltY2Nnb3d2cHFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyNzQyNjIsImV4cCI6MjA5Njg1MDI2Mn0.7Am1tSulJrkWlsm_Vv9xz5RlvpxoYGYSL3237UaQ8S8';
  var CK = 'hx_gate_' + MODULE, TTL = 7 * 864e5; // offline χάρη 7 ημερών μετά από επιτυχή έλεγχο
  document.documentElement.style.visibility = 'hidden';
  function allow(){
    document.documentElement.style.visibility = '';
    try{ localStorage.setItem(CK, String(Date.now())); }catch(e){}
    try{
      var pl = JSON.parse(atob(tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
      fetch(SB + '/rest/v1/user_activity', {
        method: 'POST',
        headers: { apikey: KEY, Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates' },
        body: JSON.stringify({ user_id: pl.sub, last_seen: new Date().toISOString(), last_app: MODULE })
      }).catch(function(){});
    }catch(e){}
  }
  function deny(u){ location.replace(u); }
  function devId(){
    try{
      var d = localStorage.getItem('hx_device_id');
      if(!d){ d = (self.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + '-' + Math.random().toString(36).slice(2); localStorage.setItem('hx_device_id', d); }
      return d;
    }catch(e){ return 'ls-unavailable-' + MODULE; }
  }
  function denyDevices(){
    document.documentElement.style.visibility = '';
    document.body.innerHTML = '<div style="font-family:system-ui,sans-serif;padding:60px 20px;text-align:center;color:#1F2836;max-width:520px;margin:0 auto">'
      + '<h2 style="margin-bottom:8px">Όριο συσκευών (4/4)</h2>'
      + '<p style="color:#5B6675;margin-bottom:14px">Ο λογαριασμός σου είναι ήδη συνδεδεμένος σε 4 συσκευές. Αποσύνδεσε μια παλιά συσκευή από το HEXIS Hub (Λογαριασμός → Συσκευές) και δοκίμασε ξανά.</p>'
      + '<a href="hub.html" style="color:#E05A12;font-weight:700">&larr; Επιστροφή στο HEXIS Hub</a></div>';
  }
  function checkDevice(cb){
    fetch(SB + '/rest/v1/rpc/register_device', {
      method: 'POST',
      headers: { apikey: KEY, Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_device_id: devId(), p_label: (navigator.userAgent || '').slice(0, 120) })
    }).then(function(r){ return r.ok ? r.json() : true; })   // αν λείπει το RPC ακόμα: μην κλειδώσεις
      .then(function(ok){ cb(ok !== false); })
      .catch(function(){ cb(true); });                        // πρόβλημα δικτύου: καλύπτεται από offline cache
  }
  function cachedOk(){ try{ var t = +localStorage.getItem(CK); return t && (Date.now() - t) < TTL; }catch(e){ return false; } }
  function offlineMsg(){
    document.documentElement.style.visibility = '';
    document.body.innerHTML = '<div style="font-family:system-ui,sans-serif;padding:60px 20px;text-align:center;color:#1F2836">'
      + '<h2 style="margin-bottom:8px">Χρειάζεται σύνδεση στο internet</h2>'
      + '<p style="color:#5B6675;margin-bottom:20px">για τον έλεγχο πρόσβασης του εργαλείου.</p>'
      + '<a href="hub.html" style="color:#E05A12;font-weight:700">&larr; Επιστροφή στο HEXIS Hub</a></div>';
  }
  var raw = null; try{ raw = localStorage.getItem('sb-oucqqudfdimccgowvpqp-auth-token'); }catch(e){}
  var tok = '';
  if (raw) { try{ var s = JSON.parse(raw); tok = s.access_token || (s.currentSession && s.currentSession.access_token) || ''; }catch(e){} }
  if (!tok) { deny('login.html'); return; }
  fetch(SB + '/rest/v1/entitlements?select=module,active,expires_at&module=eq.' + MODULE, {
    headers: { apikey: KEY, Authorization: 'Bearer ' + tok }
  }).then(function(r){
    if (r.status === 401 || r.status === 403) { if (cachedOk()) { allow(); } else { deny('hub.html'); } return null; }
    return r.json();
  }).then(function(rows){
    if (rows === null) return;
    var ok = (rows || []).some(function(e){ return e.active && (!e.expires_at || new Date(e.expires_at) > new Date()); });
    if (ok) { checkDevice(function(devOk){ if (devOk) allow(); else denyDevices(); }); }
    else deny('tool.html?id=' + MODULE);
  }).catch(function(){
    if (cachedOk()) allow(); else offlineMsg();
  });
})();
</script>

function topoCalc(){
 const t = D.topo || (D.topo = defTopo());
 const l = +D.lambda||0.23368;
 const rows = []; let sum = 0;
 const add = (per, qty, mon, drx, extra)=>{ if(qty<=0||drx<=0) return; const e = qty*drx*l*(extra||1); rows.push({per, qty, mon, drx, e}); sum += e; };
 // Αποτύπωση
 const tab = TOPO_APOT[t.mode]||{}; const kl = tab[t.klim] || tab[Object.keys(tab)[0]] || {};
 let base = t.mode==="ektos" ? (kl[t.klisi]||0) : (kl[t.kal]||0);
 let extra = 1;
 if(t.mode==="entos"){ extra += ({A:0,B:.10,G:.40,D:.75,E:1.00})[t.klisi]||0; }              // άρθ.9§2
 if(t.mode==="astiko"){ extra += (({A:0,B:.10,G:.40,D:.75,E:1.00})[t.klisi]||0)*0.5; }       // άρθ.10§2 (50%)
 add(`Αποτύπωση ${t.mode==="ektos"?"υπαίθρου (άρθ.8)":t.mode==="entos"?"κατοικημένης (άρθ.9)":"αστική ορθογ. (άρθ.10)"} 1:${t.klim}`, +t.strem, "στρ", base, extra);
 if(t.ypsom && +t.strem>0 && base>0) add("Υψομέτρηση (60% αποτύπωσης — άρθ.8§2)", +t.strem, "στρ", base*0.60, extra);
 // Όμορα — κτηματογραφική
 const om = (TOPO_OMORA[t.mode]||{})[t.klim] || (TOPO_OMORA[t.mode]||{})["500"] || 0;
 add("Κτηματογραφική αποτύπωση ομόρων (άρθ.13/14/15)", +t.omora, "στρ", om);
 // Εξάρτηση — τριγωνισμοί (άρθ.5)
 add("Τριγωνομετρικό σημείο IV τάξης", +t.trigIV, "τεμ", 4550);
 add("Εμπροσθοτομία/Οπισθοτομία", +t.trigTomi, "τεμ", 1950);
 add("Αναγνώριση/χρήση υπάρχ. τριγωνομετρικού", +t.trigXr, "τεμ", 390);
 // Πολυγωνομετρία (άρθ.6)
 add(`Πολυγωνικό σημείο ${t.mode==="ektos"?"(εκτός κατοικ.)":"(εντός κατοικ.)"}`, +t.polyN, "τεμ", t.mode==="ektos"?260:390);
 // Εφαρμογή ρυμοτομικών (άρθ.18)
 add("Εφαρμογή γραμμών — σημεία αξόνων οδών", +t.rymN, "τεμ", 390);
 add("Κορυφές Ο.Τ. / πολυγώνων", +t.otN, "τεμ", 104);
 return { rows, sum, min: 5000*l };
}

function amoivesCalc(){
 const S = symbatikos(), l = +D.lambda||0.23368;
 // Σταθμισμένη προσαύξηση προσθήκης (ΠΔ 696/74 άρθ.88): γραμμές ΠΡΟΣΘΗΚΗ ×1,30 αναλογικά με το μερίδιό τους στον προϋπ.
 const _bT = D.uses.reduce((a,x)=>a+useBudget(x),0);
 const incP = _bT>0 ? D.uses.reduce((a,x)=>a+useBudget(x)*((x.kind==="pros"||x.kind==="episk")?1.30:1.00),0)/_bT : (D.incProsthiki?1.30:1.00);
 let mel=0, epi=0; const rows=[];
 for(const st of D.studies){
  if(!st.on){ rows.push({...st, melF:0, epiF:0}); continue; }
  const base = S * ((+st.share||0)/100);
  let melF = feePart(base, l, +st.mk, +st.mm, +st.bf) * incP;
  if(st.aseismic) melF *= 1.80;            // αντισεισμικός: μελέτη στατικών +80% (τκ ΤΕΕ)
  let epiF = feePart(base, l, +st.ek, +st.em, +st.bf) * incP;
  if(st.aseismic) epiF *= 1.40;            // αντισεισμικός: επίβλεψη στατικών +40% (ανάλυση ΤΕΕ)
  mel += melF; epi += epiF;
  rows.push({...st, base, melF, epiF});
 }
 // ΚΕΝΑΚ (5601): όπως στο ΤΕΕ — ανά κλάδο, με τα κ/μ του 5601 (2.3/45) επί της βάσης του κλάδου, σε factor %
 const kenak = rows.filter(r=>r.on && [101,301,601,701,1101,1201,1001].includes(r.tM))
   .reduce((a,r)=> a + feePart(r.base, l, 2.3, 45, 1), 0) * ((+D.kenakPct||0)/100) * incP;
 mel += kenak;
 rows.push({s:"ΚΕΝΑΚ (Μελ. Ενεργειακής Απόδοσης)", tM:5601, on:true, melF:kenak, epiF:0, isKenak:true});
 // Τοπογραφικό (2001) — κατ' αποκοπή
 const topo = +D.topoFlat||0;
 mel += topo;
 rows.push({s:"Τοπογραφικό διάγραμμα", tM:2001, on:topo>0, melF:topo, epiF:0, isTopo:true});
 // Ελάχιστη συνολική νόμιμη αμοιβή: 5000×λ
 const minPay = 5000 * l;
 return {rows, mel, epi, sum: mel+epi, minPay, belowMin: (mel+epi) < minPay};
}
function prasinoCalc(){
 if(!D.ektosSxediou) return 0;
 // Άρθ.32 §1 ν.4759/2020 (εγκ. ΥΠΕΝ/ΔΑΟΚΑ): 5% επί ΣΥΜΒΑΤΙΚΟΥ ή 5‰ επί ΑΝΑΛΥΤΙΚΟΥ προϋπολογισμού
 const mode = D.prasMode || "p5";
 const base = mode==="m5" ? ((+D.analytP||0) > 0 ? +D.analytP : symbatikos()) : symbatikos();
 const p = base * (mode==="m5" ? 0.005 : 0.05);
 return Math.min(5000, Math.max(250, p));  // ελάχιστο 250 € — μέγιστο 5.000 €
}

const EKA_DEM = [["17 01 01","Σκυρόδεμα",.50],["17 01 02","Τούβλα",.25],["17 01 03","Πλακίδια και κεραμικά",.05],["17 04 07","Ανάμεικτα μέταλλα",.05],["17 02 01","Ξύλο",.03],["17 09 04","Μεικτά απόβλητα δομικών κατασκευών",.12]];
const EKA_REN = [["17 01 07","Μείγμα σκυροδέματος, τούβλων, πλακιδίων, κεραμικών",.45],["17 08 02","Υλικά δομικών κατασκευών με βάση τον γύψο",.15],["17 02 01","Ξύλο",.08],["17 02 03","Πλαστικά",.05],["17 04 07","Ανάμεικτα μέταλλα",.05],["17 09 04","Μεικτά απόβλητα δομικών κατασκευών",.22]];

function aekkCalc(){
 const A = D.aekk || (D.aekk = defAekk());
 const rows = [];
 const add = (eka, per, t) => {
  if(t <= 0.0005) return;
  const r = rows.find(x => x.eka === eka);
  if(r) r.t += t; else rows.push({eka, per, t});
 };
 // Εκσκαφές: όγκος × πυκνότητα, μείον επιτόπου αξιοποίηση (αυτοδιαχείριση χωμάτων)
 const excGross = A.excOn ? (+A.excM3||0) * (+A.excDens||0) : 0;
 const excReuse = A.excOn ? Math.min((+A.excReuseM3||0) * (+A.excDens||0), excGross) : 0;
 if(A.excOn) add("17 05 04", "Χώματα και πέτρες (εκτός 17 05 03)", excGross - excReuse);
 // Νέα κατασκευή: συνολικά μ² × kg/μ²
 if(A.newOn){ const t = totM2() * ((+D.aekkKg||0)/1000); EKA_NEW.forEach(([e,p,f]) => add(e, p, t*f)); }
 // Κατεδάφιση: μ² × t/μ²
 if(A.demOn){ const t = (+A.demM2||0) * (+A.demT||0); EKA_DEM.forEach(([e,p,f]) => add(e, p, t*f)); }
 // Ανακαίνιση: μ² × t/μ²
 if(A.renOn){ const t = (+A.renM2||0) * (+A.renT||0); EKA_REN.forEach(([e,p,f]) => add(e, p, t*f)); }

 const excT  = rows.filter(r => r.eka.startsWith("17 05")).reduce((a,r)=>a+r.t, 0);
 const restT = rows.reduce((a,r)=>a+r.t, 0) - excT;
 const tons  = excT + restT;
 const cost  = excT*(+A.excEur||0) + restT*(+D.aekkEur||0) + (+D.aekkEgy||0);
 // Εγγυητική ΚΥΑ 36259/2010 άρθ.7: 0,5% προϋπ. (κατασκευές/κατεδαφίσεις) · 0,2% (αποκλειστικά εκσκαφές)
 const P = symbatikos();
 const egy = A.egyMode==="man" ? (+A.egyManual||0) : P * (A.egyMode==="a02" ? 0.002 : 0.005);
 return {tons, cost, excT, restT, excGross, excReuse, egy, P, rows};
}
function foroCalc(){
 const a = amoivesCalc();
 const billed = (+D.agreedFee||0) > 0 ? +D.agreedFee : a.sum;   // συμφωνηθείσα αμοιβή — αλλιώς νόμιμη
 const fpa = billed * (+D.fpa||0)/100;                          // ΦΠΑ επί της τιμολογούμενης (συμφωνηθείσας)
 // ΦΕΜ (προκαταβλητέος φόρος μηχανικών, ν.4172/13 άρθ.69§4): 10% μελέτες-επιβλέψεις, 4% τοπογραφικά
 const topoFee = a.rows.filter(r=>r.isTopo).reduce((s,r)=>s+(+r.melF||0),0);
 const parakr = (a.sum - topoFee) * (+D.parakr||0)/100 + topoFee * (+D.parakrTopo||0)/100;
 const tee = billed * (+D.teeKrat||0)/1000;
 const prasino = prasinoCalc();
 const aekk = aekkCalc();
 const other = (+D.dimosFee||0) + (+D.eadeiesFee||0);
 return {a, billed, fpa, parakr, tee, prasino, aekk, other, cash: billed + fpa + tee + prasino + aekk.cost + other};
}
function mzms(days){ // Μέσος Ζυγισμένος Μειωτικός Συντελεστής (εγκ. 13/99)
 if(days<=3000) return 1.00;
 if(days<=10000) return 0.90;
 if(days<=30000) return 0.85;
 return 0.80;
}
function efkaMatFor(mode){
 if(mode==="2a"){ if(!D.efkaMat2a) D.efkaMat2a = JSON.parse(JSON.stringify(DEF.efkaMat2a)); return D.efkaMat2a; }
 if(mode==="2b"){ if(!D.efkaMat2b) D.efkaMat2b = JSON.parse(JSON.stringify(DEF.efkaMat2b)); return D.efkaMat2b; }
 if(!D.efkaMat) D.efkaMat = JSON.parse(JSON.stringify(DEF.efkaMat));
 return D.efkaMat;
}
function efkaCalc(){
 const mode = D.efkaMode || "1";
 if(!D.efkaCols) D.efkaCols = DEF.efkaCols.slice();
 if(mode==="3"){
  if(!D.efka3) D.efka3 = JSON.parse(JSON.stringify(DEF.efka3));
  const rows = D.efka3.map(r=>{ const lab = (+r.b||0)*(+r.p||0)/100; return {w:r.w, b:+r.b||0, p:+r.p||0, lab}; });
  const labor = rows.reduce((a,r)=>a+r.lab,0);
  const days = (+D.tekmHm>0)? labor/(+D.tekmHm) : 0;
  const cost = labor * ((+D.efkaPct||0)/100);
  return {mode, rows3:rows, labor, days, k:1, raw:days, cost};
 }
 const mat = efkaMatFor(mode);
 const rows=[]; let raw=0;
 for(const r of mat){
  const m2 = +r.m2||0;

  raw += d; rows.push({x:r.x, m2, d});
 }
 const k = mzms(raw);
 const days = raw * k;
 const cost = days * (+D.tekmHm||0) * ((+D.efkaPct||0)/100);
 return {mode, rows, raw, k, days, cost};
}

function wgs84ToEgsa87(lat, lon){
 const d2r = Math.PI/180;
 // WGS84 γεωδαιτικές → ECEF
 let a = 6378137, f = 1/298.257223563, e2 = f*(2-f);
 const fi = lat*d2r, la = lon*d2r;
 let N = a/Math.sqrt(1 - e2*Math.sin(fi)*Math.sin(fi));
 let X = N*Math.cos(fi)*Math.cos(la), Y = N*Math.cos(fi)*Math.sin(la), Z = N*(1-e2)*Math.sin(fi);
 // Μετάθεση WGS84 → ΕΓΣΑ'87 (αντίστροφη της ΕΓΣΑ→WGS: ΔX=-199.87, ΔY=+74.79, ΔZ=+246.62)
 X += 199.87; Y -= 74.79; Z -= 246.62;
 // ECEF → γεωδαιτικές σε GRS80
 a = 6378137; f = 1/298.257222101; e2 = f*(2-f);
 const p = Math.hypot(X, Y);
 let fi2 = Math.atan2(Z, p*(1-e2));
 for(let i=0;i<6;i++){ N = a/Math.sqrt(1 - e2*Math.sin(fi2)*Math.sin(fi2)); fi2 = Math.atan2(Z + e2*N*Math.sin(fi2), p); }
 const la2 = Math.atan2(Y, X);
 // Εγκάρσια Μερκατορική ΤΜ87 (λ0=24°, k0=0.9996, FE=500000)
 const k0 = 0.9996, l0 = 24*d2r, FE = 500000;
 const ep2 = e2/(1-e2), t = Math.tan(fi2), n2 = ep2*Math.cos(fi2)*Math.cos(fi2);
 N = a/Math.sqrt(1 - e2*Math.sin(fi2)*Math.sin(fi2));
 const A = (la2 - l0)*Math.cos(fi2);
 const M = a*((1 - e2/4 - 3*e2*e2/64 - 5*e2*e2*e2/256)*fi2
   - (3*e2/8 + 3*e2*e2/32 + 45*e2*e2*e2/1024)*Math.sin(2*fi2)
   + (15*e2*e2/256 + 45*e2*e2*e2/1024)*Math.sin(4*fi2)
   - (35*e2*e2*e2/3072)*Math.sin(6*fi2));
 const E = FE + k0*N*(A + (1 - t*t + n2)*Math.pow(A,3)/6 + (5 - 18*t*t + Math.pow(t,4) + 72*n2 - 58*ep2)*Math.pow(A,5)/120);
 const No = k0*(M + N*t*(A*A/2 + (5 - t*t + 9*n2 + 4*n2*n2)*Math.pow(A,4)/24 + (61 - 58*t*t + Math.pow(t,4) + 600*n2 - 330*ep2)*Math.pow(A,6)/720));
 return {E, N: No};
}

  : `<span class="pill">Κλικ στον χάρτη, αναζήτηση ή GPS για να τοποθετήσεις την πινέζα του έργου.</span>`;

function ergSetPin(la, lo, pan){
 D.ergo.lat = +(+la).toFixed(7); D.ergo.lon = +(+lo).toFixed(7); save();
 if(ERGMAP){
  if(!ERGMARK){
   ERGMARK = L.marker([la, lo], {draggable:true, icon: ergPinIcon()}).addTo(ERGMAP);
   ERGMARK.on("dragend", ()=>{ const p = ERGMARK.getLatLng(); D.ergo.lat = +p.lat.toFixed(7); D.ergo.lon = +p.lng.toFixed(7); save(); ergCoordsUI(); });
  } else ERGMARK.setLatLng([la, lo]);
  if(pan) ERGMAP.setView([la, lo], Math.max(ERGMAP.getZoom(), 17));
 }
 ergCoordsUI();
}
function ergClearPin(){
 D.ergo.lat = null; D.ergo.lon = null; save();
 if(ERGMARK && ERGMAP){ ERGMAP.removeLayer(ERGMARK); ERGMARK = null; }
 ergCoordsUI();
}
async function ergSearch(){
 const inp = document.getElementById("ergQ");
 const q = inp ? inp.value.trim() : "";
 if(!q){ if(inp) inp.focus(); return; }
 const b = document.getElementById("ergGo"); if(b){ b.disabled = true; b.textContent = "…"; }
 try{
  const r = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=gr&q=" + encodeURIComponent(q), {headers:{"Accept":"application/json"}});
  const j = await r.json();
  if(j && j[0]) ergSetPin(+j[0].lat, +j[0].lon, true);
  else alert("Δεν βρέθηκε η τοποθεσία — δοκίμασε π.χ. «Οδός, Πόλη».");
 }catch(_){ alert("Σφάλμα αναζήτησης — έλεγξε τη σύνδεση."); }
 if(b){ b.disabled = false; b.textContent = "🔍"; }
}
function ergGps(){
 if(!navigator.geolocation){ alert("Το GPS δεν υποστηρίζεται στη συσκευή."); return; }
 navigator.geolocation.getCurrentPosition(
  p=> ergSetPin(p.coords.latitude, p.coords.longitude, true),
  ()=> alert("Αδύνατος ο εντοπισμός θέσης (άδεια/σήμα GPS)."),
  {enableHighAccuracy:true, timeout:9000});
}
function initErgoMap(){
 const el = document.getElementById("ergMap"); if(!el) return;
 ensureLeaflet().then(()=>{
  const m = document.getElementById("ergMap"); if(!m || m._done) return; m._done = 1;
  const has = isFinite(+D.ergo.lat) && isFinite(+D.ergo.lon) && (+D.ergo.lat || +D.ergo.lon);
  ERGMAP = L.map(m).setView(has ? [+D.ergo.lat, +D.ergo.lon] : [38.83, 21.16], has ? (D.ergo.zoom || 17) : 8);
  const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {maxZoom:19, attribution:"Esri World Imagery"});
  const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:"© OpenStreetMap"});
  sat.addTo(ERGMAP);
  L.control.layers({"Δορυφόρος": sat, "Χάρτης": osm}, null, {position:"topright"}).addTo(ERGMAP);
  L.control.scale({imperial:false}).addTo(ERGMAP);
  ERGMAP.on("click", e=> ergSetPin(e.latlng.lat, e.latlng.lng, false));
  ERGMAP.on("zoomend", ()=>{ D.ergo.zoom = ERGMAP.getZoom(); save(); });
  if(has) ergSetPin(+D.ergo.lat, +D.ergo.lon, false);
  ergCoordsUI();
 }).catch(()=>{ el.innerHTML = '<div class="note warn" style="margin:8px">Ο χάρτης απαιτεί σύνδεση στο διαδίκτυο — οι συντεταγμένες που έχεις ήδη ορίσει διατηρούνται.</div>'; });
}

function engTotals(id, a){
 a = a || amoivesCalc();
 let mel=0, epi=0;
 for(let i=0;i<D.studies.length;i++){
  const st = D.studies[i], r = a.rows[i];
  if(!st.on || !r) continue;
  if(+st.mEng===+id) mel += r.melF||0;
  if(+st.eEng===+id) epi += r.epiF||0;
 }
 // ΚΕΝΑΚ & τοπογραφικό: στον μηχανικό της αρχιτεκτονικής μελέτης / στον πρώτο
 const arch = D.studies.find(s=>s.tM===101);
 const kenakRow = a.rows.find(r=>r.isKenak), topoRow = a.rows.find(r=>r.isTopo);
 if(arch && +arch.mEng===+id && kenakRow) mel += kenakRow.melF||0;
 if(D.engineers[0] && +D.engineers[0].id===+id && topoRow) mel += topoRow.melF||0;
 return {mel, epi};
}

function printSymf(kind){
 const a=amoivesCalc(); const isMel = kind==="mel";
 const en = engById(D.docEng);
 const t = engTotals(en.id, a);
 let poso = isMel ? t.mel : t.epi;
 const _fac = ((+D.agreedFee||0)>0 && a.sum>0) ? (+D.agreedFee)/a.sum : 1;
 const posoNom = poso; poso = poso * _fac;   // συμφωνηθείσα αναλογικά στο μερίδιο του μηχανικού
 const list = [];
 D.studies.forEach((st,i)=>{ if(!st.on) return; const r=a.rows[i];
  if(isMel && +st.mEng===+en.id && (r.melF||0)>0) list.push(st.s);
  if(!isMel && +st.eEng===+en.id && (r.epiF||0)>0) list.push(st.s); });
 const arch = D.studies.find(s=>s.tM===101);
 if(isMel && arch && +arch.mEng===+en.id && +D.kenakPct>0) list.push("ΚΕΝΑΚ");
 if(isMel && D.engineers[0] && +D.engineers[0].id===+en.id && +D.topoFlat>0) list.push("Τοπογραφικό διάγραμμα");

function payCalc(){
 const f = foroCalc(), ef = efkaCalc();
 const rows = [
  {to:"Μηχανικοί έργου (τιμολόγια)", ti:"Αμοιβές μελετών & επιβλέψεων" + ((+D.agreedFee||0)>0 ? " — συμφωνηθείσα (ν.3919/2011)" : " — νόμιμη ΤΕΕ"), amt:f.billed},
  {to:"ΑΑΔΕ (μέσω τιμολογίων μηχανικών)", ti:`ΦΠΑ ${num(D.fpa)}% επί αμοιβών`, amt:f.fpa},
  {to:"ΔΟΥ — ΦΕΜ", ti:`Προκαταβλητέος φόρος μηχανικών ${num(D.parakr)}% μελ./επιβλ. + ${num(D.parakrTopo)}% τοπογρ. (ν.4172/13 άρθ.69§4) — καταβάλλεται από τους μηχανικούς πριν την έκδοση, ΔΕΝ προστίθεται στο ταμειακό σύνολο`, amt:f.parakr, info:true},
  {to:"e-ΕΦΚΑ", ti:`Εισφορές οικοδομικών ενσήμων (${num(ef.days)} ημερομίσθια × ${eur(D.tekmHm)} × ${num(D.efkaPct)}%)`, amt:ef.cost},
 ];
 if(f.prasino>0) rows.push({to:"Πράσινο Ταμείο (e-Παράβολο)", ti:"Αντισταθμιστικό περιβαλλοντικό τέλος εκτός σχεδίου — άρθ.32 §1 ν.4759/2020 (min 250 € / max 5.000 €)", amt:f.prasino});
 if(f.aekk.cost>0) rows.push({to:"ΣΣΕΔ ΑΕΚΚ / Διαχειριστής", ti:`Διαχείριση αποβλήτων ΑΕΚΚ (${num(f.aekk.tons)} τν)` + (f.aekk.egy>0?` — επιπλέον εγγυητική ${eur(f.aekk.egy)} προς τον Δήμο (ΚΥΑ 36259/2010)`:""), amt:f.aekk.cost});
 if((+D.eadeiesFee||0)>0) rows.push({to:"ΤΕΕ / e-Άδειες", ti:"Αντάλλαγμα χρήσης πληροφοριακού συστήματος", amt:+D.eadeiesFee});
 if((+D.dimosFee||0)>0) rows.push({to:"Δημοτικό Ταμείο", ti:"Δημοτικά τέλη / τέλος κατάληψης κοινόχρηστου χώρου", amt:+D.dimosFee});
 if(f.tee>0) rows.push({to:"Λοιπές κρατήσεις", ti:`${num(D.teeKrat)}‰ επί αμοιβών`, amt:f.tee});
 const total = rows.filter(r=>!r.info).reduce((a,r)=> a + r.amt, 0);
 return {rows, total};
}

 }
