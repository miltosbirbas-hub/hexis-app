  --accent:#b3271e;      /* safety orange — σημαία χωροβάτη */
  --accent-dk:#7e1b14;
  --ok:#1f7a3d;
  --ok-bg:#e6f4ea;
  --muted:#6b7280;
  --field:#f3f7e4;
  --tbh: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--paper);color:var(--ink);
  padding-bottom:90px;
}

/* ο χάρτης ως φόντο όλης της σελίδας */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background-image:var(--mapimg);background-size:cover;background-position:center;
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;
  background:rgba(233,239,214,.72); /* ημιδιάφανο πράσινο για αναγνωσιμότητα */
}
body.outdoor::after{background:rgba(255,255,255,.88)}
section{box-shadow:0 1px 6px rgba(50,58,40,.12)}
/* ---------- HEADER ---------- */
header{position:sticky}
.hd-bg{
  position:absolute;inset:0;z-index:0;background-image:var(--mapimg);
  background-size:cover;background-position:center 38%;
  opacity:.30;filter:saturate(.7) contrast(1.05);
  pointer-events:none;
}
.hd-shade{
  position:absolute;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg, rgba(50,58,40,.55) 0%, rgba(50,58,40,.72) 55%, rgba(50,58,40,.92) 100%);
}
body.outdoor .hd-bg{opacity:.35;filter:saturate(.5) contrast(1.1)}
body.outdoor .hd-shade{background:linear-gradient(180deg, rgba(0,0,0,.6) 0%, rgba(0,0,0,.78) 55%, rgba(0,0,0,.95) 100%)}
.hd-row,.tabs,.prog-wrap{position:relative;z-index:1}

header{
  background:var(--ink);color:#fff;
  position:relative;overflow:hidden;
  padding:calc(var(--tbh) + 14px) 16px 0 16px;
  position:sticky;top:0;z-index:20;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
}
.hd-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:10px}
.hd-title{font-size:1.02rem;font-weight:800;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-title small{display:block;font-weight:400;font-size:.68rem;color:#b5bfa5;letter-spacing:.06em;text-transform:uppercase;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:400px){.hd-title{font-size:.92rem}.hd-title small{font-size:.6rem}}
.hd-btn{
  background:transparent;border:1px solid #5c6650;color:#d5dcc5;
  border-radius:8px;padding:8px 12px;font-size:.8rem;font-weight:600;cursor:pointer;
}
/* tabs */
.tabs{display:flex;gap:0}
.tab{
  flex:1;text-align:center;padding:12px 6px 14px 6px;
  font-size:.85rem;font-weight:700;color:#a8b298;
  border-bottom:4px solid transparent;cursor:pointer;user-select:none;
}
.tab.active{color:#fff;border-bottom-color:var(--accent)}
.tab .tag{display:block;font-size:.68rem;font-weight:400;color:#8b9479;margin-top:2px}
.tab.active .tag{color:#d5dcc5}
/* progress */
.prog-wrap{height:5px;background:#4b5540}
.prog{height:100%;background:var(--accent);width:0%;transition:width .25s}
/* ---------- BODY ---------- */
main{padding:14px 12px 0 12px;max-width:640px;margin:0 auto}
.panel{display:none}
.panel.active{display:block}
.summary{
  display:flex;align-items:center;justify-content:space-between;
  font-size:.8rem;color:var(--muted);padding:2px 4px 12px 4px;
}
.summary b{color:var(--ink)}
/* section */
section{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  margin-bottom:14px;overflow:hidden;
}
.sec-hd{
  display:flex;align-items:center;gap:10px;
  padding:13px 14px;background:linear-gradient(#fff,#faf9f5);
  border-bottom:1px solid var(--line);
}
.sec-num{
  min-width:30px;height:30px;border-radius:8px;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:.85rem;font-weight:800;font-variant-numeric:tabular-nums;
}
.sec-hd h2{font-size:.95rem;font-weight:800;flex:1}
.sec-count{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
section.done .sec-num{background:var(--ok)}
section.done{border-color:#bcdcc6}
/* items */
.item{
  display:flex;align-items:flex-start;gap:12px;
  padding:13px 14px;border-bottom:1px solid #efede7;
  cursor:pointer;user-select:none;
}
.item:last-child{border-bottom:none}
.box{
  min-width:26px;height:26px;border:2.5px solid #b9b4a6;border-radius:7px;
  background:#fff;margin-top:1px;position:relative;flex-shrink:0;transition:all .15s;
}
.item.checked .box{background:var(--ok);border-color:var(--ok)}
.item.checked .box::after{
  content:"";position:absolute;left:7px;top:2px;width:7px;height:13px;
  border:solid #fff;border-width:0 3px 3px 0;transform:rotate(42deg);
}
.item .txt{font-size:.92rem;line-height:1.45;flex:1;padding-top:2px}
.item.checked .txt{color:#8a9186;text-decoration:line-through;text-decoration-color:#c3cabb}
.item .txt b{font-weight:700}
.item .txt .warn{color:var(--accent-dk);font-weight:700}
/* inline value inputs */
.val{
  display:inline-block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:.9rem;font-weight:700;color:var(--accent-dk);
  background:var(--field);border:1.5px dashed #9db07a;border-radius:6px;
  padding:3px 8px;min-width:74px;text-align:center;margin:0 2px;
}
.val:focus{outline:2px solid var(--accent);border-style:solid}
.val:empty::before{content:attr(data-ph);color:#9db07a;font-weight:400}
/* note row */
.note{
  padding:11px 14px;font-size:.8rem;line-height:1.5;color:#4a5434;
  background:#f2f6e0;border-top:1px solid #c9d6a8;
}
.note b{color:var(--accent-dk)}
/* residuals badge */
.crit{
  display:inline-block;background:var(--ink);color:#cfe3a8;border-radius:6px;
  padding:2px 8px;font-family:ui-monospace,Menlo,monospace;font-size:.8rem;font-weight:700;
}
/* footer bar */
.footbar{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  background:var(--ink);color:#fff;
  padding:10px 16px calc(env(safe-area-inset-bottom, 0px) + 10px) 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.footbar .fstat{font-size:.82rem;color:#d5dcc5}
.footbar .fstat b{color:#fff;font-size:1rem}
.fix-badge{
  background:#4b5540;border-radius:20px;padding:7px 16px;
  font-weight:800;font-size:.85rem;letter-spacing:.05em;color:#a8b298;
}
.fix-badge.ready{background:var(--ok);color:#fff}
/* ---------- CALCULATOR ---------- */
.calc{
  background:var(--ink);color:#e7ebf2;border-radius:14px;
  margin-bottom:14px;overflow:hidden;border:1px solid #4b5540;
}
.calc-hd{
  display:flex;align-items:center;gap:10px;padding:13px 14px;
  border-bottom:1px solid #4b5540;
}
.calc-hd .sec-num{background:var(--accent)}
.calc-hd h2{font-size:.95rem;font-weight:800;flex:1;color:#fff}
.calc-body{padding:12px 14px 14px 14px}
.calc-sub{
  font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:#a8b298;margin:10px 0 6px 0;
}
.calc-sub:first-child{margin-top:0}
.crow{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:center;margin-bottom:6px}
.crow label{font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:.85rem;color:#cfe3a8;text-align:center}
.crow input{
  width:100%;background:#454f3a;border:1px solid #5c6650;border-radius:8px;
  color:#fff;font-family:ui-monospace,Menlo,monospace;font-size:.95rem;
  padding:9px 10px;
}
.crow input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.crow input::placeholder{color:#79826a}
.calc-res{
  margin-top:10px;background:#2d3526;border:1px solid #4b5540;border-radius:10px;
  padding:11px 12px;font-family:ui-monospace,Menlo,monospace;font-size:.92rem;line-height:1.8;
}
.calc-res b{color:#7fe0a0}
.calc-res .dim{color:#a8b298;font-family:inherit;font-size:.78rem}
.calc-note{font-size:.75rem;color:#b5bfa5;line-height:1.5;margin-top:10px}
.calc-btnrow{display:flex;gap:8px;margin-top:10px}
.calc-btn{
  flex:1;background:#4b5540;border:1px solid #5c6650;color:#d5dcc5;border-radius:8px;
  padding:9px;font-size:.8rem;font-weight:700;cursor:pointer;
}
.calc-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
/* help image (benchmark example) */
.helpimg{border-top:1px solid #efede7}
.helpimg summary{
  list-style:none;cursor:pointer;padding:11px 14px;
  font-size:.8rem;font-weight:700;color:var(--accent-dk);user-select:none;
}
.helpimg summary::before{content:"🗺 ";}
.helpimg[open] summary::after{content:" ▲"}
.helpimg:not([open]) summary::after{content:" ▼"}
.helpimg img{display:block;width:100%;height:auto}
.helpimg figcaption{padding:9px 14px 12px 14px;font-size:.75rem;color:var(--muted);line-height:1.5}
body.outdoor .helpimg{border-top:1.5px solid #000}
body.outdoor .helpimg summary{color:#611410}
body.outdoor .helpimg figcaption{color:#000}
/* toast */
#toast{
  position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;
  font-size:.85rem;opacity:0;pointer-events:none;transition:all .25s;z-index:40;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ============ STORAGE (localStorage + in-memory fallback) ============ */
let mem = {};
const store = {
  get(k){ try{ return localStorage.getItem(k) ?? mem[k] ?? null }catch(e){ return mem[k] ?? null } },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(k,v) }catch(e){} },
  del(k){ delete mem[k]; try{ localStorage.removeItem(k) }catch(e){} }
};
const KEY = "rtk_l1_checklist_v1";
let state = {};
try{ state = JSON.parse(store.get(KEY) || "{}") }catch(e){ state = {} }
function save(){ store.set(KEY, JSON.stringify(state)) }

/* ============ RENDER ============ */
function render(listDef, panelId, prefix){
  const panel = document.getElementById(panelId);
  let html = `<div class="summary"><span>Πάτησε κάθε βήμα για ✔ — τα πεδία <span style="border:1.5px dashed #9db07a;border-radius:5px;padding:0 5px;background:#f3f7e4;color:#7e1b14;font-weight:700">___</span> συμπληρώνονται</span></div>`;
  listDef.forEach((sec,si)=>{
    html += `<section data-sec="${prefix}${si}">
      <div class="sec-hd"><div class="sec-num">${si+1}</div><h2>${sec.t}</h2><span class="sec-count" data-cnt></span></div>`;
    sec.items.forEach((it,ii)=>{
      const id = `${prefix}${si}_${ii}`;
      html += `<div class="item" data-id="${id}"><div class="box"></div><div class="txt">${it}</div></div>`;
    });
    if(sec.note) html += `<div class="note">${sec.note}</div>`;
    html += `</section>`;
  });
  panel.innerHTML = html;
}

/* ============ RELOCALISE CALCULATOR (panel B) ============ */
const CIN = (id,ph)=>`<div class="crow"><label>${id.slice(-1).toUpperCase()}</label><input type="text" inputmode="decimal" data-cid="${id}" placeholder="${ph}"></div>`;
document.getElementById("panel-B").insertAdjacentHTML("beforeend", `
<div class="calc">
  <div class="calc-hd"><div class="sec-num">Δ</div><h2>ΥΠΟΛΟΓΙΣΤΗΣ RELOCALISE</h2></div>
  <div class="calc-body">
    <div class="calc-sub">1 · Γνωστό σημείο — πραγματικές (ΕΓΣΑ'87)</div>
    ${CIN("kx","X π.χ. 231456.789")}
    ${CIN("ky","Y π.χ. 4278123.456")}
    ${CIN("kz","Z π.χ. 12.345")}
    <div class="calc-sub">2 · Ίδιο σημείο — όπως το μέτρησε ο rover</div>
    ${CIN("mx","X μετρημένο")}
    ${CIN("my","Y μετρημένο")}
    ${CIN("mz","Z μετρημένο")}
    <div class="calc-res" id="shiftRes">ΔX = — &nbsp;·&nbsp; ΔY = — &nbsp;·&nbsp; ΔZ = —<br><span class="dim">Συμπλήρωσε τα 6 πεδία για υπολογισμό shift</span></div>
    <div class="calc-sub" style="margin-top:14px">3 · Διόρθωση σημείου (προαιρετικό)</div>
    ${CIN("px","X σημείου προς διόρθωση")}
    ${CIN("py","Y σημείου προς διόρθωση")}
    ${CIN("pz","Z σημείου προς διόρθωση")}
    <div class="calc-res" id="corrRes"><span class="dim">Διορθωμένες = μετρημένες + Δ</span></div>
    <div class="calc-btnrow">
      <button class="calc-btn primary" id="copyShift">Αντιγραφή Δ</button>
      <button class="calc-btn" id="clearCalc">Καθάρισμα</button>
    </div>
    <div class="calc-note">Χρήση: ο base στήθηκε σε αυθαίρετη θέση χωρίς localization (ή ξαναστήθηκε σε νέα θέση). Μέτρα με τον rover ένα γνωστό σημείο → το Δ είναι η μετάθεση που πρέπει να εφαρμοστεί σε όλα τα σημεία της μέτρησης. Ισχύει για <b>μετάθεση μόνο</b> (χωρίς στροφή/κλίμακα) — για πλήρη προσαρμογή κάνε κανονικό Localization με 2+ σημεία.</div>
  </div>
</div>`);

const cin = id => document.querySelector(`[data-cid="${id}"]`);
const num = id => { const v = parseFloat((cin(id).value||"").replace(",",".")); return isNaN(v)?null:v; };
const f3 = v => (v>=0?"+":"")+v.toFixed(3);
let lastShift = null;

function calcShift(){
  const kx=num("c_kx"),ky=num("c_ky"),kz=num("c_kz"),mx=num("c_mx"),my=num("c_my"),mz=num("c_mz");
  const el = document.getElementById("shiftRes");
  if([kx,ky,kz,mx,my,mz].some(v=>v===null)){
    lastShift=null;
    el.innerHTML = `ΔX = — &nbsp;·&nbsp; ΔY = — &nbsp;·&nbsp; ΔZ = —<br><span class="dim">Συμπλήρωσε τα 6 πεδία για υπολογισμό shift</span>`;
  }else{
    const dx=kx-mx, dy=ky-my, dz=kz-mz, dh=Math.hypot(dx,dy);
    lastShift={dx,dy,dz};
    el.innerHTML = `ΔX = <b>${f3(dx)}</b><br>ΔY = <b>${f3(dy)}</b><br>ΔZ = <b>${f3(dz)}</b><br><span class="dim">Οριζόντιο shift: ${dh.toFixed(3)} m · 3D: ${Math.hypot(dh,dz).toFixed(3)} m</span>`;
  }
  calcCorr();
}
function calcCorr(){
  const px=num("c_px"),py=num("c_py"),pz=num("c_pz");
  const el = document.getElementById("corrRes");
  if(!lastShift || [px,py,pz].some(v=>v===null)){
    el.innerHTML = `<span class="dim">Διορθωμένες = μετρημένες + Δ</span>`;
  }else{
    el.innerHTML = `X' = <b>${(px+lastShift.dx).toFixed(3)}</b><br>Y' = <b>${(py+lastShift.dy).toFixed(3)}</b><br>Z' = <b>${(pz+lastShift.dz).toFixed(3)}</b>`;
  }
}
// normalize: prefix ids
document.querySelectorAll(".calc input[data-cid]").forEach(el=>{
  el.dataset.cid = "c_"+el.dataset.cid;
  const saved = state[el.dataset.cid]; if(saved) el.value = saved;
  el.addEventListener("input", ()=>{
    if(el.value.trim()) state[el.dataset.cid]=el.value.trim(); else delete state[el.dataset.cid];
    save(); calcShift();
  });
});
document.getElementById("copyShift").addEventListener("click", ()=>{
  if(!lastShift){ toast("Δεν έχει υπολογιστεί Δ ακόμα"); return; }
  const txt = `ΔX=${f3(lastShift.dx)} ΔY=${f3(lastShift.dy)} ΔZ=${f3(lastShift.dz)}`;
  try{ navigator.clipboard.writeText(txt); toast("Αντιγράφηκε: "+txt); }
  catch(e){ toast(txt); }
});
document.getElementById("clearCalc").addEventListener("click", ()=>{
  document.querySelectorAll(".calc input[data-cid]").forEach(el=>{ el.value=""; delete state[el.dataset.cid]; });
  save(); calcShift();
});
calcShift();

    <div class="calc-res" id="helmRes"><span class="dim">Συμπλήρωσε X,Y και για τα 2 σημεία → παράμετροι μετασχηματισμού</span></div>
    <div class="calc-sub" style="margin-top:14px">Μετατροπή σημείου</div>
    ${HIN("hpx","X","X μετρημένο")}${HIN("hpy","Y","Y μετρημένο")}${HIN("hpz","Z","Z μετρημένο (προαιρ.)")}
    <div class="calc-res" id="helmPtRes"><span class="dim">Μετρημένες rover → ΕΓΣΑ'87</span></div>
    <div class="calc-btnrow">
      <button class="calc-btn primary" id="copyHelm">Αντιγραφή παραμέτρων</button>
      <button class="calc-btn" id="clearHelm">Καθάρισμα</button>
    </div>
    <div class="calc-note">Ομοιότητας 2D (4 παράμετροι: μετάθεση + στροφή + κλίμακα) από 2 σημεία — <b>ακριβής λύση, χωρίς περίσσεια</b>: με 2 σημεία τα οριζόντια residuals είναι μηδέν εξ ορισμού, οπότε ο μόνος έλεγχος αξιοπιστίας είναι η <b>σύγκριση αποστάσεων</b> (κλίμακα) και η διαφορά ΔZ των δύο σημείων. Για πραγματικό έλεγχο χρειάζεσαι 3ο σημείο. Στο Z εφαρμόζεται μέση κατακόρυφη μετάθεση.</div>
  </div>
</div>`);

const hin = id => document.querySelector(`[data-hid="h_${id}"]`);
const hnum = id => { const el=hin(id); if(!el) return null; const v=parseFloat((el.value||"").replace(",",".")); return isNaN(v)?null:v; };
let helm = null;

function calcHelm(){
  const k1x=hnum("k1x"),k1y=hnum("k1y"),k2x=hnum("k2x"),k2y=hnum("k2y");
  const m1x=hnum("m1x"),m1y=hnum("m1y"),m2x=hnum("m2x"),m2y=hnum("m2y");
  const k1z=hnum("k1z"),m1z=hnum("m1z"),k2z=hnum("k2z"),m2z=hnum("m2z");
  const el = document.getElementById("helmRes");
  helm = null;
  if([k1x,k1y,k2x,k2y,m1x,m1y,m2x,m2y].some(v=>v===null)){
    el.innerHTML = `<span class="dim">Συμπλήρωσε X,Y και για τα 2 σημεία → παράμετροι μετασχηματισμού</span>`;
    calcHelmPt(); return;
  }
  const dmx=m2x-m1x, dmy=m2y-m1y, dkx=k2x-k1x, dky=k2y-k1y;
  const dm=Math.hypot(dmx,dmy), dk=Math.hypot(dkx,dky);
  if(dm<0.01){ el.innerHTML=`<span class="dim">Τα 2 μετρημένα σημεία σχεδόν ταυτίζονται — δώσε σημεία με απόσταση</span>`; calcHelmPt(); return; }
  const den = dmx*dmx + dmy*dmy;
  const a = (dkx*dmx + dky*dmy)/den;
  const b = (dky*dmx - dkx*dmy)/den;
  const tx = k1x - (a*m1x - b*m1y);
  const ty = k1y - (b*m1x + a*m1y);
  const scale = Math.hypot(a,b);
  const rotRad = Math.atan2(b,a);
  const rotGon = rotRad*200/Math.PI;
  const ppm = (scale-1)*1e6;
  let dz=null, dzChk="";
  const dz1=(k1z!==null&&m1z!==null)?k1z-m1z:null;
  const dz2=(k2z!==null&&m2z!==null)?k2z-m2z:null;
  if(dz1!==null&&dz2!==null){ dz=(dz1+dz2)/2; dzChk=` <span class="dim">(ΔZ₁−ΔZ₂ = ${((dz1-dz2)*100).toFixed(1)} cm)</span>`; }
  else if(dz1!==null) dz=dz1; else if(dz2!==null) dz=dz2;
  helm = {a,b,tx,ty,dz,scale,rotGon};
  el.innerHTML =
    `Κλίμακα = <b>${scale.toFixed(8)}</b> <span class="dim">(${(ppm>=0?"+":"")+ppm.toFixed(1)} ppm)</span><br>`+
    `Στροφή = <b>${rotGon.toFixed(5)} gon</b> <span class="dim">(${(rotRad*180/Math.PI).toFixed(5)}°)</span><br>`+
    `Tx = <b>${f3(tx)}</b> · Ty = <b>${f3(ty)}</b><br>`+
    (dz!==null?`ΔZ = <b>${f3(dz)}</b>${dzChk}<br>`:``)+
    `<span class="dim">Απόσταση γνωστών: ${dk.toFixed(3)} m · μετρημένων: ${dm.toFixed(3)} m · διαφορά: ${((dk-dm)*100).toFixed(1)} cm</span>`;
  calcHelmPt();
}
function calcHelmPt(){
  const px=hnum("hpx"),py=hnum("hpy"),pz=hnum("hpz");
  const el = document.getElementById("helmPtRes");
  if(!helm || px===null || py===null){
    el.innerHTML = `<span class="dim">Μετρημένες rover → ΕΓΣΑ'87</span>`; return;
  }
  const X = helm.a*px - helm.b*py + helm.tx;
  const Y = helm.b*px + helm.a*py + helm.ty;
  let out = `X' = <b>${X.toFixed(3)}</b><br>Y' = <b>${Y.toFixed(3)}</b>`;
  if(pz!==null && helm.dz!==null) out += `<br>Z' = <b>${(pz+helm.dz).toFixed(3)}</b>`;
  el.innerHTML = out;
}
document.querySelectorAll(".calc input[data-hid]").forEach(el=>{
  el.dataset.hid = "h_"+el.dataset.hid;
  const saved = state[el.dataset.hid]; if(saved) el.value = saved;
  el.addEventListener("input", ()=>{
    if(el.value.trim()) state[el.dataset.hid]=el.value.trim(); else delete state[el.dataset.hid];
    save(); calcHelm();
  });
});
document.getElementById("copyHelm").addEventListener("click", ()=>{
  if(!helm){ toast("Δεν έχουν υπολογιστεί παράμετροι"); return; }
  const txt = `Helmert 2D: scale=${helm.scale.toFixed(8)} rot=${helm.rotGon.toFixed(5)}gon Tx=${f3(helm.tx)} Ty=${f3(helm.ty)}`+(helm.dz!==null?` dZ=${f3(helm.dz)}`:"");
  try{ navigator.clipboard.writeText(txt); toast("Αντιγράφηκαν οι παράμετροι"); }
  catch(e){ toast(txt); }
});
document.getElementById("clearHelm").addEventListener("click", ()=>{
  document.querySelectorAll(".calc input[data-hid]").forEach(el=>{ el.value=""; delete state[el.dataset.hid]; });
  save(); calcHelm();
});
calcHelm();

/* ============ BEHAVIOUR ============ */
let activeTab = state._tab || "A";

function applyState(){
  document.querySelectorAll(".item").forEach(el=>{
    el.classList.toggle("checked", !!state[el.dataset.id]);
  });
  document.querySelectorAll(".val").forEach(el=>{
    const v = state["v_"+el.dataset.vid];
    if(v && el.textContent!==v) el.textContent = v;
  });
  // section counters
  document.querySelectorAll("section").forEach(sec=>{
    const items = sec.querySelectorAll(".item");
    const done = sec.querySelectorAll(".item.checked").length;
    sec.querySelector("[data-cnt]").textContent = `${done}/${items.length}`;
    sec.classList.toggle("done", done===items.length);
  });
  updateProgress();
}

function updateProgress(){
  const panel = document.getElementById("panel-"+activeTab);
  const items = panel.querySelectorAll(".item");
  const done = panel.querySelectorAll(".item.checked").length;
  const pct = items.length ? Math.round(done/items.length*100) : 0;
  document.getElementById("prog").style.width = pct+"%";
  document.getElementById("fstat").innerHTML = `<b>${done}</b> / ${items.length} βήματα`;
  const badge = document.getElementById("fixBadge");
  if(pct===100){ badge.textContent="● FIX — ΕΤΟΙΜΟΣ"; badge.classList.add("ready"); }
  else{ badge.textContent = pct+" %"; badge.classList.remove("ready"); }
}

/* item toggle */
document.querySelectorAll(".panel").forEach(p=>{
  p.addEventListener("click", e=>{
    if(e.target.closest(".val")) return; // editing a field
    const item = e.target.closest(".item");
    if(!item) return;
    const id = item.dataset.id;
    state[id] = !state[id];
    if(!state[id]) delete state[id];
    save(); applyState();
  });
});

/* value fields */
document.querySelectorAll(".val").forEach(el=>{
  el.addEventListener("blur", ()=>{
    const t = el.textContent.trim();
    if(t) state["v_"+el.dataset.vid]=t; else delete state["v_"+el.dataset.vid];
    save();
  });
  el.addEventListener("keydown", e=>{
    if(e.key==="Enter"){ e.preventDefault(); el.blur(); }
  });
});

/* tabs */
document.querySelectorAll(".tab").forEach(t=>{
  t.addEventListener("click", ()=>{
    activeTab = t.dataset.tab;
    state._tab = activeTab; save();
    document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===t));
    document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id==="panel-"+activeTab));
    updateProgress();
    window.scrollTo({top:0});
  });
});
if(activeTab==="B"){
  document.querySelector('.tab[data-tab="B"]').click();
}

/* reset */
document.getElementById("resetBtn").addEventListener("click", ()=>{
  if(!confirm("Νέα εργασία; Θα καθαρίσουν όλα τα ✔ και τα πεδία και στις δύο λίστες.")) return;
  state = {_tab:activeTab, _mode:state._mode}; save();
  document.querySelectorAll(".val").forEach(el=>el.textContent="");
  document.querySelectorAll(".calc input").forEach(el=>el.value="");
  if(typeof calcShift==="function") calcShift();
  if(typeof calcHelm==="function") calcHelm();
  applyState();
  toast("Καθαρίστηκε — καλή δουλειά! 📡");
});

/* mode: inside / outside */
const modeBtn = document.getElementById("modeBtn");
function applyMode(){
  const out = state._mode === "out";
  document.body.classList.toggle("outdoor", out);
  modeBtn.textContent = out ? "🌙 ΜΕΣΑ" : "☀ ΕΞΩ";
  document.querySelector('meta[name="theme-color"]').setAttribute("content", out ? "#000000" : "#39422e");
}
modeBtn.addEventListener("click", ()=>{
  state._mode = (state._mode==="out") ? "in" : "out";
  save(); applyMode();
  toast(state._mode==="out" ? "☀ Εξωτερικά — υψηλή αντίθεση" : "🌙 Εσωτερικά — κανονική προβολή");
});
applyMode();

function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2200);
}

applyState();
</script>
