<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#16202B">
<title>HEXIS APP — προμέτρηση πεδίου</title>
<link rel="manifest" href="stegh-manifest.json">
<link rel="apple-touch-icon" href="stegh-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HEXIS">
<style>
:root{
  --paper:#EDF0F2; --ink:#16202B; --ink-2:#5A6875; --line:#C8D2DA;
  --brb:#1F4E9C; --maxia:#C0562F; --nteres:#2E7FA8; --korf:#C08A2E; --geiso:#4A7A4A;
  --num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--ui)}
#board{position:fixed;inset:0;touch-action:none;display:block}

.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
  display:flex;align-items:center;gap:10px;pointer-events:none}
.mark{font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--brb)}
.mark small{display:block;font-weight:500;font-size:10px;letter-spacing:.08em;color:var(--ink-2)}
.hint{margin-left:auto;font-size:12px;color:var(--ink-2);background:#fffc;border:1px solid var(--line);
  border-radius:999px;padding:5px 11px;pointer-events:none;max-width:60vw;text-align:right}

.dock{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
  padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);box-shadow:0 -8px 24px #16202b12}
.row{display:flex;gap:8px}
.row + .row{margin-top:8px}
button{font-family:var(--ui);font-size:14px;font-weight:600;border:1px solid var(--line);background:#fff;
  color:var(--ink);border-radius:10px;padding:11px 12px;flex:1;min-height:46px}
button:active{transform:translateY(1px)}
button:disabled{opacity:.38}
button.pri{background:var(--brb);border-color:var(--brb);color:#fff}
button.gh{flex:0 0 auto;padding:11px 14px}
.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
label{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:3px}
input{width:100%;font-family:var(--num);font-size:16px;font-weight:600;padding:8px 6px;text-align:center;
  border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
input:focus{outline:2px solid var(--brb);outline-offset:-1px}

.sheet{position:fixed;inset:0;background:var(--paper);transform:translateY(100%);
  transition:transform .32s cubic-bezier(.32,.72,0,1);overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:20}
.sheet.on{transform:none}
.sheet-hd{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:baseline;gap:10px}
.sheet-hd h2{margin:0;font-size:17px;letter-spacing:-.01em}
.sheet-hd button{flex:0 0 auto;margin-left:auto;min-height:36px;padding:7px 12px;font-size:13px}
.pad{padding:14px 16px 26px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.kpi div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-family:var(--num);font-size:26px;font-weight:700;letter-spacing:-.02em}
.kpi span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--brb);
  margin:22px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:6px 0;border-bottom:1px solid #E4E9ED;vertical-align:baseline}
td:last-child{text-align:right;font-family:var(--num);font-weight:600;white-space:nowrap;padding-left:10px}
canvas.plan{width:100%;height:auto;background:#fff;border:1px solid var(--line);
  border-radius:12px;display:block;margin-bottom:6px}
.who{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:18px}
.who label{margin-bottom:4px}
.who input{text-align:left;font-family:var(--ui);font-size:14px;font-weight:500;margin-bottom:9px}
.who input:last-of-type{margin-bottom:0}
.cap{font-size:11px;color:var(--ink-2);margin:0 0 16px;font-family:var(--num)}
.note{font-size:11px;line-height:1.55;color:var(--ink-2);background:#fff;border:1px solid var(--line);
  border-left:3px solid var(--maxia);border-radius:8px;padding:11px 12px;margin-top:20px}
.note b{color:var(--ink)}
.warn{color:var(--maxia);font-weight:700}
button.tg{flex:0 0 auto;padding:11px 12px;font-size:13px}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:8px}
.seg button{border:none;border-radius:0;flex:1;min-height:40px;font-size:12.5px;font-weight:600;
  background:#fff;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--brb);color:#fff}
.err{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 170px);
  background:#fff;border:1px solid var(--maxia);border-left:4px solid var(--maxia);
  border-radius:12px;padding:12px 14px;box-shadow:0 8px 28px #16202b22;z-index:15;display:none}
.err.on{display:block}
.err b{display:block;font-size:13px;color:var(--maxia);margin-bottom:3px}
.err span{font-size:12.5px;line-height:1.5;color:var(--ink)}
button.tg.on{background:var(--brb);border-color:var(--brb);color:#fff}
.mask{position:fixed;inset:0;background:#16202b66;display:none;align-items:center;
  justify-content:center;z-index:40;padding:20px}
.mask.on{display:flex}
.dlg{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:300px;
  box-shadow:0 18px 50px #16202b33}
.dlg h4{margin:0 0 3px;font-size:15px}
.dlg p{margin:0 0 12px;font-size:12px;color:var(--ink-2)}
.dlg input{font-size:22px;padding:12px}
.dlg .row{margin-top:12px}
</style>
</head>
<body>
<canvas id="board"></canvas>

<div class="hud">
  <div class="mark">HEXIS APP<small>προμέτρηση πεδίου</small></div>
  <div class="hint" id="hint">Πάτα για κορυφές</div>
</div>

<div class="dock">
  <div class="seg">
    <button id="t_hip" class="on">Τετράρριχτη</button>
    <button id="t_gable">Δίρριχτη</button>
    <button id="t_mono">Μονόρριχτη</button>
  </div>
  <div class="fields">
    <div><label>Κλίση %</label><input id="pit" type="number" inputmode="decimal" value="35"></div>
    <div><label>Γείσο m</label><input id="ovh" type="number" inputmode="decimal" value="0.60" step="0.05"></div>
    <div><label>Βάση m</label><input id="base" type="number" inputmode="decimal" value="3.20" step="0.05"></div>
    <div><label>Κερ/m²</label><input id="km2" type="number" inputmode="decimal" value="13"></div>
  </div>
  <div class="row" style="margin-top:9px">
    <button class="tg on" id="ortho" title="Κλείδωμα σε ορθές γωνίες">90°</button>
    <button class="tg" id="hole" title="Αίθριο ή κλιμακοστάσιο">Τρύπα</button>
    <button class="tg" id="refside" style="display:none">Πλευρά 1</button>
    <button class="gh" id="undo">Αναίρεση</button>
    <button class="gh" id="clear">Νέο</button>
    <button class="pri" id="solve" disabled>Κλείσε &amp; λύσε</button>
  </div>
</div>

<div class="err" id="err"><b>Δεν λύνεται</b><span id="errTxt"></span></div>

<div class="mask" id="mask">
  <div class="dlg">
    <h4>Μήκος πλευράς</h4>
    <p id="dlgInfo">Δώσε το ακριβές μήκος σε μέτρα.</p>
    <input id="dlgVal" type="text" inputmode="decimal" autocomplete="off">
    <div class="row"><button id="dlgNo">Άκυρο</button><button class="pri" id="dlgOk">Εφαρμογή</button></div>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-hd"><h2>Προμέτρηση</h2><button id="close">Πίσω</button></div>
  <div class="pad" id="out"></div>
</div>

<script>
/* ============================================================
   STRAIGHT SKELETON — port του τεσταρισμένου πυρήνα (40/40 σχήματα)
   Wavefront propagation: edge events + split events.
   ============================================================ */
const PX=0,PY=1,VT=2,EA=3,EB=4,PRV=5,NXT=6,ACT=7,BX=8,BY=9,RFX=10;
const QPX=0,QPY=1,QQX=2,QQY=3,EDX=4,EDY=5,ENX=6,ENY=7,ECC=8;
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
function area2(p){let s=0;for(let i=0;i<p.length;i++){const q=p[(i+1)%p.length];s+=p[i][0]*q[1]-q[0]*p[i][1];}return s;}

function mkedge(p,q){let dx=q[0]-p[0],dy=q[1]-p[1],L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;
  const nx=-dy,ny=dx;return [p[0],p[1],q[0],q[1],dx,dy,nx,ny,nx*p[0]+ny*p[1]];}
function bisect(ea,eb){const n1x=ea[ENX],n1y=ea[ENY],n2x=eb[ENX],n2y=eb[ENY];
  const det=n1x*n2y-n1y*n2x;if(Math.abs(det)<1e-12)return[n1x,n1y];
  return [(n2y-n1y)/det,(n1x-n2x)/det];}
function reflexp(ea,eb){return ea[EDX]*eb[EDY]-ea[EDY]*eb[EDX] < -1e-12;}
function vpos(v,t){const d=t-v[VT];return [v[PX]+v[BX]*d, v[PY]+v[BY]*d];}

function build(loops){
  /* loops: εξωτερικό (CCW) + τρύπες (CW). Δέχεται και σκέτο περίγραμμα. */
  if(typeof loops[0][0]==='number') loops=[loops];
  const E=[],V=[];
  for(const lp of loops){
    const n=lp.length, e0=E.length, v0=V.length;
    for(let i=0;i<n;i++)E.push(mkedge(lp[i],lp[(i+1)%n]));
    for(let i=0;i<n;i++){const ea=e0+(i-1+n)%n, eb=e0+i, b=bisect(E[ea],E[eb]);
      V.push([lp[i][0],lp[i][1],0,ea,eb,v0+(i-1+n)%n,v0+(i+1)%n,1,b[0],b[1],reflexp(E[ea],E[eb])?1:0]);}
  }
  return [V,E];}

function evEdge(V,ia,ib){const a=V[ia],b=V[ib];
  const ax=a[PX]-a[BX]*a[VT],ay=a[PY]-a[BY]*a[VT];
  const bx=b[PX]-b[BX]*b[VT],by=b[PY]-b[BY]*b[VT];
  const ddx=a[BX]-b[BX],ddy=a[BY]-b[BY],den=ddx*ddx+ddy*ddy;
  if(den<1e-16)return null;
  const t=((bx-ax)*ddx+(by-ay)*ddy)/den;
  const px=ax+a[BX]*t,py=ay+a[BY]*t,qx=bx+b[BX]*t,qy=by+b[BY]*t;
  if(Math.hypot(px-qx,py-qy)>1e-6)return null;
  if(t<Math.max(a[VT],b[VT])-1e-9)return null;
  return [t,[px,py]];}

function evSplit(V,E,iv,ie){const v=V[iv],e=E[ie];
  const den=e[ENX]*v[BX]+e[ENY]*v[BY]-1;
  if(Math.abs(den)<1e-12)return null;
  const bx=v[PX]-v[BX]*v[VT],by=v[PY]-v[BY]*v[VT];
  const t=(e[ECC]-(e[ENX]*bx+e[ENY]*by))/den;
  if(t<v[VT]+1e-9)return null;
  const px=bx+v[BX]*t,py=by+v[BY]*t;
  if(e[ENX]*px+e[ENY]*py-e[ECC] < -1e-6)return null;
  const s=(px-e[QPX])*e[EDX]+(py-e[QPY])*e[EDY];
  const L=(e[QQX]-e[QPX])*e[EDX]+(e[QQY]-e[QPY])*e[EDY];
  if(s < -t-1e-6 || s > L+t+1e-6)return null;
  return [t,[px,py]];}

function opposite(V,E,iv,ie,P,t){let best=null,bd=null;const e=E[ie];
  for(let cur=0;cur<V.length;cur++){const c=V[cur];
    if(cur===iv||!c[ACT]||c[EB]!==ie||c[NXT]<0||!V[c[NXT]][ACT])continue;
    const A=vpos(c,t),B=vpos(V[c[NXT]],t);
    const s=(P[0]-A[0])*e[EDX]+(P[1]-A[1])*e[EDY];
    const L=(B[0]-A[0])*e[EDX]+(B[1]-A[1])*e[EDY];
    if(s>=-1e-6&&s<=L+1e-6)return cur;
    const d=Math.min(Math.abs(s),Math.abs(s-L));
    if(bd===null||d<bd){bd=d;best=cur;}}
  return best;}

function newvert(V,E,P,t,ea,eb){const b=bisect(E[ea],E[eb]);
  V.push([P[0],P[1],t,ea,eb,-1,-1,1,b[0],b[1],reflexp(E[ea],E[eb])?1:0]);return V.length-1;}

function skeleton(pts,holes){
  let loops;
  if(typeof pts[0][0]==='number'){
    if(area2(pts)<0)pts=pts.slice().reverse();
    loops=[pts];
  } else { loops=pts; pts=loops[0]; }
  if(holes&&holes.length){
    loops=[area2(pts)<0?pts.slice().reverse():pts];
    for(const h of holes) loops.push(area2(h)>0?h.slice().reverse():h);  /* τρύπες ΔΕΞΙΟΣΤΡΟΦΑ */
    pts=loops[0];
  }
  const nAll=loops.reduce((s,l)=>s+l.length,0);
  const [V,E]=build(loops);const arcs=[],nodes=[];
  const maxit=60+16*nAll;
  for(let it=0;it<maxit;it++){
    let best=null;
    for(let i=0;i<V.length;i++){const v=V[i];if(!v[ACT])continue;
      const j=v[NXT];if(j<0||j===i||!V[j][ACT])continue;
      const r=evEdge(V,i,j);
      if(r&&(!best||r[0]<best[0]-1e-9))best=[r[0],'E',i,j,r[1],-1];}
    for(let i=0;i<V.length;i++){const v=V[i];if(!v[ACT]||!v[RFX])continue;
      for(let k=0;k<E.length;k++){if(k===v[EA]||k===v[EB])continue;
        const r=evSplit(V,E,i,k);if(!r)continue;
        if(best&&r[0]>=best[0]-1e-9)continue;
        if(opposite(V,E,i,k,r[1],r[0])===null)continue;
        best=[r[0],'S',i,-1,r[1],k];}}
    if(!best)break;
    const [t,kind,ia,ib,P,ie]=best;
    if(kind==='E'){const a=V[ia],b=V[ib];
      arcs.push([[a[PX],a[PY]],P]);arcs.push([[b[PX],b[PY]],P]);nodes.push([P,t]);
      const ip=a[PRV],inx=b[NXT];a[ACT]=0;b[ACT]=0;
      if(ip===ib||inx===ia)continue;
      const nv=newvert(V,E,P,t,a[EA],b[EB]);
      V[nv][PRV]=ip;V[nv][NXT]=inx;V[ip][NXT]=nv;V[inx][PRV]=nv;
      if(V[nv][PRV]===V[nv][NXT]){const o=V[nv][PRV];
        arcs.push([P,[V[o][PX],V[o][PY]]]);V[nv][ACT]=0;V[o][ACT]=0;}
    }else{
      const io=opposite(V,E,ia,ie,P,t);if(io===null)continue;
      const v=V[ia];arcs.push([[v[PX],v[PY]],P]);nodes.push([P,t]);
      const iy=V[io][NXT],ip=v[PRV],inx=v[NXT];v[ACT]=0;
      const v1=newvert(V,E,P,t,v[EA],ie),v2=newvert(V,E,P,t,ie,v[EB]);
      V[v1][PRV]=ip;V[v1][NXT]=iy;V[ip][NXT]=v1;V[iy][PRV]=v1;
      V[v2][PRV]=io;V[v2][NXT]=inx;V[io][NXT]=v2;V[inx][PRV]=v2;
      for(const nv of [v1,v2]){
        if(V[nv][PRV]===V[nv][NXT]&&V[nv][PRV]>=0){const o=V[nv][PRV];
          arcs.push([[V[nv][PX],V[nv][PY]],[V[o][PX],V[o][PY]]]);V[nv][ACT]=0;V[o][ACT]=0;}}
    }
    if(!V.some(v=>v[ACT]))break;
  }
  const clean=[];
  for(const a of arcs){if(dist(a[0],a[1])<1e-7)continue;
    if(!clean.some(x=>(dist(a[0],x[0])<1e-6&&dist(a[1],x[1])<1e-6)||(dist(a[0],x[1])<1e-6&&dist(a[1],x[0])<1e-6)))clean.push(a);}
  return {arcs:clean,nodes,pts,loops};
}

/* γείσο: κάθε κορυφή -> P - ovh*διχοτόμος (σωστό και σε ανακλαστικές) */
function offsetPoly(pts,d){const [V]=build(pts);
  return V.map(v=>[v[PX]-v[BX]*d, v[PY]-v[BY]*d]);}
function perim(p){let s=0;for(let i=0;i<p.length;i++)s+=dist(p[i],p[(i+1)%p.length]);return s;}

/* ============================================================
   ΕΛΕΓΧΟΣ ΓΕΩΜΕΤΡΙΑΣ — τι δεν λύνεται και γιατί
   ============================================================ */
function segX(a,b,c,d){                       /* τέμνονται τα τμήματα; */
  const o=(p,q,r)=>{const v=(q[1]-p[1])*(r[0]-q[0])-(q[0]-p[0])*(r[1]-q[1]);
    return Math.abs(v)<1e-12?0:(v>0?1:2);};
  const on=(p,q,r)=>Math.min(p[0],r[0])-1e-9<=q[0]&&q[0]<=Math.max(p[0],r[0])+1e-9&&
                    Math.min(p[1],r[1])-1e-9<=q[1]&&q[1]<=Math.max(p[1],r[1])+1e-9;
  const o1=o(a,b,c),o2=o(a,b,d),o3=o(c,d,a),o4=o(c,d,b);
  if(o1!==o2&&o3!==o4)return true;
  if(!o1&&on(a,c,b))return true; if(!o2&&on(a,d,b))return true;
  if(!o3&&on(c,a,d))return true; if(!o4&&on(c,b,d))return true;
  return false;
}
function checkGeom(P){
  if(P.length<3) return 'Χρειάζονται τουλάχιστον 3 κορυφές.';
  const n=P.length;
  for(let i=0;i<n;i++) if(dist(P[i],P[(i+1)%n])<0.05)
    return 'Η πλευρά '+(i+1)+' είναι σχεδόν μηδενική. Σβήσε τη διπλή κορυφή.';
  for(let i=0;i<n;i++)for(let j=i+2;j<n;j++){
    if(i===0&&j===n-1)continue;
    if(segX(P[i],P[(i+1)%n],P[j],P[(j+1)%n]))
      return 'Οι πλευρές '+(i+1)+' και '+(j+1)+' τέμνονται. Το περίγραμμα δεν επιτρέπεται να διασταυρώνεται.';
  }
  const A=Math.abs(area2(P)/2);
  if(A<0.5) return 'Το σχήμα είναι πολύ μικρό ή εκφυλισμένο (εμβαδόν '+A.toFixed(2)+' m²).';
  for(let i=0;i<n;i++){
    const a=P[(i-1+n)%n],c=P[i],b=P[(i+1)%n];
    const u=[a[0]-c[0],a[1]-c[1]],w=[b[0]-c[0],b[1]-c[1]];
    const ang=Math.acos(Math.max(-1,Math.min(1,(u[0]*w[0]+u[1]*w[1])/(Math.hypot(...u)*Math.hypot(...w)))))*180/Math.PI;
    if(ang<8) return 'Η γωνία στην κορυφή '+(i+1)+' είναι '+ang.toFixed(0)+'° — πολύ οξεία για να λυθεί στέγη.';
  }
  return null;
}
function checkSolution(sol,P){
  for(const v of P){
    const c=sol.arcs.filter(a=>dist(a[0],v)<1e-6||dist(a[1],v)<1e-6).length;
    if(c!==1) return 'Ο επιλύτης δεν κατέληξε σε έγκυρη στέγη σε αυτό το σχήμα.';
  }
  const K=p=>p[0].toFixed(5)+','+p[1].toFixed(5), adj={};
  for(const [a,b] of sol.arcs){(adj[K(a)]=adj[K(a)]||[]).push(K(b));(adj[K(b)]=adj[K(b)]||[]).push(K(a));}
  const ks=Object.keys(adj);
  if(ks.length){const seen=new Set(),st=[ks[0]];
    while(st.length){const k=st.pop(); if(seen.has(k))continue; seen.add(k); for(const w of adj[k])st.push(w);}
    if(seen.size!==ks.length) return 'Ο σκελετός βγήκε ασύνδετος — δοκίμασε απλούστερο περίγραμμα.';}
  return null;
}

/* ============================================================
   ΤΥΠΟΙ ΣΤΕΓΗΣ — τετράρριχτη (σκελετός) · δίρριχτη · μονόρριχτη
   Για δίρριχτη/μονόρριχτη το ύψος ορίζεται από την ΑΠΟΣΤΑΣΗ
   από μια πλευρά αναφοράς, όχι από τον σκελετό.
   ============================================================ */
function clipLine(P,p0,dir){                  /* διαστήματα της ευθείας μέσα στο πολύγωνο */
  const ts=[], n=P.length;
  for(let i=0;i<n;i++){
    const a=P[i],b=P[(i+1)%n];
    const ex=b[0]-a[0], ey=b[1]-a[1];
    const den=dir[0]*ey-dir[1]*ex; if(Math.abs(den)<1e-12)continue;
    const ax=a[0]-p0[0], ay=a[1]-p0[1];
    const t=(ax*ey-ay*ex)/den, ss=(ax*dir[1]-ay*dir[0])/den;
    if(ss>=-1e-9&&ss<=1+1e-9) ts.push(t);
  }
  ts.sort((x,y)=>x-y);
  const out=[];
  for(let i=0;i+1<ts.length;i+=2) if(ts[i+1]-ts[i]>1e-6) out.push([ts[i],ts[i+1]]);
  return out;
}
function splitAt(P,pts){
  /* βάζει τα σημεία pts ως κορυφές πάνω στις ακμές — αλλιώς ο κορφιάς
     δεν συνδέεται με το περίγραμμα και οι έδρες βγαίνουν λάθος */
  let Q=P.map(p=>p.slice());
  for(const q of pts){
    let bi=-1,bt=0,bd=1e9;
    for(let i=0;i<Q.length;i++){
      const a=Q[i],b=Q[(i+1)%Q.length];
      const dx=b[0]-a[0],dy=b[1]-a[1],L2=dx*dx+dy*dy; if(L2<1e-12)continue;
      const t=Math.max(0,Math.min(1,((q[0]-a[0])*dx+(q[1]-a[1])*dy)/L2));
      const d=Math.hypot(q[0]-a[0]-t*dx,q[1]-a[1]-t*dy);
      if(d<bd){bd=d;bi=i;bt=t;}
    }
    if(bi>=0&&bd<1e-6&&bt>1e-6&&bt<1-1e-6) Q.splice(bi+1,0,q.slice());
  }
  return Q;
}
function refFrame(P,ei){                      /* πλαίσιο πλευράς αναφοράς */
  const n=P.length, a=P[ei], b=P[(ei+1)%n], L=dist(a,b);
  const d=[(b[0]-a[0])/L,(b[1]-a[1])/L], nv=[-d[1],d[0]];
  let umax=0;
  for(const p of P) umax=Math.max(umax,(p[0]-a[0])*nv[0]+(p[1]-a[1])*nv[1]);
  return {a,d,nv,umax};
}
/* συνθέτει sol {arcs,nodes,pts} συμβατό με τα υπόλοιπα */
function buildSimpleRoof(P,type,ei,th){
  const F=refFrame(P,ei), arcs=[], nodes=[];
  if(type==='gable'){
    const u=F.umax/2;
    const p0=[F.a[0]+F.nv[0]*u, F.a[1]+F.nv[1]*u];
    for(const [t0,t1] of clipLine(P,p0,F.d)){
      const A=[p0[0]+F.d[0]*t0,p0[1]+F.d[1]*t0], B=[p0[0]+F.d[0]*t1,p0[1]+F.d[1]*t1];
      arcs.push([A,B]); nodes.push([A,u]); nodes.push([B,u]);
    }
  } else {                                     /* μονόρριχτη: κορφιάς = η απέναντι ακμή */
    const u=F.umax;
    const p0=[F.a[0]+F.nv[0]*u, F.a[1]+F.nv[1]*u];
    for(const [t0,t1] of clipLine(P,p0,F.d)){
      const A=[p0[0]+F.d[0]*t0,p0[1]+F.d[1]*t0], B=[p0[0]+F.d[0]*t1,p0[1]+F.d[1]*t1];
      nodes.push([A,u]); nodes.push([B,u]);
    }
  }
  const ends=[]; for(const ar of arcs){ends.push(ar[0],ar[1]);}
  for(const nd of nodes) ends.push(nd[0]);
  return {arcs,nodes,pts:splitAt(P,ends),frame:F,type};
}

/* ============================================================
   ΕΔΡΕΣ ΑΠΟ ΤΟΝ ΓΡΑΦΟ — μία έδρα ανά πλευρά, άθροισμα = εμβαδόν
   Διάσχιση: "επόμενη ακμή = η αμέσως δεξιόστροφα μετά την αντίστροφη"
   ============================================================ */
function faces(pts,arcs){
  const K=p=>p[0].toFixed(6)+','+p[1].toFixed(6);
  const pos={},adj={};
  const add=(u,v)=>{pos[K(u)]=u;pos[K(v)]=v;(adj[K(u)]=adj[K(u)]||new Set()).add(K(v));};
  const n=pts.length;
  for(let i=0;i<n;i++){add(pts[i],pts[(i+1)%n]);add(pts[(i+1)%n],pts[i]);}
  for(const ab of arcs){add(ab[0],ab[1]);add(ab[1],ab[0]);}
  const nb={};
  for(const k in adj) nb[k]=[...adj[k]].sort((x,y)=>
    Math.atan2(pos[x][1]-pos[k][1],pos[x][0]-pos[k][0])-
    Math.atan2(pos[y][1]-pos[k][1],pos[y][0]-pos[k][0]));
  const seen=new Set(), out=[];
  for(const u in adj) for(const v of nb[u]){
    if(seen.has(u+'|'+v))continue;
    const f=[];let cu=u,cv=v,g=0;
    while(!seen.has(cu+'|'+cv)&&g<5000){
      g++;seen.add(cu+'|'+cv);f.push(pos[cu]);
      const L=nb[cv],ix=L.indexOf(cu);cu=cv;cv=L[(ix-1+L.length)%L.length];
    }
    if(f.length>=3&&area2(f)/2>1e-6)out.push(f);
  }
  return out;
}
function polysegs(f){const o=[];for(let i=0;i<f.length;i++)o.push([f[i],f[(i+1)%f.length]]);return o;}
function faceFor(a,b,F){
  for(const f of F){const m=f.length;
    for(let k=0;k<m;k++) if(dist(f[k],a)<1e-6&&dist(f[(k+1)%m],b)<1e-6) return f;}
  const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];   /* εφεδρικό: μέσο πάνω σε ακμή έδρας */
  for(const f of F){const m=f.length;
    for(let k=0;k<m;k++){const p=f[k],q=f[(k+1)%m];
      const dx=q[0]-p[0],dy=q[1]-p[1],L2=dx*dx+dy*dy; if(L2<1e-12)continue;
      const t=Math.max(0,Math.min(1,((mid[0]-p[0])*dx+(mid[1]-p[1])*dy)/L2));
      if(Math.hypot(mid[0]-p[0]-t*dx,mid[1]-p[1]-t*dy)<1e-6)return f;}}
  return null;
}
/* πλησιέστερη τομή ημιευθείας (p,v) με σύνολο τμημάτων */
function rayNear(p,v,segs){let best=null;
  for(const ab of segs){const a=ab[0],b=ab[1];
    const dx=b[0]-a[0],dy=b[1]-a[1],det=v[0]*dy-v[1]*dx;
    if(Math.abs(det)<1e-12)continue;
    const ax=a[0]-p[0],ay=a[1]-p[1];
    const t=(ax*dy-ay*dx)/det, ss=(ax*v[1]-ay*v[0])/det;
    if(t>1e-7&&ss>=-1e-6&&ss<=1.000001&&(best===null||t<best))best=t;}
  return best;
}

/* ---------- ΞΥΛΟΤΥΠΟΣ: κάθε δοκός ΜΕΣΑ στην έδρα της ---------- */
function framing(eav,F,step,dz){
  const R={raf:[],purl:[]}, n=eav.length;
  for(let i=0;i<n;i++){
    const a=eav[i],b=eav[(i+1)%n],L=dist(a,b); if(L<1e-6)continue;
    const d=[(b[0]-a[0])/L,(b[1]-a[1])/L], nv=[-d[1],d[0]];
    const fc=faceFor(a,b,F); if(!fc)continue;
    const fs=polysegs(fc);
    for(let s=step/2;s<L;s+=step){
      const p=[a[0]+d[0]*s,a[1]+d[1]*s], t=rayNear(p,nv,fs);
      if(t&&t>0.01)R.raf.push([p,[p[0]+nv[0]*t,p[1]+nv[1]*t]]);
    }
    const m=[(a[0]+b[0])/2,(a[1]+b[1])/2], tm=rayNear(m,nv,fs);
    if(tm)for(let u=dz;u<tm;u+=dz){
      const p=[m[0]+nv[0]*u,m[1]+nv[1]*u];
      const q1=rayNear(p,d,fs), q2=rayNear(p,[-d[0],-d[1]],fs);
      if(q1&&q2)R.purl.push([[p[0]+d[0]*q1,p[1]+d[1]*q1],[p[0]-d[0]*q2,p[1]-d[1]*q2]]);
    }
  }
  return R;
}

/* ---------- ΑΝΑΠΤΥΓΜΑ: u αμετάβλητο, v / cos(κλίσης) ---------- */
function unfold(fc,a,b,ca){
  const L=dist(a,b);
  const d=[(b[0]-a[0])/L,(b[1]-a[1])/L], nv=[-d[1],d[0]];
  const P=fc.map(p=>{
    const u=(p[0]-a[0])*d[0]+(p[1]-a[1])*d[1];
    const v=(p[0]-a[0])*nv[0]+(p[1]-a[1])*nv[1];
    return [u,v/ca];});
  return {pts:P, area:Math.abs(area2(P)/2), L};
}

/* ============================================================
   ΕΥΡΩΚΩΔΙΚΑΣ 1 — Ελληνικό Εθνικό Προσάρτημα
   ============================================================ */
function ec1(adeg,zone,alt,vb0,terr,z){
  const sk0=zone===1?0.4:zone===2?1.7:0.8;
  const sk=sk0*(1+Math.pow(alt/917,2));
  const mu=adeg<=30?0.8:adeg<60?0.8*(60-adeg)/30:0;
  const T=[[0.003,1],[0.01,1],[0.05,2],[0.30,5],[1.0,10]][terr];
  const ze=Math.max(z,T[1]);
  const kr=0.19*Math.pow(T[0]/0.05,0.07), cr=kr*Math.log(ze/T[0]);
  const vm=cr*vb0, iv=1/Math.log(ze/T[0]);
  const qp=(1+7*iv)*0.5*1.25*vm*vm/1000;
  const ip=(a,tb)=>{if(a>=tb[tb.length-1][0])return tb[tb.length-1][1];
    for(let i=0;i<tb.length-1;i++){if(a>=tb[i][0]&&a<=tb[i+1][0])
      return tb[i][1]+(tb[i+1][1]-tb[i][1])*(a-tb[i][0])/(tb[i+1][0]-tb[i][0]);}return tb[0][1];};
  const cF=ip(adeg,[[5,-1.7],[15,-.9],[30,-.5],[45,0],[60,.7],[75,.8]]);
  return {sk,mu,s:mu*sk,qp,vm,wF:qp*cF};
}

/* ============================================================
   ΚΑΤΑΣΤΑΣΗ + ΚΑΜΒΑΣ
   ============================================================ */
const cv=document.getElementById('board'), ctx=cv.getContext('2d');
let DPR=1, W=0, H=0;
let verts=[], closed=false, sol=null, gp=null, anim=0;
let cell=48, ox=0, oy=0;               // px ανά μέτρο, μετατόπιση
let ortho=true, dragIdx=-1, edgeIdx=-1, dragOrig=null, downW=null;
let rtype='hip', refEdge=0, holes=[], holeMode=false, curHole=null;
const showErr=t=>{const e=document.getElementById('err');
  document.getElementById('errTxt').textContent=t; e.classList.add('on');};
const hideErr=()=>document.getElementById('err').classList.remove('on');
const G=v=>Math.round(v*20)/20;        // ψιλός κάνναβος 5 cm

function resize(){DPR=Math.min(devicePixelRatio||1,2.5);
  W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;
  cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);
  if(!verts.length){ox=W/2;oy=H/2;}draw();}
addEventListener('resize',resize);

const s2w=(x,y)=>[(x-ox)/cell, (oy-y)/cell];
const w2s=p=>[ox+p[0]*cell, oy-p[1]*cell];

function fit(){
  const all=(gp||verts); if(all.length<2)return;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of all){x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);}
  const pad=90, availW=W-2*pad, availH=H-260;
  cell=Math.max(8,Math.min(availW/Math.max(.5,x1-x0), availH/Math.max(.5,y1-y0)));
  ox=W/2-(x0+x1)/2*cell; oy=(H-150)/2+(y0+y1)/2*cell;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  /* κάνναβος */
  const step=cell>=26?1:cell>=13?2:5;
  ctx.lineWidth=1;
  const wx0=Math.floor(s2w(0,0)[0]/step)*step, wx1=s2w(W,0)[0];
  const wy1=s2w(0,0)[1], wy0=Math.floor(s2w(0,H)[1]/step)*step;
  for(let x=wx0;x<=wx1;x+=step){const sx=w2s([x,0])[0];
    ctx.strokeStyle=(Math.abs(x%(step*5))<1e-6)?'#D3DCE3':'#E3E9ED';
    ctx.beginPath();ctx.moveTo(sx,0);ctx.lineTo(sx,H);ctx.stroke();}
  for(let y=wy0;y<=wy1;y+=step){const sy=w2s([0,y])[1];
    ctx.strokeStyle=(Math.abs(y%(step*5))<1e-6)?'#D3DCE3':'#E3E9ED';
    ctx.beginPath();ctx.moveTo(0,sy);ctx.lineTo(W,sy);ctx.stroke();}

  const line=(a,b,c,w,dash)=>{ctx.strokeStyle=c;ctx.lineWidth=w;ctx.setLineDash(dash||[]);
    const A=w2s(a),B=w2s(b);ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();ctx.setLineDash([]);};

  if(sol&&gp){ /* γείσο */
    ctx.strokeStyle='var(--geiso)';
    for(let i=0;i<gp.length;i++)line(gp[i],gp[(i+1)%gp.length],'#4A7A4A',1.5,[7,4]);
  }

  /* πλευρά που σέρνεται */
  if(edgeIdx>=0&&verts.length>1){
    const A=w2s(verts[edgeIdx]),B=w2s(verts[(edgeIdx+1)%verts.length]);
    ctx.strokeStyle='#1F4E9C';ctx.lineWidth=7;ctx.globalAlpha=.22;
    ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();ctx.globalAlpha=1;
  }

  /* τρύπες */
  for(const h of holes.concat(curHole&&curHole.length?[curHole]:[])){
    if(h.length<2)continue;
    ctx.strokeStyle='#7A4DB0';ctx.lineWidth=2.2;ctx.setLineDash(h===curHole?[6,4]:[]);
    ctx.beginPath();
    h.forEach((q,i)=>{const S=w2s(q);i?ctx.lineTo(S[0],S[1]):ctx.moveTo(S[0],S[1]);});
    if(h!==curHole)ctx.closePath();
    ctx.stroke();ctx.setLineDash([]);
    for(const q of h){const S=w2s(q);ctx.fillStyle='#7A4DB0';
      ctx.beginPath();ctx.arc(S[0],S[1],4,0,7);ctx.fill();}
  }

  /* πλευρά αναφοράς σε δίρριχτη / μονόρριχτη */
  if(rtype!=='hip'&&verts.length>1){
    const A=w2s(verts[refEdge]),B=w2s(verts[(refEdge+1)%verts.length]);
    ctx.strokeStyle='#1F4E9C';ctx.lineWidth=6;ctx.globalAlpha=.3;
    ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();ctx.globalAlpha=1;
  }

  /* περίγραμμα */
  if(verts.length){
    ctx.lineWidth=2.5;ctx.strokeStyle='#16202B';ctx.beginPath();
    const P=w2s(verts[0]);ctx.moveTo(P[0],P[1]);
    for(let i=1;i<verts.length;i++){const q=w2s(verts[i]);ctx.lineTo(q[0],q[1]);}
    if(closed)ctx.closePath();
    ctx.stroke();
  }

  /* σκελετός με σταδιακή εμφάνιση */
  if(sol){
    const n=Math.ceil(sol.arcs.length*anim);
    for(let i=0;i<n;i++){
      const a=sol.arcs[i];
      const at=vidx(a[0]), bt=vidx(a[1]);
      const rf=(t)=>t!==null&&isReflex(sol.pts,t);
      const col=(rf(at)||rf(bt))?'#2E7FA8':(at!==null||bt!==null)?'#C0562F':'#C08A2E';
      const A=(at!==null&&gp)?gp[at]:a[0], B=(bt!==null&&gp)?gp[bt]:a[1];
      line(A,B,col,2.5);
    }
    if(anim>=1){ /* υψόμετρα */
      const base=+document.getElementById('base').value||0;
      const th=(+document.getElementById('pit').value||0)/100;
      ctx.font='600 11px '+getComputedStyle(document.body).getPropertyValue('--num');
      ctx.textAlign='center';ctx.fillStyle='#16202B';
      for(const [P,t] of sol.nodes){const S=w2s(P);
        ctx.fillStyle='#fff';ctx.fillRect(S[0]-21,S[1]-16,42,13);
        ctx.fillStyle='#C08A2E';ctx.fillText('+'+(base+t*th).toFixed(2),S[0],S[1]-6);}
    }
  }

  /* κορυφές */
  for(let i=0;i<verts.length;i++){const S=w2s(verts[i]);
    const act=(i===dragIdx);
    if(act){ctx.fillStyle='#1F4E9C22';ctx.beginPath();ctx.arc(S[0],S[1],20,0,7);ctx.fill();}
    ctx.fillStyle=act?'#1F4E9C':'#fff';ctx.strokeStyle='#1F4E9C';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(S[0],S[1],act?9:6.5,0,7);ctx.fill();ctx.stroke();}

  /* μήκη πλευρών — αποθηκεύονται για να πατιούνται */
  dimHits=[];
  if(verts.length>1){
    ctx.font='700 12px '+getComputedStyle(document.body).getPropertyValue('--num');
    ctx.textAlign='center';
    const lim=closed?verts.length:verts.length-1;
    for(let i=0;i<lim;i++){
      const a=verts[i],b=verts[(i+1)%verts.length],L=dist(a,b);
      if(L<.15)continue;
      const M=w2s([(a[0]+b[0])/2,(a[1]+b[1])/2]);
      ctx.fillStyle='#fff';ctx.strokeStyle='#C8D2DA';ctx.lineWidth=1;
      ctx.beginPath();ctx.roundRect(M[0]-24,M[1]-11,48,21,5);ctx.fill();ctx.stroke();
      ctx.fillStyle='#1F4E9C';ctx.fillText(L.toFixed(2),M[0],M[1]+4);
      dimHits.push({i,x:M[0],y:M[1]});}
  }
}
function vidx(p){for(let i=0;i<sol.pts.length;i++)if(dist(p,sol.pts[i])<1e-6)return i;return null;}
function isReflex(p,i){const n=p.length,a=p[(i-1+n)%n],c=p[i],b=p[(i+1)%n];
  return (c[0]-a[0])*(b[1]-c[1])-(c[1]-a[1])*(b[0]-c[0]) < -1e-9;}

/* ---------- είσοδος ---------- */
let down=null,moved=false,panned=false;
cv.addEventListener('pointerdown',e=>{
  down=[e.clientX,e.clientY];moved=false;panned=false;dragIdx=-1;
  /* πιάσιμο κορυφής: μεγάλος στόχος για δάχτυλο */
  for(let i=0;i<verts.length;i++){
    const S=w2s(verts[i]);
    if(Math.hypot(e.clientX-S[0],e.clientY-S[1])<26){
      dragIdx=i; dragOrig=verts.map(v=>v.slice()); break;}
  }
  /* αλλιώς: πιάσιμο ΠΛΕΥΡΑΣ -> μετακίνηση παράλληλα (οι γωνίες μένουν) */
  if(dragIdx<0&&verts.length>1){
    const lim=closed?verts.length:verts.length-1;
    for(let i=0;i<lim;i++){
      const A=w2s(verts[i]), B=w2s(verts[(i+1)%verts.length]);
      const dx=B[0]-A[0],dy=B[1]-A[1],L2=dx*dx+dy*dy; if(L2<400)continue;
      const t=Math.max(0,Math.min(1,((e.clientX-A[0])*dx+(e.clientY-A[1])*dy)/L2));
      if(Math.hypot(e.clientX-A[0]-t*dx, e.clientY-A[1]-t*dy)<20){
        edgeIdx=i; dragOrig=verts.map(v=>v.slice());
        downW=s2w(e.clientX,e.clientY); break;}
    }
  }
});
cv.addEventListener('pointermove',e=>{
  if(!down)return;
  if(dragIdx>=0){
    if(Math.hypot(e.clientX-down[0],e.clientY-down[1])<6)return;
    moved=true;
    const w=s2w(e.clientX,e.clientY);
    const p=[G(w[0]),G(w[1])];
    const n=dragOrig.length, O=dragOrig[dragIdx];
    if(ortho){
      /* ΟΡΘΟ: μαζί με την κορυφή μετακινούνται ΟΛΕΣ όσες μοιράζονται
         την ίδια συντεταγμένη -> το σχήμα παραμένει ορθογωνικό */
      const dx=p[0]-O[0], dy=p[1]-O[1];
      for(let k=0;k<n;k++){
        const q=dragOrig[k].slice();
        if(Math.abs(q[0]-O[0])<1e-6)q[0]+=dx;
        if(Math.abs(q[1]-O[1])<1e-6)q[1]+=dy;
        verts[k]=q;
      }
    } else {
      verts[dragIdx]=p;               /* ελεύθερη γωνία: μόνο αυτή η κορυφή */
    }
    draw();return;
  }
  if(edgeIdx>=0){
    if(Math.hypot(e.clientX-down[0],e.clientY-down[1])<6)return;
    moved=true;
    const w=s2w(e.clientX,e.clientY);
    const n=dragOrig.length, i=edgeIdx, j=(i+1)%n;
    const A=dragOrig[i], B=dragOrig[j];
    const L=dist(A,B); if(L<1e-9)return;
    const d=[(B[0]-A[0])/L,(B[1]-A[1])/L], nv=[-d[1],d[0]];
    /* μετατόπιση = προβολή της κίνησης στην κάθετο της πλευράς */
    let de=(w[0]-downW[0])*nv[0]+(w[1]-downW[1])*nv[1];
    de=Math.round(de*20)/20;
    const c=nv[0]*A[0]+nv[1]*A[1]+de;
    /* οι γειτονικές πλευρές ΚΡΑΤΟΥΝ τη διεύθυνσή τους -> οι γωνίες μένουν */
    const solve=(P,Q)=>{const ex=Q[0]-P[0],ey=Q[1]-P[1];
      const den=nv[0]*ex+nv[1]*ey; if(Math.abs(den)<1e-9)return null;
      const t=(c-(nv[0]*P[0]+nv[1]*P[1]))/den;
      return [P[0]+ex*t, P[1]+ey*t];};
    const pv=closed?dragOrig[(i-1+n)%n]:(i>0?dragOrig[i-1]:null);
    const nx=closed?dragOrig[(j+1)%n]:(j<n-1?dragOrig[j+1]:null);
    verts=dragOrig.map(v=>v.slice());
    verts[i]=(pv&&solve(pv,A))||[A[0]+nv[0]*de, A[1]+nv[1]*de];
    verts[j]=(nx&&solve(nx,B))||[B[0]+nv[0]*de, B[1]+nv[1]*de];
    draw();return;
  }
  if(Math.hypot(e.clientX-down[0],e.clientY-down[1])>7){moved=true;
    ox+=e.clientX-down[0];oy+=e.clientY-down[1];down=[e.clientX,e.clientY];panned=true;draw();}
});
cv.addEventListener('pointerup',e=>{
  if(edgeIdx>=0){
    const wasDrag=moved; edgeIdx=-1;
    if(wasDrag){ if(closed){closed=false;sol=null;gp=null;finish();} down=null;return; }
    /* απλό πάτημα πάνω σε ετικέτα -> ακριβές μήκος */
    for(const dh of dimHits)
      if(Math.abs(e.clientX-dh.x)<30&&Math.abs(e.clientY-dh.y)<20){askLen(dh.i);down=null;return;}
    down=null;return;
  }
  if(dragIdx>=0){
    const wasDrag=moved, idx=dragIdx; dragIdx=-1;
    if(wasDrag){                                   /* μετακινήθηκε -> επίλυση ξανά */
      if(closed){closed=false;sol=null;gp=null;finish();}
      down=null;return;
    }
    if(!closed&&idx===0&&verts.length>2){finish();down=null;return;}  /* πάτημα 1ης = κλείσιμο */
    down=null;return;
  }
  if(!moved){
    /* πάτημα σε ετικέτα μήκους -> ακριβής τιμή */
    for(const d of dimHits){
      if(Math.abs(e.clientX-d.x)<30&&Math.abs(e.clientY-d.y)<20){
        askLen(d.i);down=null;return;}
    }
  }
  if(!moved&&holeMode){
    const w=s2w(e.clientX,e.clientY);
    let q=[G(w[0]),G(w[1])];
    if(ortho&&curHole.length){const L=curHole[curHole.length-1];
      if(Math.abs(q[0]-L[0])<Math.abs(q[1]-L[1]))q[0]=L[0];else q[1]=L[1];}
    if(curHole.length>2&&dist(q,curHole[0])<0.6){
      holes.push(curHole);curHole=[];holeMode=false;
      document.getElementById('hole').classList.remove('on');
      hint('Τρύπα '+holes.length+' προστέθηκε');
      closed=false;sol=null;gp=null;finish();down=null;return;}
    curHole.push(q);draw();down=null;return;
  }
  if(!moved&&!closed){
    let w=s2w(e.clientX,e.clientY);
    let p=[G(w[0]),G(w[1])];
    if(ortho&&verts.length){
      /* κούμπωμα σε οριζόντια/κατακόρυφη ως προς την προηγούμενη */
      const L=verts[verts.length-1];
      if(Math.abs(p[0]-L[0])<Math.abs(p[1]-L[1]))p[0]=L[0];else p[1]=L[1];
    }
    if(verts.length>2&&dist(p,verts[0])<0.6){finish();down=null;return;}
    if(!verts.length||dist(p,verts[verts.length-1])>1e-6)verts.push(p);
    document.getElementById('solve').disabled=verts.length<3;
    hint(verts.length<3?'Πάτα για κορυφές · 90° για λοξές'
      :'Πάτα μήκος για ακριβή τιμή · πρώτη κορυφή για κλείσιμο');
    draw();
  }
  down=null;
});

/* ---------- ακριβές μήκος πλευράς ---------- */
let dimHits=[], editIdx=-1;
function askLen(i){
  editIdx=i;
  const a=verts[i], b=verts[(i+1)%verts.length];
  document.getElementById('dlgInfo').textContent=
    'Πλευρά '+(i+1)+' · τώρα '+dist(a,b).toFixed(2)+' m. Η διεύθυνση δεν αλλάζει.';
  const v=document.getElementById('dlgVal');
  v.value=dist(a,b).toFixed(2);
  document.getElementById('mask').classList.add('on');
  setTimeout(()=>{v.focus();v.select();},60);
}
function applyLen(){
  const raw=document.getElementById('dlgVal').value.replace(',','.');
  const L=parseFloat(raw);
  document.getElementById('mask').classList.remove('on');
  if(!(L>0.05)||editIdx<0)return;
  const i=editIdx, n=verts.length, j=(i+1)%n;
  const a=verts[i], b=verts[j], cur=dist(a,b);
  if(cur<1e-9)return;
  const ux=(b[0]-a[0])/cur, uy=(b[1]-a[1])/cur;
  const dx=(L-cur)*ux, dy=(L-cur)*uy;
  const T=1e-6, horiz=Math.abs(uy)<1e-9, vert=Math.abs(ux)<1e-9;

  if(ortho&&(horiz||vert)){
    /* ΟΡΘΟΓΩΝΙΚΟΣ ΠΕΡΙΟΡΙΣΜΟΣ: μετακινούνται ΟΛΕΣ οι κορυφές που
       μοιράζονται τη συντεταγμένη που αλλάζει. Έτσι το ορθογώνιο
       παραμένει ορθογώνιο και η απέναντι πλευρά ακολουθεί. */
    if(horiz){ const x0=b[0];
      for(let k=0;k<n;k++) if(Math.abs(verts[k][0]-x0)<1e-6)
        verts[k]=[verts[k][0]+dx, verts[k][1]]; }
    else { const y0=b[1];
      for(let k=0;k<n;k++) if(Math.abs(verts[k][1]-y0)<1e-6)
        verts[k]=[verts[k][0], verts[k][1]+dy]; }
  } else {
    /* λοξή πλευρά ή ελεύθερη γωνία: μετακινείται το άκρο και όσα ακολουθούν */
    for(let k=j;k<=n-1;k++){
      if(k===0)continue;
      verts[k]=[verts[k][0]+dx, verts[k][1]+dy];
    }
  }
  if(closed){closed=false;sol=null;gp=null;finish();}
  else draw();
}
let pinch=null;
cv.addEventListener('touchstart',e=>{if(e.touches.length===2){
  pinch=[Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY),cell];}},{passive:true});
cv.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinch){
  const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  cell=Math.max(8,Math.min(220,pinch[1]*d/pinch[0]));draw();}},{passive:true});
cv.addEventListener('touchend',()=>{pinch=null;});

const hint=t=>document.getElementById('hint').textContent=t;

/* ---------- λύση ---------- */
function finish(){
  hideErr();
  if(verts.length<3){showErr('Χρειάζονται τουλάχιστον 3 κορυφές.');return;}
  let p=verts.filter((v,i)=>i===0||dist(v,verts[i-1])>1e-6);
  if(p.length>1&&dist(p[0],p[p.length-1])<1e-6)p.pop();
  const cl=[];
  for(let i=0;i<p.length;i++){const a=p[(i-1+p.length)%p.length],c=p[i],b=p[(i+1)%p.length];
    const la=dist(a,c),lb=dist(c,b);if(la<1e-9||lb<1e-9)continue;
    const cr=Math.abs((c[0]-a[0])*(b[1]-c[1])-(c[1]-a[1])*(b[0]-c[0]))/(la*lb);
    if(cr>1e-6)cl.push(c);}
  p=cl.length>=3?cl:p;
  if(area2(p)<0)p.reverse();

  const e=checkGeom(p);
  if(e){showErr(e+' Διόρθωσε το περίγραμμα και δοκίμασε ξανά.');return;}

  /* οι τρύπες πρέπει να είναι ΕΝΤΟΣ και να μην τέμνονται */
  for(let k=0;k<holes.length;k++){
    const h=holes[k];
    const eh=checkGeom(h.slice());
    if(eh){showErr('Τρύπα '+(k+1)+': '+eh);return;}
    for(const q of h) if(!inPoly(q,p)){
      showErr('Η τρύπα '+(k+1)+' βγαίνει εκτός περιγράμματος.');return;}
    if(Math.abs(area2(h)/2) > Math.abs(area2(p)/2)*0.75){
      showErr('Η τρύπα '+(k+1)+' είναι πολύ μεγάλη σε σχέση με τη στέγη.');return;}
  }

  verts=p;closed=true;refEdge=Math.min(refEdge,p.length-1);
  const ovh=+document.getElementById('ovh').value||0;
  const th=(+document.getElementById('pit').value||35)/100;
  const H=holes.map(h=>h.map(q=>q.slice()));

  try{
    if(rtype==='hip') sol=skeleton(p,H);
    else{
      if(H.length){showErr('Οι τρύπες υποστηρίζονται μόνο σε τετράρριχτη στέγη.');closed=false;return;}
      sol=buildSimpleRoof(p,rtype,refEdge,th);
    }
  }catch(err){showErr('Ο επιλύτης απέτυχε σε αυτό το σχήμα. Δοκίμασε απλούστερο περίγραμμα.');
    closed=false;sol=null;return;}

  if(rtype==='hip'){
    const bad=checkSolution(sol,p);
    if(bad){showErr(bad+' Δώσε νέα γεωμετρία.');closed=false;sol=null;return;}
  }

  gp=ovh>0.001?offsetPoly(p,ovh):null;
  fit();
  anim=0;const t0=performance.now();
  (function step(){anim=Math.min(1,(performance.now()-t0)/520);draw();
    if(anim<1)requestAnimationFrame(step);else report();})();
  hint('Λύθηκε · '+({hip:'τετράρριχτη',gable:'δίρριχτη',mono:'μονόρριχτη'})[rtype]);
  document.getElementById('solve').textContent='Ποσότητες';
  document.getElementById('solve').disabled=false;
}
function inPoly(P,ps){let c=false,j=ps.length-1;
  for(let i=0;i<ps.length;i++){const xi=ps[i][0],yi=ps[i][1],xj=ps[j][0],yj=ps[j][1];
    if(((yi>P[1])!==(yj>P[1]))&&(P[0]<(xj-xi)*(P[1]-yi)/(yj-yi+1e-30)+xi))c=!c;j=i;}
  return c;}

function quantities(){
  const th=(+document.getElementById('pit').value||35)/100;
  const a=Math.atan(th), ca=Math.cos(a), adeg=a*180/Math.PI;
  const base=+document.getElementById('base').value||0;
  const km2=+document.getElementById('km2').value||13;
  const eav=gp||sol.pts;
  let plan=Math.abs(area2(eav)/2), per=perim(eav);
  /* οι τρύπες αφαιρούν εμβαδόν και προσθέτουν υδρορροή */
  const parapet=[];
  const bldup=(0.16+0.02+0.10+0.04+0.05+0.05)/ca;
  for(const h of holes){
    plan-=Math.abs(area2(h)/2); per+=perim(h);
    let dmax=0;
    for(let i=0;i<h.length;i++){
      const a2=h[i],b2=h[(i+1)%h.length],L2=dist(a2,b2),np=Math.max(1,Math.ceil(L2/0.2));
      for(let k=0;k<=np;k++){
        const q=[a2[0]+(b2[0]-a2[0])*k/np, a2[1]+(b2[1]-a2[1])*k/np];
        let d=1e9;
        for(let j=0;j<sol.pts.length;j++){
          const u=sol.pts[j],v=sol.pts[(j+1)%sol.pts.length];
          const dx=v[0]-u[0],dy=v[1]-u[1],L3=dx*dx+dy*dy;
          const t=L3<1e-12?0:Math.max(0,Math.min(1,((q[0]-u[0])*dx+(q[1]-u[1])*dy)/L3));
          d=Math.min(d,Math.hypot(q[0]-u[0]-t*dx,q[1]-u[1]-t*dy));
        }
        dmax=Math.max(dmax,d);
      }
    }
    parapet.push({d:dmax, hStruct:dmax*th, h:dmax*th+bldup+0.15});
  }
  const roof=plan/ca;
  let lmax=0,lnt=0,lkr=0,hmax=0;
  for(const [P,t] of sol.nodes)hmax=Math.max(hmax,t*th);
  for(const arc of sol.arcs){
    const ia=vidx(arc[0]), ib=vidx(arc[1]);
    const A=(ia!==null&&gp)?gp[ia]:arc[0], B=(ib!==null&&gp)?gp[ib]:arc[1];
    const L=dist(A,B);
    if((ia!==null&&isReflex(sol.pts,ia))||(ib!==null&&isReflex(sol.pts,ib)))lnt+=L;
    else if(ia!==null||ib!==null)lmax+=L;else lkr+=L;
  }
  const E=ec1(adeg,3,100,33,2,Math.max(3,base+hmax));
  /* ΤΑ ΤΟΞΑ ΕΠΕΚΤΕΙΝΟΝΤΑΙ ΣΤΟ ΓΕΙΣΟ, αλλιώς οι έδρες χτίζονται στο
     περίγραμμα του τοίχου και καμία πλευρά του γείσου δεν βρίσκει έδρα. */
  const arcsE=sol.arcs.map(ar=>{
    const ia=vidx(ar[0]), ib=vidx(ar[1]);
    return [(ia!==null&&gp)?gp[ia]:ar[0], (ib!==null&&gp)?gp[ib]:ar[1]];});
  const F=faces(eav,arcsE);
  const fr=framing(eav,F,0.80,0.30);
  const unf=[];
  for(let i=0;i<eav.length;i++){
    const fc=faceFor(eav[i],eav[(i+1)%eav.length],F);
    if(fc)unf.push(unfold(fc,eav[i],eav[(i+1)%eav.length],ca));
  }
  const rafLen=fr.raf.reduce((t,x)=>t+dist(x[0],x[1]),0)/ca;   /* κεκλιμένο μήκος */
  const purlLen=fr.purl.reduce((t,x)=>t+dist(x[0],x[1]),0);     /* οριζόντιες -> ίδιο */
  return {th,a,ca,adeg,base,plan,per,roof,hmax,lmax,lnt,lkr,km2,E,F,fr,unf,eav,arcsE,rafLen,purlLen,parapet,rtype,
    tiles:Math.ceil(roof*km2), kav:Math.ceil(lkr/0.33), kavm:Math.ceil(lmax/0.33),
    akro:Math.ceil(per/0.25), aer:Math.max(2,Math.ceil(roof/25)),
    boards:roof};
}

/* ---------- Ελάχιστος PDF writer (χωρίς εξωτερική βιβλιοθήκη) ----------
   Σελίδες A4 με ενσωματωμένα JPEG. Καμία εξωτερική βιβλιοθήκη. */
function b64bytes(dataURL){
  const b=atob(dataURL.split(',')[1]), u=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
  return u;
}
function savePdf(canvases,W,H,name){
  const jp=canvases.map(c=>({bytes:b64bytes(c.toDataURL('image/jpeg',0.92)),
                             w:c.width,h:c.height}));
  const enc=new TextEncoder(), parts=[], off=[]; let len=0;
  const push=u=>{parts.push(u);len+=u.length;}, txt=t=>push(enc.encode(t));
  const N2=jp.length, nObj=2+N2*3;
  txt('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const mark=i=>{off[i]=len;};
  mark(1);txt('1 0 obj\n<</Type/Catalog/Pages 2 0 R>>\nendobj\n');
  const kids=[];for(let i=0;i<N2;i++)kids.push((3+i*3)+' 0 R');
  mark(2);txt('2 0 obj\n<</Type/Pages/Kids['+kids.join(' ')+']/Count '+N2+'>>\nendobj\n');
  for(let i=0;i<N2;i++){
    const pg=3+i*3, co=pg+1, im=pg+2, j=jp[i];
    mark(pg);txt(pg+' 0 obj\n<</Type/Page/Parent 2 0 R/MediaBox[0 0 '+W+' '+H+']'+
      '/Resources<</XObject<</Im0 '+im+' 0 R>>>>/Contents '+co+' 0 R>>\nendobj\n');
    const cs='q '+W+' 0 0 '+H+' 0 0 cm /Im0 Do Q\n';
    mark(co);txt(co+' 0 obj\n<</Length '+cs.length+'>>\nstream\n'+cs+'endstream\nendobj\n');
    mark(im);txt(im+' 0 obj\n<</Type/XObject/Subtype/Image/Width '+j.w+'/Height '+j.h+
      '/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+j.bytes.length+
      '>>\nstream\n');
    push(j.bytes);txt('\nendstream\nendobj\n');
  }
  const xr=len;
  let x='xref\n0 '+(nObj+1)+'\n0000000000 65535 f \n';
  for(let i=1;i<=nObj;i++)x+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  txt(x+'trailer\n<</Size '+(nObj+1)+'/Root 1 0 R>>\nstartxref\n'+xr+'\n%%EOF\n');
  const out=new Uint8Array(len);let o=0;
  for(const q of parts){out.set(q,o);o+=q.length;}
  const url=URL.createObjectURL(new Blob([out],{type:'application/pdf'}));
  const a=document.createElement('a');a.href=url;a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}

const N=(v,d=2)=>v.toFixed(d).replace('.',',');
/* στοιχεία χρήστη — μένουν στη συσκευή του, δεν φεύγουν πουθενά */
function me(k){ const el=document.getElementById(k);
  if(el&&el.value!==undefined&&el.value!=='')return el.value;
  try{return localStorage.getItem('hexis-'+k)||'';}catch(e){return '';} }

/* ---------- ΠΡΟΓΡΑΜΜΑ ΔΟΚΩΝ: ομαδοποίηση ανά μήκος ---------- */
function grp(list,step){
  const L=list.map(s=>dist(s[0],s[1])).sort((a,b)=>a-b), out=[];
  let cur=null,cnt=0;
  for(const v of L){const k=Math.round(v/step)*step;
    if(cur!==null&&Math.abs(k-cur)<step*0.6)cnt++;
    else{if(cur!==null)out.push([cur,cnt]);cur=k;cnt=1;}}
  if(cur!==null)out.push([cur,cnt]);
  return out;
}
function markOf(len,g,step){
  for(let i=0;i<g.length;i++) if(Math.abs(len-g[i][0])<step*0.6) return i+1;
  return g.length;
}
/* Κωδικοποιούνται ΜΟΝΟ οι αμείβοντες: κόβονται σε μοναδικά μήκη.
   Οι τεγίδες ματίζονται πάνω τους -> δίνονται ως συνολικά τρέχοντα μέτρα. */
function schedule(q){
  /* τα σχεδιασμένα μήκη είναι προβολές -> κεκλιμένο = προβολή / cos */
  const g=grp(q.fr.raf,0.05*q.ca);
  return {A:g.map(x=>[x[0]/q.ca,x[1]])};
}

/* ---------- ΞΥΛΟΤΥΠΟΣ σε καμβά ---------- */
function drawFraming(c,q,marks){
  const x=c.getContext('2d'), W=c.width, H=c.height;
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  const all=q.eav; let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of all){x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);}
  const pad=14, sc=Math.min((W-2*pad)/Math.max(.5,x1-x0),(H-2*pad)/Math.max(.5,y1-y0));
  const T=p=>[W/2+(p[0]-(x0+x1)/2)*sc, H/2-(p[1]-(y0+y1)/2)*sc];
  const seg=(a,b,col,lw)=>{x.strokeStyle=col;x.lineWidth=lw;const A=T(a),B=T(b);
    x.beginPath();x.moveTo(A[0],A[1]);x.lineTo(B[0],B[1]);x.stroke();};
  for(const r of q.fr.purl) seg(r[0],r[1],'#4A93C4',1);
  for(const r of q.fr.raf)  seg(r[0],r[1],'#5FA85F',1.2);
  for(const arc of q.arcsE) seg(arc[0],arc[1],'#D0503A',2.4);
  for(let i=0;i<all.length;i++) seg(all[i],all[(i+1)%all.length],'#16202B',1.8);
  if(marks){
    const sc2=schedule(q);
    x.font='700 '+Math.max(7,Math.round(sc*0.11))+'px ui-monospace,Menlo,monospace';
    x.textAlign='center';
    const put=(list,g,pre,col)=>{
      for(const r of list){
        const L=dist(r[0],r[1])/q.ca; if(dist(r[0],r[1])*sc<34)continue;
        const m=[(r[0][0]+r[1][0])/2,(r[0][1]+r[1][1])/2], P=T(m);
        let an=Math.atan2(-(r[1][1]-r[0][1]),r[1][0]-r[0][0]);
        if(an>Math.PI/2)an-=Math.PI; if(an<-Math.PI/2)an+=Math.PI;
        x.save();x.translate(P[0],P[1]);x.rotate(an);
        x.fillStyle=col;x.fillText(pre+markOf(L,g,0.05/q.ca),0,-3);x.restore();
      }};
    put(q.fr.raf,sc2.A,'A','#2E6B2E');
  }
}

/* ---------- ΤΟΜΗ ΖΕΥΚΤΟΥ σε καμβά ---------- */
function drawSection(c,q){
  const x=c.getContext('2d'), W=c.width, H=c.height;
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  const th=q.th, a=q.a, ca=q.ca, S=Math.max(2,2*q.hmax/Math.max(th,1e-6));
  const half=S/2, ovh=+document.getElementById('ovh').value||0.6;
  const am=.16,el=.18,ort=.12,ant=.10,kor=.10,strw=.12,ww=.25;
  const pet=.02,tth=.10,epi=.04,tg=.05,ker=.05, dz=.30;
  const korh=Math.max(.20, am/ca+.03);
  const TOT=am+pet+tth+epi+tg+ker;
  const wTot=S+2*ovh+2*TOT*Math.sin(a), hTot=half*th+TOT/ca+el+strw+.9;
  const pad=16, sc=Math.min((W-2*pad)/wTot,(H-2*pad-14)/hTot);
  const ox2=(W-wTot*sc)/2+(ovh+TOT*Math.sin(a))*sc, oy2=H-pad-(el+strw+.9)*sc;
  const T2=p=>[ox2+p[0]*sc, oy2-p[1]*sc];
  const adv=(p,an,d)=>[p[0]+Math.cos(an)*d, p[1]+Math.sin(an)*d];
  const off=(p,an,d)=>[p[0]-Math.sin(an)*d, p[1]+Math.cos(an)*d];
  const poly=(pts,fill,st,lw)=>{x.beginPath();
    pts.forEach((p,i)=>{const P=T2(p); i?x.lineTo(P[0],P[1]):x.moveTo(P[0],P[1]);});
    x.closePath(); if(fill){x.fillStyle=fill;x.fill();}
    if(st){x.strokeStyle=st;x.lineWidth=lw||1;x.stroke();}};
  const band=(p,an,LL,o1,o2,fill,st,vc)=>{
    const tn=Math.tan(an), L1=vc?LL+o1*tn:LL, L2=vc?LL+o2*tn:LL;
    poly([off(p,an,o1),off(adv(p,an,L1),an,o1),off(adv(p,an,L2),an,o2),off(p,an,o2)],fill,st,1);};
  const H0=[0,strw+el], HR=[S,strw+el];
  /* τοίχοι + στρωτήρες */
  poly([[0,strw],[ww,strw],[ww,-0.9],[0,-0.9]],'#7A7A7A88','#7A7A7A');
  poly([[S,strw],[S-ww,strw],[S-ww,-0.9],[S,-0.9]],'#7A7A7A88','#7A7A7A');
  poly([[0,0],[strw,0],[strw,strw],[0,strw]],'#8B6A3E','#6B4E2A');
  poly([[S,0],[S-strw,0],[S-strw,strw],[S,strw]],'#8B6A3E','#6B4E2A');
  /* ελκυστήρας */
  poly([[0,H0[1]-el],[S,H0[1]-el],[S,H0[1]],[0,H0[1]]],'#8B6A3E','#6B4E2A');
  /* κλίσεις */
  const LRr=(half-kor/2)/ca, LR=half/ca, ext=ovh/ca;
  for(const [p0,an] of [[H0,a],[HR,Math.PI-a]]){
    const sg=(an===a)?1:-1;
    const P0=adv(p0,an,-ext);
    const o=[am*sg,(am+pet)*sg,(am+pet+tth)*sg,(am+pet+tth+epi)*sg,(am+pet+tth+epi+tg)*sg];
    band(P0,an,LRr+ext,0,o[0],'#8B6A3E','#6B4E2A',1);
    band(P0,an,LR+ext,o[0],o[1],'#B8A17699','#8A7A55',1);
    band(P0,an,LR+ext,o[1],o[2],'#4A93C466','#2E7FA8',1);
    band(P0,an,LR+ext,o[2],o[3],'#8B6A3E','#6B4E2A',1);
    for(let t=0;t<LR+ext;t+=dz) band(adv(P0,an,t),an,tg,o[3],o[4],'#8B6A3E','#6B4E2A',0);
    band(P0,an,LR+ext,o[4],o[4]+ker*sg,'#C4562F99','#A0432A',1);
  }
  /* κορφιάς */
  const q1=strw+el+(half-kor/2)*th+am/ca, q2=strw+el+half*th+am/ca;
  poly([[half-kor/2,q1-korh],[half+kor/2,q1-korh],[half+kor/2,q1],[half,q2],[half-kor/2,q1]],
       '#8B6A3E','#6B4E2A',1.4);
  /* ορθοστάτης κρεμαστός + λάμα */
  const kb=strw+el+.03, kt=strw+el+half*th;
  poly([[half-ort/2,kb],[half+ort/2,kb],[half+ort/2,kt],[half-ort/2,kt]],'#8B6A3E','#6B4E2A');
  poly([[half-ort/2-.02,strw+el+.30],[half+ort/2+.02,strw+el+.30],
        [half+ort/2+.02,strw+el-el],[half-ort/2-.02,strw+el-el]],'#5B6BA8','#3E4C7E');
  /* αντηρίδες */
  for(const sgn of [-1,1]){
    const A=[half,kb+.06], B=[half+sgn*half/2, strw+el+(half/2)*th];
    const L=Math.hypot(B[0]-A[0],B[1]-A[1]), an=Math.atan2(B[1]-A[1],B[0]-A[0]);
    band(A,an,L,-ant/2,ant/2,'#8B6A3E','#6B4E2A',0);
  }
  /* καβαλλάρης */
  const cy0=strw+el+half*th+TOT/ca, dk=.18, hk=.06, tk=ker/2;
  const out=[],inn=[];
  for(let i=0;i<=8;i++){
    const xx=half-dk+2*dk*i/8, u=(xx-half)/dk;
    const yb=cy0-Math.abs(xx-half)*th, yo=yb+hk*(1-u*u);
    out.push([xx,yo]); inn.push([xx,yo-tk]);
  }
  poly(out.concat(inn.reverse()),'#C4562F','#A0432A',1);
}

/* ---------- ΑΝΑΠΤΥΓΜΑ σε καμβά ---------- */
function drawUnfold(c,q){
  const x=c.getContext('2d'), W=c.width, H=c.height;
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  const gap=0.6;
  let tw=0,th2=0;
  for(const f of q.unf){let a=1e9,b=-1e9,t=0;
    for(const p of f.pts){a=Math.min(a,p[0]);b=Math.max(b,p[0]);t=Math.max(t,p[1]);}
    f._w=b-a; f._x0=a; f._h=t; tw+=f._w+gap; th2=Math.max(th2,t);}
  tw-=gap;
  const pad=16, sc=Math.min((W-2*pad)/Math.max(.5,tw),(H-2*pad-16)/Math.max(.5,th2));
  let cx=(W-tw*sc)/2, base=H-pad;
  x.font='700 9px ui-monospace,Menlo,monospace';x.textAlign='center';
  q.unf.forEach((f,i)=>{
    x.beginPath();
    f.pts.forEach((p,k)=>{const X=cx+(p[0]-f._x0)*sc, Y=base-p[1]*sc;
      k?x.lineTo(X,Y):x.moveTo(X,Y);});
    x.closePath();
    x.fillStyle='#C4562F22';x.fill();
    x.strokeStyle='#C4562F';x.lineWidth=1.6;x.stroke();
    x.fillStyle='#5A6875';
    x.fillText('E'+(i+1)+'  '+f.area.toFixed(1)+'m²', cx+f._w*sc/2, base+11);
    cx+=(f._w+gap)*sc;});
}

function makePDF(){
  const q=quantities(), S=3, w=595*S, h=842*S;
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,w,h);
  const F=(s,wt)=>`${wt||600} ${s*S}px -apple-system,Segoe UI,Roboto,sans-serif`;
  const M=(s)=>`600 ${s*S}px ui-monospace,Menlo,Consolas,monospace`;
  let y=46*S;
  x.fillStyle='#1F4E9C';x.font=F(17,700);x.fillText('HEXIS APP — ΠΡΟΜΕΤΡΗΣΗ ΠΕΔΙΟΥ',40*S,y);
  x.fillStyle='#16202B';x.font=F(9,600);y+=15*S;
  const uN=me('uName'), uC=me('uCont'), uP=me('uProj');
  x.fillText(uN||'Προμέτρηση στέγης',40*S,y);
  x.fillStyle='#5A6875';x.font=F(8,500);
  if(uC){y+=11*S;x.fillText(uC,40*S,y);}
  y+=11*S;
  x.fillText((uP?uP+'  ·  ':'')+new Date().toLocaleDateString('el-GR'),40*S,y);
  x.strokeStyle='#1F4E9C';x.lineWidth=1.4*S;y+=8*S;
  x.beginPath();x.moveTo(40*S,y);x.lineTo(555*S,y);x.stroke();

  /* σχέδιο κάτοψης */
  const eav=gp||sol.pts;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of eav){x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);}
  const bw=505*S, bh=210*S, sc=Math.min(bw/Math.max(.5,x1-x0), bh/Math.max(.5,y1-y0))*0.86;
  const cx=297*S, cy=y+22*S+bh/2;
  const T=p=>[cx+(p[0]-(x0+x1)/2)*sc, cy-(p[1]-(y0+y1)/2)*sc];
  const seg=(a,b,col,lw,dash)=>{x.strokeStyle=col;x.lineWidth=lw*S;x.setLineDash(dash||[]);
    const A=T(a),B=T(b);x.beginPath();x.moveTo(A[0],A[1]);x.lineTo(B[0],B[1]);x.stroke();x.setLineDash([]);};
  if(gp)for(let i=0;i<gp.length;i++)seg(gp[i],gp[(i+1)%gp.length],'#4A7A4A',1,[6*S,3*S]);
  for(let i=0;i<sol.pts.length;i++)seg(sol.pts[i],sol.pts[(i+1)%sol.pts.length],'#16202B',1.6);
  for(const arc of sol.arcs){
    const ia=vidx(arc[0]),ib=vidx(arc[1]);
    const rf=t=>t!==null&&isReflex(sol.pts,t);
    const col=(rf(ia)||rf(ib))?'#2E7FA8':(ia!==null||ib!==null)?'#C0562F':'#C08A2E';
    seg((ia!==null&&gp)?gp[ia]:arc[0],(ib!==null&&gp)?gp[ib]:arc[1],col,1.8);}
  x.font=M(7);x.textAlign='center';x.fillStyle='#C08A2E';
  for(const [P,t] of sol.nodes){const A=T(P);x.fillText('+'+N(q.base+t*q.th),A[0],A[1]-4*S);}
  x.textAlign='left';
  y=cy+bh/2+16*S;
  x.font=F(7.5,500);

  for(const [col,txt] of [['#C0562F','μαχιές'],['#2E7FA8','ντερέδες'],
                          ['#C08A2E','κορφιάδες'],['#4A7A4A','γείσο']]){
    x.fillStyle=col;x.fillRect(lx0,y-6*S,7*S,7*S);

    lx0+=(11+txt.length*4.6+16)*S;}
  y+=22*S;

  const H3=t=>{x.fillStyle='#1F4E9C';x.font=F(9,700);x.fillText(t.toUpperCase(),40*S,y);
    x.strokeStyle='#C8D2DA';x.lineWidth=S;x.beginPath();x.moveTo(40*S,y+5*S);x.lineTo(555*S,y+5*S);x.stroke();y+=17*S;};
  const R=(k,v,warn)=>{x.fillStyle='#16202B';x.font=F(9,500);x.fillText(k,44*S,y);

  H3('Γεωμετρία');

  R('Μεμβράνες (+10%)',N(q.roof*2.2)+' m²');

  H3('Φορτία — Ευρωκώδικας 1');

  R('Υποπίεση ανέμου ζώνη F',N(q.E.wF,3)+' kN/m²',q.E.wF<-0.8);

  y+=14*S;
  x.fillStyle='#FAFBFC';x.fillRect(40*S,y-4*S,515*S,54*S);
  x.fillStyle='#C0562F';x.fillRect(40*S,y-4*S,2.5*S,54*S);
  x.fillStyle='#16202B';x.font=F(8,700);x.fillText('ΕΚΤΙΜΗΣΗ — ΠΡΟΜΕΤΡΗΣΗ',50*S,y+9*S);
  x.fillStyle='#5A6875';x.font=F(7.5,500);
  ['Τα ανωτέρω αφορούν ποσότητες και προκαταρκτικές τιμές φορτίων βάσει της γεωμετρίας που σχεδίασε ο χρήστης.',
   'ΔΕΝ ΥΠΟΚΑΘΙΣΤΟΥΝ ΤΗ ΣΤΑΤΙΚΗ ΜΕΛΕΤΗ. Η μελέτη του φέροντος οργανισμού εκπονείται, υπογράφεται και',
   'σφραγίζεται από εξουσιοδοτημένο Πολιτικό Μηχανικό, μέλος Τ.Ε.Ε., κατά EN 1990 / 1991 / 1995.']
   .forEach((t,i)=>x.fillText(t,50*S,y+22*S+i*10*S));

  /* ---- ΣΕΛΙΔΑ 2: ξυλότυπος + ανάπτυγμα ---- */
  const c2=document.createElement('canvas');c2.width=w;c2.height=h;
  const y2=c2.getContext('2d');
  y2.fillStyle='#fff';y2.fillRect(0,0,w,h);
  let py=46*S;
  y2.fillStyle='#1F4E9C';y2.font=F(17,700);y2.fillText('ΞΥΛΟΤΥΠΟΣ ΚΑΙ ΑΝΑΠΤΥΓΜΑ',40*S,py);
  y2.strokeStyle='#1F4E9C';y2.lineWidth=1.4*S;py+=10*S;
  y2.beginPath();y2.moveTo(40*S,py);y2.lineTo(555*S,py);y2.stroke();
  const mk=(fn,ttl,cap,hh)=>{
    py+=22*S;
    y2.fillStyle='#1F4E9C';y2.font=F(9,700);y2.fillText(ttl.toUpperCase(),40*S,py);py+=10*S;
    const tmp=document.createElement('canvas');tmp.width=515*S;tmp.height=hh*S;
    fn(tmp,q);
    y2.drawImage(tmp,40*S,py);
    y2.strokeStyle='#C8D2DA';y2.lineWidth=S;y2.strokeRect(40*S,py,515*S,hh*S);
    py+=hh*S+13*S;
    y2.fillStyle='#5A6875';y2.font=F(7.5,500);y2.fillText(cap,40*S,py);py+=4*S;
  };
  mk((cc,qq)=>drawFraming(cc,qq,true),'Ξυλότυπος με σήμανση δοκών',
     q.fr.raf.length+' αμείβοντες ('+N(q.rafLen)+' m) · '+q.fr.purl.length+
     ' τεγίδες ('+N(q.purlLen)+' m) · '+q.F.length+' έδρες',330);
  mk(drawUnfold,'Ανάπτυγμα εδρών — πραγματικό μέγεθος',
     q.unf.length+' έδρες · σύνολο '+N(q.unf.reduce((a,f)=>a+f.area,0))+
     ' m² (κοπή μεμβράνης και μόνωσης χωρίς 1/cos)',230);
  py+=14*S;
  y2.fillStyle='#FAFBFC';y2.fillRect(40*S,py-4*S,515*S,34*S);
  y2.fillStyle='#C0562F';y2.fillRect(40*S,py-4*S,2.5*S,34*S);
  y2.fillStyle='#16202B';y2.font=F(8,700);y2.fillText('ΕΚΤΙΜΗΣΗ — ΠΡΟΜΕΤΡΗΣΗ',50*S,py+9*S);
  y2.fillStyle='#5A6875';y2.font=F(7.5,500);
  y2.fillText('Οι θέσεις των ξύλων είναι ενδεικτικές. Η μελέτη του φέροντος οργανισμού εκπονείται και',50*S,py+21*S);
  y2.fillText('υπογράφεται από εξουσιοδοτημένο Πολιτικό Μηχανικό, μέλος Τ.Ε.Ε., κατά EN 1995-1-1.',50*S,py+31*S);
  y2.fillStyle='#9AA7B2';y2.font=F(6.5,500);y2.textAlign='right';
  y2.fillText('HEXIS APP',555*S,h-26*S);y2.textAlign='left';

  /* ---- ΣΕΛΙΔΑ 3: τομή ζευκτού + πρόγραμμα δοκών ---- */
  const c3=document.createElement('canvas');c3.width=w;c3.height=h;
  const y3=c3.getContext('2d');
  y3.fillStyle='#fff';y3.fillRect(0,0,w,h);
  let qy=46*S;
  y3.fillStyle='#1F4E9C';y3.font=F(17,700);y3.fillText('ΤΟΜΗ ΖΕΥΚΤΟΥ ΚΑΙ ΠΡΟΓΡΑΜΜΑ ΔΟΚΩΝ',40*S,qy);
  y3.strokeStyle='#1F4E9C';y3.lineWidth=1.4*S;qy+=10*S;
  y3.beginPath();y3.moveTo(40*S,qy);y3.lineTo(555*S,qy);y3.stroke();
  qy+=20*S;
  const tS=document.createElement('canvas');tS.width=515*S;tS.height=250*S;
  drawSection(tS,q);
  y3.drawImage(tS,40*S,qy);
  y3.strokeStyle='#C8D2DA';y3.lineWidth=S;y3.strokeRect(40*S,qy,515*S,250*S);
  qy+=250*S+13*S;
  y3.fillStyle='#5A6875';y3.font=F(7.5,500);
  y3.fillText('Άνοιγμα '+N(2*q.hmax/Math.max(q.th,1e-6))+' m · κλίση '+N(q.adeg,1)+
    '° · κρεμαστός ορθοστάτης (δεν πατά στον ελκυστήρα)',40*S,qy);
  qy+=22*S;
  const sc3=schedule(q);
  y3.fillStyle='#1F4E9C';y3.font=F(9,700);y3.fillText('ΠΡΟΓΡΑΜΜΑ ΔΟΚΩΝ',40*S,qy);
  y3.strokeStyle='#C8D2DA';y3.lineWidth=S;
  y3.beginPath();y3.moveTo(40*S,qy+5*S);y3.lineTo(555*S,qy+5*S);y3.stroke();qy+=17*S;
  const rw=(k,v)=>{y3.fillStyle='#16202B';y3.font=F(8.5,500);y3.fillText(k,44*S,qy);
    y3.font=M(8.5);y3.textAlign='right';y3.fillText(v,551*S,qy);y3.textAlign='left';
    y3.strokeStyle='#E8EDF0';y3.beginPath();y3.moveTo(40*S,qy+4*S);y3.lineTo(555*S,qy+4*S);
    y3.stroke();qy+=13.5*S;};
  sc3.A.forEach((g,i)=>rw('A'+(i+1)+'   Αμείβοντας 10×16 cm', g[1]+' τεμ × '+N(g[0])+' m'));
  qy+=2*S;
  rw('ΣΥΝΟΛΟ ΑΜΕΙΒΟΝΤΩΝ', q.fr.raf.length+' τεμ · '+N(q.rafLen)+' m');
  rw('Τεγίδες 5×5 cm (ματίζονται)', N(q.purlLen)+' m');
  qy+=6*S;
  y3.fillStyle='#5A6875';y3.font=F(7,500);
  y3.fillText('Οι κωδικοί A αντιστοιχούν στη σήμανση του ξυλοτύπου στη σελίδα 2.',44*S,qy);
  y3.fillText('Οι τεγίδες δίνονται σε τρέχοντα μέτρα γιατί ματίζονται πάνω στους αμείβοντες.',44*S,qy+10*S);
  y3.fillStyle='#9AA7B2';y3.font=F(6.5,500);y3.textAlign='right';
  y3.fillText('HEXIS APP',555*S,h-26*S);y3.textAlign='left';

  savePdf([c,c2,c3],595,842,'prometrisi-stegis.pdf');
}

/* ---------- κουμπιά ---------- */
document.getElementById('solve').onclick=()=>{
  if(!closed)finish();
  else{document.getElementById('sheet').classList.add('on');}
};
document.getElementById('undo').onclick=()=>{
  hideErr();
  if(holeMode&&curHole&&curHole.length){curHole.pop();draw();return;}
  if(holes.length&&closed){holes.pop();closed=false;sol=null;gp=null;finish();return;}
  if(closed){closed=false;sol=null;gp=null;
    document.getElementById('solve').textContent='Κλείσε & λύσε';}
  else verts.pop();
  document.getElementById('solve').disabled=verts.length<3;
  hint(verts.length<3?'Πάτα για κορυφές':'Πάτα μήκος για ακριβή τιμή · πρώτη κορυφή για κλείσιμο');draw();};
document.getElementById('clear').onclick=()=>{verts=[];closed=false;sol=null;gp=null;
  holes=[];curHole=null;holeMode=false;hideErr();
  document.getElementById('hole').classList.remove('on');
  document.getElementById('solve').disabled=true;
  document.getElementById('solve').textContent='Κλείσε & λύσε';
  ox=W/2;oy=H/2;cell=48;hint('Πάτα για κορυφές');draw();};
document.getElementById('close').onclick=()=>document.getElementById('sheet').classList.remove('on');
for(const [id,t] of [['t_hip','hip'],['t_gable','gable'],['t_mono','mono']]){
  document.getElementById(id).onclick=()=>{
    rtype=t;
    for(const x of ['t_hip','t_gable','t_mono'])
      document.getElementById(x).classList.toggle('on',x===id);
    document.getElementById('refside').style.display=(t==='hip')?'none':'';
    if(closed){closed=false;sol=null;gp=null;finish();}else draw();
  };
}
document.getElementById('refside').onclick=e=>{
  if(!verts.length)return;
  refEdge=(refEdge+1)%verts.length;
  e.currentTarget.textContent='Πλευρά '+(refEdge+1);
  if(closed){closed=false;sol=null;gp=null;finish();}else draw();
};
document.getElementById('hole').onclick=e=>{
  if(!closed){showErr('Κλείσε πρώτα το περίγραμμα της στέγης.');return;}
  holeMode=!holeMode; curHole=holeMode?[]:null;
  e.currentTarget.classList.toggle('on',holeMode);
  hint(holeMode?'Πάτα κορυφές της τρύπας · ξαναπάτα «Τρύπα» για τέλος'
               :'Πάτα μήκος για ακριβή τιμή');
  if(!holeMode&&curHole===null){closed=false;sol=null;gp=null;finish();}
  draw();
};
document.getElementById('ortho').onclick=e=>{
  ortho=!ortho; e.currentTarget.classList.toggle('on',ortho);
  e.currentTarget.textContent=ortho?'90°':'λοξό';
  hint(ortho?'Κλείδωμα σε ορθές γωνίες':'Ελεύθερη γωνία — σβήσε το για λοξές πλευρές');};
document.getElementById('dlgOk').onclick=applyLen;
document.getElementById('dlgNo').onclick=()=>document.getElementById('mask').classList.remove('on');
document.getElementById('dlgVal').addEventListener('keydown',e=>{if(e.key==='Enter')applyLen();});
document.getElementById('mask').addEventListener('click',e=>{
  if(e.target.id==='mask')document.getElementById('mask').classList.remove('on');});
for(const id of ['pit','ovh','base','km2'])
  document.getElementById(id).addEventListener('change',()=>{if(closed){finish();}});

resize();
