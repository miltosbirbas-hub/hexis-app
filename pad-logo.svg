<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="hx" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3de8ff"/>
      <stop offset="0.55" stop-color="#2a8dff"/>
      <stop offset="1" stop-color="#8b5cff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe9ff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#04070f" flood-opacity="0.45"/>
    </filter>
    <filter id="sh2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#04103a" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Εξάγωνο -->
  <path filter="url(#sh)" fill="url(#hx)" d="M256 28 L453 142 L453 370 L256 484 L59 370 L59 142 Z" stroke="#ffffff" stroke-opacity="0.55" stroke-width="6" stroke-linejoin="round"/>
  <path fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3" d="M256 62 L424 159 L424 353 L256 450 L88 353 L88 159 Z"/>
  <!-- Δορυφόρος (με σκιά) -->
  <g filter="url(#sh2)" transform="rotate(-35 256 250)">
    <!-- ηλιακά πάνελ -->
    <g fill="url(#panel)" stroke="#0b3f82" stroke-width="5" stroke-linejoin="round">
      <rect x="96" y="214" width="104" height="64" rx="6"/>
      <rect x="312" y="214" width="104" height="64" rx="6"/>
    </g>
    <g stroke="#0b3f82" stroke-width="3" opacity="0.7">
      <line x1="130" y1="214" x2="130" y2="278"/><line x1="165" y1="214" x2="165" y2="278"/><line x1="96" y1="246" x2="200" y2="246"/>
      <line x1="347" y1="214" x2="347" y2="278"/><line x1="382" y1="214" x2="382" y2="278"/><line x1="312" y1="246" x2="416" y2="246"/>
    </g>
    <!-- βραχίονες -->
    <rect x="198" y="240" width="116" height="12" fill="#ffffff" stroke="#0b3f82" stroke-width="4"/>
    <!-- σώμα -->
    <rect x="222" y="206" width="68" height="80" rx="10" fill="#ffffff" stroke="#0b3f82" stroke-width="5"/>
    <rect x="236" y="222" width="40" height="14" rx="3" fill="#3de8ff"/>
    <!-- κεραία πιάτο -->
    <path d="M226 300 Q256 334 286 300 Z" fill="#ffffff" stroke="#0b3f82" stroke-width="5" stroke-linejoin="round"/>
    <line x1="256" y1="286" x2="256" y2="312" stroke="#0b3f82" stroke-width="5"/>
  </g>
  <!-- σήμα -->
  <g fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.95">
    <path d="M318 360 a46 46 0 0 0 46 -46"/>
    <path d="M318 394 a80 80 0 0 0 80 -80" opacity="0.7"/>
  </g>
  <circle cx="316" cy="362" r="10" fill="#ff3d81"/>
</svg>
