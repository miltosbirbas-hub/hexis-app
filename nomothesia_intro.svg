<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14213D"/>
      <stop offset="1" stop-color="#0D1730"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F4E9C" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1F4E9C" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="-80" rx="760" ry="300" fill="url(#glow)"/>

  <!-- Λεπτό πλαίσιο -->
  <rect x="26" y="26" width="1148" height="578" fill="none" stroke="#2C3E63" stroke-width="2" rx="18"/>
  <rect x="34" y="34" width="1132" height="562" fill="none" stroke="#1F4E9C" stroke-width="1" rx="14" opacity="0.5"/>

  <!-- Λογότυπο H (πλαίσιο-λαβύρινθος όπως στο app) -->
  <g transform="translate(120,180)">
    <rect x="0" y="0" width="150" height="150" rx="14" fill="none" stroke="#8FB4EE" stroke-width="7"/>
    <rect x="18" y="18" width="114" height="114" rx="8" fill="none" stroke="#8FB4EE" stroke-width="3" opacity="0.55"/>
    <text x="75" y="112" text-anchor="middle" font-family="DejaVu Serif" font-weight="bold" font-size="92" fill="#FFFFFF">H</text>
  </g>

  <!-- Ζυγαριά δικαιοσύνης (δεξιά, διακριτική) -->
  <g transform="translate(915,120) scale(1.45)" stroke="#8FB4EE" stroke-width="6" fill="none" opacity="0.14">
    <line x1="70" y1="10" x2="70" y2="180"/>
    <line x1="-10" y1="45" x2="150" y2="45"/>
    <circle cx="70" cy="10" r="8" fill="#8FB4EE" stroke="none"/>
    <!-- αριστερός δίσκος -->
    <line x1="-10" y1="45" x2="-34" y2="105"/>
    <line x1="-10" y1="45" x2="14" y2="105"/>
    <path d="M -44 105 A 34 34 0 0 0 24 105 Z" fill="#1F4E9C" fill-opacity="0.35"/>
    <!-- δεξιός δίσκος -->
    <line x1="150" y1="45" x2="126" y2="105"/>
    <line x1="150" y1="45" x2="174" y2="105"/>
    <path d="M 116 105 A 34 34 0 0 0 184 105 Z" fill="#1F4E9C" fill-opacity="0.35"/>
    <!-- βάση -->
    <line x1="40" y1="180" x2="100" y2="180"/>
    <line x1="28" y1="196" x2="112" y2="196"/>
  </g>

  <!-- Τίτλος -->
  <text x="330" y="232" font-family="DejaVu Serif" font-weight="bold" font-size="60" letter-spacing="3">
    <tspan fill="#FFFFFF">HEXIS </tspan><tspan fill="#8FB4EE">ΝΟΜΟΘΕΣΙΑ</tspan>
  </text>

  <!-- Υπότιτλος: νόμοι -->
  <text x="332" y="300" font-family="DejaVu Sans" font-size="27" letter-spacing="2" fill="#93A5C6">ΚΩΔΙΚΑΣ ΤΑΓΑΡΑ 5306/26 · ΝΟΚ 4067/12</text>
  <text x="332" y="342" font-family="DejaVu Sans" font-size="27" letter-spacing="2" fill="#93A5C6">Ν.4495/17 · ΚΤΙΡΙΟΔΟΜΙΚΟΣ 23</text>

  <!-- Διαχωριστική γραμμή -->
  <line x1="332" y1="376" x2="880" y2="376" stroke="#1F4E9C" stroke-width="3"/>

  <!-- Περιγραφή -->
  <text x="332" y="420" font-family="DejaVu Sans" font-size="26" fill="#C9D6EE">Πολεοδομική νομοθεσία με ευρετήριο άρθρων,</text>
  <text x="332" y="456" font-family="DejaVu Sans" font-size="26" fill="#C9D6EE">αντιστοιχίσεις παλαιών/νέων διατάξεων &amp; AI αναζήτηση</text>

  <!-- Chips -->
  <g font-family="DejaVu Sans" font-size="21">
    <rect x="332" y="486" width="212" height="44" rx="22" fill="#1F4E9C" opacity="0.35" stroke="#1F4E9C"/>
    <text x="438" y="514" text-anchor="middle" fill="#DCE7F8">4 νομοθετήματα</text>
    <rect x="558" y="486" width="204" height="44" rx="22" fill="#1F4E9C" opacity="0.35" stroke="#1F4E9C"/>
    <text x="660" y="514" text-anchor="middle" fill="#DCE7F8">AI αναζήτηση</text>
    <rect x="776" y="486" width="238" height="44" rx="22" fill="#1F4E9C" opacity="0.35" stroke="#1F4E9C"/>
    <text x="895" y="514" text-anchor="middle" fill="#DCE7F8">Επαλήθευση live</text>
  </g>

  <!-- Footer -->
  <text x="600" y="576" text-anchor="middle" font-family="DejaVu Sans" font-size="22" letter-spacing="3" fill="#5B6B85">hexis-app.gr · ΕΡΓΑΛΕΙΟ STUDIO</text>
</svg>
