name: Δασικοί χάρτες · διερεύνηση πεδίων
# Διαβάζει τη δομή των layers δασικών χαρτών του ΕΨΧ (αναρτημένοι / μερικώς κυρωμένοι) — μόνο ανάγνωση, αποτέλεσμα ως artifact.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/forest-probe.yml"]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Κλήσεις
        run: |
          mkdir -p out; MS="https://sdigmap.tee.gov.gr/mapping/rest/services/UDM/UDM_SERVICE_NATURA_DASIKA/MapServer"
          curl -s -m 60 "$MS?f=json" -o out/ms.json
          for L in 1 2 3 15 16 17 29 30; do curl -s -m 60 "$MS/$L?f=json" -o out/layer_$L.json; done
          for L in 2 16; do
            for F in KATHGORDX KATHGORAL1 KATHGORAL2; do
              curl -s -m 90 "$MS/$L/query?where=1%3D1&outFields=$F&returnGeometry=false&returnDistinctValues=true&f=json" -o out/distinct_${L}_$F.json
            done
            curl -s -m 90 "$MS/$L/query?where=1%3D1&outFields=*&returnGeometry=false&resultRecordCount=5&f=json" -o out/sample_$L.json
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: forest-probe, path: out }
