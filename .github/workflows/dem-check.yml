name: Έλεγχος ακρίβειας DEM (Κτηματολόγιο Z)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/dem/**"
      - ".github/workflows/dem-check.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy pillow pyproj scipy rasterio
      - run: sleep 150 && python3 scripts/dem/coast_fn.py
