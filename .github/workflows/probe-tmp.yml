name: Probe (προσωρινό)
on:
  push:
    branches: [main]
    paths: ["tools-probe/**", ".github/workflows/probe-tmp.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd tools-probe && npm init -y >/dev/null && node te.mjs && mv out ../out
      - run: |
          cd out && git init -q && git checkout -q -b probe-out
          git -c user.name=probe -c user.email=probe@hexis add -A && git -c user.name=probe -c user.email=probe@hexis commit -qm "tif"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out
