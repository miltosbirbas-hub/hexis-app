name: Probe (προσωρινό)
on:
  push:
    branches: [main]
    paths: ["tools-probe/**", ".github/workflows/probe-tmp.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q tifffile imagecodecs
      - run: python tools-probe/probe.py out
      - run: |
          cd out && git init -q && git checkout -q -b probe-out
          git -c user.name=probe -c user.email=probe@hexis add -A && git -c user.name=probe -c user.email=probe@hexis commit -qm "probe"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out
