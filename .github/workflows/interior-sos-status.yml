name: Interior SOS status
# Σημειώνει αναφορές SOS ως «seen»/«fixed» (μόνο τη στήλη status) — για την καθημερινή αυτοβελτίωση.
on:
  workflow_dispatch:
    inputs:
      ids: { description: "Αριθμοί αναφορών, χωρισμένοι με κόμμα", required: true }
      status: { description: "seen ή fixed", required: true, default: "fixed" }
permissions: { contents: read }
jobs:
  set:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: oucqqudfdimccgowvpqp
    steps:
      - name: Ενημέρωση
        run: |
          set -euo pipefail
          IDS=$(echo "${{ github.event.inputs.ids }}" | tr -cd '0-9,' | sed 's/,,*/,/g;s/^,//;s/,$//'); ST="${{ github.event.inputs.status }}"
          case "$ST" in seen|fixed) ;; *) echo "::error::status"; exit 1;; esac
          [ -n "$IDS" ] || { echo "::error::ids"; exit 1; }
          jq -n --arg q "update public.interior_reports set status='$ST' where id in ($IDS) returning id, status" '{query: $q}' > /tmp/q.json
          curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json
