name: DB query (read-only helper)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/query.sql"]
jobs:
  q:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: oucqqudfdimccgowvpqp
    steps:
      - uses: actions/checkout@v4
      - run: |
          jq -Rs '{query: .}' tools/query.sql > /tmp/q.json
          curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json | jq .
