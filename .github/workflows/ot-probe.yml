name: Ο.Τ. έλεγχος (προσωρινό)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    env: { SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}", REF: oucqqudfdimccgowvpqp }
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: pip install pyproj
      - name: Κλειδί
        run: |
          KEY=$(openssl rand -hex 32); echo "::add-mask::$KEY"; echo "KEY=$KEY" >> $GITHUB_ENV
          supabase secrets set SELFTEST_KEY=$KEY --project-ref $REF --yes >/dev/null
          sleep 25
      - run: python3 .github/probe/ot_probe.py
      - name: probe-out
        run: |
          cd out && git init -q && git checkout -q -b probe-ot
          git -c user.name=probe -c user.email=probe@hexis add -A && git -c user.name=probe -c user.email=probe@hexis commit -qm "ot probe"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-ot
