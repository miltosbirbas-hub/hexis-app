name: tmp inspect (read-only)
on:
  push:
    branches: [main]
    paths: [".github/workflows/tmp-inspect.yml"]
jobs:
  q:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: oucqqudfdimccgowvpqp
    steps:
      - run: |
          q() { jq -n --arg q "$1" '{query:$q}' > /tmp/q.json; curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json | jq -r '.[] | to_entries | map(.value|tostring) | join(" | ")'; echo; }
          q "select 1 from pg_proc where proname='admin_set_module' and prorettype='timestamptz'::regtype" ; 
          q "with fix as (update public.entitlements e set expires_at = s.trial_ends_at from public.subscriptions s where s.user_id = e.user_id and e.active and coalesce(s.tier,'free') = 'free' and s.trial_ends_at is not null and e.expires_at > s.trial_ends_at + interval '1 hour' and e.expires_at - interval '1 year' <= s.trial_ends_at + interval '1 day' and e.expires_at - interval '1 year' >= timestamptz '2026-10-01' and not exists (select 1 from public.hx_orders o where o.user_id = e.user_id) returning e.user_id, e.module, e.expires_at) select u.email, f.module, f.expires_at from fix f join auth.users u on u.id=f.user_id order by 1,2"
