name: tmp inspect (read-only)
on:
  push:
    branches: [main]
    paths: [".github/workflows/tmp-inspect.yml"]
jobs:
  q:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: oucqqudfdimccgowvpqp
    steps:
      - run: |
          q() { jq -n --arg q "$1" '{query:$q}' > /tmp/q.json; curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json | jq -r '.[] | to_entries | map(.value|tostring) | join(" | ")'; echo; }
          q "select p.oid::regprocedure, pg_get_functiondef(p.oid) from pg_proc p where p.pronamespace='public'::regnamespace and p.proname in ('admin_set_module','grant_trial_modules','handle_new_user_subscription','admin_activate')"
          q "select conname, pg_get_constraintdef(oid) from pg_constraint where conrelid='public.entitlements'::regclass"
          q "select column_name, data_type from information_schema.columns where table_schema='public' and table_name in ('entitlements','subscriptions') order by table_name, ordinal_position"
          q "select tgname, tgrelid::regclass, tgfoid::regproc from pg_trigger where not tgisinternal and tgfoid::regproc::text in ('grant_trial_modules','handle_new_user_subscription','public.grant_trial_modules','public.handle_new_user_subscription')"
