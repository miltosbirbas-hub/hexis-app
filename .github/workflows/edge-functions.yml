name: Deploy Supabase (functions + SQL)
# Ανεβάζει τις Edge Functions του supabase/functions και τρέχει τα αρχεία SQL της λίστας.
# Χρειάζεται μία φορά το secret SUPABASE_ACCESS_TOKEN (GitHub → Settings → Secrets and variables → Actions).
# Τρέχει αυτόματα όταν αλλάζουν functions ή τα SQL της λίστας, ή χειροκίνητα (Actions → Run workflow).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "interior-billing.sql"
      - "hexis-payments.sql"
      - "admin-users.sql"
      - "ai-costs.sql"
      - "mapping-audit.sql"
      - "pad-licenses.sql"
      - "geo-pro.sql"
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: oucqqudfdimccgowvpqp
    steps:
      - uses: actions/checkout@v4
      - name: Έλεγχος token
        run: '[ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Λείπει το secret SUPABASE_ACCESS_TOKEN"; exit 1; }'
      - name: SQL (με τη σειρά)
        run: |
          for f in interior-billing.sql hexis-payments.sql admin-users.sql ai-costs.sql mapping-audit.sql pad-licenses.sql geo-pro.sql; do
            echo "== $f"
            jq -Rs '{query: .}' "$f" > /tmp/q.json
            code=$(curl -sS -o /tmp/r.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json)
            head -c 600 /tmp/r.json; echo
            [ "$code" -lt 300 ] || { echo "::error::$f απέτυχε ($code)"; exit 1; }
          done
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Κλειδί κρυπτογράφησης HEXIS GEOmetry Pro (φτιάχνεται μία φορά)
        # Το ιδιωτικό κλειδί πάει μόνο στο secret GEO_PRO_SK του Supabase — δεν τυπώνεται, δεν αποθηκεύεται αλλού.
        # Το δημόσιο κλειδί γράφεται στο geometry/pro-key.pub (με αυτό κρυπτογραφείται ο κώδικας Pro πριν μπει στο repo).
        run: |
          set -e
          if supabase secrets list --project-ref "$REF" | awk -F'|' '{gsub(/ /,"",$1);print $1}' | grep -qx GEO_PRO_SK && [ -s geometry/pro-key.pub ]; then
            echo "Υπάρχει ήδη: $(cat geometry/pro-key.pub)"
          else
            mkdir -p "$RUNNER_TEMP/gk" && ( cd "$RUNNER_TEMP/gk" && npm i -s tweetnacl@1.0.3 >/dev/null 2>&1 && node -e "const n=require('tweetnacl'),fs=require('fs');const k=n.box.keyPair();fs.writeFileSync('sk',Buffer.from(k.secretKey).toString('base64'));fs.writeFileSync('pk',Buffer.from(k.publicKey).toString('base64'))" )
            SK=$(cat "$RUNNER_TEMP/gk/sk"); echo "::add-mask::$SK"; rm -f "$RUNNER_TEMP/gk/sk"
            supabase secrets set --project-ref "$REF" --yes "GEO_PRO_SK=$SK" >/dev/null
            mkdir -p geometry && cp "$RUNNER_TEMP/gk/pk" geometry/pro-key.pub
            git config user.name "hexis-bot"; git config user.email "bot@hexis-app.gr"
            git add geometry/pro-key.pub && git commit -m "GEOmetry Pro: δημόσιο κλειδί κρυπτογράφησης"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
            echo "Νέο κλειδί GEOmetry Pro: $(cat geometry/pro-key.pub)"
          fi
      - name: Κλειδί υπογραφής άδειας HEXIS PAD (φτιάχνεται μία φορά)
        # Το ιδιωτικό κλειδί πάει μόνο στο secret PAD_SIGN_SK του Supabase — δεν τυπώνεται, δεν αποθηκεύεται αλλού.
        # Το δημόσιο κλειδί γράφεται στον πίνακα pad_config (το χρειάζεται η εφαρμογή για τον έλεγχο).
        run: |
          set -e
          q() { jq -n --arg q "$1" '{query:$q}' > /tmp/q.json; curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json; }
          PK=$(q "select v from public.pad_config where k='sign_pk'" | jq -r '.[0].v // empty')
          if [ -z "$PK" ]; then
            mkdir -p "$RUNNER_TEMP/kg" && cd "$RUNNER_TEMP/kg" && npm i -s tweetnacl@1.0.3 >/dev/null 2>&1
            node -e "const n=require('tweetnacl'),fs=require('fs');const k=n.sign.keyPair();fs.writeFileSync('sk',Buffer.from(k.secretKey).toString('base64'));fs.writeFileSync('pk',Buffer.from(k.publicKey).toString('base64'))"
            SK=$(cat sk); echo "::add-mask::$SK"; rm -f sk
            supabase secrets set --project-ref "$REF" --yes "PAD_SIGN_SK=$SK" >/dev/null
            PK=$(cat pk)
            q "insert into public.pad_config(k,v) values ('sign_pk','$PK') on conflict (k) do update set v=excluded.v, updated_at=now()" >/dev/null
            echo "Νέο κλειδί υπογραφής δημιουργήθηκε"
          fi
          echo "PAD_SIGN_PK=$PK"
      - name: Deploy functions
        run: |
          for d in supabase/functions/*/; do
            n=$(basename "$d"); echo "== $n"
            supabase functions deploy "$n" --no-verify-jwt --project-ref "$REF" --yes
          done
      - name: Secrets (μόνο ονόματα, για έλεγχο)
        run: supabase secrets list --project-ref "$REF" | awk -F'|' 'NR>2{gsub(/ /,"",$1);print $1}'
      - name: Δοκιμή pad-lic
        run: |
          U="https://$REF.supabase.co/functions/v1/pad-lic"; K="sb_publishable_AjcKB0okxSvA9SUBazKEHQ_-HR0FMHP"
          a=$(curl -sS -X POST "$U" -H "apikey: $K" -H "Content-Type: application/json" -d '{"op":"activate","key":"PAD-XXXX-XXXX-XXXX","device":"a-ci-test","cert":"00","sdk":34}'); echo "αλλοιωμένη: $a"
          b=$(curl -sS -X POST "$U" -H "apikey: $K" -H "Content-Type: application/json" -d '{"op":"activate","key":"PAD-XXXX-XXXX-XXXX","device":"a-ci-test","cert":"8869136DE32B85F58B170636D1F36C51F5CE1F87B9AE220E4325004682E13236","sdk":34}'); echo "λάθος κωδικός: $b"
          echo "$a" | grep -q '"tampered"' && echo "$b" | grep -q '"invalid"' || { echo "::error::pad-lic δεν απαντά σωστά"; exit 1; }
