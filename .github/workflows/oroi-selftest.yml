name: Όροι Δόμησης · έλεγχος
# (v5) Καλεί τη function oroi-domisis σε δείγματα σημείων με προσωρινό κλειδί αυτοελέγχου και γράφει τα αποτελέσματα στον κλάδο probe-out.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/oroi-selftest.yml"]
permissions:
  contents: write
concurrency: { group: oroi-selftest, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: oucqqudfdimccgowvpqp
    steps:
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Προσωρινό κλειδί
        run: |
          KEY=$(openssl rand -hex 32); echo "::add-mask::$KEY"; echo "KEY=$KEY" >> $GITHUB_ENV
          supabase secrets set SELFTEST_KEY=$KEY --project-ref $REF --yes >/dev/null
          sleep 25
      - name: Κλήσεις
        run: |
          mkdir -p out
          call(){ curl -s -m 60 -o "out/$1.json" -w "$1 %{http_code} %{time_total}s\n" -X POST "https://$REF.supabase.co/functions/v1/oroi-domisis" \
            -H "Content-Type: application/json" -H "x-hx-selftest: $KEY" --data "$2" | tee -a out/summary.txt; }
          call karya_lef '{"x":209179.9,"y":4296394.6,"ring":[[209170,4296385],[209190,4296385],[209190,4296405],[209170,4296405]]}'
          call agrinio '{"x":274177.6,"y":4277664.2}'
          call nydri '{"x":213637.6,"y":4289207.9}'
          call ektos_lef '{"x":210410.3,"y":4292903.8}'
          call lefkada_poli '{"x":213986.5,"y":4303000.3}'
          curl -s -o out/tif_part.bin -w "tif_range %{http_code} %{size_download}B\n" -H "x-hx-selftest: $KEY" -H "Origin: https://hexis-app.gr" -H "Range: bytes=0-65535" -D out/tif_headers.txt \
            "https://$REF.supabase.co/functions/v1/oroi-domisis?tif=https%3A%2F%2Fsdigmap.tee.gov.gr%2F_Digitize_LOW%2F2_GEOREF_EGSA_LOW%2F102691FS000831-1986E.tif" | tee -a out/summary.txt
          curl -s -o /dev/null -w "tif_bad %{http_code}\n" -H "x-hx-selftest: $KEY" "https://$REF.supabase.co/functions/v1/oroi-domisis?tif=https%3A%2F%2Fexample.com%2Fx.tif" | tee -a out/summary.txt
          for pt in "209179.9,4296394.6" "274177.6,4277664.2" "210410.3,4292903.8"; do
            K=$(curl -s "https://services-eu1.arcgis.com/40tFGWzosjaLJpmn/arcgis/rest/services/GEOTEMAXIA_LEITOURGOUN_ON_gdb/FeatureServer/0/query?f=json&where=1%3D1&geometry=$pt&geometryType=esriGeometryPoint&inSR=2100&spatialRel=esriSpatialRelIntersects&outFields=KAEK&returnGeometry=false" | python3 -c "import json,sys; f=json.load(sys.stdin).get('features',[]); print(f[0]['attributes']['KAEK'] if f else '')")
            echo "point $pt -> KAEK $K" | tee -a out/summary.txt
            [ -n "$K" ] && curl -s -o "out/lisp_$K.txt" -w "lisp $K %{http_code} %{time_total}s\n" -X POST "https://$REF.supabase.co/functions/v1/oroi-domisis" \
              -H "Content-Type: application/json" -H "x-hx-selftest: $KEY" --data "{\"action\":\"lisp\",\"kaek\":\"$K\"}" | tee -a out/summary.txt
          done
          for K in 050115303002 340211111111 340210597056; do
            curl -s -o "out/extract_$K.txt" -w "extract $K %{http_code} %{time_total}s %{size_download}B\n" -X POST "https://$REF.supabase.co/functions/v1/oroi-domisis" \
              -H "Content-Type: application/json" -H "x-hx-selftest: $KEY" --data "{\"action\":\"lisp_extract\",\"kaek\":\"$K\"}" | tee -a out/summary.txt
          done
          for pt in "209179.9,4296394.6" "274177.6,4277664.2"; do
            K=$(curl -s "https://services-eu1.arcgis.com/40tFGWzosjaLJpmn/arcgis/rest/services/GEOTEMAXIA_LEITOURGOUN_ON_gdb/FeatureServer/0/query?f=json&where=1%3D1&geometry=$pt&geometryType=esriGeometryPoint&inSR=2100&spatialRel=esriSpatialRelIntersects&outFields=KAEK&returnGeometry=false" | python3 -c "import json,sys; f=json.load(sys.stdin).get('features',[]); print(f[0]['attributes']['KAEK'] if f else '')")
            [ -n "$K" ] && curl -s -o "out/extract_$K.txt" -w "extract $K %{http_code} %{time_total}s %{size_download}B\n" -X POST "https://$REF.supabase.co/functions/v1/oroi-domisis" \
              -H "Content-Type: application/json" -H "x-hx-selftest: $KEY" --data "{\"action\":\"lisp_extract\",\"kaek\":\"$K\"}" | tee -a out/summary.txt
          done
          curl -s -o out/aig_img.json -w "aigialos_img %{http_code} %{size_download}B\n" -X POST "https://$REF.supabase.co/functions/v1/oroi-domisis" -H "Content-Type: application/json" -H "x-hx-selftest: $KEY" --data '{"action":"aigialos_img","bbox":[213300,4288900,213900,4289500],"w":800,"h":800}' | tee -a out/summary.txt
          python3 -c "import json,base64;j=json.load(open('out/aig_img.json'));open('out/aig_img.png','wb').write(base64.b64decode(j.get('png','')))" || true
          curl -s -o out/noauth.json -w "noauth %{http_code}\n" -X POST "https://$REF.supabase.co/functions/v1/oroi-domisis" -H "Content-Type: application/json" --data '{"x":1,"y":2}' | tee -a out/summary.txt
      - name: Δημοσίευση στο probe-out
        run: |
          cd out && git init -q && git checkout -q -b probe-out
          git -c user.name=probe -c user.email=probe@hexis add -A && git -c user.name=probe -c user.email=probe@hexis commit -qm "oroi selftest $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out
