name: Diag SQL (definitions only)
on: workflow_dispatch
jobs:
  q:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: oucqqudfdimccgowvpqp
    steps:
      - name: definitions
        run: |
          Q="select p.proname, pg_get_functiondef(p.oid) d from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and (p.proname in ('admin_all_users','admin_list_subs') or p.oid in (select tgfoid from pg_trigger where tgrelid='auth.users'::regclass))"
          jq -n --arg q "$Q" '{query:$q}' > /tmp/q.json
          curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json | jq -r '.[] | "=== "+.proname+"\n"+.d'
