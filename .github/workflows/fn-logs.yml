name: Supabase · αρχείο κλήσεων function
# Διαβάζει τα αρχεία καταγραφής (status code) μιας edge function των τελευταίων ημερών — μόνο ανάγνωση.
on:
  workflow_dispatch:
    inputs:
      fn: { description: "Όνομα function", required: true, default: "interior-ai" }
      days: { description: "Ημέρες πίσω", required: false, default: "6" }
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: oucqqudfdimccgowvpqp
    steps:
      - name: Κλήσεις
        run: |
          S=$(date -u -d "-${{ github.event.inputs.days }} days" +%Y-%m-%dT%H:%M:%SZ); E=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          q() { curl -sS -G "https://api.supabase.com/v1/projects/$REF/analytics/endpoints/logs" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --data-urlencode "iso_timestamp_start=$S" --data-urlencode "iso_timestamp_end=$E" --data-urlencode "sql=$1"; echo; }
          F="${{ github.event.inputs.fn }}"
          P='import json,sys;d=json.load(sys.stdin);[print(r) for r in d.get("result",[])] if "result" in d else print(d)'
          echo "== sources"; q "select source_name, count() as n from logs group by source_name" | python3 -c "$P"
          echo "== edge"; q "select timestamp, source_name, event_message from logs where event_message like '%/$F%' order by timestamp desc limit 200" | python3 -c "$P"
          echo "== console"; q "select timestamp, source_name, event_message, log_attributes from logs where source_name like '%function_logs%' and (event_message ilike '%error%' or event_message ilike '%fail%') order by timestamp desc limit 40" | python3 -c "$P"
