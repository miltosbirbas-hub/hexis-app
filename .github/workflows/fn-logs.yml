name: Supabase · αρχείο κλήσεων function
# Διαβάζει τα αρχεία καταγραφής (status code) μιας edge function των τελευταίων ημερών — μόνο ανάγνωση.
on:
  workflow_dispatch:
    inputs:
      fn: { description: "Όνομα function", required: true, default: "interior-ai" }
      days: { description: "Ημέρες πίσω", required: false, default: "6" }
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: oucqqudfdimccgowvpqp
    steps:
      - name: Κλήσεις
        run: |
          S=$(date -u -d "-${{ github.event.inputs.days }} days" +%Y-%m-%dT%H:%M:%SZ); E=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          q() { curl -sS -G "https://api.supabase.com/v1/projects/$REF/analytics/endpoints/logs.all" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --data-urlencode "iso_timestamp_start=$S" --data-urlencode "iso_timestamp_end=$E" --data-urlencode "sql=$1"; echo; }
          F="${{ github.event.inputs.fn }}"
          echo "== edge"; q "select datetime(timestamp) as t, response.status_code as code, request.method as m, m.execution_time_ms as ms from function_edge_logs cross join unnest(metadata) as m cross join unnest(m.response) as response cross join unnest(m.request) as request where request.url like '%/$F%' order by timestamp desc limit 200" | python3 -c "import json,sys;d=json.load(sys.stdin);[print(r) for r in d.get('result',[])] if 'result' in d else print(d)"
          echo "== console"; q "select datetime(timestamp) as t, event_message, m.level from function_logs cross join unnest(metadata) as m where m.function_id in (select id from function_logs limit 0) or event_message like '%rror%' order by timestamp desc limit 60" | python3 -c "import json,sys;d=json.load(sys.stdin);[print(r) for r in d.get('result',[])] if 'result' in d else print(d)"
