name: Supabase · αρχείο κλήσεων function
# Διαβάζει τα αρχεία καταγραφής (status code) μιας edge function των τελευταίων ημερών — μόνο ανάγνωση.
on:
  workflow_dispatch:
    inputs:
      fn: { description: "Όνομα function", required: true, default: "interior-ai" }
      days: { description: "Ημέρες πίσω", required: false, default: "6" }
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: oucqqudfdimccgowvpqp
    steps:
      - name: Κλήσεις
        run: |
          F="${{ github.event.inputs.fn }}"
          P='import json,sys;d=json.load(sys.stdin);[print(r) for r in d.get("result",[])] if "result" in d else print(d)'
          for k in $(seq 0 ${{ github.event.inputs.days }}); do
            S=$(date -u -d "-$((k+1)) days" +%Y-%m-%dT%H:%M:%SZ); E=$(date -u -d "-$k days" +%Y-%m-%dT%H:%M:%SZ)
            echo "== $S .. $E"
            curl -sS -G "https://api.supabase.com/v1/projects/$REF/analytics/endpoints/logs" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --data-urlencode "iso_timestamp_start=$S" --data-urlencode "iso_timestamp_end=$E" \
              --data-urlencode "sql=select timestamp, event_message from logs where event_message ilike '%$F%' or event_message ilike '%interior%rror%' order by timestamp desc limit 120" | python3 -c "$P"
          done
