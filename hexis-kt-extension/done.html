<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Φάκελος ZIP · HEXIS-APP</title>
<style>
:root{--navy:#14213D;--blue:#1F4E9C;--line:#D9E1EE;--muted:#5B6B85;--ok:#1E7B4A;--warn:#8A5A00;--bg:#F4F7FC}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--navy);font:14px/1.5 'Segoe UI',Arial,sans-serif}
main{max-width:980px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
td.k{font-family:Consolas,monospace;white-space:nowrap}
input[type=text]{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--navy)}
input[type=text]:focus{outline:none;border-color:var(--blue)}
.tag{display:inline-block;font-size:11.5px;border-radius:6px;padding:1px 7px;background:#E8EEF8;color:var(--blue);font-weight:600}
.tag.main{background:var(--blue);color:#fff}
.files{font-size:12.5px;color:var(--muted)}
.files b{color:var(--ok)}
.miss{color:var(--warn)}
.btn{appearance:none;border:1.5px solid var(--blue);background:#fff;color:var(--blue);font:700 14px 'Segoe UI',Arial,sans-serif;border-radius:9px;padding:9px 16px;cursor:pointer}
.btn.p{background:var(--blue);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.preview{font-family:Consolas,monospace;font-size:12.5px;white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:10px;max-height:260px;overflow:auto;margin-top:10px}
.st{margin-top:10px;font-weight:600}
.warnbox{background:#FFF6E0;border:1px solid #F0D79A;color:#5C3D00;border-radius:8px;padding:9px 11px;margin-top:10px;font-size:13px}
@media (max-width:640px){ th.h,td.h{display:none} }
</style>
</head>
<body>
<main>
  <h1>Φάκελος ακινήτου — ZIP</h1>
  <p class="sub">Όλα τα αρχεία που κατέβηκαν από το Κτηματολόγιο, οργανωμένα σε έναν φάκελο. Έλεγξε τα ονόματα και πάτα «Αποθήκευση ZIP».</p>
  <div class="card">
    <table><thead><tr><th>ΚΑΕΚ</th><th>Ρόλος</th><th>Ιδιοκτήτης (για το όνομα φακέλου)</th><th class="h">ΟΤΑ</th><th>Αρχεία</th></tr></thead><tbody id="rows"><tr><td colspan="5">Φόρτωση…</td></tr></tbody></table>
    <div class="preview" id="tree"></div>
    <div id="warn"></div>
  </div>
  <div class="row">
    <button class="btn p" id="save" disabled>Αποθήκευση ZIP…</button>
    <button class="btn" id="clear">Νέα εργασία (καθαρισμός)</button>
  </div>
  <div class="st" id="st"></div>
</main>
<script src="lib/jszip.min.js"></script>
<script src="lib/pdf.min.js"></script>
<script src="done.js"></script>
</body>
</html>
