function helpOverview(){
 const el=L==='el';
 const steps=el?['<b>Εκθέσεις & συμβάσεις:</b> μηνιαία έκθεση προόδου (Earned Value, καθυστερήσεις, κίνδυνοι, καμπύλη S), πιστοποίηση εργασιών – λογαριασμός με σωρευτικά/προηγούμενα/τρέχοντα, κρατήσεις και ΦΠΑ, έκθεση κόστους, πρακτικό σύσκεψης (αποδοχή σε 72 ώρες), σύμβαση κατασκευής με παραρτήματα (προμέτρηση, ορόσημα, πρόγραμμα πληρωμών), συμφωνητικό εργολάβου, σύμβαση επίβλεψης & διαχείρισης έργου (επιλογές Α/Β/Γ), εντολή μεταβολής. Μητρώο εγγράφων με αριθμό, αναθεώρηση, κατάσταση, Συνέταξε/Έλεγξε/Ενέκρινε· PDF και Word.','<b>Στήσιμο:</b> «+ Νέο έργο» → 5 βήματα: στοιχεία & λογότυπο, προμέτρηση (σύνταξη στην εφαρμογή: όλες οι εργασίες της βιβλιοθήκης ανά φάση, γράφετε κατευθείαν ποσότητα και τιμή μονάδας — ή εισαγωγή ενός ή πολλών Excel), κτίρια, φάσεις & χρόνοι (αυτόματα ή με τεχνητή νοημοσύνη), έλεγχος.','<b>Μετάφραση:</b> αν η προμέτρηση είναι σε άλλη γλώσσα, πατήστε «Μετάφραση στα Ελληνικά» — μεταφράζονται περιγραφές, ενότητες, σημειώσεις και ονόματα κτιρίων με αυστηρή τεχνική ορολογία. Το πρωτότυπο κρατιέται και κάθε μετάφραση διορθώνεται από την επεξεργασία εργασίας.','<b>Σύγκριση κτιρίων:</b> κατάταξη κτιρίων με πρόοδο, τρέχουσα φάση, καθυστέρηση και πίνακας προόδου φάση × κτίριο.','<b>Εισαγωγή προμέτρησης:</b> αναγνωρίζονται αυτόματα περιγραφή, μονάδα, ποσότητα, τιμή και σύνολο. Οι γραμμές χωρίς αριθμούς γίνονται ενότητες, τα σύνολα/ΦΠΑ/αμοιβές αγνοούνται. Κάθε φύλλο γίνεται κτίριο· στήλες τύπου «VILLA B / VILLA C» με τιμές 0–1 γίνονται ξεχωριστά κτίρια με το ποσοστό εκτέλεσης.','<b>Προμέτρηση:</b> γράφετε εκτελεσμένες ποσότητες· για κατ’ αποκοπή εργασίες (ποσότητα 0) γράφετε ποσοστό.','<b>Gantt:</b> έναρξη κάθε εργασίας = τέλος των προηγούμενων (σειρά φάσεων ή επιλογή εργασιών / τεχνητή νοημοσύνη) + αναμονή. Εργάσιμες ανά εβδομάδα από το έργο. Κόκκινο περίγραμμα = κρίσιμη διαδρομή (μηδενικό περιθώριο).','<b>Καθυστέρηση:</b> σήμερα − (έναρξη + % × διάρκεια), σε εργάσιμες. Η καθυστέρηση του έργου = μέγιστη καθυστέρηση πέρα από το περιθώριο κάθε εργασίας.','<b>Πληρωμές:</b> εισπράξεις από πελάτη και πληρωμές σε τρίτους, με τρόπο Τράπεζα / 💶 Μετρητά / Επιταγή. Τα μετρητά φαίνονται χωριστά παντού (Επισκόπηση, Πληρωμές, καρτέλες πελάτη, προμηθευτών και εργολάβων, PDF, Excel) και όσα ξεπερνούν το όριο των Ρυθμίσεων εμφανίζονται στους Ελέγχους. Οι γραμμές BANK / CASH του Excel περνούν αυτόματα ως εισπράξεις (ορίστε μετά την πραγματική ημερομηνία από τους Ελέγχους). Υπόλοιπο προς είσπραξη = εκτελεσμένη αξία με αμοιβή & ΦΠΑ − εισπράξεις.','<b>Αποθετήριο:</b> τιμολόγια προμηθευτών, παραγγελίες και τιμολόγια προς τον πελάτη, με συνημμένο PDF/φωτογραφία, συνδεδεμένα με κτίριο, φάση ή εργασία. Με την εξόφληση γράφεται αυτόματα η κίνηση στις Πληρωμές. Στο Gantt, περνώντας το ποντίκι πάνω από μια μπάρα, βλέπετε πρόοδο, ημερομηνίες και τι εκκρεμεί για να κλείσει (📄 = εκκρεμή έγγραφα).','<b>Σχέδια:</b> φάκελος του έργου ανά τύπο μελέτης (αρχιτεκτονικά, στατικά, Η/Μ, ηλεκτρολογικά, τοπογραφικά, άδεια, ενεργειακή, πυροπροστασία, περιβάλλων χώρος, as-built, φωτογραφίες, λοιπά). Ανεβάζετε πολλά PDF/εικόνες μαζί (ο τύπος μαντεύεται από το όνομα αρχείου), με αρ. σχεδίου, αναθεώρηση, ημερομηνία και κτίριο· για DWG/DXF βάζετε σύνδεσμο. Ανοίγουν με ένα πάτημα και από το κινητό.','<b>Διαγράμματα:</b> εκτός από το Gantt, τα διεθνώς καθιερωμένα διαγράμματα παρακολούθησης: καμπύλη S με Earned Value (PV, EV, AC, SPI, CPI, EAC – ANSI/EIA-748, PMI), ταμειακές ροές, δικτυωτό διάγραμμα κρίσιμης διαδρομής (CPM/PDM), Line of Balance για επαναλαμβανόμενα κτίρια, ορόσημα (πρόγραμμα/πρόβλεψη), ιστόγραμμα φόρτου εργολάβων και WBS. Όλα βγαίνουν και σε PDF.','<b>Χρονόμετρο:</b> από την ημερομηνία έναρξης, στην Επισκόπηση τρέχει αντίστροφη μέτρηση μέχρι την πρόβλεψη αποπεράτωσης, η ημέρα του έργου και οι εργάσιμες, πού καθυστερεί το έργο και προτάσεις για το bottleneck (ενίσχυση συνεργείου με υπολογισμό απόδοσης, επικάλυψη φάσεων, μεταφορά συνεργείου, επίσπευση παραγγελιών, εργασία Σάββατο με τη νέα ημερομηνία λήξης) — και με τεχνητή νοημοσύνη.','<b>Τρόπος τιμολόγησης & επιβαρύνσεις:</b> κάθε εργασία τιμολογείται κατ’ αποκοπή, ανά m², ανά τρεχόμετρο, ανά m³, τεμάχιο ή κιλό. Στο τέλος της προμέτρησης ορίζονται ΦΠΑ, αμοιβή επίβλεψης, ΦΠΑ αμοιβής και λοιπά (ποσοστό επί του κόστους εργασιών, της προηγούμενης γραμμής ή όλων των παραπάνω, ή σταθερό ποσό) — διαβάζονται αυτόματα από το Excel. Με εμβαδό κτιρίου υπολογίζεται και το €/m².','<b>Εργολάβοι:</b> σε κάθε φάση ή ενότητα της προμέτρησης το «👷 Ανάθεση εργολάβου» συνδέει εργολάβο σε όλες τις εργασίες της. Η καρτέλα του εργολάβου δείχνει στοιχεία, σε ποια φάση βρίσκεται, πρόοδο, τι δικαιούται, τι έχει πληρωθεί, τιμολόγια και υπόλοιπο.','<b>Έλεγχοι:</b> εντοπίζει διπλοπερασμένες εργασίες (ίδια ή σχεδόν ίδια περιγραφή στην ίδια ενότητα), λάθη αθροισμάτων του αρχείου, ποσότητα × τιμή ≠ σύνολο, εργασίες χωρίς τιμή ή ποσότητα, εκτελεσμένα πάνω από την ποσότητα, διαφορετική κατηγορία σκυροδέματος ή τιμή μεταξύ κτιρίων, διπλά τιμολόγια/πληρωμές και ληξιπρόθεσμα. Κάθε εύρημα έχει «Διόρθωση…»: η εφαρμογή δείχνει τι θα αλλάξει (ή ζητά να διαλέξετε τη σωστή τιμή) και αλλάζει μόνο με την έγκρισή σας. «Διόρθωση όλων» εφαρμόζει μαζί όσες επιλέξετε· «Αναίρεση τελευταίας διόρθωσης» επαναφέρει.','<b>Καρτέλες:</b> καρτέλα πελάτη ανά κτίριο (σύμβαση, εκτελεσμένο, τιμολογημένο, εισπράξεις, υπόλοιπα, αναλυτική κίνηση με προοδευτικό υπόλοιπο) και καρτέλες προμηθευτών (παραγγελίες, τιμολόγια, πληρωμές, οφειλή). Εξαγωγή σε PDF και Excel.','<b>Κοινή χρήση:</b> μοιραστείτε τη σελίδα από την κοινή χρήση του claude.ai. Όλοι δουλεύουν στα ίδια έργα με ζωντανό συγχρονισμό· οι ταυτόχρονες αλλαγές συγχωνεύονται. Θεατής = μόνο προβολή, Συμμετέχων = καταχωρεί, Συντάκτης = και επισυνάπτει αρχεία.','<b>Εξαγωγή:</b> Excel (σύνοψη, προμέτρηση με τύπους, πληρωμές, αποθετήριο) και PDF (σύνοψη, σύγκριση κτιρίων, Gantt, προμέτρηση, πληρωμές, τιμολόγια) με το λογότυπό σας.']
 :['<b>Setup:</b> “+ New project” → 5 steps: details & logo, BOQ (build in the app: all library items by phase, type quantity and unit price directly — or import one or many Excel files), buildings, phases & durations (automatic or AI), review.','<b>Translation:</b> if the BOQ is in another language, press “Translate to English” — descriptions, sections, notes and building names are translated with strict technical terminology. The original is kept and each translation can be corrected in the item editor.','<b>Building comparison:</b> ranking of buildings with progress, current phase, delay and a phase × building progress matrix.','<b>BOQ import:</b> description, unit, quantity, price and total are detected automatically. Rows without numbers become sections; totals/VAT/fees are skipped. Each sheet becomes a building; columns like “VILLA B / VILLA C” with 0–1 values become separate buildings with their completion ratio.','<b>BOQ:</b> enter executed quantities; for lump-sum items (quantity 0) enter a percentage.','<b>Gantt:</b> each item starts when its predecessors finish (phase order, or chosen items/AI) plus any wait. Working days per week come from the project. Red outline = critical path (zero float).','<b>Delay:</b> today − (start + % × duration), in working days. Project delay = largest delay beyond each item’s float.','<b>Payments:</b> receipts from the client and payments to others, by Bank / 💶 Cash / Cheque. Cash is shown separately everywhere (Overview, Payments, client, supplier and contractor ledgers, PDF, Excel) and entries above the Settings threshold appear in Checks. BANK / CASH lines in the Excel file are imported as receipts automatically (then set the real date from Checks). Balance due = executed value incl. fee & VAT − receipts.','<b>Repository:</b> supplier invoices, orders and invoices to the client, with a PDF/photo attachment, linked to a building, phase or item. Marking an invoice paid records the payment automatically. In the Gantt, hover a bar to see progress, dates and what is still pending before it can close (📄 = pending documents).','<b>Drawings:</b> project folder by discipline (architectural, structural, MEP, electrical, survey, permit, energy, fire, landscape, as-built, photos, other). Upload several PDFs/images at once (the discipline is guessed from the file name), with drawing no., revision, date and building; for DWG/DXF add a link. They open with one tap, on the phone too.','<b>Charts:</b> besides the Gantt, the internationally established monitoring charts: S-curve with Earned Value (PV, EV, AC, SPI, CPI, EAC – ANSI/EIA-748, PMI), cash flow, critical path network diagram (CPM/PDM), Line of Balance for repetitive buildings, milestones (planned/forecast), contractor loading histogram and WBS. All exported to PDF too.','<b>Clock:</b> from the start date, the Overview shows a countdown to forecast completion, the project day and working days, where the project is late and suggestions to break the bottleneck (crew reinforcement with required output, phase overlap, crew transfer, expediting orders, Saturday work with the new end date) — also with AI.','<b>Pricing & charges:</b> each item is priced as lump sum, per m², per linear metre, per m³, piece or kilogram. At the end of the BOQ you set VAT, supervision fee, VAT on fee and others (percentage of works cost, of the previous line or of everything above, or a fixed amount) — read automatically from Excel. With building area, €/m² is computed too.','<b>Contractors:</b> on each phase or section of the BOQ, “👷 Assign contractor” links a contractor to all its items. The contractor card shows details, current phase, progress, earned amount, payments, invoices and balance.','<b>Checks:</b> finds duplicated items (same or nearly same description in the same section), file sum errors, quantity × price ≠ total, items without price or quantity, executed above quantity, different concrete class or price between buildings, duplicate invoices/payments and overdue invoices. Each finding has “Fix…”: the app shows what will change (or asks you to choose the correct value) and changes it only with your approval. “Fix all” applies the ones you select; “Undo last fix” restores.','<b>Ledgers:</b> client ledger per building (contract, executed, invoiced, received, balances, detailed entries with running balance) and supplier ledgers (orders, invoices, payments, amount owed). Export to PDF and Excel.','<b>Sharing:</b> share the page from claude.ai sharing. Everyone works on the same projects with live sync; simultaneous changes are merged. Viewer = view only, Contributor = enters data, Editor = can also attach files.','<b>Export:</b> Excel (summary, BOQ with formulas, payments, repository) and PDF (summary, Gantt, BOQ, payments, invoices) with your logo.'];
 return ('<ol style="padding-left:20px">'+steps.map(s=>'<li style="margin:8px 0">'+s+'</li>').join('')+'</ol>'+glossTable()+stdTable()+'<h3 style="margin-top:14px">'+t('sources')+'</h3><ul class="mini" style="padding-left:20px"><li>'+(el?'Ν. 4495/2017 (ΦΕΚ Α΄ 167), άρθρο 42 — διάρκεια ισχύος άδειας δόμησης (4 έτη) και αναθεώρηση/ενημέρωση· η ημερομηνία λήξης ελέγχεται από τον μηχανικό.':'Law 4495/2017 (Gov. Gazette A 167), art. 42 — building permit validity (4 years) and revision/update; the expiry date is checked by the engineer.')+'</li><li>RFC 5545 (iCalendar) — '+(el?'αρχείο .ics με ειδοποιήσεις ημερολογίου.':'.ics file with calendar alarms.')+'</li><li>DCMA 14-Point Assessment (2012); GAO-16-89G Schedule Assessment Guide</li><li>ISO 21511:2018 Work breakdown structures; ISO 21512:2024 EVM implementation guidance; ISO 31000:2018 Risk management</li><li>W. Lipke, Schedule is Different, The Measurable News (2003) — Earned Schedule</li><li>SCL Delay and Disruption Protocol, 2nd ed. (2017); AACE International RP 29R-03, 49R-06</li><li>FIDIC Conditions of Contract for Construction (Red Book), 2nd ed. 2017</li><li>Critical Path Method — Kelley & Walker (1959), «Critical-Path Planning and Scheduling».</li><li>PMI, PMBOK® Guide — Schedule Management (forward/backward pass, total float).</li><li>Earned Value: ANSI/EIA-748 — '+(el?'πρόοδος με βάση την αξία εκτελεσμένων ποσοτήτων.':'progress weighted by executed value.')+'</li><li>ISO 21502:2020 — '+(el?'Διαχείριση έργων· PMI PMBOK® 7η έκδ. — εκθέσεις προόδου, μητρώο εγγράφων, έλεγχος μεταβολών.':'Project management; PMI PMBOK® 7th ed. — progress reporting, document control, change control.')+'</li><li>FIDIC Conditions of Contract for Construction (Red Book, 2017) — '+(el?'πιστοποιήσεις πληρωμών (Interim Payment Certificate), κρατήσεις, εντολές μεταβολής.':'interim payment certificates, retention, variations.')+'</li><li>'+(el?'Αστικός Κώδικας άρθρα 681–702 (σύμβαση έργου)· ν. 4495/2017 (επίβλεψη)· ν. 1396/1983 και Π.Δ. 305/1996 (υγεία & ασφάλεια εργοταξίων).':'Greek Civil Code Art. 681–702 (contract for work); Law 4495/2017 (supervision); Law 1396/1983 and P.D. 305/1996 (site health & safety).')+'</li></ul><p class="mini" style="margin-top:10px">'+t('version')+' '+APP_VERSION+' · '+t('wn1')+'</p>');
}

function projList(){
 const ids=Object.keys(projects).sort((a,b)=>(projects[b].upd||0)-(projects[a].upd||0));
 let h='<div class="mh"><div class="row"><h2>📁 '+t('myProj')+'</h2><span class="sp"></span><button class="ib" data-act="mClose">✕</button></div></div><div class="mb"><div class="list">';
 ids.forEach(id=>{const p=ensureP(projects[id]);const v=p.tasks.reduce((a,x)=>a+(+x.qty||0)*(+x.price||0),0);
  h+='<div class="li" style="cursor:default;flex-wrap:wrap;'+(id===prefs.cur?'border-color:var(--acc)':'')+'"><div class="tx" style="flex:1 1 240px"><b>'+esc(p.name||'—')+'</b><small>'+esc([p.client,p.loc].filter(Boolean).join(' · '))+' · '+p.buildings.length+' '+t('buildingsL').toLowerCase()+' · '+p.tasks.length+' '+t('items').toLowerCase()+' · '+money(v)+' · '+t('lastUpd')+': '+new Date(p.upd||Date.now()).toLocaleDateString(loc())+'</small></div><button class="btn sec sm" data-act="plOpenP" data-v="'+id+'">'+t('open')+'</button><button class="btn dang sm" data-act="plDelP" data-v="'+id+'">🗑 '+t('del')+'</button></div>'});
 h+='</div><p class="mini" style="margin-top:10px">'+t('delHint')+'</p></div><div class="mf"><span class="sp"></span><button class="btn" data-act="newProject">+ '+t('newProject')+'</button></div>';
 openModal(h)}

 {v:'',el:['Πόσο πιθανό είναι να τελειώσει το έργο στην ημερομηνία του προγράμματος;','Χρονοπρόγραμμα → «Κίνδυνοι & ανάλυση» → «Πιθανότητα περάτωσης (QSRA)». Η εφαρμογή τρέχει χιλιάδες σενάρια (Monte Carlo) με αβεβαιότητα διάρκειας (προεπιλογή −10% / +30%, αλλάζει ανά έργο ή ανά εργασία) και τους κινδύνους του μητρώου. Δείχνει την πιθανότητα της ημερομηνίας σας και τις P50/P80/P90· για δέσμευση προς τον εργοδότη χρησιμοποιήστε την P80. Πηγή: AACE RP 57R-09.'],en:['How likely is the project to finish on the programme date?','Schedule → “Risk & analysis” → “Completion probability (QSRA)”. The app runs thousands of scenarios (Monte Carlo) with duration uncertainty (default −10% / +30%, editable per project or per task) and the risks in the register. It shows the probability of your date and P50/P80/P90; commit to the employer at P80. Source: AACE RP 57R-09.']},
 {v:'',el:['Πώς καταγράφω κινδύνους;','«Κίνδυνοι & ανάλυση» → «Μητρώο κινδύνων» → «+ Νέος κίνδυνος»: πιθανότητα 1–5, επίπτωση 1–5, στρατηγική (αποφυγή/μείωση/μεταφορά/αποδοχή), υπεύθυνος, μέτρα, προθεσμία. Αν ο κίνδυνος καθυστερεί εργασίες, δώστε ελάχιστη/πιθανότερη/μέγιστη επίπτωση σε εργάσιμες και συνδέστε τις εργασίες — μπαίνει αυτόματα στην προσομοίωση. Πηγή: ISO 31000:2018, IEC 31010:2019.'],en:['How do I record risks?','“Risk & analysis” → “Risk register” → “+ New risk”: probability 1–5, impact 1–5, response (avoid/mitigate/transfer/accept), owner, actions, due date. If the risk delays tasks, give min/most likely/max impact in workdays and link the tasks — it feeds the simulation automatically. Source: ISO 31000:2018, IEC 31010:2019.']},
 {v:'',el:['Πώς τεκμηριώνω αίτημα παράτασης προθεσμίας;','«Κίνδυνοι & ανάλυση» → «Καθυστερήσεις (TIA)» → «+ Νέο γεγονός»: ημερομηνία, ευθύνη (εργοδότης / ουδέτερο / ανάδοχος), διάρκεια και εργασία που καθυστερεί. Η εφαρμογή εισάγει κάθε γεγονός στο πρόγραμμα (fragnet) με χρονολογική σειρά και δείχνει πόσο μετακινείται η περάτωση και το δικαίωμα παράτασης (EOT). Αν η εργασία έχει περιθώριο, δεν προκύπτει παράταση. Πηγές: AACE RP 52R-06, SCL Protocol 2017, FIDIC 2017 όρ. 8.5.'],en:['How do I support an extension of time request?','“Risk & analysis” → “Delays (TIA)” → “+ New event”: date, responsibility (employer / neutral / contractor), duration and the task delayed. The app inserts each event into the programme (fragnet) in date order and shows the shift in completion and the extension entitlement (EOT). If the task has float, no extension results. Sources: AACE RP 52R-06, SCL Protocol 2017, FIDIC 2017 cl. 8.5.']},
 {v:'',el:['Ένας εργολάβος έχει πολλές εργασίες ταυτόχρονα — τι κάνω;','«Κίνδυνοι & ανάλυση» → «Εξομάλυνση πόρων»: δηλώστε πόσα συνεργεία έχει κάθε εργολάβος. Η εφαρμογή βρίσκει πού το πρόγραμμα ζητά περισσότερα και μεταθέτει πακέτα εργασιών (φάση × κτίριο), πρώτα μέσα στο περιθώριό τους. «Εφαρμογή στο πρόγραμμα» για να περάσει (αναιρείται με Ctrl+Z).'],en:['A contractor has many tasks at once — what do I do?','“Risk & analysis” → “Resource levelling”: enter how many crews each contractor has. The app finds where the programme asks for more and shifts work packages (phase × building), first within their float. “Apply to programme” to commit it (undo with Ctrl+Z).']},
 {v:'',el:['Πώς βάζω «όχι νωρίτερα από» ή συμβατικό ορόσημο σε εργασία;','Ανοίξτε την εργασία → «Περιορισμός ημερομηνίας & αβεβαιότητα διάρκειας»: «Έναρξη όχι νωρίτερα από» (π.χ. παράδοση υλικού) ή «Λήξη όχι αργότερα από» (ορόσημο). Αν το ορόσημο δεν τηρείται, εμφανίζεται αρνητικό περιθώριο (κόκκινο). Χρησιμοποιήστε τους με φειδώ — ο έλεγχος DCMA τους μετρά.'],en:['How do I set “no earlier than” or a contractual milestone on a task?','Open the task → “Date constraint & duration uncertainty”: “Start no earlier than” (e.g. material delivery) or “Finish no later than” (milestone). If the milestone is missed, negative float shows (red). Use them sparingly — the DCMA check counts them.']},
 {v:'',el:['Έχω χρονοπρόγραμμα σε άλλο πρόγραμμα — μπορώ να το φέρω;','Ναι, αν το αποθηκεύσετε ως XML (ανοιχτό σχήμα ανταλλαγής δεδομένων έργου). «Κίνδυνοι & ανάλυση» → «Εισαγωγή XML»: δημιουργείται νέο έργο με εργασίες, διάρκειες, σχέσεις FS/SS/FF/SF, χρονικές υστερήσεις, ημερολόγιο, ποσοστά, κόστος και περιορισμούς. Το τρέχον έργο δεν αλλάζει.'],en:['I have a schedule in another program — can I bring it in?','Yes, if you save it as XML (open project data interchange schema). “Risk & analysis” → “XML import”: a new project is created with tasks, durations, FS/SS/FF/SF links, lags, calendar, percentages, cost and constraints. The current project is not changed.']},
 {v:'',el:['Κάτι δεν λειτουργεί — πώς το αναφέρω;','Βοήθεια (?) → «🆘 Αναφορά προβλήματος» ή Ρυθμίσεις → «Ασφάλεια δεδομένων». Γράψτε τι συνέβη· η έκδοση, η συσκευή και η οθόνη επισυνάπτονται αυτόματα (όχι τα δεδομένα του έργου). Στο hub η αναφορά πηγαίνει απευθείας στην υποστήριξη· εκτός hub ανοίγει έτοιμο email.'],en:['Something does not work — how do I report it?','Help (?) → “🆘 Report a problem” or Settings → “Data safety”. Write what happened; the version, device and screen are attached automatically (not your project data). In the hub the report goes straight to support; outside the hub a ready email opens.']},
 {v:'',el:['Έκανα λάθος ή έσβησα κάτι — πώς το επαναφέρω;','Πατήστε ↶ (επάνω δεξιά) ή Ctrl+Z: αναιρείται η τελευταία αλλαγή, όσες φορές χρειαστεί (έως 40 βήματα)· ↷ / Ctrl+Y για επανάληψη. Για παλαιότερη κατάσταση: Ρυθμίσεις → «Ασφάλεια δεδομένων» → «Στιγμιότυπα έργου» → Επαναφορά (η τωρινή κατάσταση κρατιέται κι αυτή, άρα δεν χάνεται τίποτα). Διαγραμμένο έργο: ίδια οθόνη → «Κάδος» (30 ημέρες). Το «Ιστορικό αλλαγών» δείχνει ποιος άλλαξε τι και πότε (audit trail κατά ISO 21502 §4.4 / PMBOK® 7 — configuration management). Για μόνιμο αντίγραφο εκτός συσκευής: «Αντίγραφο ασφαλείας (JSON)».'],en:['I made a mistake or deleted something — how do I get it back?','Press ↶ (top right) or Ctrl+Z: the last change is undone, as many times as needed (up to 40 steps); ↷ / Ctrl+Y to redo. For an older state: Settings → “Data safety” → “Project snapshots” → Restore (the current state is kept too, so nothing is lost). Deleted project: same screen → “Bin” (30 days). “Change history” shows who changed what and when (audit trail per ISO 21502 §4.4 / PMBOK® 7 — configuration management). For a permanent off-device copy: “Backup (JSON)”.']},
 {v:'',el:['Τι σημαίνουν οι συντομογραφίες (SPI, CPI, EAC, TF…);','Πατήστε το «?» δίπλα σε κάθε όρο: ανοίγει σύντομη εξήγηση — τι είναι, γιατί χρησιμοποιείται, πώς διαβάζεται — και, όπου υπάρχει τιμή, τι σημαίνει για το δικό σας έργο (π.χ. «SPI 1,18: η εκτέλεση είναι 18% γρηγορότερη από το πρόγραμμα»). Όλοι οι όροι μαζί: Βοήθεια → «Γλωσσάριο όρων PM».'],en:['What do the abbreviations (SPI, CPI, EAC, TF…) mean?','Press the “?” next to any term: a short explanation opens — what it is, why it is used, how to read it — and, where there is a value, what it means for your project (e.g. “SPI 1.18: execution is 18% faster than planned”). All terms together: Help → “PM glossary”.']},
 {v:'',el:['Με ποια διεθνή πρότυπα συμμορφώνεται η εφαρμογή;','Βοήθεια → «Πρότυπα, μέθοδοι και συμμόρφωση»: ISO 21502, PMBOK®, ISO 21511 (WBS), PMI Practice Standard for Scheduling (CPM, FS/SS/FF/SF, περιθώρια), DCMA-14 (ποιότητα προγράμματος), ANSI/EIA-748, ISO 21508/21512 και PMI Standard for EVM (Earned Value), Lipke (Earned Schedule), ISO 31000, SCL Protocol (καθυστερήσεις), FIDIC 2017. Για κάθε πρότυπο φαίνεται πώς εφαρμόζεται.'],en:['Which international standards does the app follow?','Help → “Standards, methods and compliance”: ISO 21502, PMBOK®, ISO 21511 (WBS), PMI Practice Standard for Scheduling (CPM, FS/SS/FF/SF, float), DCMA-14 (schedule quality), ANSI/EIA-748, ISO 21508/21512 and the PMI Standard for EVM, Lipke (Earned Schedule), ISO 31000, SCL Protocol (delays), FIDIC 2017. Each standard shows how it is applied.']},
 {v:'',el:['Πώς ορίζω baseline και τι αλλάζει;','Χρονοπρόγραμμα → Gantt → «Ορισμός baseline» όταν εγκριθεί το πρόγραμμα. Αποθηκεύονται ημερομηνίες και αξίες κάθε εργασίας· στο Gantt φαίνονται ως λεπτές γκρι μπάρες, το PV της καμπύλης S υπολογίζεται από αυτή (κατά ANSI/EIA-748) και κάθε εργασία δείχνει απόκλιση λήξης. Μετά από εγκεκριμένη μεταβολή: «Ενημέρωση baseline».'],en:['How do I set a baseline and what changes?','Programme → Gantt → “Set baseline” once the programme is approved. Dates and values of every item are saved; in Gantt they show as thin grey bars, the S-curve PV is computed from it (per ANSI/EIA-748) and every item shows its finish variance. After an approved change: “Update baseline”.']},
 {v:'',el:['Πώς ορίζω σχέσεις SS / FF / SF και επικαλύψεις;','Ανοίξτε την εργασία → «Τι προηγείται» → «Χειροκίνητα» → επιλέξτε προαπαιτούμενες. Για καθεμία διαλέξτε τύπο (FS, SS, FF, SF) και lag σε εργάσιμες· αρνητικό lag = επικάλυψη (lead). Η κρίσιμη διαδρομή, τα περιθώρια και το DCMA-14 ενημερώνονται αμέσως.'],en:['How do I set SS / FF / SF links and overlaps?','Open the item → “What comes first” → “Manual” → select predecessors. For each choose the type (FS, SS, FF, SF) and the lag in working days; negative lag = overlap (lead). The critical path, float and DCMA-14 update immediately.']},
 {v:'',el:['Τι ελέγχει η εφαρμογή στο Excel που εισάγω;','Στο βήμα «Προμέτρηση → Εισαγωγή από Excel», κάτω από κάθε φύλλο εμφανίζεται ο «Έλεγχος αρχείου». Ελέγχει: ποσότητα × τιμή έναντι του συνόλου της γραμμής, σφάλματα τύπων (#REF!, #DIV/0!, #VALUE!), κενή ποσότητα ή τιμή (υπολογίζεται από τις άλλες στήλες), ποσοστά εκτέλεσης γραμμένα ως 70 αντί 70% ή εκτός 0–100%, αθροίσματα ενοτήτων και γενικά σύνολα, ΦΠΑ και αμοιβή έναντι του συντελεστή τους, αρνητικές τιμές, διπλοεγγραφές και άρθρα χωρίς τιμή. Τα σαφή σφάλματα διορθώνονται αυτόματα με τις σωστές πράξεις (✓)· όσα θέλουν απόφαση σημειώνονται με «!» και έχουν κουμπί (π.χ. «Κράτα του αρχείου», «Αφαίρεση» διπλοεγγραφής). Πάνω δεξιά φαίνεται «Σύνολο αρχείου → ορθό». Οι διορθώσεις καταγράφονται και στους «Ελέγχους» του έργου.'],en:['What does the app check in the Excel I import?','In “BOQ → Import from Excel”, a “File check” appears under each sheet. It checks quantity × rate against the line amount, formula errors (#REF!, #DIV/0!, #VALUE!), missing quantity or rate (calculated from the other columns), progress written as 70 instead of 70% or outside 0–100%, section and grand totals, VAT and fees against their rate, negative values, duplicate rows and items without a rate. Clear errors are corrected automatically with the correct arithmetic (✓); items needing a decision are marked “!” with a button (e.g. “Keep file value”, “Remove” duplicate). Top right shows “File total → correct”. Corrections are also logged in the project “Checks”.']},
 {v:'',el:['Τι σημαίνουν PM, PMIS, PPM και CPM;','PM (Project Management / Project Manager): η διοίκηση έργου και ο υπεύθυνος διοίκησης έργου — ο όρος της διεθνούς πρακτικής (PMI PMBOK®, ISO 21502). Construction PM: η διοίκηση κατασκευαστικού έργου· έτσι χαρακτηρίζεται και αυτή η εφαρμογή. PMIS (Project Management Information System): ο όρος του PMBOK® για το πληροφοριακό σύστημα που συγκεντρώνει χρονοπρόγραμμα, κόστος, πρόοδο και αναφορές του έργου. PPM (Project Portfolio Management): διαχείριση χαρτοφυλακίου πολλών έργων. CPM (Critical Path Method): η μέθοδος κρίσιμης διαδρομής του χρονοπρογράμματος — όχι όνομα λογισμικού. Οι όροι PRM και PCM δεν χρησιμοποιούνται για διοίκηση κατασκευαστικών έργων.'],en:['What do PM, PMIS, PPM and CPM mean?','PM (Project Management / Project Manager): the international term (PMI PMBOK®, ISO 21502). Construction PM: management of construction projects — how this app is described. PMIS (Project Management Information System): the PMBOK® term for the information system that brings together schedule, cost, progress and reporting. PPM (Project Portfolio Management): managing a portfolio of many projects. CPM (Critical Path Method): the scheduling method — not a software name. PRM and PCM are not used for construction project management.']},
 {v:'',el:['Εγκαθίσταται η εφαρμογή στον υπολογιστή;','Ναι. Ανοίξτε το hexis-app.gr/boq.html σε Chrome ή Edge → «Ρυθμίσεις» → «Εγκατάσταση εφαρμογής» (ή το εικονίδιο εγκατάστασης δεξιά στη γραμμή διευθύνσεων). Μπαίνει εικονίδιο «HEXIS BoQ» στην επιφάνεια εργασίας και ανοίγει σε δικό της παράθυρο. Σε Mac: Chrome/Edge όπως παραπάνω, ή Safari (macOS 14+) → Αρχείο → «Προσθήκη στο Dock». Στο κινητό: Android → μενού ⋮ → «Προσθήκη στην αρχική οθόνη»· iPhone → Safari → Κοινοποίηση → «Προσθήκη στην οθόνη Αφετηρίας».'],en:['Can the app be installed on a computer?','Yes. Open hexis-app.gr/boq.html in Chrome or Edge → “Settings” → “Install app” (or the install icon at the right of the address bar). A “HEXIS BoQ” icon is added to the desktop and it opens in its own window. On a Mac: Chrome/Edge as above, or Safari (macOS 14+) → File → “Add to Dock”. On phones: Android → menu ⋮ → “Add to Home screen”; iPhone → Safari → Share → “Add to Home Screen”.']},
 {v:'',el:['Πώς καταχωρώ την πρόοδο της ημέρας γρήγορα;','Πατήστε το πράσινο «✅ Πρόοδος» πάνω. Εμφανίζονται μόνο οι εργασίες που τρέχουν σήμερα ή καθυστερούν. Σε κάθε μία: «+» / «−» (βήμα περίπου 10%), ή γράψτε την εκτελεσμένη ποσότητα στο κίτρινο κουτί, ή «✓ Τελείωσε». Για άλλη εργασία «+ Άλλη εργασία». Προαιρετικά σημείωση ημέρας. «Αποθήκευση προόδου» — αν δεν έγινε τίποτα, «Σήμερα χωρίς πρόοδο». Αν μια δόση γίνει ώριμη, το λέει αμέσως.'],en:['How do I record today’s progress quickly?','Press the green “✅ Progress” at the top. Only items running today or late are listed. For each: “+” / “−” (about 10% steps), or type the executed quantity in the yellow box, or “✓ Finished”. For another item “+ Other item”. Optional note of the day. “Save progress” — if nothing was done, “No progress today”. If an instalment becomes due, you are told at once.']},
 {v:'',el:['Πώς βλέπω πόσο υπολείπεται για να πάρω/δώσω μια δόση;','Καρτέλα «Πληρωμές» → «📋 Δόσεις συμφωνητικών» → «+ Δόση». Διαλέξτε με ποιον είναι το συμφωνητικό (πελάτης ή εργολάβος), ποσό και προϋπόθεση: ολοκλήρωση φάσης/φάσεων σε % (και κτίριο), έναρξη φάσης ή υπογραφή. Κάθε δόση δείχνει «Ολοκληρώθηκε Χ% — υπολείπεται Υ% εργασιών (≈ €) για την εκταμίευση». Όταν εκπληρωθεί γίνεται πράσινη «Ώριμη για εκταμίευση» με κουμπί «Καταχώρηση είσπραξης/πληρωμής». Οι επόμενες δόσεις φαίνονται και στην Επισκόπηση· του εργολάβου και στην καρτέλα του.'],en:['How do I see how much is left before an instalment is due?','“Payments” tab → “📋 Agreement instalments” → “+ Instalment”. Choose the party (client or contractor), amount and condition: completion of phase(s) in % (and building), phase start or signature. Each instalment shows “X% complete — Y% of works remaining (≈ €) for release”. When met it turns green “Due for release” with a “Record receipt/payment” button. Next instalments also show on the Overview; a contractor’s also on their card.']},
 {v:'',el:['Πώς βάζω την άδεια και πώς με ειδοποιεί πριν λήξει;','Επισκόπηση → «📄 Άδειες & υπενθυμίσεις λήξης» → «+ Άδεια». Γράψτε είδος, αριθμό άδειας, ΑΑ πράξης, ΥΔΟΜ και ημερομηνία έκδοσης· για άδεια δόμησης προτείνεται λήξη +4 έτη (ν. 4495/2017, άρθρο 42) — ελέγξτε την. Από 4 μήνες πριν τη λήξη εμφανίζεται κόκκινη/κίτρινη ειδοποίηση πάνω σε κάθε καρτέλα και μπαίνει στους «Ελέγχους». Με «✓ Το είδα» κρύβεται μέχρι τον επόμενο μήνα. Πατήστε «📅 Στο ημερολόγιο» για να μπουν οι ίδιες ειδοποιήσεις (4, 3, 2, 1 μήνα πριν, στη λήξη και κάθε μήνα μετά) στο ημερολόγιο του κινητού, ώστε να χτυπάει ακόμη κι αν η εφαρμογή είναι κλειστή.'],en:['How do I record the permit and get reminded before it expires?','Overview → “📄 Permits & expiry reminders” → “+ Permit”. Enter type, permit number, act ref., authority and issue date; for a building permit, expiry +4 years is suggested (Law 4495/2017, art. 42) — check it. From 4 months before expiry a red/yellow reminder shows above every tab and in “Checks”. “✓ Got it” hides it until next month. Press “📅 Add to calendar” to put the same reminders (4, 3, 2, 1 month before, on expiry and monthly after) in your phone calendar, so it alerts even when the app is closed.']},
 {v:'',el:['Πώς συνδέω εργολάβο σε μια εργασία και βλέπω την καρτέλα του;','Καρτέλα «Προμέτρηση» → στη στήλη «Φάση» κάθε εργασίας πατήστε «👷 + Εργολάβος» → διαλέξτε υπάρχοντα ή γράψτε νέο (όνομα, ειδικότητα) → «Αποθήκευση». Για όλη τη φάση μαζί: «👷 Ανάθεση εργολάβου» στον τίτλο της φάσης. Πατώντας το όνομα του εργολάβου ανοίγει η καρτέλα του: στοιχεία, συμφωνία, πρόοδος, τι δικαιούται, τι πληρώθηκε (τράπεζα / μετρητά), υπόλοιπο, φάσεις και εργασίες, με κουμπιά «Πληρωμή» και «Τιμολόγιο».'],en:['How do I link a contractor to an item and see their card?','“BOQ” tab → in the “Phase” column of each item press “👷 + Contractor” → choose an existing one or type a new one (name, trade) → “Save”. For a whole phase: “👷 Assign contractor” on the phase header. Tapping the contractor’s name opens their card: details, deal, progress, earned, paid (bank / cash), balance, phases and items, with “Payment” and “Invoice” buttons.']},
 {v:'',el:['Πώς προσθέτω εργασίες σε έργο που έχω ήδη στήσει;','Καρτέλα «Προμέτρηση» → «📚 Προσθήκη εργασιών». Ανοίγει η βιβλιοθήκη με όλες τις φάσεις αριστερά: διαλέξτε κτίριο, γράψτε ποσότητα και τιμή μονάδας σε όσες εργασίες θέλετε ή «+ Δική μου εργασία» στη φάση → «Αποθήκευση ✓». Για μία μόνο εργασία με όλα τα στοιχεία (φάση, διάρκεια, εργολάβος) υπάρχει το «+ Νέα εργασία».'],en:['How do I add works to a project already set up?','“BOQ” tab → “📚 Add works”. The library opens with all phases on the left: choose the building, type quantity and unit price on any items or “+ My own item” in the phase → “Save ✓”. For a single item with all details (phase, duration, contractor) use “+ New item”.']},
 {v:'',el:['Πώς βγάζω δίγλωσσο συμφωνητικό (ελληνικά – αγγλικά);','«Εκθέσεις & συμβάσεις» → «Ιδιωτικό συμφωνητικό ανάθεσης έργου» → «+ Νέο». Συμπληρώστε τα στοιχεία των μερών (και στα αγγλικά), την άδεια, τις προθεσμίες, τις ποινικές ρήτρες, την πληρωμή ανά στάδιο και την εγγύηση. Βγαίνει σε δύο στήλες ΕΛ | EN με Παράρτημα 1 (στάδια, χρονοδιάγραμμα, πληρωμές, προμέτρηση). Κάθε άλλο έγγραφο γίνεται δίγλωσσο από το πεδίο «Γλώσσα εγγράφου». Για αγγλικές περιγραφές στην προμέτρηση πατήστε πρώτα «Μετάφραση».'],en:['How do I produce a bilingual (Greek – English) agreement?','“Reports & contracts” → “Private contracting agreement” → “+ New”. Enter the parties (also in English), permit, deadlines, penalties, payment per stage and warranty. It is produced in two columns EL | EN with Annex 1 (stages, programme, payments, BOQ). Any other document becomes bilingual from the “Document language” field. For English BOQ descriptions run “Translate” first.']},
 {v:'',el:['Πώς βγάζω μηνιαία έκθεση προόδου;','Καρτέλα «Εκθέσεις & συμβάσεις» → «Μηνιαία έκθεση προόδου» → «+ Νέο». Ορίστε περίοδο, γράψτε γεγονότα, κινδύνους και επόμενες ενέργειες → «Αποθήκευση & PDF». Περιέχει Earned Value (PV, EV, AC, SPI, CPI, EAC), καθυστερήσεις, πρόοδο ανά φάση και κτίριο, οικονομικά και καμπύλη S.'],en:['How do I produce a monthly progress report?','“Reports & contracts” tab → “Monthly progress report” → “+ New”. Set the period, enter events, risks and next actions → “Save & PDF”. It contains Earned Value (PV, EV, AC, SPI, CPI, EAC), delays, progress per phase and building, finance and the S-curve.']},
 {v:'',el:['Πώς κάνω πιστοποίηση / λογαριασμό εργολάβου;','«Εκθέσεις & συμβάσεις» → «Πιστοποίηση εργασιών – λογαριασμός» → «+ Νέο». Διαλέξτε κύρια σύμβαση ή εργολάβο, κράτηση %, προκαταβολή. Βγαίνει επιμέτρηση ανά άρθρο με σωρευτικά, προηγούμενα και τρέχοντα, κρατήσεις, ΦΠΑ και πληρωτέο. Ο επόμενος λογαριασμός αφαιρεί αυτόματα τους προηγούμενους.'],en:['How do I certify a contractor payment?','“Reports & contracts” → “Interim payment certificate” → “+ New”. Choose the main contract or a contractor, retention %, advance. You get measurement per item with cumulative, previous and this period, deductions, VAT and amount payable. The next certificate deducts the previous ones automatically.']},
 {v:'',el:['Πώς φτιάχνω σύμβαση ή συμφωνητικό από την προμέτρηση;','«Εκθέσεις & συμβάσεις» → «Σύμβαση κατασκευής», «Συμφωνητικό εργολάβου» ή «Σύμβαση επίβλεψης & διαχείρισης έργου» → «+ Νέο». Συμπληρώστε τα στοιχεία των μερών και τους όρους· τίμημα, χρόνοι και παραρτήματα (προμέτρηση, ορόσημα, πρόγραμμα πληρωμών) μπαίνουν αυτόματα. Βγάλτε Word για να το διορθώσετε. Ελέγξτε το με νομικό πριν την υπογραφή.'],en:['How do I create a contract from the BOQ?','“Reports & contracts” → “Construction contract”, “Trade contractor agreement” or “Supervision & PM agreement” → “+ New”. Fill in the parties and terms; price, times and annexes (BOQ, milestones, payment schedule) are added automatically. Export to Word to edit. Have it reviewed by a lawyer before signing.']},
 {v:'',el:['Τι είναι το μητρώο εγγράφων και οι αναθεωρήσεις;','Κάθε έγγραφο παίρνει αριθμό (π.χ. CRM-MPR-001), αναθεώρηση (R0, R1…), κατάσταση (Προσχέδιο, Για έλεγχο / έγκριση, Εκδόθηκε) και πεδία Συνέταξε / Έλεγξε / Ενέκρινε. Με «✎ Αναθεώρηση» βγαίνει νέα αναθεώρηση με τον ίδιο αριθμό· οι παλιές μένουν στο μητρώο.'],en:['What are the document register and revisions?','Each document gets a number (e.g. CRM-MPR-001), a revision (R0, R1…), a status (Draft, For review / approval, Issued) and Prepared / Checked / Approved fields. “✎ Revise” issues a new revision with the same number; older ones stay in the register.']},
 {v:'',hub:1,el:['Πώς δίνω πρόσβαση σε άλλον (επιβλέπων, πελάτης, εργολάβος);','Ανοίξτε το έργο → «👥 Κοινή χρήση» πάνω → γράψτε για ποιον, διαλέξτε «Μόνο προβολή» ή «Επεξεργασία» → «+ Νέος σύνδεσμος». Στείλτε τον σύνδεσμο με WhatsApp ή Email. Δεν χρειάζεται λογαριασμό ούτε κλειδί· βλέπει μόνο αυτό το έργο. Αλλάζετε ή αφαιρείτε την πρόσβαση όποτε θέλετε.'],en:['How do I give access to someone (supervisor, client, contractor)?','Open the project → “👥 Share” at the top → enter for whom, choose “View only” or “Edit” → “+ New link”. Send the link by WhatsApp or Email. No account or key needed; they see only this project. Change or remove access at any time.']},
 {v:'',hub:1,el:['Πώς βλέπω τα έργα μου σε υπολογιστή και κινητό;','Ενεργοποιήστε το ίδιο κλειδί σε κάθε συσκευή. Τα έργα συγχρονίζονται αυτόματα μέσω του server του HEXIS-APP· η ένδειξη «● Ζωντανός συγχρονισμός» πάνω δεξιά το επιβεβαιώνει.'],en:['How do I see my projects on PC and phone?','Activate the same key on each device. Projects sync automatically through the HEXIS-APP server; “● Live sync” at the top right confirms it.']},
 {v:'',hub:1,el:['Πώς ενεργοποιώ την άδεια (κλειδί);','Ανοίξτε το BoQ από το HEXIS-APP Hub, γράψτε το κλειδί BOQ-XXXX-XXXX-XXXX και το email στο οποίο σας στάλθηκε → «Ενεργοποίηση». Μία φορά σε κάθε συσκευή· μετά δουλεύει και χωρίς ίντερνετ μέχρι τη λήξη. Η άδεια φαίνεται στις Ρυθμίσεις.'],en:['How do I activate the licence (key)?','Open BoQ from the HEXIS-APP Hub, enter the key BOQ-XXXX-XXXX-XXXX and the email it was sent to → “Activate”. Once per device; then it works offline until it expires. The licence is shown in Settings.']},
 {v:'01',a:1,b:1,el:['Πώς φτιάχνω νέο έργο;','Πατήστε «+ Νέο έργο» πάνω δεξιά. Ανοίγει οδηγός 5 βημάτων: στοιχεία, προμέτρηση, κτίρια, φάσεις & χρόνοι, έλεγχος.'],en:['How do I create a new project?','Press “+ New project” at the top right. A 5-step wizard opens: details, BOQ, buildings, phases & durations, review.']},
 {v:'01',a:2,b:3,el:['Πώς ορίζω ημερομηνία έναρξης και εργάσιμες;','Στο 1ο βήμα του οδηγού: «Ημερομηνία έναρξης» και «Εργάσιμες ημέρες εβδομάδας». Αλλάζουν και αργότερα από Ρυθμίσεις → «Επεξεργασία στησίματος έργου».'],en:['How do I set the start date and working days?','In wizard step 1: “Start date” and “Working days per week”. You can change them later in Settings → “Edit project setup”.']},
 {v:'01',a:4,b:4,el:['Πώς βάζω το λογότυπό μου;','«Ανέβασμα λογότυπου» στο 1ο βήμα ή στις Ρυθμίσεις. Μπαίνει στην κεφαλίδα, στο PDF και στο Excel.'],en:['How do I add my logo?','“Upload logo” in step 1 or in Settings. It appears in the header, the PDF and the Excel file.']},
 {v:'02',a:2,b:2,el:['Πώς γράφω ποσότητες και τιμές χωρίς Excel;','Στο βήμα «Προμέτρηση» γράψτε ποσότητα και τιμή μονάδας δίπλα σε οποιαδήποτε εργασία της βιβλιοθήκης. Μπαίνει αμέσως στο κτίριο με το σύνολό της.'],en:['How do I enter quantities and prices without Excel?','In the “BOQ” step type quantity and unit price next to any library item. It is added to the building with its total at once.']},
 {v:'02',a:3,b:3,el:['Πού φαίνεται αν είναι κατ’ αποκοπή, €/m² ή €/μ.μ.;','Στη στήλη «Τρόπος τιμολόγησης» δίπλα σε κάθε εργασία: κ.α., m², μ.μ., m³, τεμ., kg.'],en:['Where do I see lump sum, €/m² or €/lm?','In the “Pricing basis” column next to each item: LS, m², lm, m³, pcs, kg.']},
 {v:'02',a:4,b:4,el:['Πώς βρίσκω γρήγορα μια εργασία;','Πατήστε τη φάση στις ετικέτες πάνω από τον πίνακα ή γράψτε μια λέξη στην «Αναζήτηση…».'],en:['How do I find an item quickly?','Tap the phase in the chips above the table or type a word in “Search…”.']},
 {v:'02',a:5,b:5,el:['Πώς προσθέτω δική μου εργασία;','«+ Δική μου εργασία» στον τίτλο της φάσης. Γράψτε περιγραφή, μονάδα, ποσότητα, τιμή.'],en:['How do I add my own item?','“+ My own item” on the phase header. Type description, unit, quantity, price.']},
 {v:'02',a:6,b:6,el:['Πώς προσθέτω κτίριο και αντιγράφω εργασίες;','Γράψτε όνομα στο «Όνομα νέου κτιρίου» → «+ Προσθήκη κτιρίου». Από «Αντιγραφή εργασιών από…» περνάτε τις εργασίες άλλου κτιρίου.'],en:['How do I add a building and copy items?','Type a name in “New building name” → “+ Add building”. “Copy items from…” brings in another building’s items.']},
 {v:'02',a:7,b:7,el:['Πώς βλέπω μόνο όσα έχω περάσει;','Τσεκάρετε «Μόνο όσες έχουν ποσότητα».'],en:['How do I see only what I entered?','Tick “Only items with quantity”.']},
 {v:'03',a:1,b:5,el:['Πώς φέρνω προμέτρηση από Excel;','Βήμα «Προμέτρηση» → «Εισαγωγή από Excel» → επιλέξτε ή σύρετε τα .xlsx → ελέγξτε την κάρτα → «Εισαγωγή επιλεγμένων».'],en:['How do I import a BOQ from Excel?','“BOQ” step → “Import from Excel” → choose or drop the .xlsx → check the card → “Import selected”.']},
 {v:'04',a:1,b:1,el:['Πώς ορίζω πότε ξεκινά κάθε κτίριο;','Βήμα «Κτίρια»: «Ξεκινά μετά από (εργάσιμες)». Εκεί και όροφοι, εμβαδό.'],en:['How do I set when each building starts?','“Buildings” step: “Starts after (working days)”. Floors and area are there too.']},
 {v:'04',a:2,b:2,el:['Πώς αντιγράφω ολόκληρο κτίριο (ίδιες βίλες);','Βήμα «Κτίρια»: πατήστε «⧉» στο κτίριο. Δημιουργείται αντίγραφο με όλες τις εργασίες.'],en:['How do I duplicate a whole building (identical villas)?','“Buildings” step: press “⧉” on the building. A copy with all items is created.']},
 {v:'04',a:3,b:4,el:['Πώς βγαίνουν διάρκειες και εξαρτήσεις αυτόματα;','Βήμα «Φάσεις & χρόνοι»: «Αυτόματη αναγνώριση» ή «Ανάλυση με τεχνητή νοημοσύνη». Διορθώνετε όποια διάρκεια θέλετε.'],en:['How are durations and dependencies set automatically?','“Phases & durations” step: “Auto detect” or “AI analysis”. Edit any duration you want.']},
 {v:'05',a:1,b:1,el:['Πού βλέπω πόσες μέρες μένουν και πόσο αργώ;','Επισκόπηση → χρονόμετρο έργου: μέρες μέχρι την αποπεράτωση, ημέρα του έργου, πρόβλεψη λήξης και καθυστέρηση.'],en:['Where do I see days left and the delay?','Overview → project clock: days to completion, project day, forecast finish and delay.']},
 {v:'05',a:2,b:3,el:['Πού καθυστερεί το έργο και τι κάνω;','Επισκόπηση → «Πού καθυστερεί το έργο» και «Προτάσεις για να φύγετε από το bottleneck».'],en:['Where is the project late and what do I do?','Overview → “Where the project is late” and “Suggestions for the bottleneck”.']},
 {v:'05',a:5,b:5,el:['Πώς συγκρίνω τα κτίρια;','Καρτέλα «Σύγκριση κτιρίων»: πρόοδος, αξίες και πίνακας φάση × κτίριο.'],en:['How do I compare buildings?','“Building comparison” tab: progress, values and a phase × building matrix.']},
 {v:'06',a:1,b:1,el:['Πώς περνάω τα εκτελεσμένα;','Καρτέλα «Προμέτρηση» → στήλη «Εκτελεσμένα». Ποσοστά, Gantt και καθυστερήσεις ενημερώνονται μόνα τους.'],en:['How do I enter executed quantities?','“BOQ” tab → “Executed” column. Percentages, Gantt and delays update by themselves.']},
 {v:'06',a:2,b:2,el:['Πώς αναθέτω εργολάβο σε φάση;','«Προμέτρηση» → στον τίτλο της φάσης «👷 Ανάθεση εργολάβου».'],en:['How do I assign a contractor to a phase?','“BOQ” → on the phase header “👷 Assign contractor”.']},
 {v:'06',a:3,b:3,el:['Πώς βάζω ΦΠΑ και αμοιβή επίβλεψης;','Στο τέλος της «Προμέτρησης» → «Τελικές επιβαρύνσεις» → «+ Προσθήκη επιβάρυνσης».'],en:['How do I add VAT and supervision fee?','At the end of “BOQ” → “Final charges” → “+ Add charge”.']},
 {v:'06',a:4,b:4,el:['Πού βλέπω τι έχω πληρώσει και τι χρωστάω σε εργολάβο;','Καρτέλα «Εργολάβοι» → πατήστε τον εργολάβο: δικαιούται, πληρωμένα, υπόλοιπο, φάσεις.'],en:['Where do I see what I paid and owe a contractor?','“Contractors” tab → tap the contractor: earned, paid, balance, phases.']},
 {v:'07',a:1,b:1,el:['Πώς βλέπω εκκρεμή τιμολόγια μιας φάσης;','Gantt → περάστε το ποντίκι (ή πατήστε στο κινητό) πάνω στη μπάρα.'],en:['How do I see pending invoices of a phase?','Gantt → hover (or tap on the phone) the bar.']},
 {v:'07',a:2,b:2,el:['Πώς κάνω ζουμ στο Gantt;','Κουμπιά «+» / «−», Ημέρα / Εβδομάδα / Μήνας, ή Ctrl + ροδέλα.'],en:['How do I zoom the Gantt?','“+” / “−” buttons, Day / Week / Month, or Ctrl + wheel.']},
 {v:'07',a:3,b:null,el:['Ποια διαγράμματα υπάρχουν;','Καρτέλα «Διαγράμματα»: καμπύλη S & Earned Value, ταμειακές ροές, CPM, Line of Balance, ορόσημα, φόρτος εργολάβων, WBS. Κάθε ένα βγαίνει σε PDF.'],en:['Which charts are there?','“Charts” tab: S-curve & Earned Value, cash flow, CPM, Line of Balance, milestones, contractor loading, WBS. Each exports to PDF.']},
 {v:'08',a:1,b:2,el:['Πώς καταχωρώ πληρωμή μετρητοίς;','«Πληρωμές» → «+ Νέα κίνηση» → τρόπος «💶 Μετρητά» → «Αποθήκευση».'],en:['How do I record a cash payment?','“Payments” → “+ New entry” → method “💶 Cash” → “Save”.']},
 {v:'08',a:3,b:3,el:['Πώς βλέπω μόνο τα μετρητά;','«Πληρωμές» → φίλτρο «💶 Μετρητά».'],en:['How do I see only cash?','“Payments” → “💶 Cash” filter.']},
 {v:'08',a:4,b:4,el:['Πώς καταχωρώ τιμολόγιο ή παραγγελία;','«Αποθετήριο» → «+ Νέο έγγραφο»: είδος, φάση ή εργασία, ποσό, συνημμένο.'],en:['How do I record an invoice or order?','“Repository” → “+ New document”: type, phase or item, amount, attachment.']},
 {v:'08',a:5,b:5,el:['Πού βγάζω καρτέλα πελάτη ή προμηθευτή;','«Καρτέλες» → «Καρτέλα πελάτη» ή «Καρτέλες προμηθευτών» → «PDF καρτέλας».'],en:['Where do I get a client or supplier ledger?','“Ledgers” → “Client ledger” or “Supplier ledgers” → “Ledger PDF”.']},
 {v:'09',a:1,b:2,el:['Πώς ανεβάζω σχέδια;','«Σχέδια» → διαλέξτε φάκελο μελέτης → σύρετε ή επιλέξτε PDF / εικόνες.'],en:['How do I upload drawings?','“Drawings” → pick the discipline folder → drop or choose PDFs / images.']},
 {v:'09',a:3,b:3,el:['Πώς βάζω DWG ή DXF;','«Σχέδια» → «Νέο σχέδιο με σύνδεσμο» και επικολλήστε τον σύνδεσμο (π.χ. Google Drive).'],en:['How do I add a DWG or DXF?','“Drawings” → “New drawing with link” and paste the link (e.g. Google Drive).']},
 {v:'10',a:1,b:2,el:['Πώς βρίσκω και διορθώνω λάθη και διπλοεγγραφές;','Καρτέλα «Έλεγχοι» → «Διόρθωση…» → βλέπετε τι θα γίνει → «Εφαρμογή διόρθωσης».'],en:['How do I find and fix errors and duplicates?','“Checks” tab → “Fix…” → see what will happen → “Apply fix”.']},
 {v:'10',a:3,b:3,el:['Πώς αναιρώ μια διόρθωση;','«Έλεγχοι» → «Αναίρεση τελευταίας διόρθωσης».'],en:['How do I undo a fix?','“Checks” → “Undo last fix”.']},
 {v:'11',a:1,b:2,el:['Πώς βγάζω PDF ή Excel;','Επισκόπηση → «Εξαγωγή PDF» (διαλέγετε περιεχόμενα) ή «Εξαγωγή Excel».'],en:['How do I export PDF or Excel?','Overview → “Export PDF” (choose contents) or “Export Excel”.']},
 {v:'11',a:3,b:3,el:['Πώς μοιράζομαι το έργο με συνεργάτες;','Κοινή χρήση της σελίδας από το claude.ai. Όλοι βλέπουν τις αλλαγές ζωντανά· όσοι έχουν μόνο προβολή δεν αλλάζουν τίποτα.'],en:['How do I share the project?','Share the page from claude.ai. Everyone sees changes live; view-only users cannot change anything.']},
 {v:'11',a:4,b:4,el:['Πώς κρατάω αντίγραφο ασφαλείας;','Ρυθμίσεις → «Αντίγραφο ασφαλείας (JSON)». Επαναφορά με «Επαναφορά από αντίγραφο».'],en:['How do I keep a backup?','Settings → “Backup (JSON)”. Restore with “Restore from backup”.']},
 {v:'11',a:5,b:6,el:['Πώς σβήνω ένα έργο;','«📁 Τα έργα μου» → «🗑 Διαγραφή» → «Ναι, διαγραφή». Δεν αναιρείται.'],en:['How do I delete a project?','“📁 My projects” → “🗑 Delete” → “Yes, delete”. It cannot be undone.']},
];
let HQ='',HO=-1,HMODE='how';
function vclip(h){const T=(VT[h.v]||[]);const st=T.find(x=>x[0]===h.a),lb=h.b==null?-1:T.map(x=>x[0]).lastIndexOf(h.b),en=h.b==null?T.find(x=>x[0]==='end'):T[lb+1];const a=st?Math.max(0,st[1]-0.6):0,b=en?en[1]+0.2:'';return VBASE+h.v+'.mp4#t='+a.toFixed(1)+(b!==''?','+b.toFixed(1):'')}
function helpBox(){renderHelp()}
function howHtml(){const el=L==='el';
 let h='<input type="search" id="hq" placeholder="'+t('hqPh')+'" value="'+esc(HQ)+'" oninput="hqF(this.value)" style="width:100%;font-size:17px;margin-bottom:10px"><div class="list" id="hqL">';
 HOWTO.forEach((x,i)=>{if(x.hub&&!HUB)return;const q=x[L];const open=i===HO;
  h+='<div class="li hq" data-s="'+esc(norm(q[0]+' '+q[1]))+'" style="display:block;cursor:default;'+(open?'border-color:var(--acc);background:var(--accbg)':'')+'"><div class="row" data-act="hqO" data-v="'+i+'" style="cursor:pointer;flex-wrap:nowrap"><b style="color:var(--acc)">'+(open?'▾':'▸')+'</b><div class="tx" style="font-weight:700;font-size:16.5px">'+esc(q[0])+'</div>'+(x.v?'<span class="mini" style="white-space:nowrap">▶ '+t('vid')+'</span>':'')+'</div>';
  if(open&&!x.v)h+='<p style="margin:8px 0 4px;font-size:16.5px">'+esc(q[1])+'</p>';
  else if(open)h+='<p style="margin:8px 0 10px;font-size:16.5px">'+esc(q[1])+'</p><video src="'+vclip(x)+'" controls playsinline autoplay muted preload="auto" style="width:100%;border-radius:12px;border:1px solid var(--line);background:#0f172a;aspect-ratio:16/10" onerror="this.outerHTML=\'<div class=&quot;note&quot;>'+t('vidNA')+'</div>\'"></video><div class="row" style="margin-top:6px">'+(el?'':'<span class="mini">'+t('vidEl')+'</span>')+'<span class="sp"></span><button class="btn sec sm" data-act="hqCh" data-v="'+GUIDE.findIndex(g=>g.v===x.v)+'">📖 '+t('fullCh')+'</button></div>';
  h+='</div>'});
 h+='</div><div class="note" id="hqNo" style="display:none">'+t('hqNo')+'</div>';return h}
function hqF(v){HQ=v;const q=norm(v||'');let n=0;document.querySelectorAll('#hqL .hq').forEach(d=>{const ok=!q||q.split(/\s+/).every(w=>d.dataset.s.includes(w));d.style.display=ok?'block':'none';if(ok)n++});const no=document.getElementById('hqNo');if(no)no.style.display=n?'none':'block'}
function renderHelp(){
 const el=L==='el';const g=GUIDE[HG];
