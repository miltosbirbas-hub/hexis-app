<!DOCTYPE html>
<html lang="el" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEXIS-APP · BoQ</title>
<meta name="theme-color" content="#14213D">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 104"><polygon points="50,7 86,28 86,70 50,91 14,70 14,28" fill="none" stroke="%231E5BD8" stroke-width="8"/><polygon points="50,27 69,38 69,61 50,72 31,61 31,38" fill="%231747B5"/></svg>'>
<style>
:root{--bg:#f4f6fa;--surf:#fff;--surf2:#f8fafc;--line:#dfe4ec;--line2:#c9d1dd;--txt:#14213d;--muted:#4b5871;--faint:#7c879b;
 --acc:#1f4e9c;--acc2:#163b78;--accbg:#e8f0fc;--ok:#13804b;--okbg:#e4f5ec;--err:#b42318;--errbg:#fdecea;--warn:#9a5b00;--warnbg:#fff4db;--info:#3b4a63;--infobg:#eef1f6;
 --orange:#e2671c;--crit:#c0262d;--fb:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;--r:12px;--lw:330px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--fb);font-size:16.5px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;min-height:60px;display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--surf);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.brand small{display:block;font-weight:600;color:var(--faint);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase}
.verb{font:700 12.5px/1 inherit;font-family:inherit;color:var(--acc);background:var(--accbg);border:1px solid var(--acc);border-radius:99px;padding:3px 8px;margin-left:4px;cursor:pointer;vertical-align:middle;letter-spacing:0}
.brand .clogo{height:34px;max-width:120px;object-fit:contain;border-left:1px solid var(--line);padding-left:10px}
.tmid{flex:1;display:flex;gap:8px;align-items:center;min-width:200px}
.tmid select{max-width:420px}
.tright{display:flex;gap:8px;align-items:center}
.sv{font-size:13.5px;color:var(--faint);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--surf2)}
.seg button{border:0;background:transparent;padding:8px 13px;cursor:pointer;font-weight:700;font-size:15px;white-space:nowrap}
.seg button.on{background:var(--acc);color:#fff}
nav.tabs{display:flex;flex-wrap:wrap;gap:2px 4px;padding:8px 14px 0;background:var(--surf);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;position:sticky;top:60px;z-index:19}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:transparent;padding:10px 11px 12px;font-weight:700;font-size:15.5px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
main{padding:16px;max-width:1500px;margin:0 auto}
h2{font-size:21px;margin:0 0 4px}
h3{font-size:17.5px;margin:0 0 10px}
.lead{color:var(--muted);margin-bottom:12px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--acc);color:#fff;font-size:16px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:hover{background:var(--acc2)}
.btn.sec{background:var(--surf);color:var(--txt);border:1px solid var(--line2)}
.btn.sec:hover{border-color:var(--acc)}
.btn.or{background:var(--orange)}.btn.or:hover{filter:brightness(.95)}
.btn.gr{background:var(--ok)}
.btn.dang{background:var(--errbg);color:var(--err);border:1px solid #f3b8b1}
.btn.sm{padding:7px 12px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default}
.ib{border:1px solid var(--line2);background:var(--surf);border-radius:9px;min-width:38px;height:38px;cursor:pointer;font-weight:700;font-size:16px;display:inline-grid;place-items:center;padding:0 9px}
.ib:hover{border-color:var(--acc);color:var(--acc)}
label.f{display:block;margin:8px 0}
label.f>span{display:block;font-size:14.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;border:1px solid var(--line2);border-radius:9px;padding:9px 10px;background:var(--surf);font-size:16px;min-height:42px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:var(--acc)}
textarea{min-height:90px;resize:vertical}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpis{grid-template-columns:repeat(auto-fit,minmax(205px,1fr))}
.card{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--surf);box-shadow:0 1px 2px rgba(20,33,61,.04)}
.kpi .l{font-size:14.5px;color:var(--muted);font-weight:600}
.kpi .v{font-size:28px;font-weight:800;margin:4px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .s{font-size:14.5px;color:var(--muted)}
.kpi .v.ok{color:var(--ok)}.kpi .v.warn{color:var(--warn)}.kpi .v.bad{color:var(--crit)}
.bar{height:12px;border-radius:99px;background:var(--infobg);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bar i.ok{background:var(--ok)}.bar i.or{background:var(--orange)}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--txt);opacity:.55}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.sp{flex:1}
.badge{display:inline-block;border-radius:7px;padding:2px 9px;font-size:13.5px;font-weight:800;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}.b-late{background:var(--warnbg);color:var(--warn)}.b-run{background:var(--accbg);color:var(--acc)}.b-wait{background:var(--infobg);color:var(--info)}.b-crit{background:#fde8e8;color:var(--crit)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surf)}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:15.5px}
table.t th{position:sticky;top:0;background:var(--surf2);text-align:left;font-size:13.5px;color:var(--muted);font-weight:700;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
table.t td{padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.grp td{background:var(--accbg);font-weight:800;color:var(--acc2)}
table.t tr.bld td{background:#14213d;color:#fff;font-weight:800;font-size:16.5px}
table.t tr.sub td{background:var(--surf2);font-weight:700}
table.t tr.tot td{background:#eef3fb;font-weight:800;font-size:16.5px}
table.t tr:hover td{background-color:rgba(31,78,156,.03)}
table.t input{min-height:36px;padding:6px 8px;font-size:15.5px}
table.t input.num{width:120px;text-align:right}
.ctrw{display:flex;gap:4px;margin-top:5px}.ctrc{flex:1;min-width:0;text-align:left;white-space:normal;line-height:1.2;border:1px solid #9cc3f5;background:#e8f1fd;color:#163b78;border-radius:8px;padding:5px 8px;font-size:13px;font-weight:700;cursor:pointer}.ctrc:hover{background:#d6e7fc}.ctre{border:1px solid var(--line);background:var(--surf);border-radius:8px;padding:0 8px;cursor:pointer}.ctra{display:block;width:100%;margin-top:5px;text-align:left;border:1.5px dashed #e9c46a;background:#fff8dc;color:#7a5600;border-radius:8px;padding:5px 8px;font-size:13px;font-weight:700;cursor:pointer}.ctra:hover{background:#fff3c4}body.ro .ctra,body.ro .ctre{display:none}
.phb{display:block;width:100%;text-align:left;white-space:normal;line-height:1.25;border:1px solid var(--line);background:var(--surf2);color:var(--txt);border-radius:8px;padding:5px 8px;font-size:13.5px;font-weight:600;cursor:pointer}.phb:hover{border-color:var(--acc)}body.ro .phb{pointer-events:none}.boqt input.num{width:92px!important}.boqt select{width:165px!important;max-width:165px!important}.boqt td,.boqt th{padding-left:6px;padding-right:6px}
@media (max-width:820px){.boqt thead{display:none}.boqt,.boqt tbody{display:block}.boqt tr{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;padding:10px 8px;border-bottom:1px solid var(--line)}.boqt td{border:0!important;padding:0!important;min-width:0}.boqt tr:not(.sub):not(.tot) td:not([colspan])::before{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:2px}.boqt td:first-child:not([colspan]){display:none}.boqt td.desc{grid-column:1/-1;font-weight:700;font-size:16px}.boqt tr:has(td[colspan]){display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}.boqt tr:has(td[colspan]) td:empty{display:none}.boqt td[colspan]{flex:1 1 100%}.boqt td.n{text-align:left!important}.boqt td input.num{width:100%!important;text-align:right}.boqt tr:not(:has(td[colspan])) td{background:transparent!important}.boqt td[style*="width:150px"]{width:auto!important}}@media (min-width:821px) and (max-width:1320px){.boqt td,.boqt th{padding-left:4px;padding-right:4px}.boqt input.num{width:82px!important}.boqt select{width:140px!important;max-width:140px!important}}@media (min-width:821px){.tw.boqw{overflow:visible}.boqw table.t th{top:var(--stk,120px);z-index:5}}
.ovl.full{padding:0}.mbox.wide.full{max-width:none;width:100vw;height:100vh;max-height:100vh;border-radius:0}
.mb .bqtw thead th{top:-14px}
table.bq td{padding-top:5px;padding-bottom:5px;border-bottom:1px solid #eef1f6}
table.bq tr:hover td{background:#f7f9fd}
table.bq input.num,table.bq input[data-in="bt"]{border:1px solid #e3e8f0;background:#fbfcfe;border-radius:8px;box-shadow:none;padding:7px 10px}
table.bq input.num:focus,table.bq input[data-in="bt"]:focus{border-color:var(--acc);background:#fff;outline:2px solid var(--accbg)}
table.bq tr[data-lrow] td:first-child{color:var(--muted)}
table.bq tr:not([data-lrow]):not(.grp) td:first-child{font-weight:600}
table.bq tr.grp td{padding-top:12px;padding-bottom:8px}
.hsteps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 10px}.hsteps>div{display:flex;gap:9px;align-items:flex-start;background:#f3f7fe;border:1px solid #d6e2f5;border-radius:12px;padding:9px 11px;font-size:14.5px;line-height:1.35}.hsteps .hn{font-style:normal;font-weight:800;flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;font-size:14px}
@media (max-width:900px){.hsteps{grid-template-columns:1fr 1fr}}@media (max-width:600px){.hsteps{grid-template-columns:1fr}}
table.bq tr.sbh td{font-size:13px;font-weight:800;letter-spacing:.02em;padding:7px 10px!important;border-bottom:0}table.bq tr.sbh.in td{color:#0f6b3a;background:#eaf7ef}table.bq tr.sbh.lib td{color:#5b6578;background:#f6f7fa}
table.bq tr.inb td:first-child{border-left:4px solid #1f8a4c}
table.bq input.num,table.bq input[data-in="bt"],.boqt input.num{background:#fff8dc!important;border:1.5px solid #e9c46a!important;border-radius:8px;color:#14213d;font-weight:600}
table.bq input.num:hover,table.bq input[data-in="bt"]:hover,.boqt input.num:hover{border-color:#d49a1f!important;background:#fff3c4!important}
table.bq input.num:not(:placeholder-shown),table.bq tr.inb input[data-in="bt"]{background:#eaf7ef!important;border-color:#7cc49a!important}
table.bq input.num:focus,table.bq input[data-in="bt"]:focus,.boqt input.num:focus{background:#fff!important;border-color:var(--acc)!important;outline:3px solid #cfe0fb!important}
.bpw{display:grid;grid-template-columns:330px minmax(0,1fr);gap:14px;align-items:start}.bside{position:sticky;top:0;display:flex;flex-direction:column;gap:3px}.bsi{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surf);border-radius:9px;padding:4px 10px;min-height:30px;cursor:pointer;font:inherit;color:var(--ink)}.bsi .bsn{font-weight:700;font-size:14.5px;line-height:1.2}.bsi .bsv{font-size:12.5px;color:var(--muted);white-space:nowrap;text-align:right}.bsi.has{border-left:4px solid var(--ok,#1f8a4c)}.bsi.on{background:var(--acc);border-color:var(--acc);color:#fff}.bsi.on .bsv{color:#e6eefc}.bqtw{max-height:none!important;overflow:visible!important}.bqtw thead th{position:sticky;top:0;z-index:3;background:var(--surf2)}
@media (max-width:820px){.bpw{grid-template-columns:1fr}.bside{position:static;flex-direction:column;max-height:none}.bsi{flex:none}}
table.t select{min-height:36px;padding:5px 6px;font-size:14.5px;width:auto;max-width:none}
.desc{cursor:pointer;min-width:220px}
.desc:hover{color:var(--acc)}
.desc small{display:block;color:var(--faint);font-size:13px}
.empty{text-align:center;padding:50px 20px}
.empty .hex{width:90px;margin:0 auto 14px}
.steps5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:900px;margin:22px auto;text-align:left}
.steps5 div{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px}
.steps5 b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;margin-bottom:6px}
/* modal */
.ovl{position:fixed;inset:0;background:rgba(15,26,46,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:14px}
.mbox{background:var(--surf);border-radius:16px;max-width:760px;width:100%;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(15,26,46,.25)}
.mbox.wide{max-width:1240px;height:96vh;max-height:96vh}
.mh{padding:16px 20px 10px;border-bottom:1px solid var(--line)}
.mb{padding:14px 20px;overflow:auto;flex:1}
.mf{padding:12px 20px;border-top:1px solid var(--line);background:var(--surf2);display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-radius:0 0 16px 16px}
.stepper{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.stepper::-webkit-scrollbar{display:none}
.st{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surf2);border-radius:999px;padding:6px 13px 6px 6px;white-space:nowrap;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer}
.st b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--txt);font-size:13.5px}
.st.on{border-color:var(--acc);color:var(--txt);background:var(--accbg)}
.st.on b{background:var(--acc);color:#fff}
.st.done b{background:var(--ok);color:#fff}
.drop{border:2px dashed var(--line2);border-radius:14px;padding:24px;text-align:center;cursor:pointer;background:var(--surf2);display:block}
.drop:hover,.drop.ov{border-color:var(--acc);background:var(--accbg)}
.drop input{display:none}
.sheet{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--surf)}
.sheet.off{opacity:.6}
.sheet .h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sheet .h label{display:flex;gap:8px;align-items:center;font-weight:700;cursor:pointer}
.sheet input[type=checkbox]{width:20px;height:20px}
.sheet details{margin-top:6px}
.sheet summary{cursor:pointer;color:var(--acc);font-weight:600;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--line2);background:var(--surf);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14.5px}
.note{border-left:4px solid var(--acc);background:var(--accbg);border-radius:0 10px 10px 0;padding:10px 12px;margin:8px 0;font-size:15.5px}
.note.or{border-color:var(--orange);background:#fff3ea}
.mini{font-size:14px;color:var(--muted)}
.logo-prev{height:60px;max-width:220px;object-fit:contain;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff}
/* gantt */
.gtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:22px;height:10px;border-radius:3px;vertical-align:middle;margin-right:5px}
.gwrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surf);max-height:calc(100vh - 230px);position:relative}
.ggrid{position:relative}
.ghead{position:sticky;top:0;z-index:6;display:flex;background:var(--surf2);border-bottom:1px solid var(--line)}
.ghead .gl{background:var(--surf2);font-weight:700;color:var(--muted);font-size:13.5px;display:flex;align-items:flex-end;padding:6px 10px}
.gl{position:sticky;left:0;z-index:4;width:var(--lw);min-width:var(--lw);background:var(--surf);border-right:1px solid var(--line);padding:6px 10px;font-size:14.5px;display:flex;align-items:center;gap:6px}
.gtl{position:relative;height:50px}
.gtl .m{position:absolute;top:0;height:25px;border-left:1px solid var(--line2);font-size:13px;font-weight:700;padding:4px 6px;white-space:nowrap;overflow:hidden;color:var(--txt)}
.gtl .d{position:absolute;top:25px;height:25px;border-left:1px solid var(--line);font-size:12px;padding:5px 3px;color:var(--faint);white-space:nowrap}
.gr{display:flex;min-height:38px;border-bottom:1px solid #eef1f5}
.gr.b .gl{background:#14213d;color:#fff;font-weight:800;font-size:15.5px}
.gr.b .gt{background:#eef2f8}
.gr.p .gl{background:var(--accbg);font-weight:700;cursor:pointer;color:var(--acc2)}
.gr.p .gt{background:#f7f9fd}
.gr.t .gl{cursor:pointer;padding-left:24px}
.gr.t .gl:hover{color:var(--acc)}
.gr.t .gl .c{color:var(--faint);font-size:12.5px;margin-right:2px}
.gt{position:relative;flex:none}
.gbar{position:absolute;top:9px;height:20px;border-radius:5px;background:#b9cdee;cursor:pointer;overflow:hidden;border:1px solid #8eaee0}
.gbar i{position:absolute;left:0;top:0;bottom:0;background:var(--acc)}
.gbar.done i{background:var(--ok)}
.gbar.crit{border:2px solid var(--crit)}
.gbar span{position:absolute;left:6px;top:0;font-size:12px;font-weight:800;color:#fff;line-height:18px;text-shadow:0 0 2px rgba(0,0,0,.4);white-space:nowrap}
.gr.p .gbar,.gr.b .gbar{height:14px;top:12px;background:#9fb3d6;border-color:#7f97c4}
.gr.b .gbar{background:#4b5e86;border-color:#14213d}
.gr.b .gbar i{background:#1f4e9c}
.gdel{position:absolute;top:13px;height:12px;border-radius:0 5px 5px 0;background:repeating-linear-gradient(45deg,#f0a35e 0 5px,#e2671c 5px 10px);opacity:.9}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--crit);z-index:5;pointer-events:none}
.gtoday span{position:absolute;top:2px;left:4px;background:var(--crit);color:#fff;font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:5px;white-space:nowrap}
.tri{display:inline-block;width:16px;color:var(--acc)}
/* toast */
#tip{position:fixed;z-index:70;max-width:380px;background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:0 12px 34px rgba(15,26,46,.22);padding:10px 12px;font-size:14px;pointer-events:none;display:none}
#tip.on{display:block}#tip .tt{font-weight:800;font-size:15px;color:var(--txt)}#tip .tsub{color:var(--faint);font-size:13px;margin-bottom:6px}#tip .tr{display:flex;justify-content:space-between;gap:14px;padding:2px 0;border-bottom:1px dashed var(--line)}#tip .tr span{color:var(--muted)}#tip .tsec{margin-top:8px;font-weight:800;color:var(--orange)}#tip .tok{color:var(--ok);font-weight:700}#tip .tdoc{font-size:13px;color:var(--muted);padding-left:10px}
.gpend{position:absolute;top:9px;min-width:20px;height:20px;border-radius:10px;background:var(--orange);color:#fff;font-size:11.5px;font-weight:800;display:grid;place-items:center;padding:0 5px;pointer-events:none}

 items:'Εργασίες',buildingsL:'Κτίρια',phasesL:'Φάσεις',version:'Έκδοση',whatsNew:'Τι νέο',wn1:'Νέο στην 1.22 — Χρονοπρόγραμμα → «Κίνδυνοι & ανάλυση»: μητρώο κινδύνων με πίνακα 5×5 και EMV (ISO 31000)· πιθανότητα περάτωσης με προσομοίωση Monte Carlo — P50/P80/P90, δείκτης κρισιμότητας, ευαισθησία (AACE 57R-09)· ανάλυση καθυστερήσεων TIA με δικαίωμα παράτασης (AACE 52R-06, SCL)· εξομάλυνση πόρων ανά συνεργείο· εισαγωγή χρονοπρογράμματος XML. Στην εργασία: περιορισμοί «έναρξη όχι νωρίτερα / λήξη όχι αργότερα» με αρνητικό περιθώριο και αβεβαιότητα διάρκειας. Στην 1.21 (ασφάλεια δεδομένων): κάθε αλλαγή αναιρείται με ↶ (επάνω δεξιά) ή Ctrl+Z· αυτόματο ημερήσιο στιγμιότυπο του έργου και στιγμιότυπο πριν από baseline / εισαγωγή / επαναφορά· «Ιστορικό αλλαγών» (ποιος, πότε, τι άλλαξε)· τα διαγραμμένα έργα μένουν 30 ημέρες στον κάδο· έλεγχοι εισαγωγής (μηδενικό ποσό, αρνητική ποσότητα/τιμή, πρόοδος πάνω από την ποσότητα, ημερομηνία πολύ στο μέλλον). Όλα στις Ρυθμίσεις → «Ασφάλεια δεδομένων». Νέο κουμπί «🆘 Αναφορά προβλήματος» (Βοήθεια / Ρυθμίσεις): η αναφορά φτάνει απευθείας στην υποστήριξη. Στην 1.20: δίπλα σε κάθε συντομογραφία (PV, EV, SPI, CPI, EAC, TCPI, SPI(t), FS/SS, περιθώρια, DCMA, CPLI, BEI κ.λπ.) υπάρχει «?» με σύντομη εξήγηση: τι είναι, γιατί χρησιμοποιείται, πώς διαβάζεται — και τι σημαίνει η τιμή του δικού σας έργου· πλήρες γλωσσάριο στη Βοήθεια. Στην 1.19 (επίπεδο επαγγελματικού λογισμικού PM): σχέσεις FS/SS/FF/SF με lag/lead και ελεύθερο περιθώριο· baseline με PV από αυτή και μπάρες στο Gantt· πλήρης ανάλυση Earned Value και Earned Schedule (EAC ×3, TCPI, SPI(t)…)· αξιολόγηση ποιότητας προγράμματος DCMA-14· ημερολόγιο με αργίες Ελλάδας· εξαγωγή χρονοπρογράμματος σε XML· πίνακας προτύπων και πηγών στη Βοήθεια. Στην 1.18: «Έλεγχος αρχείου» στην εισαγωγή Excel — εντοπίζει και διορθώνει ποσότητα × τιμή ≠ σύνολο, σφάλματα τύπων (#REF!, #DIV/0!), ποσοστά γραμμένα ως 70 αντί 70%, λάθος αθροίσματα ενοτήτων, λάθος ΦΠΑ/αμοιβή, αρνητικές τιμές, διπλοεγγραφές και άρθρα χωρίς τιμή· διορθώθηκε η αναγνώριση βάσης της αμοιβής (υπολογιζόταν σε λάθος βάση σε ορισμένα αρχεία). Στην 1.17: η εφαρμογή χαρακτηρίζεται πλέον με τον διεθνή όρο «Construction PM» (Project Management)· στο How-to νέα ερώτηση με τους όρους PM, PMIS, PPM, CPM. Στην 1.16: η πλοήγηση έγινε 9 ομάδες σε μία γραμμή (Προμέτρηση, Χρονοπρόγραμμα, Συμβάσεις & έντυπα, Οικονομικά κ.λπ.)· μόλις καταχωρηθεί η προμέτρηση, ανοίγουν απευθείας τα επόμενα βήματα (συμφωνητικό, σύμβαση, εργολάβοι, πρόγραμμα πληρωμών, άδεια)· στην Επισκόπηση νέα «Οργάνωση έργου» με ό,τι εκκρεμεί. Στην 1.15: πιο επαγγελματική εμφάνιση (ήπια χρώματα, εικονίδια γραμμής αντί για emoji, λιγότερες καμπύλες)· η εφαρμογή εγκαθίσταται στον υπολογιστή και στο κινητό σαν κανονική εφαρμογή (Ρυθμίσεις → «Εγκατάσταση»). Στην 1.14: πράσινο κουμπί «✅ Πρόοδος» πάνω — δείχνει μόνο όσες εργασίες τρέχουν σήμερα ή καθυστερούν, με + / − και «✓ Τελείωσε», για καταχώρηση σε λίγα λεπτά· στην Επισκόπηση υπενθύμιση αν δεν καταχωρήθηκε η πρόοδος σήμερα. Νέο «📋 Δόσεις συμφωνητικών» (Πληρωμές, Επισκόπηση, καρτέλα εργολάβου): για κάθε δόση η προϋπόθεση (ολοκλήρωση φάσης %, έναρξη φάσης ή υπογραφή) και πόσο % εργασιών υπολείπεται για την εκταμίευση. Στην 1.13: στην Επισκόπηση νέα ενότητα «📄 Άδειες» (αριθμός, ΑΑ πράξης, ΥΔΟΜ, έκδοση, λήξη) με ειδοποίηση 4 μήνες πριν τη λήξη και μετά κάθε μήνα, και «📅 Στο ημερολόγιο» για ξυπνητήρι στο κινητό. Στην 1.12: αφαιρέθηκε η «Εργοταξιακή εγκατάσταση» από τη βιβλιοθήκη και το πρότυπο νέου έργου (όπου υπάρχει ήδη σε έργο, σβήνεται με τον κάδο)· τα κουτιά που συμπληρώνετε είναι κίτρινα και γίνονται πράσινα όταν τα γράψετε· στην Προμέτρηση κάθε εργασία έχει κουμπί «👷 + Εργολάβος» και, όταν συνδεθεί, πατώντας το όνομα ανοίγει η καρτέλα του (στοιχεία, πληρωμές, μετρητά, υπόλοιπο, φάσεις)· στο στήσιμο υπάρχουν 4 αριθμημένα βήματα και οι εργασίες χωρίζονται σε «Στην προμέτρηση» και «Βιβλιοθήκη». Στην 1.11: στο κινητό κάθε εργασία της προμέτρησης γράφει πάνω από τα πεδία «Ποσότητα (μονάδα)», «Τιμή μονάδας €/μονάδα» και «Σύνολο», και τα βήματα του οδηγού πιάνουν μία γραμμή. Στην 1.10: ο οδηγός στησίματος και η «Προσθήκη εργασιών» ανοίγουν σε όλη την οθόνη, με πιο ήρεμο πίνακα (χωρίς επαναλαμβανόμενα κείμενα στα κενά πεδία) και σταθερή επικεφαλίδα. Στην 1.9: «Είσοδος διαχειριστή» με email και κωδικό του HEXIS-APP μέσα στο BoQ, και αυτόματη ανανέωση της σύνδεσης του Hub. Στην 1.8: η έκδοση φαίνεται πάντα δίπλα στο HEXIS-APP· πατώντας την βλέπετε τι άλλαξε. Στην 1.7: «📚 Προσθήκη εργασιών» στην Προμέτρηση για έργο που έχει ήδη στηθεί (βιβλιοθήκη ανά φάση, δικές σας εργασίες, νέα κτίρια) και πίνακας προμέτρησης χωρίς κρυφές στήλες — στο κινητό σε κάρτες. Στην 1.6: δίγλωσσο «Ιδιωτικό συμφωνητικό ανάθεσης έργου» (ΕΛ | EN σε δύο στήλες) με τους νομικούς όρους των συμφωνητικών σας, και επιλογή «Δίγλωσσο» σε κάθε έκθεση και σύμβαση. Στην 1.5: καρτέλα «Εκθέσεις & συμβάσεις» — μηνιαία έκθεση προόδου, πιστοποίηση εργασιών, έκθεση κόστους, πρακτικό σύσκεψης, σύμβαση κατασκευής, συμφωνητικό εργολάβου, σύμβαση επίβλεψης & διαχείρισης έργου, εντολή μεταβολής, με μητρώο εγγράφων, αναθεωρήσεις, PDF και Word· πιο σωστή αναγνώριση φάσεων και ενοτήτων στην εισαγωγή Excel. Στην 1.4: συγχρονισμός έργων μέσω του server του HEXIS-APP σε όλες τις συσκευές του κλειδιού και «👥 Κοινή χρήση» με σύνδεσμο (προβολή ή επεξεργασία) για οποιονδήποτε, χωρίς λογαριασμό. Στην 1.3: διαθέσιμο στο HEXIS-APP Hub με κλειδί άδειας (ενεργοποίηση μία φορά ανά συσκευή, λειτουργία και χωρίς ίντερνετ, AI από τον server του HEXIS-APP). Στην 1.2: «Γρήγορες απαντήσεις» (How to) — 35 γρήγορες απαντήσεις με αναζήτηση, η καθεμία με το δικό της σύντομο βίντεο. Στην 1.1: «📁 Τα έργα μου» με άνοιγμα και διαγραφή έργου (με επιβεβαίωση), αναλυτικές οδηγίες σε 11 κεφάλαια με βίντεο βήμα-βήμα. Στην 1.0: φάκελος σχεδίων ανά τύπο μελέτης, βιβλιοθήκη εργασιών πιο εμφανής στο στήσιμο, μετρητά χωριστά παντού και εισαγωγή BANK/CASH από το Excel, διαγράμματα διαχείρισης έργου (καμπύλη S/Earned Value, ταμειακές ροές, CPM, Line of Balance, ορόσημα, φόρτος εργολάβων, WBS), χρονόμετρο έργου με προτάσεις για bottleneck, εργολάβοι με καρτέλες, τρόπος τιμολόγησης και τελικές επιβαρύνσεις (ΦΠΑ, αμοιβή επίβλεψης), διορθώσεις λαθών μετά από έγκριση, έλεγχοι διπλοεγγραφών & λαθών, καρτέλες πελάτη και προμηθευτών, κοινή χρήση με συνεργάτες και ζωντανό συγχρονισμό, σύγκριση κτιρίων, μετάφραση προμέτρησης κατ’ επιλογή με τεχνική ορολογία, αποθετήριο τιμολογίων & παραγγελιών με σύνδεση σε εργασία/φάση και πληροφορίες εκκρεμοτήτων στο Gantt, οδηγός στησίματος 5 βημάτων, έξυπνη εισαγωγή BOQ από Excel (πολλά φύλλα/κτίρια), προμέτρηση με εκτελεσμένα, πληρωμές, αυτόματο Gantt με καθυστερήσεις και κρίσιμη διαδρομή, AI εξαρτήσεις, εξαγωγή PDF & Excel με λογότυπο.',

 items:'Items',buildingsL:'Buildings',phasesL:'Phases',version:'Version',whatsNew:'What’s new',wn1:'New in 1.22 — Schedule → “Risk & analysis”: risk register with 5×5 matrix and EMV (ISO 31000); completion probability by Monte Carlo — P50/P80/P90, criticality index, sensitivity (AACE 57R-09); delay analysis TIA with extension entitlement (AACE 52R-06, SCL); resource levelling per crew; schedule XML import. On each task: “start no earlier / finish no later” constraints with negative float, and duration uncertainty. In 1.21 (data safety): every change can be undone with ↶ (top right) or Ctrl+Z; automatic daily project snapshot plus snapshots before baseline / import / restore; “Change history” (who, when, what changed); deleted projects stay 30 days in the bin; input checks (zero amount, negative quantity/rate, progress above quantity, date far in the future). All in Settings → “Data safety”. New “🆘 Report a problem” button (Help / Settings): the report goes straight to support. In 1.20: next to every abbreviation (PV, EV, SPI, CPI, EAC, TCPI, SPI(t), FS/SS, float, DCMA, CPLI, BEI etc.) there is a “?” with a short explanation: what it is, why it is used, how to read it — and what your project’s value means; full glossary in Help. In 1.19 (professional PM level): FS/SS/FF/SF links with lag/lead and free float; baseline with PV from it and bars in Gantt; full Earned Value and Earned Schedule analysis (EAC ×3, TCPI, SPI(t)…); DCMA-14 schedule quality assessment; calendar with Greek public holidays; schedule export to XML; standards and sources table in Help. In 1.18: “File check” on Excel import — detects and corrects quantity × rate ≠ amount, formula errors (#REF!, #DIV/0!), progress written as 70 instead of 70%, wrong section totals, wrong VAT/fees, negative values, duplicate rows and items without a rate; fixed the detection of the fee base (it was computed on the wrong base in some files). In 1.17: the app now uses the international term “Construction PM” (Project Management); new How-to entry on the terms PM, PMIS, PPM, CPM. In 1.16: navigation grouped into 9 sections on one line (BOQ, Programme, Contracts & documents, Finance etc.); right after the BOQ is recorded the next steps open (agreement, contract, contractors, payment schedule, permit); new “Project set-up” on the Overview listing what is pending. In 1.15: more professional look (muted colours, line icons instead of emoji, flatter shapes); the app installs on computer and phone like a regular app (Settings → “Install”). In 1.14: green “✅ Progress” button at the top — shows only items running today or late, with + / − and “✓ Finished”, to record in a few minutes; the Overview reminds you if today’s progress is missing. New “📋 Agreement instalments” (Payments, Overview, contractor card): each instalment’s condition (phase completion %, phase start or signature) and how much % of works remains for release. In 1.13: new “📄 Permits” section on the Overview (number, act ref., authority, issue, expiry) with a reminder 4 months before expiry and then every month, plus “📅 Add to calendar” for a phone alarm. In 1.12: “Site set-up” removed from the library and the new-project template (where already in a project, delete it with the bin); boxes you fill in are yellow and turn green once filled; in the BOQ each item has a “👷 + Contractor” button and, once linked, tapping the name opens the contractor card (details, payments, cash, balance, phases); setup shows 4 numbered steps and items are split into “In the BOQ” and “Library”. In 1.11: on the phone each BOQ item shows “Quantity (unit)”, “Unit price €/unit” and “Total” above the fields, and the wizard steps take one line. In 1.10: the setup wizard and “Add works” open full screen, with a calmer table (no repeated text in empty fields) and a fixed header. In 1.9: “Administrator sign-in” with your HEXIS-APP email and password inside BoQ, and automatic renewal of the Hub session. In 1.8: the version is always shown next to HEXIS-APP; tap it to see what changed. In 1.7: “📚 Add works” in the BOQ for a project already set up (library per phase, your own items, new buildings) and a BOQ table without hidden columns — cards on the phone. In 1.6: bilingual “Private contracting agreement” (EL | EN in two columns) with the legal terms of your agreements, and a “Bilingual” option on every report and contract. In 1.5: “Reports & contracts” tab — monthly progress report, interim payment certificate, cost report, meeting minutes, construction contract, trade contractor agreement, supervision & PM agreement, variation order, with document register, revisions, PDF and Word; better phase and section recognition on Excel import. In 1.4: project sync through the HEXIS-APP server across all devices of the key and “👥 Share” by link (view or edit) for anyone, no account needed. In 1.3: available on the HEXIS-APP Hub with a licence key (activate once per device, works offline, AI from the HEXIS-APP server). In 1.2: “How to” — 35 quick answers with search, each with its own short video. In 1.1: “📁 My projects” with open and delete project (with confirmation), detailed guide in 11 chapters with step-by-step videos. In 1.0: drawings folder by discipline, more visible work item library in setup, cash shown separately everywhere and BANK/CASH import from Excel, project management charts (S-curve/Earned Value, cash flow, CPM, Line of Balance, milestones, contractor loading, WBS), project clock with bottleneck suggestions, contractors with ledgers, pricing basis and final charges (VAT, supervision fee), error fixes after approval, duplicate & error checks, client and supplier ledgers, sharing with colleagues and live sync, building comparison, optional BOQ translation with technical terminology, invoice & order repository linked to items/phases with pending info in the Gantt, 5-step setup wizard, smart BOQ import from Excel (several sheets/buildings), BOQ with executed quantities, payments, automatic Gantt with delays and const CAL={};
function orthEaster(y){const a=y%4,b=y%7,c=y%19,d=(19*c+15)%30,e=(2*a+4*b-d+34)%7,m=Math.floor((d+e+114)/31),day=((d+e+114)%31)+1;return new Date(y,m-1,day+13)}
const HOLC={};function grHol(y){if(HOLC[y])return HOLC[y];const E=orthEaster(y);const f=(m,d)=>new Date(y,m-1,d);const off=n=>new Date(E.getFullYear(),E.getMonth(),E.getDate()+n);
 const L=[f(1,1),f(1,6),off(-48),f(3,25),off(-2),off(1),f(5,1),off(50),f(8,15),f(10,28),f(12,25),f(12,26)];return HOLC[y]=new Set(L.map(d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()))}
const isHol=d=>grHol(d.getFullYear()).has(d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate());
const wdP=(d,p)=>wdOk(d,+p.wd)&&!(p.hol&&isHol(d));
function wdOk(d,wd){const g=d.getDay();if(wd>=7)return true;if(wd==6)return g!==0;return g!==0&&g!==6}
function offToDate(p,off){off=Math.max(0,Math.floor(off));const key=p.start+'|'+p.wd+'|'+(p.hol?1:0);let cal=CAL[key];if(!cal){cal=CAL[key]=[];let d=parseD(p.start);while(!wdP(d,p))d=addDays(d,1);cal.push(d.getTime())}
 while(cal.length<=off){let d=new Date(cal[cal.length-1]);do{d=addDays(d,1)}while(!wdP(d,p));cal.push(d.getTime())}return new Date(cal[off])}
function dateToOff(p,date){const s=parseD(p.start);if(date<s)return -Math.round((s-date)/864e5);let i=0;while(i<40000&&offToDate(p,i)<date)i++;return i}
function pctOf(t){const q=+t.qty||0;if(q>0)return clamp((+t.done||0)/q,0,1);return clamp((+t.pctM||0)/100,0,1)}
function schedule(p){
 const tasks=p.tasks,byId=new Map(tasks.map(x=>[x.id,x]));
 const grp={};tasks.forEach(x=>{const k=x.b+'|'+x.ph;(grp[k]=grp[k]||[]).push(x)});
 const memo={};
 const phPred=(b,ph)=>{const key=b+'|'+ph;if(memo[key])return memo[key];let out=[];const seen=new Set();const walk=q=>{(PHM[q]?.pre||[]).forEach(r=>{if(seen.has(r))return;seen.add(r);const g=grp[b+'|'+r];if(g&&g.length)out=out.concat(g);else walk(r)})};walk(ph);return memo[key]=out};
 const preds=new Map();
 tasks.forEach(x=>{let d=x.noDep?[]:Array.isArray(x.deps)&&x.deps.length?x.deps.map(id=>byId.get(id)).filter(y=>y&&y!==x):phPred(x.b,x.ph);preds.set(x.id,d.slice())});
 const order=[],state={};
 const visit=x=>{if(state[x.id]===2)return false;if(state[x.id]===1)return true;state[x.id]=1;const ps=preds.get(x.id);for(let i=ps.length-1;i>=0;i--){if(visit(ps[i]))ps.splice(i,1)}state[x.id]=2;order.push(x);return false};
 tasks.forEach(x=>visit(x));
 const lagB={};p.buildings.forEach(b=>lagB[b.id]=Math.max(0,Math.round(+b.lag||0)));
 const CO={};const cOff=d=>CO[d]!=null?CO[d]:(CO[d]=dateToOff(p,parseD(d)));
 const S={};const rl=(x,q)=>{const r=(x.rel&&x.rel[q.id])||{};return {t:['FS','SS','FF','SF'].includes(r.t)?r.t:'FS',l:Math.round(+r.l||0)+Math.max(0,Math.round(+x.lag||0))}};
 order.forEach(x=>{const d=Math.max(0,Math.round(+x.dur||0));let es=lagB[x.b]||0;const ps=preds.get(x.id);if(!ps.length)es+=Math.max(0,Math.round(+x.lag||0));
  ps.forEach(q=>{const r=rl(x,q),P=S[q.id];const v=r.t==='FS'?P.ef+r.l:r.t==='SS'?P.es+r.l:r.t==='FF'?P.ef+r.l-d:P.es+r.l-d;es=Math.max(es,v)});if(x.cons&&x.cons.d&&x.cons.t==='SNET')es=Math.max(es,cOff(x.cons.d));S[x.id]={es,ef:es+d,dur:d}});
 let end=0;order.forEach(x=>{end=Math.max(end,S[x.id].ef)});
 const succ=new Map(tasks.map(x=>[x.id,[]]));tasks.forEach(x=>preds.get(x.id).forEach(q=>succ.get(q.id).push(x)));
 for(let i=order.length-1;i>=0;i--){const x=order[i];const s=S[x.id];let lf=end,ff=end-s.ef;succ.get(x.id).forEach(y=>{const r=rl(y,x),Y=S[y.id];
   const c=r.t==='FS'?Y.ls-r.l:r.t==='SS'?Y.ls-r.l+s.dur:r.t==='FF'?Y.lf-r.l:Y.lf-r.l+s.dur;lf=Math.min(lf,c);
   const f=r.t==='FS'?Y.es-r.l-s.ef:r.t==='SS'?Y.es-r.l-s.es:r.t==='FF'?Y.ef-r.l-s.ef:Y.ef-r.l-s.es;ff=Math.min(ff,f)});
  if(x.cons&&x.cons.d&&x.cons.t==='FNLT')lf=Math.min(lf,cOff(x.cons.d)+1);s.lf=lf;s.ls=lf-s.dur;s.fl=s.ls-s.es;s.ffl=Math.max(0,Math.min(ff,s.fl))}
 const tOff=dateToOff(p,today0());
 let projDelay=0;
 tasks.forEach(x=>{const s=S[x.id];const pc=pctOf(x);s.pct=pc;s.delay=pc>=0.999?0:Math.max(0,Math.ceil(tOff-(s.es+pc*s.dur)-1e-9));s.crit=s.fl<=0&&s.dur>0;s.status=pc>=0.999?'done':s.delay>0?'late':pc>0?'run':'wait';
  s.start=offToDate(p,s.es);s.finish=offToDate(p,Math.max(s.es,s.ef-1));s.fcFinish=offToDate(p,Math.max(s.es,s.ef-1)+s.delay);projDelay=Math.max(projDelay,s.delay-Math.max(0,s.fl))});

}
function calc(p){
 const sc=schedule(p);let cv=0,ev=0;
 p.tasks.forEach(x=>{const v=(+x.qty||0)*(+x.price||0);cv+=v;ev+=v*sc.S[x.id].pct});
 let pr;if(cv>0)pr=ev/cv;else{let a=0,b=0;p.tasks.forEach(x=>{const d=Math.max(1,sc.S[x.id].dur);a+=d*sc.S[x.id].pct;b+=d});pr=b?a/b:0}
 ensureP(p);const k=costSummary({charges:p.charges.filter(c=>c.type!=='fix')},1).total;const fxTot=costSummary(p,cv).total-cv*k;const gross=v=>v*k+(cv>0?fxTot*v/cv:0);
 const rin=p.pays.filter(x=>x.type==='in').reduce((a,x)=>a+(+x.amount||0),0);
 const rout=p.pays.filter(x=>x.type==='out').reduce((a,x)=>a+(+x.amount||0),0);
 const startDate=parseD(p.start);const endDate=sc.end>0?offToDate(p,sc.end-1):startDate;const fcDate=sc.end>0?offToDate(p,sc.end-1+sc.projDelay):startDate;
 const timeP=sc.end>0?clamp(sc.tOff/sc.end,0,1):0;
 return Object.assign(sc,{cv,ev,pr,k,gross,cvG:gross(cv),evG:gross(ev),rin,rout,startDate,endDate,fcDate,timeP});
}
function aggr(R,ts){let v=0,vd=0,dd=0,dw=0,es=Infinity,ef=0,del=0,crit=false;ts.forEach(x=>{const s=R.S[x.id];const val=(+x.qty||0)*(+x.price||0);v+=val;vd+=val*s.pct;dd+=Math.max(1,s.dur)*s.pct;dw+=Math.max(1,s.dur);es=Math.min(es,s.es);ef=Math.max(ef,s.ef);del=Math.max(del,s.delay);if(s.crit)crit=true});return {v,vd,pct:v>0?vd/v:(dw?dd/dw:0),es:es===Infinity?0:es,ef,del,crit}}

function evm(p,R){const S=evSeries(p,R);const BAC=p.bl?p.bl.cv:R.cv,EV=R.ev,PV=S.pvToday,AC=S.acNow;
 const CPI=AC>0?EV/AC:null,SPI=PV>0?EV/PV:null,CV=EV-AC,SV=EV-PV;

 const root=doc.documentElement;const nm=g(root,'Name')||g(root,'Title')||'XML';const st=(g(root,'StartDate')||'').slice(0,10);
 const tasksEl=[...root.getElementsByTagName('*')].filter(e=>e.localName==='Task'&&e.parentElement&&e.parentElement.localName==='Tasks');
 const T=tasksEl.map(e=>({uid:g(e,'UID'),name:g(e,'Name'),lvl:+g(e,'OutlineLevel')||1,sum:g(e,'Summary')==='1',dur:durD(g(e,'Duration')),pct:+g(e,'PercentComplete')||0,cost:+g(e,'Cost')||0,wbs:g(e,'WBS'),start:g(e,'Start').slice(0,10),ct:+g(e,'ConstraintType')||0,cd:g(e,'ConstraintDate').slice(0,10),
  links:[...e.children].filter(z=>z.localName==='PredecessorLink').map(l=>({u:g(l,'PredecessorUID'),t:['FF','FS','SF','SS'][+g(l,'Type')]||'FS',l:Math.round((+g(l,'LinkLag')||0)/4800)}))})).filter(x=>x.name&&x.uid!=='0');
 const wds=[...root.getElementsByTagName('*')].filter(e=>e.localName==='WeekDay');const dw=d=>{const w=wds.find(e=>g(e,'DayType')===String(d));return w?g(w,'DayWorking')==='1':null};const sat=dw(7),sun=dw(1);const wd=sun?7:sat?6:5;const hol=wds.some(e=>g(e,'DayType')==='0'&&g(e,'DayWorking')==='0');

SENS:{a:'Tornado',n:['Sensitivity (duration correlation)','Ευαισθησία'],w:['Συντελεστής συσχέτισης (−1…1) ανάμεσα στη διάρκεια κάθε εργασίας και στην ημερομηνία περάτωσης, στα σενάρια της προσομοίωσης.','Correlation coefficient (−1…1) between each task’s duration and the completion date across the simulated scenarios.'],y:['Δείχνει πού αξίζει να επενδύσετε: περισσότερα συνεργεία, καλύτερη προετοιμασία, στενότερη παρακολούθηση.','Shows where to invest: more crews, better preparation, closer monitoring.'],r:['Κοντά στο 1: η εργασία «οδηγεί» την περάτωση. Κοντά στο 0: δεν την επηρεάζει.','Close to 1: the task “drives” completion. Close to 0: no effect.']},
RISK:{a:'P × I',n:['Risk score (probability × impact)','Βαθμός κινδύνου'],w:['Κάθε κίνδυνος βαθμολογείται 1–5 σε πιθανότητα και 1–5 σε επίπτωση· το γινόμενο (1–25) τον κατατάσσει στον πίνακα 5×5.','Each risk is rated 1–5 for probability and 1–5 for impact; the product (1–25) places it on the 5×5 matrix.'],y:['Ιεραρχεί πού θα δοθεί προσοχή και πόροι, κατά ISO 31000:2018 και PMBOK® 7 (Uncertainty domain).','Prioritises attention and resources, per ISO 31000:2018 and PMBOK® 7 (Uncertainty domain).'],r:['15–25 άμεση δράση, 10–14 σχέδιο αντιμετώπισης με υπεύθυνο, 5–9 παρακολούθηση, 1–4 αποδοχή.','15–25 act now, 10–14 response plan with owner, 5–9 monitor, 1–4 accept.']},
EMV:{a:'EMV',n:['Expected Monetary Value','Αναμενόμενη χρηματική αξία'],w:['Σ (πιθανότητα × οικονομική επίπτωση) των ανοιχτών κινδύνων.','Σ (probability × cost impact) of open risks.'],y:['Υπολογίζει ένα τεκμηριωμένο αποθεματικό απροβλέπτων.','Sizes a justified contingency reserve.'],r:['Συγκρίνεται με το κονδύλι απροβλέπτων του προϋπολογισμού.','Compare with the contingency line of the budget.']},
TIA:{a:'TIA',n:['Time Impact Analysis','Ανάλυση χρονικής επίπτωσης'],w:['Κάθε γεγονός καθυστέρησης μοντελοποιείται ως πρόσθετη δραστηριότητα (fragnet) στο τρέχον πρόγραμμα και μετριέται πόσο μετακινείται η περάτωση.','Each delay event is modelled as an extra activity (fragnet) in the current programme and the shift in completion is measured.'],y:['Είναι η μέθοδος που προτείνουν AACE RP 52R-06 και SCL Protocol 2017 για αιτήματα παράτασης κατά την εκτέλεση.','It is the method recommended by AACE RP 52R-06 and the SCL Protocol 2017 for extension requests during execution.'],r:['Αν η εργασία έχει περιθώριο μεγαλύτερο από την καθυστέρηση, η περάτωση δεν μετακινείται — δεν υπάρχει δικαίωμα παράτασης.','If the task’s float exceeds the delay, completion does not move — no extension entitlement.']},
EOT:{a:'EOT',n:['Extension of Time','Παράταση προθεσμίας'],w:['Οι εργάσιμες κατά τις οποίες μετακινείται η περάτωση από γεγονότα που δεν βαρύνουν τον ανάδοχο.','Workdays by which completion moves due to events not at the contractor’s risk.'],y:['Βάση για αίτημα παράτασης (π.χ. FIDIC 2017 όρος 8.5) και αποφυγή ποινικών ρητρών.','Basis for an extension request (e.g. FIDIC 2017 clause 8.5) and to avoid delay damages.'],r:['«Με αποζημίωση» μόνο για γεγονότα ευθύνης εργοδότη· τα ουδέτερα δίνουν χρόνο χωρίς χρήμα.','“With compensation” only for employer events; neutral events give time without money.']},
LVL:{a:'Levelling',n:['Resource levelling','Εξομάλυνση πόρων'],w:['Αναδιάταξη εργασιών ώστε κανένας εργολάβος να μην έχει ταυτόχρονα περισσότερες εργασίες από τα συνεργεία του.','Re-sequencing tasks so no contractor has more concurrent tasks than its crews.'],y:['Ένα πρόγραμμα που απαιτεί ανύπαρκτα συνεργεία δεν θα τηρηθεί.','A programme that needs crews that do not exist will not be met.'],r:['Αν η περάτωση μετακινείται, χρειάζεται επιπλέον συνεργείο ή αλλαγή σειράς εργασιών.','If completion moves, an extra crew or a different sequence is needed.']},
XMLI:{a:'XML',n:['Project data interchange (XML)','Ανταλλαγή δεδομένων έργου'],w:['Ανοιχτό σχήμα XML για χρονοπρογράμματα που διαβάζουν και γράφουν τα περισσότερα προγράμματα χρονοπρογραμματισμού.','Open XML schema for schedules that most scheduling programs read and write.'],y:['Επιτρέπει να φέρετε ένα υπάρχον πρόγραμμα χωρίς να το ξαναγράψετε.','Lets you bring in an existing programme without retyping it.'],r:['Μετά την εισαγωγή: έλεγχος DCMA-14 για την ποιότητα του προγράμματος.','After import: run the DCMA-14 check for programme quality.']},
PV:{a:'PV',n:['Planned Value','Προγραμματισμένη αξία'],w:['Η αξία (σε €) των εργασιών που, σύμφωνα με το πρόγραμμα, έπρεπε να έχουν εκτελεστεί μέχρι σήμερα. Αν υπάρχει baseline, υπολογίζεται από αυτή.','The value (in €) of the work that, according to the programme, should have been done by today. If a baseline exists, it is computed from it.'],y:['Είναι το μέτρο σύγκρισης: χωρίς PV δεν ξέρουμε αν είμαστε μπροστά ή πίσω.','It is the yardstick: without PV we cannot tell whether we are ahead or behind.'],r:['Συγκρίνεται με την EV. EV μεγαλύτερη από PV = έχουμε εκτελέσει περισσότερα από όσα προβλέπονταν.','Compare with EV. EV greater than PV = more work done than planned.']},
EV:{a:'EV',n:['Earned Value','Αξία εκτελεσμένου έργου'],w:['Η αξία όσων εργασιών έχουν πραγματικά γίνει, με τις τιμές της προμέτρησης: Σ ποσότητα × τιμή × % εκτέλεσης.','The value of the work actually done, at BOQ rates: Σ quantity × rate × % complete.'],y:['Μετρά την πρόοδο σε € — έτσι συγκρίνεται με το πρόγραμμα (PV) και με το κόστος (AC).','It measures progress in € so it can be compared with the plan (PV) and the cost (AC).'],r:['Όσο πλησιάζει τον BAC, τόσο πλησιάζει η ολοκλήρωση. EV / BAC = φυσική πρόοδος.','The closer to BAC, the closer to completion. EV / BAC = physical progress.']},
AC:{a:'AC',n:['Actual Cost','Πραγματικό κόστος'],w:['Ό,τι έχει πραγματικά πληρωθεί για τις εργασίες έως σήμερα (πληρωμές σε εργολάβους και προμηθευτές).','What has actually been paid for the work to date (payments to contractors and suppliers).'],y:['Δείχνει αν η εργασία που έγινε κόστισε όσο έπρεπε.','Shows whether the work done cost what it should.'],r:['AC μεγαλύτερο από EV = πληρώσαμε περισσότερα από όσα «αξίζει» η εργασία που έγινε (υπέρβαση).','AC greater than EV = we paid more than the work done is worth (overrun).']},
SV:{a:'SV',n:['Schedule Variance','Απόκλιση χρονοπρογράμματος'],w:['SV = EV − PV, σε €.','SV = EV − PV, in €.'],y:['Λέει σε χρήματα πόσο μπροστά ή πίσω είμαστε από το πρόγραμμα.','Tells in money how far ahead or behind the programme we are.'],r:['Θετική = μπροστά. Αρνητική = πίσω. Μηδέν = όπως το πρόγραμμα.','Positive = ahead. Negative = behind. Zero = on programme.'],x:v=>v>=0?['Είστε μπροστά κατά '+money(v)+' εργασιών.','You are ahead by '+money(v)+' of work.']:['Είστε πίσω κατά '+money(-v)+' εργασιών.','You are behind by '+money(-v)+' of work.']},
CV:{a:'CV',n:['Cost Variance','Απόκλιση κόστους'],w:['CV = EV − AC, σε €.','CV = EV − AC, in €.'],y:['Δείχνει αν το έργο κερδίζει ή χάνει χρήματα μέχρι τώρα.','Shows whether the project is gaining or losing money so far.'],r:['Θετική = οικονομία. Αρνητική = υπέρβαση κόστους.','Positive = saving. Negative = cost overrun.'],x:v=>v>=0?['Οικονομία '+money(v)+' μέχρι σήμερα.','Saving of '+money(v)+' to date.']:['Υπέρβαση '+money(-v)+' μέχρι σήμερα.','Overrun of '+money(-v)+' to date.']},
SPI:{a:'SPI',n:['Schedule Performance Index','Δείκτης απόδοσης χρόνου'],w:['SPI = EV / PV.','SPI = EV / PV.'],y:['Δείχνει με έναν αριθμό αν η εκτέλεση τρέχει γρηγορότερα ή αργότερα από το πρόγραμμα.','One number that shows whether execution runs faster or slower than planned.'],r:['1,00 = ακριβώς στο πρόγραμμα. 1,10 = 10% γρηγορότερα. 0,90 = 10% αργότερα. Κάτω από 0,90 χρειάζεται ενέργεια.','1.00 = exactly on programme. 1.10 = 10% faster. 0.90 = 10% slower. Below 0.90 action is needed.'],x:v=>v>=1?['Η εκτέλεση είναι '+fnum((v-1)*100,0)+'% γρηγορότερη από το πρόγραμμα.','Execution is '+fnum((v-1)*100,0)+'% faster than planned.']:['Η εκτέλεση είναι '+fnum((1-v)*100,0)+'% αργότερη από το πρόγραμμα.','Execution is '+fnum((1-v)*100,0)+'% slower than planned.']},
CPI:{a:'CPI',n:['Cost Performance Index','Δείκτης απόδοσης κόστους'],w:['CPI = EV / AC.','CPI = EV / AC.'],y:['Δείχνει πόση εργασία «παίρνουμε» για κάθε 1 € που πληρώνουμε.','Shows how much work we “get” for every €1 we pay.'],r:['1,00 = όπως ο προϋπολογισμός. 1,05 = κάθε 1 € αποδίδει 1,05 € εργασίας (οικονομία). Κάτω από 1 = υπέρβαση.','1.00 = on budget. 1.05 = every €1 yields €1.05 of work (saving). Below 1 = overrun.'],x:v=>v>=1?['Κάθε 1 € που πληρώνεται αποδίδει '+fnum(v,2)+' € εργασίας.','Every €1 paid yields €'+fnum(v,2)+' of work.']:['Κάθε 1 € αποδίδει μόνο '+fnum(v,2)+' € εργασίας — υπέρβαση.','Every €1 yields only €'+fnum(v,2)+' of work — overrun.']},
BAC:{a:'BAC',n:['Budget at Completion','Προϋπολογισμός ολοκλήρωσης'],w:['Ο συνολικός εγκεκριμένος προϋπολογισμός εργασιών (από τη baseline ή την προμέτρηση).','The total approved works budget (from the baseline or the BOQ).'],y:['Είναι το «τέρμα» με το οποίο συγκρίνονται όλες οι προβλέψεις.','It is the “finish line” all forecasts are compared with.'],r:['Δεν αλλάζει χωρίς εγκεκριμένη μεταβολή.','It does not change without an approved change.']},
EAC:{a:'EAC',n:['Estimate at Completion','Εκτίμηση τελικού κόστους'],w:['Πόσο εκτιμάται ότι θα κοστίσει τελικά το έργο. Τρεις μέθοδοι: BAC / CPI (αν συνεχίσει η ίδια απόδοση), AC + (BAC − EV) (αν το υπόλοιπο γίνει με τις αρχικές τιμές), AC + (BAC − EV) / (CPI × SPI) (αν επηρεάζουν και κόστος και χρόνος).','The estimated final cost. Three methods: BAC / CPI (same performance continues), AC + (BAC − EV) (remaining work at budget), AC + (BAC − EV) / (CPI × SPI) (cost and time both matter).'],y:['Δίνει έγκαιρα εικόνα για το τελικό κόστος, ώστε να παρθούν αποφάσεις πριν είναι αργά.','Gives an early view of the final cost so decisions are taken in time.'],r:['EAC μικρότερο από BAC = τελειώνουμε κάτω από τον προϋπολογισμό. Το εύρος των 3 μεθόδων δείχνει την αβεβαιότητα.','EAC below BAC = finishing under budget. The spread of the 3 methods shows the uncertainty.']},
ETC:{a:'ETC',n:['Estimate to Complete','Κόστος για ολοκλήρωση'],w:['ETC = EAC − AC: πόσα χρήματα χρειάζονται ακόμη.','ETC = EAC − AC: how much money is still needed.'],y:['Χρήσιμο για τον ταμειακό προγραμματισμό.','Useful for cash planning.'],r:['Συγκρίνεται με τα διαθέσιμα κεφάλαια και τις εισπράξεις που απομένουν.','Compare with available funds and remaining receipts.']},
VAC:{a:'VAC',n:['Variance at Completion','Απόκλιση στην ολοκλήρωση'],w:['VAC = BAC − EAC.','VAC = BAC − EAC.'],y:['Λέει από τώρα αν το έργο θα κλείσει με οικονομία ή υπέρβαση.','Tells now whether the project will close with a saving or an overrun.'],r:['Θετική = οικονομία στο τέλος. Αρνητική = υπέρβαση στο τέλος.','Positive = saving at the end. Negative = overrun at the end.'],x:v=>v>=0?['Πρόβλεψη οικονομίας '+money(v)+' στο τέλος.','Forecast saving of '+money(v)+' at completion.']:['Πρόβλεψη υπέρβασης '+money(-v)+' στο τέλος.','Forecast overrun of '+money(-v)+' at completion.']},
TCPI:{a:'TCPI',n:['To-Complete Performance Index','Απαιτούμενη απόδοση'],w:['TCPI = (BAC − EV) / (BAC − AC): η απόδοση κόστους που χρειάζεται από εδώ και πέρα για να μείνει το έργο στον BAC.','TCPI = (BAC − EV) / (BAC − AC): the cost performance needed from now on to stay within BAC.'],y:['Δείχνει αν ο στόχος του προϋπολογισμού είναι ρεαλιστικός.','Shows whether the budget target is realistic.'],r:['Κάτω από 1 = εύκολο. Γύρω στο 1 = εφικτό. Πάνω από 1,10 = πολύ δύσκολο — αναθεωρήστε τον προϋπολογισμό.','Below 1 = easy. Around 1 = achievable. Above 1.10 = very hard — revise the budget.'],x:v=>v<=1?['Ο προϋπολογισμός τηρείται άνετα.','The budget is comfortably achievable.']:v<=1.1?['Χρειάζεται απόδοση '+fnum(v,2)+' — εφικτό με προσοχή.','Performance of '+fnum(v,2)+' needed — achievable with care.']:['Χρειάζεται απόδοση '+fnum(v,2)+' — ο προϋπολογισμός δύσκολα τηρείται.','Performance of '+fnum(v,2)+' needed — the budget is hard to meet.']},
ES:{a:'ES',n:['Earned Schedule','Κερδισμένος χρόνος'],w:['Σε ποια ημέρα του προγράμματος αντιστοιχεί η εργασία που έχει γίνει. Π.χ. ES = 78 σημαίνει ότι έχουμε κάνει όσα έπρεπε να είχαμε κάνει στην 78η εργάσιμη.','Which programme day the work done corresponds to. E.g. ES = 78 means we have done what was due by working day 78.'],y:['Μετρά την απόκλιση σε ημέρες, όχι σε €.','Measures the deviation in days, not €.'],r:['Συγκρίνεται με τον πραγματικό χρόνο AT.','Compare with the actual time AT.']},
AT:{a:'AT',n:['Actual Time','Πραγματικός χρόνος'],w:['Οι εργάσιμες ημέρες που πέρασαν από την έναρξη μέχρι σήμερα.','Working days elapsed from the start to today.'],y:['Βάση για τους δείκτες χρόνου SPI(t) και SV(t).','Basis for the time indices SPI(t) and SV(t).'],r:['ES μεγαλύτερο από AT = μπροστά.','ES greater than AT = ahead.']},
SPIt:{a:'SPI(t)',n:['Schedule Performance Index (time)','Δείκτης χρόνου σε ημέρες'],w:['SPI(t) = ES / AT.','SPI(t) = ES / AT.'],y:['Όπως το SPI, αλλά σε χρόνο. Είναι αξιόπιστο μέχρι το τέλος — το απλό SPI τείνει πάντα στο 1 κοντά στην ολοκλήρωση, ακόμη κι αν το έργο αργεί.','Like SPI but in time. Reliable to the end — plain SPI always tends to 1 near completion even if the project is late.'],r:['1 = στο πρόγραμμα, πάνω από 1 = μπροστά, κάτω από 1 = πίσω.','1 = on programme, above 1 = ahead, below 1 = behind.'],x:v=>v>=1?['Μπροστά στον χρόνο κατά '+fnum((v-1)*100,0)+'%.','Ahead in time by '+fnum((v-1)*100,0)+'%.']:['Πίσω στον χρόνο κατά '+fnum((1-v)*100,0)+'%.','Behind in time by '+fnum((1-v)*100,0)+'%.']},
SVt:{a:'SV(t)',n:['Schedule Variance (time)','Απόκλιση χρόνου'],w:['SV(t) = ES − AT, σε εργάσιμες ημέρες.','SV(t) = ES − AT, in working days.'],y:['Λέει απευθείας «πόσες μέρες μπροστά ή πίσω».','Says directly “how many days ahead or behind”.'],r:['Θετική = μπροστά, αρνητική = πίσω.','Positive = ahead, negative = behind.'],x:v=>v>=0?['Μπροστά κατά '+fnum(v,1)+' εργάσιμες.','Ahead by '+fnum(v,1)+' working days.']:['Πίσω κατά '+fnum(-v,1)+' εργάσιμες.','Behind by '+fnum(-v,1)+' working days.']},
IEACt:{a:'IEAC(t)',n:['Independent Estimate at Completion (time)','Εκτιμώμενη συνολική διάρκεια'],w:['Προγραμματισμένη διάρκεια / SPI(t).','Planned duration / SPI(t).'],y:['Προβλέπει πότε θα τελειώσει πραγματικά το έργο με τον σημερινό ρυθμό.','Forecasts when the project will really finish at today’s pace.'],r:['Μικρότερη από την προγραμματισμένη = νωρίτερη αποπεράτωση.','Shorter than planned = earlier completion.']},
CPM:{a:'CPM',n:['Critical Path Method','Μέθοδος κρίσιμης διαδρομής'],w:['Η μέθοδος που υπολογίζει νωρίτερες και αργότερες ημερομηνίες κάθε εργασίας από τις διάρκειες και τις σχέσεις τους (forward / backward pass).','The method that computes the earliest and latest dates of every item from durations and links (forward / backward pass).'],y:['Βρίσκει ποιες εργασίες καθορίζουν τη λήξη και πόσο περιθώριο έχουν οι υπόλοιπες.','Finds which items drive the finish and how much float the rest have.'],r:['Τα αποτελέσματα είναι το Gantt, η κρίσιμη διαδρομή και τα περιθώρια.','Its results are the Gantt, the critical path and the floats.']},
CP:{a:'CP',n:['Critical Path','Κρίσιμη διαδρομή'],w:['Η αλυσίδα εργασιών χωρίς περιθώριο. Είναι η μεγαλύτερη διαδρομή του έργου.','The chain of items with no float — the longest path through the project.'],y:['Κάθε ημέρα καθυστέρησης σε αυτές καθυστερεί όλο το έργο.','Every day of delay on them delays the whole project.'],r:['Στο Gantt έχουν κόκκινο περίγραμμα. Εκεί εστιάζει καθημερινά ο PM.','In the Gantt they have a red outline. The PM focuses there daily.']},
TF:{a:'TF',n:['Total Float','Συνολικό περιθώριο'],w:['Πόσες εργάσιμες μπορεί να καθυστερήσει μια εργασία χωρίς να καθυστερήσει η λήξη του έργου.','How many working days an item can slip without delaying the project finish.'],y:['Δείχνει πού υπάρχει ευελιξία για μετακίνηση συνεργείων.','Shows where there is flexibility to move crews.'],r:['0 = κρίσιμη. Αρνητικό = ήδη καθυστερεί το έργο. Πολύ μεγάλο (πάνω από 44 εργάσιμες) = πιθανώς λείπει σύνδεση.','0 = critical. Negative = already delaying the project. Very large (over 44 working days) = a link is probably missing.']},
FFL:{a:'FF',n:['Free Float','Ελεύθερο περιθώριο'],w:['Πόσες εργάσιμες μπορεί να καθυστερήσει μια εργασία χωρίς να επηρεάσει την επόμενη εργασία.','How many working days an item can slip without affecting the next item.'],y:['Δείχνει τι μπορεί να μετακινηθεί χωρίς να ενοχληθεί κανένας άλλος εργολάβος.','Shows what can move without disturbing any other contractor.'],r:['Είναι πάντα μικρότερο ή ίσο με το συνολικό περιθώριο.','It is always less than or equal to total float.']},
REL:{a:'FS · SS · FF · SF',n:['Relationship types','Τύποι σχέσεων'],w:['FS (Τέλος → Έναρξη): η επόμενη αρχίζει όταν τελειώσει η προηγούμενη. SS (Έναρξη → Έναρξη): αρχίζει όταν αρχίσει η προηγούμενη. FF (Τέλος → Τέλος): τελειώνει όταν τελειώσει η προηγούμενη. SF (Έναρξη → Τέλος): τελειώνει όταν αρχίσει η προηγούμενη (σπάνιο).','FS (Finish → Start): the next starts when the previous finishes. SS (Start → Start): it starts when the previous starts. FF (Finish → Finish): it finishes when the previous finishes. SF (Start → Finish): it finishes when the previous starts (rare).'],y:['Περιγράφουν ρεαλιστικά την επικάλυψη συνεργείων, π.χ. τα επιχρίσματα ξεκινούν (SS) λίγες μέρες μετά την τοιχοποιία.','They describe crew overlap realistically, e.g. plastering starts (SS) a few days after masonry.'],r:['Κατά DCMA τουλάχιστον το 90% των σχέσεων πρέπει να είναι FS.','Per DCMA at least 90% of links should be FS.']},
LAG:{a:'Lag / Lead',n:['Lag / Lead','Αναμονή / επικάλυψη'],w:['Lag: εργάσιμες αναμονής πάνω σε μια σχέση (π.χ. 7 ημέρες ωρίμανσης σκυροδέματος). Lead: αρνητικό lag, δηλαδή επικάλυψη.','Lag: waiting working days on a link (e.g. 7 days concrete curing). Lead: negative lag, i.e. overlap.'],y:['Αποδίδουν αναμονές και επικαλύψεις χωρίς ψεύτικες εργασίες.','They model waits and overlaps without dummy items.'],r:['Κατά DCMA: leads 0%, lags έως 5% των σχέσεων.','Per DCMA: leads 0%, lags up to 5% of links.']},
BL:{a:'Baseline (PMB)',n:['Performance Measurement Baseline','Γραμμή βάσης'],w:['Το εγκεκριμένο πρόγραμμα και κόστος, «παγωμένο» σε μια ημερομηνία.','The approved programme and cost, “frozen” at a date.'],y:['Χωρίς baseline το πρόγραμμα αλλάζει συνέχεια και δεν φαίνεται η πραγματική απόκλιση. Είναι και τεκμήριο σε διαφορές για καθυστερήσεις.','Without a baseline the programme keeps changing and the real deviation is hidden. It is also evidence in delay disputes.'],r:['Οι γκρι μπάρες στο Gantt είναι η baseline. Ενημερώνεται μόνο μετά από εγκεκριμένη μεταβολή.','The grey bars in the Gantt are the baseline. It is updated only after an approved change.']},
WBS:{a:'WBS',n:['Work Breakdown Structure','Ανάλυση εργασιών'],w:['Η ιεραρχική διάσπαση του έργου: Έργο → Κτίριο → Φάση → Άρθρο.','The hierarchical breakdown of the project: Project → Building → Phase → Item.'],y:['Εξασφαλίζει ότι τίποτα δεν λείπει και ότι κόστος και χρόνος παρακολουθούνται στο ίδιο επίπεδο.','Ensures nothing is missing and that cost and time are tracked at the same level.'],r:['Κάθε επίπεδο δείχνει αξία και πρόοδο.','Each level shows value and progress.']},
DCMA:{a:'DCMA-14',n:['DCMA 14-Point Assessment','Έλεγχος ποιότητας χρονοπρογράμματος'],w:['14 κριτήρια με όρια, που ελέγχουν αν το χρονοπρόγραμμα είναι σωστά δομημένο (συνδέσεις, περιθώρια, διάρκειες, πόροι, κρίσιμη διαδρομή).','14 criteria with thresholds that check whether the programme is properly built (links, float, durations, resources, critical path).'],y:['Ένα κακοδομημένο πρόγραμμα δίνει λάθος ημερομηνίες και λάθος κρίσιμη διαδρομή — άρα λάθος αποφάσεις.','A badly built programme gives wrong dates and a wrong critical path — hence wrong decisions.'],r:['Όσα περισσότερα «Εντός», τόσο πιο αξιόπιστο το πρόγραμμα. Κάθε «Εκτός» δείχνει τι να διορθωθεί.','The more “Pass”, the more reliable the programme. Each “Fail” shows what to fix.']},
CPLI:{a:'CPLI',n:['Critical Path Length Index','Δείκτης κρίσιμης διαδρομής'],w:['(Υπόλοιπο μήκος κρίσιμης διαδρομής + περιθώριο) / υπόλοιπο μήκος.','(Remaining critical path length + float) / remaining length.'],y:['Δείχνει πόσο ρεαλιστική είναι η ημερομηνία λήξης.','Shows how realistic the finish date is.'],r:['1 ή περισσότερο = εφικτή. Κάτω από 0,95 = η λήξη κινδυνεύει.','1 or more = achievable. Below 0.95 = the finish date is at risk.']},
BEI:{a:'BEI',n:['Baseline Execution Index','Δείκτης εκτέλεσης baseline'],w:['Εργασίες που ολοκληρώθηκαν / εργασίες που έπρεπε να έχουν ολοκληρωθεί σύμφωνα με τη baseline.','Items completed / items due by the baseline.'],y:['Μετρά πόσο πιστά εκτελείται το εγκεκριμένο πρόγραμμα.','Measures how faithfully the approved programme is executed.'],r:['0,95 ή περισσότερο = καλή εκτέλεση.','0.95 or more = good execution.']},
SCURVE:{a:'S-curve',n:['S-curve','Καμπύλη S'],w:['Η σωρευτική αξία στον χρόνο: προγραμματισμένη (PV), εκτελεσμένη (EV) και πραγματικό κόστος (AC). Έχει σχήμα S γιατί τα έργα αρχίζουν αργά, επιταχύνουν στη μέση και επιβραδύνουν στο τέλος.','Cumulative value over time: planned (PV), earned (EV) and actual cost (AC). It is S-shaped because projects start slowly, speed up mid-way and slow at the end.'],y:['Με μια ματιά δείχνει πρόοδο και κόστος έναντι του σχεδίου.','At a glance it shows progress and cost against the plan.'],r:['Μπλε (EV) πάνω από γκρι (PV) = μπροστά. Πορτοκαλί (AC) πάνω από μπλε = υπέρβαση κόστους.','Blue (EV) above grey (PV) = ahead. Orange (AC) above blue = cost overrun.']},
CASH:{a:'Cash flow',n:['Cash flow','Ταμειακές ροές'],w:['Εισπράξεις και πληρωμές στον χρόνο και το ταμειακό υπόλοιπο.','Receipts and payments over time and the cash balance.'],y:['Προλαμβάνει ταμειακά κενά.','Prevents cash gaps.'],r:['Αρνητικό υπόλοιπο = χρηματοδοτείτε το έργο από δικά σας κεφάλαια.','Negative balance = you are financing the project with your own funds.']},
NET:{a:'Network',n:['Network diagram','Δικτυωτό διάγραμμα'],w:['Οι εργασίες ως κουτιά συνδεδεμένα με τις σχέσεις τους.','Items as boxes connected by their links.'],y:['Δείχνει τη λογική του προγράμματος: τι εξαρτάται από τι.','Shows the programme logic: what depends on what.'],r:['Τα κρίσιμα κουτιά είναι κόκκινα.','Critical boxes are red.']},
LOB:{a:'LoB',n:['Line of Balance','Γραμμή ισορροπίας'],w:['Για επαναλαμβανόμενα κτίρια: κάθε φάση είναι μια γραμμή που «περνά» από κτίριο σε κτίριο.','For repetitive buildings: each phase is a line moving from building to building.'],y:['Δείχνει αν τα συνεργεία κινούνται με σταθερό ρυθμό χωρίς να «πέφτουν» το ένα πάνω στο άλλο.','Shows whether crews move at a steady rate without running into each other.'],r:['Γραμμές που πλησιάζουν ή διασταυρώνονται = σύγκρουση συνεργείων.','Lines converging or crossing = crew clash.']},
MS:{a:'Milestones',n:['Milestones','Ορόσημα'],w:['Σημαντικά σημεία του έργου (π.χ. ολοκλήρωση φέροντος οργανισμού) με την προγραμματισμένη και την προβλεπόμενη ημερομηνία.','Key points of the project (e.g. structure complete) with planned and forecast dates.'],y:['Συνδέονται με δόσεις πληρωμών και δεσμεύσεις προς τον πελάτη.','They are tied to payment instalments and client commitments.'],r:['Πρόβλεψη μετά το πρόγραμμα = το ορόσημο κινδυνεύει.','Forecast after plan = the milestone is at risk.']},
RES:{a:'Resource histogram',n:['Resource histogram','Ιστόγραμμα φόρτου'],w:['Πόσες εργασίες έχει ταυτόχρονα κάθε εργολάβος, ανά εβδομάδα.','How many items each contractor has at the same time, per week.'],y:['Εντοπίζει υπερφόρτωση συνεργείων πριν γίνει καθυστέρηση.','Spots crew overload before it becomes delay.'],r:['Ψηλές κορυφές = ζητήστε δεύτερο συνεργείο ή μετακινήστε εργασίες με περιθώριο.','High peaks = ask for a second crew or move items that have float.']},
PM:{a:'PM',n:['Project Management / Project Manager','Διοίκηση έργου / υπεύθυνος διοίκησης έργου'],w:['Ο σχεδιασμός, η παρακολούθηση και ο έλεγχος του έργου σε χρόνο, κόστος και ποιότητα.','Planning, monitoring and controlling the project in time, cost and quality.'],y:['Ο διεθνής όρος (PMI, ISO 21502).','The international term (PMI, ISO 21502).'],r:['Construction PM = διοίκηση κατασκευαστικού έργου.','Construction PM = construction project management.']},
PMIS:{a:'PMIS',n:['Project Management Information System','Πληροφοριακό σύστημα διοίκησης έργου'],w:['Το σύστημα που συγκεντρώνει πρόγραμμα, κόστος, πρόοδο, έγγραφα και αναφορές του έργου.','The system that brings together programme, cost, progress, documents and reports.'],y:['Μία πηγή δεδομένων για όλους.','One source of data for everyone.'],r:['Το BoQ είναι PMIS για κατασκευαστικά έργα.','BoQ is a PMIS for construction projects.']}};

 }return ''}

async function runAI(p){
 if(!SAMPLE||typeof SAMPLE.json!=='function'){autoPhases(p);toast(t('aiNA'));return false}
 let upd=0;
 try{
  for(const b of p.buildings){
   const ts=p.tasks.filter(x=>x.b===b.id);if(!ts.length)continue;
   for(let i=0;i<ts.length;i+=140){
    const chunk=ts.slice(i,i+140);busy(t('aiRunning',{b:tr(b.name)})+(ts.length>140?' ('+(i+1)+'–'+Math.min(ts.length,i+140)+'/'+ts.length+')':''));
    const short={};chunk.forEach((x,k)=>short['t'+k]=x);
    const list=chunk.map((x,k)=>({id:'t'+k,d:x.desc,s:x.grp||'',u:x.unit||'',q:x.qty||0}));
    const prompt='You are a senior construction planner for residential building projects in Greece (reinforced concrete, stone, villas, pools).\n'+
     'Building: "'+b.name+'", floors: '+(b.floors||1)+'. Working days per week: '+p.wd+'.\n'+
     'For EVERY item below return: phase id, realistic duration in WORKING days for a typical small Greek crew given the quantity and unit (lump-sum items: typical duration), and direct finish-to-start predecessors (ids from THIS list only).\n'+
     'Phase ids: '+PH.map(x=>x.id+' = '+x.en).join('; ')+'.\n'+
     'Rules: follow real construction sequencing (site → earthworks → lean concrete → foundations/RC frame → masonry/drywall & waterproofing → MEP rough-in → plaster → screeds/tiles/cladding & window frames → painting → fixtures/kitchens/sanitary → handover; pool/external works after the RC frame; insulation before tiles in bathrooms). Only direct predecessors, no cycles, at most 4 per item. Items that can run in parallel must not depend on each other.\n'+
     'Return ONLY JSON: {"items":[{"id":"t0","phase":"struct","dur":12,"deps":["t3"]}]}\nItems:\n'+JSON.stringify(list);
    const res=await SAMPLE.json(prompt,{modelTier:'default'});
    const arr=res&&Array.isArray(res.items)?res.items:Array.isArray(res)?res:[];
    arr.forEach(a=>{const x=short[a&&a.id];if(!x)return;if(PHM[a.phase])x.ph=a.phase;const d=Math.round(+a.dur);if(isFinite(d)&&d>=0&&d<=400)x.dur=d;if(Array.isArray(a.deps)){const dd=a.deps.map(k=>short[k]).filter(y=>y&&y!==x).map(y=>y.id);x.deps=dd.length?dd:undefined}upd++});
   }
  }
 }catch(e){busy();if(e&&e.code==='not_granted'){SAMPLE=null}autoPhases(p);toast(t('aiNA'));return false}
 busy();toast(t('aiDone',{n:upd}));return true;
}

function tblLayout(){return {hLineWidth:()=>0.5,vLineWidth:()=>0.5,hLineColor:()=>'#dfe4ec',vLineColor:()=>'#dfe4ec',paddingLeft:()=>4,paddingRight:()=>4,paddingTop:()=>2.5,paddingBottom:()=>2.5}}
function pdfGantt(p,R,o,bsel){
 const LWp=230,BW=770-LWp-8;
 const ts=p.tasks.filter(x=>bsel.some(b=>b.id===x.b));if(!ts.length)return [{text:t('noItems')}];
 const a0=aggr(R,ts);const t0=addDays(offToDate(p,a0.es),-2);let tE=offToDate(p,Math.max(a0.es,a0.ef-1+R.projDelay));if(today0()>tE&&today0()-t0<800*864e5)tE=today0();const t1=addDays(tE,5);
 const nd=Math.max(7,(t1-t0)/864e5);const X=d=>clamp(((d-t0)/864e5)/nd*BW,0,BW);
 // κεφαλίδα μηνών
 const mcols=[];let d=new Date(t0.getFullYear(),t0.getMonth(),1);let acc=0;
 while(d<t1){const n=new Date(d.getFullYear(),d.getMonth()+1,1);const x1=X(d<t0?t0:d),x2=X(n>t1?t1:n);const w=x2-x1;if(w>0.5){mcols.push({text:w>34?d.toLocaleDateString(loc(),{month:'short',year:'2-digit'}):'',width:w,fontSize:7.5,bold:true,color:'#ffffff',alignment:'center'});acc+=w}d=n}
 const rows=[];
 rows.push([{text:t('colDesc'),bold:true,fontSize:8.5,color:'#fff',fillColor:'#14213d'},{columns:mcols,columnGap:0,fillColor:'#14213d',color:'#fff'}]);
 const tx=X(today0());const showToday=today0()>=t0&&today0()<=t1;
 const barCell=(ds,de,pc,crit,del,fde,kind)=>{const x1=X(ds),x2=Math.max(x1+2,X(addDays(de,1)));const hgt=kind==='t'?8:6;const y=kind==='t'?2:3;const cv=[{type:'rect',x:x1,y,w:x2-x1,h:hgt,r:1.5,color:kind==='b'?'#4b5e86':'#b9cdee',lineColor:crit?'#c0262d':'#8eaee0',lineWidth:crit?1.2:0.4}];
  if(pc>0)cv.push({type:'rect',x:x1,y,w:Math.max(0.8,(x2-x1)*pc),h:hgt,r:1.5,color:pc>=0.999?'#13804b':'#1f4e9c'});
  if(del&&fde){const x3=X(addDays(fde,1));if(x3>x2)cv.push({type:'rect',x:x2,y:y+1,w:x3-x2,h:hgt-2,color:'#e2671c'})}
  if(showToday)cv.push({type:'line',x1:tx,y1:0,x2:tx,y2:12,lineWidth:0.8,lineColor:'#c0262d'});
  return {canvas:cv,margin:[0,0,0,0]}};
 bsel.forEach(b=>{const bt=p.tasks.filter(x=>x.b===b.id);if(!bt.length)return;const a=aggr(R,bt);
  rows.push([{text:tr(b.name)+' · '+pctS(a.pct),bold:true,fontSize:9,color:'#fff',fillColor:'#14213d'},Object.assign(barCell(offToDate(p,a.es),offToDate(p,Math.max(a.es,a.ef-1)),a.pct,false,0,null,'b'),{fillColor:'#eef2f8'})]);
  PH.forEach(ph=>{const pt=bt.filter(x=>x.ph===ph.id);if(!pt.length)return;const ap=aggr(R,pt);
   rows.push([{text:ph[L]+'  '+pctS(ap.pct)+(ap.del?'  +'+ap.del:''),bold:true,fontSize:8,color:'#163b78',fillColor:'#e8f0fc'},Object.assign(barCell(offToDate(p,ap.es),offToDate(p,Math.max(ap.es,ap.ef-1)),ap.pct,ap.crit,ap.del,offToDate(p,Math.max(ap.es,ap.ef-1)+ap.del),'p'),{fillColor:'#f7f9fd'})]);
   if(o.gmode==='all')pt.slice().sort((x,y)=>R.S[x.id].es-R.S[y.id].es).forEach(x=>{const s=R.S[x.id];rows.push([{text:(x.code?x.code+' ':'')+tr(x.desc),fontSize:7,margin:[8,0,0,0]},barCell(s.start,s.finish,s.pct,s.crit,s.delay,s.fcFinish,'t')])})})});
 return [{table:{headerRows:1,widths:[LWp,BW],body:rows,dontBreakRows:true},layout:{hLineWidth:()=>0.3,vLineWidth:()=>0.3,hLineColor:()=>'#dfe4ec',vLineColor:()=>'#dfe4ec',paddingLeft:(i)=>i===1?0:4,paddingRight:(i)=>i===1?0:4,paddingTop:()=>1.5,paddingBottom:()=>1.5}},
  {columns:[{text:'■ '+t('lgPlan'),color:'#8eaee0',fontSize:8,width:'auto'},{text:'■ '+t('lgDone'),color:'#1f4e9c',fontSize:8,width:'auto'},{text:'■ '+t('lgLate'),color:'#e2671c',fontSize:8,width:'auto'},{text:'□ '+t('lgCrit'),color:'#c0262d',fontSize:8,width:'auto'},{text:'| '+t('today')+' '+fdate(today0()),color:'#c0262d',fontSize:8,width:'auto'}],columnGap:16,margin:[0,6,0,0]}];
}
