  v.addEventListener('ended', endSplash);
  v.addEventListener('error', endSplash);
  document.getElementById('hxSplashSkip').addEventListener('click', endSplash);
  var p = v.play(); if(p && p.catch) p.catch(endSplash);
  setTimeout(function(){ if(v.readyState < 2) endSplash(); }, 4000);
  setTimeout(endSplash, 10000);
  document.getElementById('replay').addEventListener('click', function(){
    done = false;
    sp.classList.remove('hx-hide');
    v.currentTime = 0;
    v.play();
  });
})();
</script>
</body>
</html>
