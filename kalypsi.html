<style>
:root{--bg:#f4f6fa;--surf:#fff;--surf2:#f8fafc;--line:#dfe4ec;--line2:#c9d1dd;--txt:#14213d;--muted:#4b5871;--faint:#7c879b;
 --acc:#1f4e9c;--acc2:#163b78;--accbg:#e8f0fc;--ok:#13804b;--okbg:#e4f5ec;--err:#b42318;--errbg:#fdecea;--warn:#9a5b00;--warnbg:#fff4db;--info:#3b4a63;--infobg:#eef1f6;
 --orange:#e2671c;--fb:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;--r:12px}
:root[data-theme="dark"]{--bg:#0d1424;--surf:#141d31;--surf2:#18233b;--line:#263452;--line2:#34466b;--txt:#e7edf7;--muted:#aab6cb;--faint:#7d8aa3;--acc:#7fb0ff;--acc2:#a9c8ff;--accbg:#1c2d4d;
 --ok:#45d28a;--okbg:#14301f;--err:#ff8a7a;--errbg:#3a1714;--warn:#ffc65c;--warnbg:#3a2a0c;--info:#c3cde0;--infobg:#1f2a40}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--fb);font-size:16.5px;line-height:1.45;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
header{height:58px;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--surf);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.brand small{display:block;font-weight:600;color:var(--faint);font-size:11px;letter-spacing:.12em}
.steps{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none;padding:0 6px}
.steps::-webkit-scrollbar{display:none}
.st{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surf2);border-radius:999px;padding:6px 12px 6px 6px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:15px;color:var(--muted)}
.st b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--txt);font-size:13px}
.st.on{border-color:var(--acc);color:var(--txt);background:var(--accbg)}
.st.on b{background:var(--acc);color:#fff}
.st.done b{background:var(--ok);color:#fff}
.hbtn{flex:none;border:1px solid var(--line);background:var(--surf2);border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:600;white-space:nowrap}
.hbtn:hover{border-color:var(--line2)}
main{position:absolute;top:58px;left:0;right:0;bottom:0;display:flex}
#view{position:relative;flex:1;min-width:200px;background:#fff;overflow:hidden;touch-action:none}
:root[data-theme="dark"] #view{background:#0a0f1c}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
#split{width:8px;cursor:col-resize;background:var(--line);flex:none}
#split:hover{background:var(--line2)}
#panel{width:460px;flex:none;background:var(--surf);display:flex;flex-direction:column;min-width:320px;max-width:70vw}
#pbody{flex:1;overflow:auto;padding:16px 18px 10px}
#pfoot{display:flex;gap:10px;padding:10px 16px;border-top:1px solid var(--line);background:var(--surf2)}
#pfoot .btn{flex:1}
h2{font-size:21px;margin:0 0 4px}
h3{font-size:17px;margin:16px 0 8px}
.lead{color:var(--muted);margin-bottom:12px}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--acc);color:#fff;font-size:16px}
.btn:hover{background:var(--acc2)}
.btn.sec{background:var(--surf2);color:var(--txt);border:1px solid var(--line2)}
.btn.sec:hover{border-color:var(--acc)}
.btn.or{background:var(--orange)}
.btn:disabled{opacity:.45;cursor:default}
label.f{display:block;margin:8px 0}
label.f span{display:block;font-size:14px;color:var(--muted);font-weight:600;margin-bottom:3px}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid var(--line2);border-radius:9px;padding:9px 10px;background:var(--surf);font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:var(--acc)}
textarea{min-height:90px;resize:vertical;font-size:15px}
.row{display:flex;gap:10px}.row>*{flex:1}
.card{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surf2);margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{border:1px solid var(--line2);background:var(--surf);border-radius:999px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.chip i{width:12px;height:12px;border-radius:3px;display:inline-block}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.kv b{font-variant-numeric:tabular-nums}
.drop{border:2px dashed var(--line2);border-radius:14px;padding:22px;text-align:center;cursor:pointer;background:var(--surf2)}
.drop:hover{border-color:var(--acc)}
.cl{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px;margin:8px 0;background:var(--surf);cursor:pointer}
.cl.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--accbg)}
.cl canvas{width:96px;height:70px;background:#fff;border:1px solid var(--line);border-radius:8px}
.cl .t{font-weight:700;font-size:15px;margin-bottom:4px}
.cl select{padding:6px 8px;font-size:15px}
.badge{display:inline-block;border-radius:7px;padding:2px 8px;font-size:13px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}.b-fail{background:var(--errbg);color:var(--err)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-info{background:var(--infobg);color:var(--info)}
.chk{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--surf)}
.chk .h{display:flex;gap:8px;align-items:center;justify-content:space-between;font-weight:700}
.chk .v{margin-top:4px}
.chk .a{margin-top:4px;color:var(--acc);font-size:14px;font-weight:600}
.chk .w{margin-top:4px;color:var(--muted);font-size:14.5px}
.sug{border-left:4px solid var(--orange);background:var(--surf);border-radius:0 10px 10px 0;padding:9px 12px;margin:8px 0}
.sug .a{color:var(--acc);font-size:14px;font-weight:600;margin-top:3px}
.sug .g{float:right;font-weight:800;color:var(--ok)}
.big{font-size:22px;font-weight:800;padding:12px 14px;border-radius:12px;text-align:center;margin:6px 0 10px}
#tb{position:absolute;left:12px;top:12px;display:flex;gap:4px;background:var(--surf);border:1px solid var(--line2);border-radius:12px;padding:5px;box-shadow:0 6px 20px rgba(15,26,46,.12);z-index:5;user-select:none}
#tb .grip{width:14px;cursor:move;display:grid;place-items:center;color:var(--faint);font-weight:900}
#tb button{border:1px solid transparent;background:transparent;border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:700;font-size:14.5px}
#tb button:hover{background:var(--surf2);border-color:var(--line)}
#tb button.on{background:var(--acc);color:#fff}
#tb button:disabled{opacity:.35}
#hint{position:absolute;left:12px;bottom:12px;right:12px;pointer-events:none;display:flex;justify-content:center;z-index:4}
#hint span{background:rgba(20,33,61,.88);color:#fff;border-radius:10px;padding:8px 14px;font-size:15px;max-width:720px;text-align:center}
#hint span:empty{display:none}
#coord:empty{display:none}
#coord{position:absolute;right:12px;top:12px;background:var(--surf);border:1px solid var(--line);border-radius:9px;padding:4px 10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;z-index:4}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#14213d;color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#busy{position:fixed;inset:0;background:rgba(15,26,46,.35);display:none;place-items:center;z-index:60}
#busy div{background:var(--surf);padding:18px 24px;border-radius:14px;font-weight:700}
.ovl{position:fixed;inset:0;background:rgba(15,26,46,.4);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.ovl.on{display:flex}
.mbox{background:var(--surf);border-radius:16px;max-width:860px;width:100%;max-height:88vh;overflow:auto;padding:22px 24px;box-shadow:0 20px 50px rgba(15,26,46,.25)}
.mbox h2{margin-bottom:10px}
.mbox ol,.mbox ul{padding-left:22px}.mbox li{margin:6px 0}
.mbox .src{font-size:14.5px;color:var(--muted)}
#aiOut{white-space:pre-wrap;line-height:1.55}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.ph div{position:relative}.ph img{width:100%;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.ph button{position:absolute;top:4px;right:4px;border:0;border-radius:6px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;padding:1px 7px}
.small{font-size:14.5px;color:var(--muted)}
.sp{display:grid;grid-template-columns:auto 1fr auto auto;gap:4px 10px;align-items:center;font-size:15px;margin:6px 0}
.sp i{width:14px;height:14px;border-radius:4px;display:inline-block}
.sp b{font-variant-numeric:tabular-nums;text-align:right}
@media (max-width:1350px){.st:not(.on) span{display:none}.st:not(.on){padding:6px}}
@media (max-width:900px){
 main{flex-direction:column}
 #split{display:none}
 #view{flex:none;height:46vh}
 #panel{width:auto!important;max-width:none;flex:1;min-height:0}
 .st span{display:none}.st{padding:6px}
 .brand small{display:none}
}

  if (location.protocol === 'file:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1') return; // τοπικές δοκιμές
  var CK = 'hx_gate_' + MODULE, TTL = 7 * 864e5;
  document.documentElement.style.visibility = 'hidden';
  var tok = '';
  function allow(){
    document.documentElement.style.visibility = '';
    try{ localStorage.setItem(CK, String(Date.now())); }catch(e){}
    try{
      var pl = JSON.parse(atob(tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
      fetch(SB + '/rest/v1/user_activity', { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates' },
        body: JSON.stringify({ user_id: pl.sub, last_seen: new Date().toISOString(), last_app: MODULE }) }).catch(function(){});
    }catch(e){}
  }
  function deny(u){ location.replace(u); }
  function cachedOk(){ try{ var t = +localStorage.getItem(CK); return t && (Date.now() - t) < TTL; }catch(e){ return false; } }
  function offlineMsg(){
    document.documentElement.style.visibility = '';
    document.body.innerHTML = '<div style="font-family:system-ui,sans-serif;padding:60px 20px;text-align:center;color:#1F2836"><h2 style="margin-bottom:8px">Χρειάζεται σύνδεση στο internet</h2><p style="color:#5B6675;margin-bottom:20px">για τον έλεγχο πρόσβασης του εργαλείου.</p><a href="hub.html" style="color:#E05A12;font-weight:700">&larr; Επιστροφή στο HEXIS Hub</a></div>';
  }
  var raw = null; try{ raw = localStorage.getItem('sb-oucqqudfdimccgowvpqp-auth-token'); }catch(e){}
  if (raw) { try{ var s = JSON.parse(raw); tok = s.access_token || (s.currentSession && s.currentSession.access_token) || ''; }catch(e){} }
  if (!tok) { deny('login.html'); return; }
  fetch(SB + '/rest/v1/entitlements?select=module,active,expires_at&module=eq.' + MODULE, { headers: { apikey: KEY, Authorization: 'Bearer ' + tok } })
  .then(function(r){ if (r.status === 401 || r.status === 403) { if (cachedOk()) allow(); else deny('hub.html'); return null; } return r.json(); })
  .then(function(rows){ if (rows === null) return; var ok = (rows || []).some(function(e){ return e.active && (!e.expires_at || new Date(e.expires_at) > new Date()); }); if (ok) allow(); else deny('tool.html?id=' + MODULE); })
  .catch(function(){ if (cachedOk()) allow(); else offlineMsg(); });
})();

const APP_VERSION = '2.3';

function templateDxf() {

  [['ΚΑΤΟΨΗ ΙΣΟΓΕΙΟΥ', 40], ["ΚΑΤΟΨΗ Α' ΟΡΟΦΟΥ", 60]].forEach(([ti, x0], k) => {
    rc('KAL_PERIGRAMMA', x0, 0, 12, 10); rc('KAL_KLIMAKA_KOINOXR', x0 + 9, 6, 3, 4); rc('KAL_FOTAGOGOS', x0 + 5, 7, 1.5, 1.5);
    if (k === 0) rc('KAL_HX', x0, 0, 4, 2.5); else { rc('KAL_EXOSTIS', x0, -1.5, 12, 1.5); rc('KAL_ERKER', x0 + 12, 3, 0.8, 3); }

  '<h3>Πηγές</h3><ul class="src">' +
  '<li>ν. 5306/2026 «Κώδικας Χωροταξίας και Πολεοδομίας» (ΦΕΚ Α΄ 88/08.06.2026) — άρθ. 196-198, 204, 206-214, 221-223, 237-240, 250-251, 256, 273, 325</li>' +

$('#ovHelp').onclick = e => { if (e.target.id === 'ovHelp') e.target.classList.remove('on'); };
function applyTheme(t) { document.documentElement.dataset.theme = t; PREF.theme = t; savePref(); draw(); }
$('#btnTheme').onclick = () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

/* ---------------- εκκίνηση ---------------- */
(async () => {
  document.documentElement.dataset.theme = PREF.theme || 'light';
  try { const st = JSON.parse(localStorage.getItem('kalypsi_settings') || 'null'); if (st) { Object.assign(S.proj, st.proj || {}); Object.assign(S.rules, st.rules || {}); Object.assign(S.ext, st.ext || {}); } } catch (e) {}
  try { const w = await IDB.get('work'); if (w && w.v === 1) { S = Object.assign(DEF(), w); rebuildExtra(); } } catch (e) {}
  resize(); compute(); render(); go(S.step || 0);
  if (PREF.seenVer !== APP_VERSION) { toast(WHATS_NEW, 8000); PREF.seenVer = APP_VERSION; savePref(); }
  else if (S.D) toast('Συνέχεια εργασίας: ' + (S.dxfName || 'DXF'));
})();
window.__KAL = { S: () => S, UI, loadDxf, go, buildSheet, compute, w2s };
