<style>
:root{
  --blue:#1F4E9C; --navy:#14213D; --paper:#F5F7FB; --card:#FFFFFF;
  --soft:#EAF1FB; --line:#D5DEEC; --muted:#5B6B85;
  --serif:'Noto Serif',Georgia,serif; --sans:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--navy);font-size:15px;line-height:1.55}

header{background:var(--navy);color:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(20,33,61,.25)}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:42px;height:42px;flex:none}
.brandtxt{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.brand h1{font-family:var(--serif);font-weight:700;font-size:19px;letter-spacing:.04em}
.brand h1 span{color:#8FB4EE}
.brand small{color:#93A5C6;font-size:11.5px;letter-spacing:.06em}
nav{display:flex;gap:2px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{appearance:none;border:0;background:transparent;color:#AEBFDD;font-family:var(--sans);font-size:13px;font-weight:600;padding:10px 13px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;letter-spacing:.02em}
nav button.active{background:var(--paper);color:var(--blue)}
nav button:focus-visible{outline:2px solid #8FB4EE;outline-offset:-2px}

main{max-width:880px;margin:0 auto;padding:16px 14px 96px}
.lawmeta{display:flex;align-items:flex-start;gap:12px;margin:6px 2px 14px}
.lawmeta .fek{font-family:var(--serif);font-weight:700;color:var(--blue);font-size:13px;border:1.5px solid var(--blue);border-radius:6px;padding:4px 8px;white-space:nowrap}
.lawmeta p{color:var(--muted);font-size:13px}

.searchwrap{position:relative;margin-bottom:14px}
.searchwrap input{width:100%;padding:12px 14px 12px 40px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;font-family:var(--sans);background:var(--card);color:var(--navy)}
.searchwrap input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,78,156,.13)}
.searchwrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--muted)}

.chapter{margin:20px 0 8px}
.chapter h2{font-family:var(--serif);font-size:13.5px;font-weight:700;color:var(--blue);letter-spacing:.08em;text-transform:uppercase;border-bottom:2px solid var(--blue);padding-bottom:5px;margin-bottom:4px}
.article{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0;overflow:hidden;scroll-margin-top:120px}
.article>button{appearance:none;border:0;background:transparent;width:100%;display:grid;grid-template-columns:74px 1fr;gap:0;text-align:left;cursor:pointer;padding:0;font-family:var(--sans)}
.artnum{font-family:var(--serif);font-weight:700;font-size:12px;color:var(--blue);border-right:1px solid var(--line);background:var(--soft);display:flex;align-items:center;justify-content:center;text-align:center;padding:12px 6px;line-height:1.3;letter-spacing:.03em}
.artmain{padding:11px 13px}
.artmain h3{font-size:14.5px;font-weight:600;color:var(--navy);line-height:1.35}
.artmain p{font-size:13px;color:var(--muted);margin-top:3px}
.artbody{display:none;border-top:1px dashed var(--line);padding:12px 13px 13px;background:#FBFCFE}
.corr{font-size:12.8px;line-height:1.55;color:#5A4A12;background:#FFF7E0;border:1px solid #EFDFA8;border-radius:8px;padding:8px 11px;margin-bottom:10px}
.corrtable{width:100%;border-collapse:collapse;margin:0 0 18px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13.4px}
.corrtable caption{caption-side:top;text-align:left;font-family:'Noto Serif',serif;font-weight:700;font-size:15px;color:var(--navy);padding:12px 2px 8px}
.corrtable th{background:var(--navy);color:#fff;text-align:left;padding:8px 11px;font-size:12.3px;letter-spacing:.4px;text-transform:uppercase}
.corrtable td{padding:8px 11px;border-top:1px solid var(--line);vertical-align:top;line-height:1.5}
.corrtable tr:nth-child(even) td{background:#F7FAFD}
.corrtable td.old{white-space:nowrap;font-weight:600;color:#7A3B00}
.corrtable td.new{white-space:nowrap;font-weight:700;color:var(--blue)}
.corrtable td .apx{color:var(--muted);font-weight:400;font-size:12px}
.corrnote{font-size:12.8px;color:var(--muted);margin:-10px 0 18px;line-height:1.5}
.newrow td.old{color:#0B7A3B;font-weight:700}
.linkcell{background:none;border:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.linkcell:hover{color:var(--blue);text-decoration-style:solid}
.subflash{animation:subfl 2.4s ease-out}
@keyframes subfl{0%{background:#FFE9A8;border-color:#E0B84C}60%{background:#FFF6DC}100%{background:#fff}}
#backfab{position:fixed;left:14px;bottom:14px;z-index:80;background:var(--navy);color:#fff;border:none;border-radius:999px;padding:11px 18px;font-size:14px;font-weight:700;font-family:inherit;box-shadow:0 4px 14px rgba(20,33,61,.35);cursor:pointer}
#backfab:hover{background:var(--blue)}
#updbar{background:#FFF3D6;border-bottom:1px solid #E8D08A;padding:9px 16px;font-size:13.4px;color:#4A3B08}
#updbar.ok{background:#E8F6EA;border-color:#BBDFC2;color:#1E5A2A}
#updbar.hidden{display:none}
.updhead{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:980px;margin:0 auto}
.updacts button{background:none;border:1px solid currentColor;border-radius:7px;color:inherit;font:inherit;font-size:12.5px;padding:3px 10px;cursor:pointer;margin-left:6px}
.updacts button.hidden{display:none}
#updbody{max-width:980px;margin:8px auto 2px;white-space:pre-wrap;line-height:1.6;font-size:13.2px}

#updbody b{color:#3A2E00}
.corr b{color:#3E3306}
.corr.now{color:#12406B;background:#EAF3FC;border-color:#BFD9F2}
.corr.now b{color:#0B2E52}
.article.open .artbody{display:block}
.article.flash{box-shadow:0 0 0 3px rgba(31,78,156,.35)}

.figcap{font-size:12.5px;color:var(--muted);margin-top:7px;text-align:center;line-height:1.45}
.sublines{margin-bottom:11px}

.subline:hover{border-color:var(--blue)}
.subline .chev{color:var(--blue);font-weight:700;margin-right:6px}
.subwrap.open .subline{border-color:var(--blue);border-bottom-left-radius:0;border-bottom-right-radius:0;background:#F4F8FD}
.subans{display:none;border:1px solid var(--blue);border-top:none;border-radius:0 0 8px 8px;background:#F9FBFE;padding:10px 12px;margin:-6px 0 8px;font-size:13.6px;line-height:1.65;color:#25314D;white-space:pre-wrap}

.subans b{color:var(--navy)}
.subloading{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:12.8px;padding:2px 0}
.artactions{display:flex;gap:8px;flex-wrap:wrap}
.askbtn{appearance:none;border:1.5px solid var(--blue);background:#fff;color:var(--blue);font-weight:600;font-size:13px;border-radius:8px;padding:7px 12px;cursor:pointer;font-family:var(--sans)}

.note{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:12.5px;color:#33415C;margin:14px 0}
.note b{color:var(--blue)}
.noresults{color:var(--muted);text-align:center;padding:30px 0;font-size:14px}
mark{background:#FFE9A8;color:inherit;border-radius:2px;padding:0 1px}

.chat{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.msg{max-width:92%;border-radius:12px;padding:11px 14px;font-size:14.5px;white-space:pre-wrap;word-wrap:break-word}

.refs{align-self:flex-start;display:flex;gap:8px;flex-wrap:wrap;max-width:92%}

.refs button:hover{background:#fff}
.thinking{align-self:flex-start;color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--blue);animation:b 1s infinite alternate}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes b{to{opacity:.25;transform:translateY(-3px)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

.chips button:hover{border-color:var(--blue);background:var(--soft)}
.askbar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--paper) 75%,transparent);padding:10px 14px calc(12px + env(safe-area-inset-bottom));display:none;justify-content:center}
.askbar.visible{display:flex}
.askbar .inner{display:flex;gap:8px;width:100%;max-width:880px}
.askbar textarea{flex:1;resize:none;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-size:15px;font-family:var(--sans);background:var(--card);color:var(--navy);max-height:120px}
.askbar textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,78,156,.13)}
.askbar button{appearance:none;border:0;background:var(--blue);color:#fff;border-radius:12px;padding:0 18px;font-weight:700;font-size:14px;cursor:pointer;font-family:var(--sans)}
.askbar button:disabled{opacity:.45;cursor:default}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
@media (max-width:480px){.article>button{grid-template-columns:62px 1fr}.artnum{font-size:11px}}
</style>

  {title:"Οικισμοί χωρίς σχέδιο (άρθ. 226–248)",items:[

  {title:"Εκτός σχεδίου δόμηση (άρθ. 249–273)",items:[
   {n:"Άρθ. 250",t:"Εκτός σχεδίου δόμηση — γενικοί κανόνες",d:"Αρτιότητα, παρεκκλίσεις, πρόσωπο σε δρόμο (πρώην άρθ. 32 ν.4759).",k:"εκτός σχεδίου αρτιότητα 4 στρέμματα παρεκκλίσεις πρόσωπο δρόμος",
    p:"• Κανόνας αρτιότητας: 4.000 μ² (4 στρ.)\n• Οι παλιές παρεκκλίσεις αρτιότητας (750/1.200/2.000 μ²) έχουν κλείσει — δομήσιμα μόνο όσα πρόλαβαν τις μεταβατικές\n• Απαίτηση προσώπου σε κοινόχρηστο δρόμο (κατά τις μεταβατικές ρυθμίσεις)\n• Δυνατότητα συνένωσης όμορων γηπέδων για συμπλήρωση αρτιότητας\n• ⚠ Ελέγχεις πάντα και τυχόν ΖΟΕ/ΤΠΣ/ειδικά καθεστώτα της περιοχής"},
   {n:"Άρθ. 251",t:"Γενικοί όροι και περιορισμοί δόμησης",d:"ΣΔ, κάλυψη, ύψη, αποστάσεις εκτός σχεδίου (πρώην άρθ. 33 ν.4759).",k:"όροι δόμησης εκτός σχεδίου συντελεστής αποστάσεις ύψος κάλυψη",
    p:"• Γενικοί όροι για όλα τα εκτός σχεδίου γήπεδα: μειωμένοι ΣΔ σε σχέση με το προ-2020 καθεστώς\n• Ελάχιστη απόσταση κτιρίου από όρια γηπέδου: 15 μ. (γενικός κανόνας εκτός σχεδίου)\n• Μέγιστα ύψη ανά χρήση — για κατοικία βλ. άρθ. 256\n• Ισχύουν σωρευτικά οι ειδικές διατάξεις ανά χρήση (252-271)"},
   {n:"Άρθ. 252–262",t:"Ειδικές χρήσεις εκτός σχεδίου",d:"Γεωργικά, βιομηχανικά, γραφεία, ΚΑΤΟΙΚΙΑ (256), κοινωφελή.",k:"κατοικία εκτός σχεδίου αποθήκη θερμοκήπιο βιομηχανία γεωργικά",
    p:"• Άρθ. 252: Γεωργοκτηνοτροφικά, θερμοκήπια, γεωργικές αποθήκες, δεξαμενές\n• Άρθ. 253: Αντλητικές εγκαταστάσεις, υδατοδεξαμενές, φρέατα\n• Άρθ. 254: Βιομηχανικές εγκαταστάσεις\n• Άρθ. 255: Γραφεία - καταστήματα\n• Άρθ. 256: ΚΑΤΟΙΚΙΑ — μέγ. δόμηση 186 μ² σε γήπεδο 4 στρ. με κλιμάκωση για μεγαλύτερα (πλαφόν)\n• Άρθ. 257: Κτίρια κοινής ωφέλειας — 258: κεραίες/σταθμοί — 260: εμπορικές αποθήκες — 261: εκπαιδευτήρια — 262: νοσοκομεία"},

    p:"• Άρθ. 263: Τουριστικές εγκαταστάσεις εκτός σχεδίου — όροι ανά κατηγορία/δυναμικότητα\n• Άρθ. 264: Αθλητικές εγκαταστάσεις — 265: γραφεία διοίκησης — 266: ιεροί ναοί\n• Άρθ. 268-270: Κτίρια συγκοινωνιών, ΚΤΕΟ, σταθμοί εξυπηρέτησης/διόδια\n• Άρθ. 271: Εγκαταστάσεις εφοδιαστικής & κέντρα δεδομένων (data centers)"},
   {n:"Άρθ. 272–273",t:"Σώρευση παρεκκλίσεων — Μεταβατικές",d:"Κανόνες σώρευσης, μεταβατικό καθεστώς εκτός σχεδίου.",k:"παρεκκλίσεις σώρευση μεταβατικές προθεσμίες εκκρεμείς",
    p:"• Άρθ. 272: Απαγόρευση/περιορισμός σώρευσης αιτημάτων παρεκκλίσεων από όρους δόμησης\n• Άρθ. 273: Μεταβατικές διατάξεις εκτός σχεδίου — τι ισχύει για εκκρεμείς αιτήσεις, προεγκρίσεις και γήπεδα που είχαν κατοχυρώσει παρεκκλίσεις\n• ⚠ Κρίσιμο για κάθε φάκελο που «τρέχει» — έλεγξε τις ημερομηνίες κατοχύρωσης"},

   {n:"Άρθ. 341–351",t:"Ηλεκτρονική Ταυτότητα Κτιρίου",d:"Ταυτότητα κτιρίου/ιδιοκτησίας, πιστοποιητικά, υπόχρεοι.",k:"ηλεκτρονική ταυτότητα κτιρίου πιστοποιητικό πληρότητας",

nok:{
 fek:"Ν. 4067/2012\nΦΕΚ Α΄79",
 meta:"Νέος Οικοδομικός Κανονισμός (ΝΟΚ). Από 06/2026 οι διατάξεις του κωδικοποιήθηκαν στα άρθ. 195–225 του Κώδικα Ταγαρά 5306/2026 (π.χ. ΣΔ: 11→206, ύψος: 15→210, ακάλυπτοι: 17→212). Εδώ κρατάμε την κλασική αρίθμηση που ξέρει η αγορά.",
 chapters:[
  {title:"Γενικές διατάξεις (άρθ. 1–10)",items:[
   {n:"Άρθρο 1",t:"Πεδίο εφαρμογής",d:"Πού εφαρμόζεται ο ΝΟΚ.",k:"πεδίο εφαρμογής εντός εκτός σχεδίου οικισμοί",
    p:"• Εφαρμόζεται σε περιοχές εντός εγκεκριμένου σχεδίου και εντός οικισμών\n• Στην εκτός σχεδίου δόμηση και σε οικισμούς χωρίς σχέδιο εφαρμόζονται μόνο συγκεκριμένα άρθρα του (ρητά απαριθμούμενα)\n• Ειδικές πολεοδομικές διατάξεις (ΖΟΕ, διατάγματα οικισμών, παραδοσιακοί) κατισχύουν των γενικών"},
   {n:"Άρθρο 2",g:["sofita","patari","ypogeio"],t:"Ορισμοί",d:"Όλοι οι πολεοδομικοί ορισμοί.",k:"ορισμοί αίθριο ημιυπαίθριος όροφος υπόγειο σοφίτα εξώστης",
    p:"• Αίθριο: ελάχιστη διάσταση Δ (όχι 2Δ)\n• Ημιυπαίθριος: ανοιχτός τουλάχιστον στο 35% της περιμέτρου του\n• Υπόγειο, σοφίτα, εξώστης, φέρων οργανισμός, κέλυφος, όροφος, οικοδομική & ρυμοτομική γραμμή\n• Απόσυρση κτιρίου, cours anglaises, υπόσκαφα\n• Οι ορισμοί εφαρμόζονται και όπου παραπέμπει ο Κτιριοδομικός"},
   {n:"Άρθρο 3",t:"Ορισμοί συντελεστών και μεγεθών",d:"ΣΔ, κάλυψη, όγκος, ύψη.",k:"συντελεστής δόμησης κάλυψη όγκος μεγέθη ορισμοί",
    p:"• Ορίζονται: συντελεστής δόμησης (σ.δ.), ποσοστό κάλυψης, συντελεστής κατ' όγκον εκμετάλλευσης (σ.ο.), μέγιστο ύψος, ιδεατό στερεό\n• Τα μεγέθη αυτά εξειδικεύονται στα άρθρα 11-15"},
   {n:"Άρθρο 4",t:"Άδειες δόμησης — κατηγορίες εργασιών",d:"Ποιες εργασίες θέλουν άδεια, ΕΕΔΜΚ ή τίποτα.",k:"άδεια μικρής κλίμακας ΕΕΔΜΚ εργασίες χωρίς άδεια 48ωρη",
    p:"• Οικοδομική άδεια: ανέγερση, προσθήκη, κατεδάφιση, στατικές επεμβάσεις, αλλαγές χρήσης με νέες προϋποθέσεις\n• ΕΕΔΜΚ: μικρής κλίμακας (περιφράξεις, πέργκολες μεγάλες, δεξαμενές, ικριώματα κ.λπ. — κατάλογος ΥΑ)\n• Χωρίς άδεια (με ή χωρίς 48ωρη ενημέρωση): χρωματισμοί, μικροεπισκευές, συντήρηση\n• Σήμερα η ύλη αυτή τρέχει μέσω ν.4495 (άρθ. 29-30) / Κώδικα 5306 (άρθ. 315-316)"},
   {n:"Άρθρο 5",t:"Χρήση κτιρίων",d:"Καθορισμός και μεταβολή χρήσης.",k:"αλλαγή χρήσης κτίριο",
    p:"• Η χρήση καθορίζεται από την οικοδομική άδεια\n• Αλλαγή χρήσης επιτρέπεται μόνο αν η νέα χρήση προβλέπεται στην περιοχή — απαιτεί άδεια/ενημέρωση κατά περίπτωση\n• Αυθαίρετη αλλαγή χρήσης = πολεοδομική παράβαση/αυθαίρετο (ν.4495)"},
   {n:"Άρθρο 6",t:"Προστασία αρχιτεκτονικής & φυσικής κληρονομιάς",d:"Διατηρητέα, παραδοσιακοί οικισμοί.",k:"διατηρητέα παραδοσιακός οικισμός κληρονομιά χαρακτηρισμός",
    p:"• Χαρακτηρισμός κτιρίων ως διατηρητέων με απόφαση ΥΠΕΝ (ή ΥΠΠΟ για μνημεία)\n• Ειδικοί όροι δόμησης/χρήσεων σε παραδοσιακά σύνολα\n• Δυνατότητα μεταφοράς ΣΔ από διατηρητέα (βλ. τράπεζα γης)\n• Επισκευές διατηρητέων με έγκριση ΣΑ"},
   {n:"Άρθρο 7",t:"Αρτιότητα και οικοδομησιμότητα",d:"Πότε το οικόπεδο είναι άρτιο και οικοδομήσιμο.",k:"αρτιότητα οικοδομησιμότητα παρέκκλιση οικόπεδο πρόσωπο",
    p:"• Άρτιο = πληροί εμβαδόν & πρόσωπο του κανόνα ή της παρέκκλισης της περιοχής\n• Οικοδομήσιμο = άρτιο + πρόσωπο σε κοινόχρηστο χώρο + δεν εμπίπτει σε απαγορεύσεις\n• Ρυμοτομούμενα τμήματα αφαιρούνται για τον έλεγχο αρτιότητας\n• Δυνατότητα τακτοποίησης με όμορα"},
   {n:"Άρθρο 8",t:"Ειδικές περιπτώσεις",d:"Ειδικές ρυθμίσεις αρτιότητας/δόμησης.",k:"ειδικές περιπτώσεις ρυμοτόμηση γωνιακά",
    p:"• Ρυθμίσεις για οικόπεδα που ρυμοτομούνται μερικώς\n• Μειωμένες αποστάσεις/ειδικοί όροι σε ειδικά σχήματα οικοπέδων\n• Εξειδικεύσεις όπου το εγκεκριμένο σχέδιο δημιουργεί αδυναμία δόμησης"},
   {n:"Άρθρο 9",t:"Δουλείες σε ακίνητα",d:"Δουλείες και δόμηση.",k:"δουλεία ακίνητο διέλευση",
    p:"• Σύσταση δουλειών (διόδου, φωτισμού κ.λπ.) δεν δημιουργεί δικαίωμα δόμησης\n• Οι δουλείες αποτυπώνονται στο τοπογραφικό και δεσμεύουν τη θέση κτιρίου"},
   {n:"Άρθρο 10",t:"Κίνητρα περιβαλλοντικής αναβάθμισης",d:"Τα «μπόνους» ΣΔ σε πυκνοδομημένες περιοχές.",k:"κίνητρα μπόνους ΣΔ περιβαλλοντική αναβάθμιση ΣτΕ",
    p:"• Προσαυξήσεις ΣΔ/ύψους με αντάλλαγμα ενεργειακή/περιβαλλοντική αναβάθμιση και αποδόσεις χώρων\n• ⚠ Οι διατάξεις των μπόνους κρίθηκαν εν μέρει αντισυνταγματικές από το ΣτΕ (Ολομέλεια 2024-2025) και αναδιατυπώθηκαν — η ισχύουσα μορφή είναι πλέον στο άρθ. 204 του Κώδικα 5306/2026\n• Για νέες άδειες με μπόνους: έλεγχος του τρέχοντος καθεστώτος υποχρεωτικός"},
  ]},
  {title:"Το κτίριο — όροι & στοιχεία δόμησης (άρθ. 11–26)",items:[
   {n:"Άρθρο 11",g:["sd"],t:"Συντελεστής δόμησης — προσμετρήσεις",d:"Τι μετράει και τι όχι στη δόμηση.",k:"προσμέτρηση δόμηση εξαιρέσεις ημιυπαίθριοι σοφίτα υπόγειο κλιμακοστάσιο",
    p:"• ΔΕΝ προσμετρώνται (κύριες εξαιρέσεις): υπόγειοι χώροι βοηθητικής χρήσης εντός περιγράμματος, ανοιχτοί ημιυπαίθριοι έως το επιτρεπόμενο ποσοστό, σοφίτα (μέσο ύψος ≤ 2,20 μ, εντός στέγης), φυτεμένα δώματα, χώροι στάθμευσης σε υπόγεια/πυλωτή\n• Κλιμακοστάσια (εγκύκλιος 2023): κοινόχρηστα με ανελκυστήρες/πλατύσκαλα έως 30 τ.μ. ανά επίπεδο (όροφο/πατάρι) και 40 τ.μ. στο επίπεδο εισόδου· εσωτερικά ανά αυτοτελή ιδιοκτησία έως 25 τ.μ. ανά επίπεδο (όροφο/πατάρι/σοφίτα) — αφαιρούνται από τον ΣΔ σωρευτικά\n• Πατάρι: δεν μετρά ως λειτουργικό παράρτημα του χώρου — ⚠ κατά ΣτΕ, αν λειτουργεί ως αυτοτελής κύριος χώρος, προσμετράται\n• Προσμετρώνται: κλειστοί χώροι κύριας χρήσης, κλειστοί εξώστες\n• Το πιο «δουλεμένο» άρθρο του ΝΟΚ — πάντα με την τρέχουσα κωδικοποίηση (206 Κώδικα)"},
   {n:"Άρθρο 12",g:["kalypsi"],t:"Ποσοστό κάλυψης",d:"Μέγιστη κάλυψη οικοπέδου.",k:"κάλυψη ποσοστό 60",
    p:"• Γενικός κανόνας: μέγιστη κάλυψη 60% της επιφάνειας του οικοπέδου (εκτός αν ειδικές διατάξεις ορίζουν άλλο)\n• Ορίζεται τι προσμετράται στην κάλυψη (προεξοχές, ημιυπαίθριοι κ.λπ.)"},
   {n:"Άρθρο 13",t:"Συντελεστής όγκου",d:"Κατ' όγκον εκμετάλλευση.",k:"συντελεστής όγκου σο",
    p:"• Ο σ.ο. υπολογίζεται ως πολλαπλάσιο του σ.δ. (τυποποιημένη σχέση)\n• Εξαιρέσεις προσμέτρησης όγκου αντίστοιχες με του άρθ. 11"},
   {n:"Άρθρο 14",g:["thesi"],t:"Θέση κτιρίου — αποστάσεις Δ, δ",d:"Υποχρεωτικές αποστάσεις από όρια.",k:"απόσταση Δ δ όρια θέση κτιρίου πλάγιες",
    p:"• Δ = 3,00 μ. + 0,10 × Η (ύψος κτιρίου)\n• δ = 2,50 μ. + 0,05 × Η\n• Πότε το κτίριο τοποθετείται σε επαφή με πλάγια όρια και πότε υποχρεωτικά σε απόσταση Δ (π.χ. ύπαρξη Δ στο όμορο, πρασιά απέναντι)\n• Ειδικές ρυθμίσεις για γωνιακά και διαμπερή"},
   {n:"Άρθρο 15",g:["ypsos"],t:"Ύψος — ιδεατό στερεό",d:"Μέγιστα ύψη ανά ΣΔ, αφετηρία μέτρησης.",k:"ύψος ιδεατό στερεό αφετηρία μέτρησης πλάτος δρόμου",
    p:"• Μέγιστο ύψος κλιμακωτά με τον σ.δ.: από 10,75 μ. (σ.δ. ≤ 0,4) έως 32,00 μ. (σ.δ. ≥ 2,4)\n• Προσαύξηση ύψους όταν εφαρμόζονται κίνητρα (βλ. άρθ. 10/25 — με τις επιφυλάξεις ΣτΕ)\n• Ιδεατό στερεό: 1,5 × πλάτος δρόμου κ.λπ. — το κτίριο εγγράφεται σε αυτό\n• Αφετηρία μέτρησης: οριστική στάθμη εδάφους/πεζοδρομίου κατά περίπτωση"},
   {n:"Άρθρο 16",g:["exostes"],t:"Εξώστες — στοιχεία όψεων",d:"Προεξοχές, προστεγάσματα.",k:"εξώστες μπαλκόνια προστεγάσματα προεξοχές όψεις",
    p:"• Εξώστες πάνω από κοινόχρηστο: μέγιστο πλάτος συναρτήσει πλάτους δρόμου (έως 1/10 αυτού, με απόλυτα όρια) και ελάχιστο ύψος από πεζοδρόμιο 3,00 μ.\n• Αρχιτεκτονικές προεξοχές & διακοσμητικά στοιχεία με περιορισμούς πλάτους\n• Προστεγάσματα: επιτρεπόμενα με όρους, δεν προσμετρώνται υπό προϋποθέσεις"},
   {n:"Άρθρο 17",t:"Ακάλυπτοι — κατασκευές & περιφράξεις",d:"Πισίνες, πέργκολες, στέγαστρα, μάντρες.",k:"ακάλυπτος πισίνα πέργκολα περίφραξη μάντρα στέγαστρο διαμόρφωση",
    p:"• Επιτρέπονται στους ακαλύπτους: διαμορφώσεις έως ±1,50 μ. από φυσικό έδαφος (γενικός κανόνας), πισίνες, πέργκολες, στέγαστρα ≤ ορισμένης επιφάνειας, καθιστικά, ΒΒQ, φυτεύσεις\n• Περιφράξεις: συμπαγές τμήμα έως 1,00 μ. + κιγκλίδωμα/φύτευση έως συνολικό 2,50 μ. (γενικός κανόνας — ειδικά καθεστώτα κατισχύουν)\n• Στην πρασιά: μόνο διαμορφώσεις/φυτεύσεις και ό,τι ρητά επιτρέπεται\n• Ισχύει και στην εκτός σχεδίου δόμηση (ρητή παραπομπή)"},
   {n:"Άρθρο 18",t:"Φυτεμένα δώματα",d:"Πράσινες στέγες/επιφάνειες.",k:"φυτεμένο δώμα πράσινη στέγη",
    p:"• Προδιαγραφές κατασκευής φυτεμένων δωμάτων/στεγών (υποστρώματα, στεγάνωση, φύτευση)\n• Κίνητρα: δεν προσμετρώνται σε δόμηση/κάλυψη υπό όρους"},
   {n:"Άρθρο 19",t:"Κατασκευές πάνω από το κτίριο",d:"Τι επιτρέπεται πάνω από το μέγιστο ύψος.",k:"απόληξη κλιμακοστασίου στέγη φωτοβολταϊκά πάνω από ύψος καπνοδόχοι",
    p:"• Πάνω από το μέγιστο ύψος επιτρέπονται: απόληξη κλιμακοστασίου/ανελκυστήρα (με μέγιστες διαστάσεις/ύψος), στέγη έως 2,00 μ. (γενικός κανόνας), ηλιακά/φωτοβολταϊκά, καπνοδόχοι, κεραίες, στηθαία, πέργκολες δώματος με όρους\n• Όλα εντός του ιδεατού στερεού όπου απαιτείται"},
   {n:"Άρθρο 20",t:"Κατασκευές σε κοινόχρηστους χώρους",d:"Περίπτερα, στέγαστρα στάσεων κ.λπ.",k:"κοινόχρηστοι χώροι περίπτερα στέγαστρα",
    p:"• Επιτρεπόμενες κατασκευές σε κοινόχρηστους: στέγαστρα στάσεων, περίπτερα, κιόσκια, έργα υποδομών, μνημεία — με έγκριση των αρμόδιων φορέων\n• Όροι ώστε να μην εμποδίζεται η κυκλοφορία πεζών/ΑμεΑ"},
   {n:"Άρθρο 21",t:"Προσωρινές κατασκευές",d:"Λυόμενα, εργοταξιακά.",k:"προσωρινές κατασκευές λυόμενα εργοτάξιο",
    p:"• Προσωρινές = τοποθετούνται/απομακρύνονται χωρίς μόνιμη σύνδεση με το έδαφος\n• Επιτρέπονται για συγκεκριμένο χρόνο/σκοπό με έγκριση — δεν δημιουργούν δικαιώματα δόμησης"},
   {n:"Άρθρο 22",t:"Παρόδια στοά",d:"Στοές όπου προβλέπονται.",k:"παρόδια στοά",
    p:"• Κατασκευάζεται όπου προβλέπεται από το ρυμοτομικό\n• Πλάτη/ύψη: αν δεν ορίζονται στο σχέδιο, εφαρμόζεται ο Κτιριοδομικός (άρθ. 17 του 2023: 2,50-4,50 μ. ανά πλάτος δρόμου)"},
   {n:"Άρθρο 23",t:"Νομίμως υφιστάμενα κτίρια",d:"Καθεστώς & προσθήκες.",k:"νομίμως υφιστάμενο προσθήκη επέκταση καθ ύψος",
    p:"• Νομίμως υφιστάμενο: με άδεια, ή προϋφιστάμενο του 1955, ή εξαιρεθέν/τακτοποιημένο οριστικά\n• Προσθήκες καθ' ύψος & κατ' επέκταση: με τις ισχύουσες διατάξεις για το νέο τμήμα· το παλιό διατηρείται\n• Επισκευές/ενισχύσεις επιτρέπονται ακόμη κι αν αντιβαίνει σε νεότερους όρους (υπό προϋποθέσεις)"},
   {n:"Άρθρο 24",t:"Χαμηλά κτίρια",d:"Ευνοϊκό καθεστώς έως 8,50 μ.",k:"χαμηλά κτίρια 8,50",
    p:"• Χαμηλό κτίριο: μέγιστο ύψος 8,50 μ. (+ στέγη)\n• Ευνοϊκές ρυθμίσεις: μειωμένες αποστάσεις δ από πλάγια όρια, απλούστερη ογκοπλασία\n• Συνηθισμένη επιλογή σε μεζονέτες/διπλοκατοικίες"},
   {n:"Άρθρο 25",t:"Κίνητρα ενεργειακής αναβάθμισης",d:"Κτίρια ελάχιστης κατανάλωσης.",k:"ενεργειακά κίνητρα αναβάθμιση μηδενική κατανάλωση",
    p:"• Κίνητρα (προσαύξηση ΣΔ/ύψους) για κτίρια σχεδόν μηδενικής ενεργειακής κατανάλωσης\n• ⚠ Ίδια επιφύλαξη με άρθ. 10: το καθεστώς αναδιατυπώθηκε μετά ΣτΕ — ισχύουσα μορφή στον Κώδικα 5306 (άρθ. 222)"},
   {n:"Άρθρο 26",t:"Προσβασιμότητα ΑμεΑ",d:"Ράμπες, ανελκυστήρες, προσβάσιμοι χώροι.",k:"ΑμεΑ προσβασιμότητα ράμπα ανελκυστήρας οδεύσεις",
    p:"• Νέα κτίρια: υποχρεωτική προσβασιμότητα σε κοινόχρηστους/κοινωφελείς χώρους και εισόδους — οριζόντια & κατακόρυφη (ανελκυστήρας/ράμπες)\n• Υφιστάμενα ειδικά κτίρια: υποχρέωση προσαρμογής (με μελέτη προσβασιμότητας)\n• Τεχνικές οδηγίες «Σχεδιάζοντας για Όλους» + Κτιριοδομικός άρθ. 25"},
  ]},
  {title:"Λοιπές διατάξεις",items:[
   {n:"Άρθ. 27–48",t:"Ειδικές, εξουσιοδοτικές, μεταβατικές & καταργούμενες",d:"Λοιπές ρυθμίσεις και έναρξη ισχύος.",k:"μεταβατικές καταργούμενες έναρξη ισχύος ειδικές",
    p:"• Ειδικές ρυθμίσεις, εξουσιοδοτήσεις για ΥΑ, τροποποιούμενες & καταργούμενες διατάξεις\n• Άρθ. 48: Έναρξη ισχύος\n• Ο ΝΟΚ καταργήθηκε ως κωδικοποιούμενος με τον Κώδικα 5306/2026 (άρθ. 477) — το περιεχόμενό του ζει στα άρθ. 195-225 αυτού"},
  ]}
 ]},
n4495:{
 fek:"Ν. 4495/2017\nΦΕΚ Α΄167",
 meta:"«Έλεγχος και προστασία του Δομημένου Περιβάλλοντος» — αυθαίρετα, άδειες, ταυτότητα κτιρίου (κωδικοποιημένος έως ν.5297/2026). Οι πλατφόρμες ΤΕΕ τρέχουν ακόμα με αυτή την αρίθμηση· παράλληλα κωδικοποιήθηκε στον Κώδικα 5306/2026 (αυθαίρετα → 366+, άδειες → 313+).",
 chapters:[
  {title:"Τμήμα Α΄ · Όργανα & μηχανισμοί (άρθ. 1–27)",items:[
   {n:"Άρθ. 1–6",t:"Παρατηρητήριο Δομημένου Περιβάλλοντος",d:"Δομή, αρμοδιότητες, μητρώα.",k:"παρατηρητήριο δομημένο περιβάλλον μητρώα",
    p:"• Παρατηρητήριο σε 3 επίπεδα: κεντρικό (ΥΠΕΝ), περιφερειακά, τοπικά\n• Τηρεί: μητρώο e-Αδειών, μητρώο ταυτότητας κτιρίων, πλατφόρμα αυθαιρέτων\n• Διενεργεί κληρώσεις ελεγκτών δόμησης, αναρτά χάρτη αυθαιρέτων"},
   {n:"Άρθ. 7–19",t:"Συμβούλια Αρχιτεκτονικής — Επιτροπές",d:"ΣΑ, ΠΕΣΑ, ΚΕΣΑ, προσβασιμότητα.",k:"συμβούλιο αρχιτεκτονικής ΣΑ ΚΕΣΑ γνωμοδότηση προσβασιμότητα",
    p:"• ΣΑ (7-9): γνωμοδοτούν υποχρεωτικά σε παραδοσιακούς οικισμούς, διατηρητέα, κτίρια άνω ορισμένης κλίμακας, παρεκκλίσεις μορφολογίας\n• ΠΕ.Σ.Α. & ΚΕ.Σ.Α.: δευτεροβάθμια/κεντρικά\n• Επιτροπές Προσβασιμότητας για θέματα ΑμεΑ"},
   {n:"Άρθ. 20–27",t:"ΣΥΠΟΘΑ — Ελεγκτές δόμησης",d:"Προσφυγές, μητρώο ελεγκτών.",k:"ΣΥΠΟΘΑ προσφυγή ελεγκτής δόμησης μητρώο εποπτικό",
    p:"• ΣΥΠΟΘΑ: εξέταση προσφυγών κατά πράξεων/παραλείψεων ΥΔΟΜ, αμφισβητήσεις\n• Ελεγκτές δόμησης: ιδιώτες μηχανικοί με μητρώο — έλεγχοι σταδίων αδειών & αυθαιρέτων με κλήρωση\n• Εποπτικό συμβούλιο ελεγκτών"},
  ]},
  {title:"Τμήμα Β΄ · Οικοδομικές άδειες (άρθ. 28–51)",items:[
   {n:"Άρθ. 28–29",t:"Ορισμοί — Διοικητικές πράξεις",d:"Οικοδομική άδεια, ΕΕΔΜΚ, 48ωρη.",k:"διοικητικές πράξεις ΕΕΔΜΚ 48ωρη μικρής κλίμακας κατεδάφιση",
    p:"• Άρθ. 29: Πράξεις εκτέλεσης εργασιών: (α) οικοδομική άδεια, (β) ΕΕΔΜΚ, (γ) 48ωρη έγγραφη ενημέρωση ΥΔΟΜ, (δ) έγκριση κατεδάφισης\n• Ποια εργασία απαιτεί ποια πράξη — καθορίζεται εδώ + στην εξειδικευτική ΥΑ μικρής κλίμακας"},
   {n:"Άρθρο 30",t:"Εργασίες χωρίς άδεια/έγκριση",d:"Ο κατάλογος των ελεύθερων εργασιών.",k:"εργασίες χωρίς άδεια ελεύθερες επισκευές διαρρυθμίσεις βαψίματα",
    p:"• Χωρίς καμία πράξη: εσωτερικοί/εξωτερικοί χρωματισμοί χωρίς ικριώματα, μικροεπισκευές, συντήρηση εγκαταστάσεων, εσωτερικές διαρρυθμίσεις ΧΩΡΙΣ επέμβαση σε φέροντα\n• Με 48ωρη ενημέρωση: κάποιες εξ αυτών όταν απαιτούν ικριώματα κ.λπ.\n• ⚠ Ό,τι δεν είναι στη λίστα → ΕΕΔΜΚ ή άδεια"},
   {n:"Άρθ. 31–37",t:"Αρμόδια όργανα — Προέγκριση — Κατηγορίες",d:"ΥΔΟΜ, προέγκριση, τρόπος έκδοσης 1/2/3.",k:"προέγκριση κατηγορίες έκδοσης ΥΔΟΜ αυτόματη",
    p:"• Άρθ. 35: Προέγκριση — κλειδώνει όρους δόμησης πριν την πλήρη μελέτη (προαιρετική γενικά, υποχρεωτική σε ειδικές περιπτώσεις)\n• Άρθ. 36: Κατηγορίες 1/2/3 έκδοσης: (1) με έλεγχο ΥΔΟΜ, (2) αυτόματη έκδοση με εκ των υστέρων έλεγχο, (3) αυτόματη — ανάλογα με είδος/θέση έργου"},
   {n:"Άρθ. 38–43",t:"Δικαιολογητικά — Μελέτες — Ισχύς",d:"Τι υποβάλλεται, διάρκεια, αναθεώρηση.",k:"δικαιολογητικά μελέτες τοπογραφικό διάγραμμα κάλυψης ισχύς αναθεώρηση ενημέρωση",
    p:"• Δικαιολογητικά: τοπογραφικό ΕΓΣΑ'87, διάγραμμα κάλυψης, αρχιτεκτονικά, στατικά, Η/Μ, ΚΕΝΑΚ, πυροπροστασία κατά περίπτωση\n• Ισχύς οικοδομικής άδειας: 4 έτη (με δυνατότητες παράτασης/αναθεώρησης)\n• Αναθεώρηση: για αλλαγές μελέτης — Ενημέρωση: για ήσσονες τροποποιήσεις\n• ΕΕΔΜΚ: ισχύς 1 έτους"},
   {n:"Άρθ. 44–51",t:"Εκτέλεση — Έλεγχοι — Ηλεκτροδότηση",d:"Στάδια ελέγχου, σύνδεση με δίκτυα.",k:"έλεγχος ελεγκτής στάδια ηλεκτροδότηση σύνδεση ΔΕΗ πινακίδα αποπεράτωση",
    p:"• Υποχρεωτικοί έλεγχοι ελεγκτών δόμησης σε στάδια (θεμελίωση/φέρων/ολοκλήρωση — ανάλογα με κατηγορία έργου)\n• Πόρισμα ελεγκτή → ΥΔΟΜ\n• Άρθ. 47/47Α: Αποπεράτωση, σύνδεση με δίκτυα κοινής ωφέλειας, διαδικασία ηλεκτροδότησης (ΔΕΔΔΗΕ) με βεβαίωση"},
  ]},
  {title:"Τμήμα Γ΄ · Ταυτότητα κτιρίου — Ψηφιακά (άρθ. 52–80)",items:[
   {n:"Άρθ. 52–62",t:"Ηλεκτρονική Ταυτότητα Κτιρίου",d:"Περιεχόμενο, πιστοποιητικά, υπόχρεοι.",k:"ηλεκτρονική ταυτότητα κτιρίου πιστοποιητικό πληρότητας μεταβίβαση",
    p:"• Υποχρεωτική για ΚΑΘΕ μεταβίβαση/σύσταση εμπράγματου δικαιώματος\n• Περιεχόμενο: στέλεχος άδειας, σχέδια as-built, δηλώσεις αυθαιρέτων, ΠΕΑ, πιστοποιητικά\n• Εκδίδεται Πιστοποιητικό Πληρότητας (ανά κτίριο ή διηρημένη ιδιοκτησία)\n• Συντάσσεται από εξουσιοδοτημένο μηχανικό"},
   {n:"Άρθ. 65–66",t:"Πολεοδομική Ταυτότητα Δήμων",d:"Ψηφιακή παρακολούθηση σχεδιασμού.",k:"πολεοδομική ταυτότητα δήμων επίσπευση",
    p:"• Άρθ. 65: Ηλεκτρονική Πολεοδομική Ταυτότητα Δήμων — ψηφιακή αποτύπωση θεσμικών γραμμών/όρων ανά δήμο\n• Άρθ. 66: Παρακολούθηση & επίσπευση εξέλιξης πολεοδομικού σχεδιασμού"},
   {n:"Άρθ. 67–80",t:"Μεταφορά ΣΔ — Τράπεζα Γης — Ισοζύγιο",d:"ΜΣΔ, ΕΠΙ, ζώνες υποδοχής.",k:"μεταφορά συντελεστή ΜΣΔ τράπεζα γης περιβαλλοντικό ισοζύγιο ΖΥΣ τίτλος",
    p:"• Τίτλοι ΜΣΔ (από διατηρητέα, ρυμοτομούμενα, αρχαιολογικά δεσμευμένα) & τίτλοι ΕΠΙ (εισφορά περιβαλλοντικού ισοζυγίου από τακτοποιήσεις)\n• Ψηφιακή Τράπεζα Γης / Τράπεζα Δικαιωμάτων Δόμησης & Κοινόχρηστων Χώρων\n• Ζώνες Υποδοχής Συντελεστή (ΖΥΣ) — πού «κάθεται» ο μεταφερόμενος ΣΔ"},

  {title:"Τμήμα Δ΄ · Αυθαίρετα — Πρόληψη (άρθ. 81–95)",items:[
   {n:"Άρθρο 81",t:"Ορισμοί — Πολεοδομική παράβαση",d:"Η κρίσιμη διάκριση.",k:"ορισμοί πολεοδομική παράβαση αυθαίρετη κατασκευή αλλαγή χρήσης",
    p:"• Αυθαίρετη κατασκευή: χωρίς/καθ' υπέρβαση άδειας ή με άδεια που ανακλήθηκε\n• Αυθαίρετη αλλαγή χρήσης: χρήση χωρίς την απαιτούμενη πράξη\n• ΠΟΛΕΟΔΟΜΙΚΗ ΠΑΡΑΒΑΣΗ: ήσσονες περιπτώσεις (π.χ. Κατηγορία 3, εργασίες άνευ ΕΕΔΜΚ) → μόνο διοικητικές κυρώσεις άρθ. 94, όχι κατεδάφιση"},
   {n:"Άρθρο 82",t:"Απαγόρευση δικαιοπραξιών",d:"Μεταβιβάσεις ακινήτων με αυθαίρετα.",k:"δικαιοπραξία μεταβίβαση απαγόρευση συμβόλαιο άκυρη",
    p:"• Άκυρη κάθε δικαιοπραξία εν ζωή σε ακίνητο με αυθαίρετη κατασκευή/χρήση\n• Εξαιρέσεις: τακτοποιημένα/εξαιρεθέντα, προ-1955, κατηγορίας που έχει υπαχθεί, κληρονομιές, δικαστικές διανομές κ.λπ."},
   {n:"Άρθρο 83",t:"Βεβαίωση μηχανικού",d:"Το καθημερινό εργαλείο των μεταβιβάσεων.",k:"βεβαίωση μηχανικού συμβόλαιο τοπογραφικό δύο μήνες αυτοψία",
    p:"• Σε ΚΑΘΕ δικαιοπραξία/εγγραπτέα πράξη: βεβαίωση μηχανικού ότι δεν υπάρχουν αυθαίρετα ή ότι έχουν υπαχθεί\n• Ισχύς: 2 μήνες από την αυτοψία\n• Συνοδεύεται από εξαρτημένο τοπογραφικό ΕΓΣΑ'87 (με τις εξαιρέσεις εντός σχεδίου που προβλέπονται)\n• Ηλεκτρονική έκδοση με μοναδικό αριθμό ΤΕΕ"},
   {n:"Άρθρο 84",t:"Απαγόρευση σύνδεσης με δίκτυα",d:"Ρεύμα/νερό σε αυθαίρετα.",k:"σύνδεση δίκτυα ρεύμα νερό απαγόρευση",
    p:"• Απαγορεύεται η σύνδεση αυθαίρετων κτισμάτων με δίκτυα κοινής ωφέλειας\n• Επανασύνδεση/σύνδεση μόνο μετά από υπαγωγή ή νομιμοποίηση"},
   {n:"Άρθ. 85–95",t:"Εντοπισμός — Χαρακτηρισμός — Κυρώσεις",d:"Αυτοψίες, προσφυγές, πρόστιμα, μετά το 2011.",k:"εντοπισμός χαρακτηρισμός αυτοψία προσφυγή πρόστιμα κυρώσεις 94",
    p:"• Άρθ. 85-87: Δορυφορικοί χάρτες, ηλεκτρονικός εντοπισμός & καταγραφή\n• Άρθ. 88-90: Διαπίστωση, χαρακτηρισμός, προσφυγή\n• Άρθ. 92: Έλεγχος από ελεγκτές δόμησης\n• Άρθ. 94: Κυρώσεις ΠΟΛΕΟΔΟΜΙΚΩΝ ΠΑΡΑΒΑΣΕΩΝ (μόνο πρόστιμα)\n• Αυθαίρετα ΜΕΤΑ τις 28.7.2011: κατεδάφιση + πρόστιμα ανέγερσης/διατήρησης — ΔΕΝ τακτοποιούνται"},
  ]},
  {title:"Τμήμα Δ΄ · Υπαγωγή & πρόστιμα (άρθ. 96–125)",items:[
   {n:"Άρθρο 96",t:"Κατηγορίες αυθαιρέτων 1–5",d:"Η ραχοκοκαλιά κάθε δήλωσης.",k:"κατηγορίες 1 2 3 4 5 1975 1983 40% ποσοστά",
    p:"• Κατ. 1: προ 9.6.1975 → οριστική εξαίρεση με παράβολο\n• Κατ. 2: προ 1.1.1983 → οριστική εξαίρεση\n• Κατ. 3: μικρές παραβάσεις (κατάλογος: πέργκολες, ΒΒQ, εξώστες <10% κ.λπ.) → οριστική με παράβολο\n• Κατ. 4: υπερβάσεις έως 40% κάλυψης & δόμησης, έως 20% ύψους (εντός οικοδ. αδείας) → οριστική μετά ταυτότητα κτιρίου\n• Κατ. 5: όλα τα υπόλοιπα → αναστολή 30ετίας (οριστικοποίηση μέσω μεταφοράς ΣΔ/ισοζυγίου)"},
   {n:"Άρθρο 97",t:"Αναστολή & εξαίρεση από κατεδάφιση",d:"Τι σημαίνει πρακτικά η υπαγωγή.",k:"αναστολή εξαίρεση κατεδάφιση 30 χρόνια οριστική",
    p:"• Κατ. 1-4: οριστική εξαίρεση από κατεδάφιση\n• Κατ. 5: αναστολή κυρώσεων για 30 έτη από την ισχύ του νόμου, με καταβολή προστίμου\n• Η υπαγωγή δεν θεραπεύει άλλες παρανομίες (δασικά, αιγιαλός, ρέματα — άρθ. 89 απαγορεύσεις)"},
   {n:"Άρθρο 98",t:"Ρυθμίσεις ν.δ. 1024/1971",d:"Κάθετες ιδιοκτησίες σε εκτός σχεδίου.",k:"1024/71 κάθετη ιδιοκτησία εκτός σχεδίου σύσταση 3741",
    p:"• Ρυθμίζει τις συστάσεις καθέτων (ν.δ.1024/71) και οριζοντίων (ν.3741/1929) σε εκτός σχεδίου γήπεδα\n• Δυνατότητα υπαγωγής/διατήρησης συστάσεων υπό προϋποθέσεις — κρίσιμο σε παλιές συστάσεις με περισσότερα κτίσματα ανά γήπεδο\n• Πάντα σε συνδυασμό με τους περιορισμούς κατάτμησης εκτός σχεδίου"},
   {n:"Άρθρο 99",t:"Δικαιολογητικά υπαγωγής",d:"Ο φάκελος της δήλωσης.",k:"δικαιολογητικά δήλωση τοπογραφικό στατική επάρκεια αεροφωτογραφία",
    p:"• Αίτηση, υπεύθυνη δήλωση ιδιοκτήτη, τελευταία δήλωση Ε9\n• Εξαρτημένο τοπογραφικό ΕΓΣΑ'87, κατόψεις/τομές, φωτογραφίες\n• Τεχνική έκθεση μηχανικού\n• Απόδειξη χρόνου: αεροφωτογραφίες ή δημόσια έγγραφα\n• Μελέτη στατικής επάρκειας ή ΔΕΔΟΤΑ κατά περίπτωση (με τις ισχύουσες προθεσμίες υποβολής)"},
   {n:"Άρθρο 100",t:"Υπολογισμός ενιαίου ειδικού προστίμου",d:"Ο τύπος του προστίμου.",k:"πρόστιμο υπολογισμός τύπος συντελεστές τιμή ζώνης παράρτημα",
    p:"• Πρόστιμο = τιμή ζώνης × τ.μ. × 15% × συντελεστές Παραρτήματος Α\n• Συντελεστές: παλαιότητας, κατηγορίας αυθαιρέτου, χρήσης, κύριας/βοηθητικής, κοινωνικοί (ΑμεΑ, πολύτεκνοι, μόνιμη κατοικία), εντός/εκτός σχεδίου\n• Λοιπές παραβάσεις χωρίς εμβαδόν: αναλυτικός προϋπολογισμός × ποσοστό"},
   {n:"Άρθρο 101",t:"Καταβολή προστίμου — Δόσεις",d:"Τρόπος πληρωμής.",k:"δόσεις εφάπαξ έκπτωση καταβολή προθεσμία",
    p:"• Καταβολή σε μηνιαίες δόσεις (πλήθος κατά τις ισχύουσες ΚΥΑ)\n• Έκπτωση 20% σε εφάπαξ, 10% με προκαταβολή 30%\n• Καθυστέρηση δόσης → προσαύξηση· μη καταβολή → απώλεια ρύθμισης"},
   {n:"Άρθρο 102",t:"Μειώσεις/επιβαρύνσεις — Καταληκτικές",d:"Πότε φθηναίνει/ακριβαίνει η δήλωση.",k:"καταληκτική ημερομηνία προθεσμία κατηγορία 5 προσαύξηση μείωση",
    p:"• Μειώσεις για πρώιμη υπαγωγή, προσαυξήσεις ανά εξάμηνα καθυστέρησης\n• Καταληκτικές ημερομηνίες υπαγωγής ανά κατηγορία — για την Κατ. 5 έχουν δοθεί διαδοχικές παρατάσεις/ειδικά παράθυρα\n• ⚠ Οι ημερομηνίες αλλάζουν με τροπολογίες — έλεγξε ΠΑΝΤΑ την τρέχουσα (AI Αναζήτηση)"},
   {n:"Άρθ. 103–113",t:"Ειδικές ομάδες — Συμψηφισμός — Νομιμοποίηση",d:"ΑμεΑ, παλιοί νόμοι, άδεια νομιμοποίησης.",k:"ΑμεΑ πολύτεκνοι συμψηφισμός 4178 4014 νομιμοποίηση έλεγχος δηλώσεων",
    p:"• Μειωμένα πρόστιμα: ΑμεΑ, παλιννοστούντες, πολύτεκνοι, τρίτεκνοι, μακροχρόνια άνεργοι\n• Συμψηφισμός ποσών που καταβλήθηκαν με ν.4014/2011 & ν.4178/2013\n• Υπαγωγή με έκδοση άδειας νομιμοποίησης (αν το κτίσμα δεν αντίκειται στις ισχύουσες ή τις τότε διατάξεις) ή άδειας κατεδάφισης\n• Έλεγχος δηλώσεων από ελεγκτές δόμησης (δειγματοληπτικός)"},
   {n:"Άρθ. 114–125",t:"Ειδικές περιπτώσεις",d:"Παραδοσιακοί, διατηρητέα, τουριστικά κ.λπ.",k:"παραδοσιακός διατηρητέο σταβλικά τουριστικά υψηλή τάση ειδικές στάσιμοι",
    p:"• Στάσιμοι οικισμοί, παραδοσιακοί & προστατευόμενες περιοχές (πρόσθετες εγκρίσεις ΣΑ/επιτροπών)\n• Διατηρητέα κτίρια — ειδική διαδικασία\n• Πλησίον γραμμών υψηλής τάσης, τουριστικές εγκαταστάσεις, σταβλικά, υδατοκαλλιέργειες, παραμεθόριες, κοινωφελή\n• Εξουσιοδοτικές & μεταβατικές Τμήματος Δ΄"},
  ]},
  {title:"Λοιπά (άρθ. 126 επ.)",items:[
   {n:"Άρθ. 126 επ.",t:"Επικίνδυνες οικοδομές — Τελικές διατάξεις",d:"Ετοιμόρροπα, λοιπές ρυθμίσεις.",k:"επικίνδυνη ετοιμόρροπη οικοδομή μεταβατικές",
    p:"• Επικίνδυνες/ετοιμόρροπες κατασκευές: πρωτόκολλο αυτοψίας, μέτρα άρσης κινδύνου, κυρώσεις\n• Λοιπές, εξουσιοδοτικές, μεταβατικές & καταργούμενες διατάξεις"},

 chapters:[
  {title:"Ενότητα Α · Εισαγωγή",items:[
   {n:"Άρθρο 1",t:"Σκοπός — Γενικές αρχές — Πεδίο εφαρμογής",d:"Σκοπός, αρμόδια αρχή, έκταση εφαρμογής.",k:"σκοπός πεδίο εφαρμογής ΥΔΟΜ",
    p:"• Ρυθμίζει την κατασκευή των δομικών έργων (άνεση, υγεία, ασφάλεια, εξοικονόμηση ενέργειας)\n• Αρμόδια αρχή: ΥΔΟΜ\n• Εφαρμόζεται εντός ΚΑΙ εκτός σχεδίου\n• Εξαίρεση: τα άρθ. 9, 10, 17, 19 ΔΕΝ εφαρμόζονται εκτός σχεδίου (και το 17 όχι σε οικισμούς χωρίς σχέδιο)"},
   {n:"Άρθρο 2",t:"Ορισμοί",d:"Ελεύθερο/μικτό ύψος, χώροι κύριας/βοηθητικής χρήσης κ.ά.",k:"ορισμοί ελεύθερο ύψος 2,50 2,20 κύρια βοηθητική χρήση όδευση ρέμα",
    p:"• Χώροι ΚΥΡΙΑΣ χρήσης (υπνοδωμάτια, καθιστικά, κουζίνες, γραφεία): ελεύθερο ύψος ≥ 2,50 μ. (για κτίρια μετά τον ΝΟΚ)\n• Χώροι ΒΟΗΘΗΤΙΚΗΣ χρήσης (διάδρομοι, WC, αποθήκες, στάθμευση): ≥ 2,20 μ.\n• Ορισμοί: ελεύθερο/μικτό ύψος, άμεσος/έμμεσος φωτισμός-αερισμός, όδευση διαφυγής, ρέμα, πληθυσμός, ΑμεΑ/εμποδιζόμενα άτομα, προκήπιο"},
  ]},
  {title:"Ενότητα Β · Σχεδιασμός κτιρίων & χώρων",items:[
   {n:"Άρθρο 3",t:"Ταξινόμηση κατά χρήση",d:"Κατηγορίες Α–Μ.",k:"ταξινόμηση χρήση κατηγορίες κατοικία συνάθροιση",
    p:"• Α Κατοικία, Β Προσωρινή διαμονή (ξενοδοχεία), Γ Συνάθροιση κοινού (≥50 άτομα: εστιατόρια, ναοί, θέατρα, αθλητικοί χώροι), Δ Εκπαίδευση (6-49 άτομα), Ε Υγεία-Πρόνοια, Ζ Σωφρονισμός, Η Εμπόριο, Θ Γραφεία, Ι Βιομηχανία-Βιοτεχνία, Κ Αποθήκευση, Λ Στάθμευση-Πρατήρια, Μ Λοιπές\n• Κτίριο με >1 χρήσεις = μικτής χρήσης, κάθε τμήμα με τους κανόνες του\n• Στέγαστρα γηπέδων = εξοπλισμός (δεν μετρούν σε κάλυψη/ΣΔ αν δεν κλείνουν χώρο)"},
   {n:"Άρθρο 4",t:"Πληθυσμός",d:"Θεωρητικός πληθυσμός ανά χρήση.",k:"πληθυσμός άτομα τετραγωνικά υπολογισμός",
    p:"• Κατοικία & προσωρινή διαμονή: 1 άτομο / 18 m² μικτά\n• Συνάθροιση: 1/1,40 m² (εστιατόρια, εκθέσεις) — 1/0,65 m² (θέατρα, ναοί, αμφιθέατρα) — 1/0,30 m² (όρθιοι/αναμονή) — σταθερά καθίσματα: 1/κάθισμα ή 1/0,45 μ. πάγκου\n• Εκπαίδευση: 1/1,5 m² αίθουσας — Υγεία: 1/11 m² νοσηλεία, 1/22 m² λοιπά\n• Εμπόριο: 1/3 m² ισόγειο, 1/6 m² όροφοι — Γραφεία: 1/9 m² — Βιομηχανία: 1/10 m² — Αποθήκες & στάθμευση: 1/50 m²"},
   {n:"Άρθρο 5",t:"Ασφάλεια — Αντοχή — Θεμελιώσεις — Ψηλά κτίρια",d:"Σεισμικός αρμός, εκσκαφές, θεμέλια.",k:"ασφάλεια σεισμικός αρμός θεμελίωση εκσκαφή αντοχή Δν εκρηκτικά",
    p:"• Υποχρεωτική συνεχής συντήρηση από ιδιοκτήτες\n• ΣΕΙΣΜΙΚΟΣ ΑΡΜΟΣ: απόσταση νέου κτιρίου από όριο ≥ Δν (μέγιστη σεισμική μετακίνηση)· όταν υπάρχει κτίριο στο όριο, ο αρμός υπολογίζεται για ΚΑΙ τα δύο κτίρια και διαμορφώνεται εξ ολοκλήρου στο νέο οικόπεδο· μη υποχρεωτικός σε προσθήκες καθ' ύψος νομίμως υφισταμένων\n• Θεμέλια: απαγορεύεται προεξοχή σε όμορα/κοινόχρηστα — κατ' εξαίρεση έως 0,30 μ. εκτός ρυμοτομικής σε βάθος >2,50 μ., και στο προκήπιο σε βάθος >0,40 μ.\n• Εκσκαφές με εκρηκτικά εντός πόλεων: μόνο με ειδική άδεια & έκθεση επιβλέποντα\n• Απαγορεύεται θεμελίωση σε πρόσφατες μη συμπιεσμένες επιχώσεις"},
   {n:"Άρθρο 6",t:"Δόμηση κοντά σε ρέματα",d:"Οριογραμμές και δόμηση.",k:"ρέμα οριογραμμές οριοθέτηση υδατόρεμα",
    p:"• ΑΠΟΛΥΤΗ απαγόρευση δόμησης εντός οριογραμμών ρέματος\n• Εκτός οριογραμμών: επιτρέπεται εφόσον (αν προβλέπονται) έχουν κατασκευαστεί τα έργα διευθέτησης\n• Καταργημένα ρέματα σε ρυμοτομικά: δόμηση μετά από βεβαίωση Δ/νσης Υδάτων\n• Χωρίς απαίτηση οριοθέτησης: άρση επικινδυνότητας, αποπεράτωση νομίμων με ολοκληρωμένο φέροντα, αλλαγή χρήσης, ενεργειακή αναβάθμιση, στατική ενίσχυση εντός κελύφους, κατεδάφιση"},
   {n:"Άρθρο 7",t:"Ελεύθερο ύψος και καθαρός όγκος",d:"Ελάχιστα ύψη χώρων.",k:"ελεύθερο ύψος 2,50 2,20 2,00 καθαρός όγκος δοκός",
    p:"• Ελάχιστα ελεύθερα ύψη: κύρια χρήση 2,50 μ. — βοηθητική 2,20 μ. — κάτω από δοκούς/Η-Μ 2,00 μ.\n• Προ της 30.9.1955: μειώνονται σε 2,20 / 2,00 / 1,90 μ.\n• Χώροι συνάθροισης & αίθουσες διδασκαλίας: καθαρός όγκος ≥ 3 m³/άτομο (όρθιοι: ≥ 1,2 m³/άτομο)\n• Τμήματα με ύψος < 2,00 μ. δεν μετρούν σε δάπεδο/όγκο"},
   {n:"Άρθρο 8",t:"Τοίχοι, ανοίγματα και κουφώματα",d:"Κατηγορίες & απαιτούμενες ιδιότητες.",k:"τοίχοι κουφώματα ανοίγματα ιδιότητες μόνωση",
    p:"• Κατηγορίες: υπαίθρου/κτιρίου, εσωτερικοί/εξωτερικοί, κτιστοί/χυτοί/με σκελετό, φέροντες/μη\n• Απαιτούμενες ιδιότητες: ευστάθεια σε σεισμό, αντοχή σε άνεμο, πυραντίσταση (κατά ΚΠΚ), θερμομόνωση (ΚΕΝΑΚ), ηχομόνωση (άρθ. 22), υγρομόνωση, αντοχή σε ηλιακή ακτινοβολία"},
   {n:"Άρθρο 9",t:"Τοίχοι στα όρια — Μεσότοιχοι",d:"Κοινό όριο, ανοίγματα.",k:"μεσότοιχος όριο οικοπέδου ανοίγματα συνένωση pilotis",
    p:"• Στο κοινό όριο: ΧΩΡΙΣΤΟΣ εξωτερικός τοίχος ανά κτίριο, εξ ολοκλήρου στο δικό του οικόπεδο\n• Νέοι μεσότοιχοι: ΑΠΑΓΟΡΕΥΟΝΤΑΙ — παλιοί (προ 30.9.55) δεν κατεδαφίζονται χωρίς συναίνεση\n• ΑΠΑΓΟΡΕΥΟΝΤΑΙ ανοίγματα σε τοίχους επί του κοινού ορίου\n• Εξαίρεση: διάνοιξη για λειτουργική συνένωση όμορων νομίμων κτιρίων υπό όρους (χωρίς αυθαίρετη αλλαγή χρήσης, τήρηση ΝΟΚ 23§5)\n• Pilotis σε επαφή με όριο: δεν απαιτείται τοίχος (αρκεί περίφραγμα)"},
   {n:"Άρθρο 10",t:"Περιφράγματα",d:"Θέση & επιτρεπόμενες κατασκευές.",k:"περίφραγμα μάντρα μετρητές πορτασιά",
    p:"• Στο πρόσωπο: εξ ολοκλήρου ΕΝΤΟΣ οικοπέδου — στο κοινό όριο: εντός ή εκατέρωθεν με συμφωνία ομόρων\n• Σε απόσταση από τα όρια: επιτρέπεται μετά από γνωμοδότηση ΣΑ\n• Στο πρόσωπο επιτρέπονται: ερμάρια μετρητών ΔΕΗ/αερίου, κάδοι, πορτασιές-χώρος εισόδου\n• Ύψη/μορφή περίφραξης: κατά ΝΟΚ άρθ. 17 (δεν εφαρμόζεται το άρθ. 10 εκτός σχεδίου)"},
   {n:"Άρθρο 11",t:"Κλίμακες",d:"Πλάτη, βαθμίδες, τύποι Ι/ΙΙ/ΙΙΙ.",k:"σκάλα κλίμακα πλάτος βαθμίδα ρίχτι πάτημα ανεμόσκαλα",
    p:"• Κάθε κτίριο: ≥1 κλίμακα ελεύθερου πλάτους 1,20 μ.\n• Εξαιρέσεις: 0,90 μ. σε κατοικίες ≤3 ορόφων (μετρά και pilotis) — 0,60 μ. εσωτερική ενιαίας κατοικίας (αν δεν είναι όδευση διαφυγής)\n• Βαθμίδες: ύψος 0,13-0,18 μ. (τύπος ΙΙ έως 0,20), πάτημα ≥0,28 μ. (τύπος Ι) — κανόνας 2υ+π = 0,60-0,66 μ.\n• Ελεύθερο ύψος κλίμακας ≥2,20 μ. — μέγ. υψομετρική διαφορά πλατύσκαλων 3,60 μ.\n• Πόρτες κατευθείαν σε βαθμίδες: ΔΕΝ επιτρέπονται\n• Υγεία (Ε): τύπου Ι — Εκπαίδευση/Συνάθροιση: τύπου Ι (εξαιρέσεις ≤20 άτομα)\n• Ανεμόσκαλες: μόνο σε βιομηχανία για στάθμες Η/Μ ≤3 ατόμων"},
   {n:"Άρθρο 12",t:"Ράμπες πεζών",d:"Μέγιστες κλίσεις.",k:"ράμπα κλίση πεζοί",
    p:"• Παραπέμπει στις ισχύουσες προδιαγραφές προσβασιμότητας (ΥΑ ΥΠΕΝ/ΔΜΕΑΑΠ/124964/1561/2022 κ.λπ.)\n• Πρακτικά: ράμπες ΑμεΑ ≤5% (έως 8% σε μικρά μήκη κατά τις προδιαγραφές), με πλατύσκαλα & χειρολισθήρες"},
   {n:"Άρθρο 13",t:"Στηθαία",d:"Ύψη, διάκενα, φορτία.",k:"στηθαίο κιγκλίδωμα ύψος 1,00 διάκενα φορτίο",
    p:"• Υποχρεωτικά όπου δάπεδο >1,00 μ. από περιβάλλοντα χώρο (εξώστες, δώματα, σκάλες)\n• Ύψος ≥1,00 μ. — συμπαγή έως 1,20 μ. (πάνω από 1,20 μόνο κιγκλίδωμα)\n• Διάκενα: κατακόρυφα ≤0,25 μ. / οριζόντια ≤0,15 μ. (κανόνες συνδυασμού)\n• Κτίρια με παιδιά (σχολεία, μουσεία): χωρίς «σκαλοπάτια» αναρρίχησης, διάκενο ≤0,15 μ.\n• Φόρτιση: 75 kp/m οριζόντια (σημείο εφαρμογής έως 1,10 μ.)\n• Εφαρμόζεται ΚΑΙ σε υφιστάμενα όταν το κρίνει η ΥΔΟΜ"},
   {n:"Άρθρο 14",t:"Χειρολισθήρες (κουπαστές)",d:"Πού και πώς.",k:"κουπαστή χειρολισθήρας",
    p:"• Υποχρεωτικοί: σε 1 πλευρά κάθε κλίμακας & ράμπας κλίσης >6% — σε ΔΥΟ πλευρές αν πλάτος >1,20 μ.\n• Ύψος 0,75-1,00 μ., συνεχείς σε όλο τον κλάδο, ελεύθερο διάστημα 0,05 μ. από τοίχο\n• Αντοχή σε συγκεντρωμένο φορτίο 90 kp"},
   {n:"Άρθρο 15",t:"Απομάκρυνση ομβρίων",d:"Δώματα, εξώστες.",k:"όμβρια απορροή δώμα εξώστης υδρορροή",
    p:"• ΑΠΑΓΟΡΕΥΕΤΑΙ η ελεύθερη απορροή από δώματα, ημιυπαίθριους, εξώστες\n• Εγκιβωτισμός με περιμετρικές κατασκευές ≥0,05 μ. και αποχέτευση με αγωγούς (κατά άρθ. 27)"},
   {n:"Άρθρο 16",t:"Εσωτερικές στοές",d:"Πλάτη, αδιέξοδα, αερισμός.",k:"εσωτερική στοά πλάτος αδιέξοδο",
    p:"• Πλάτος: ≥4 μ. ΚΑΙ ≥1/10 του μήκους (έως 8 μ.) ΚΑΙ ≥0,55 μ./100 άτομα πληθυσμού\n• Απαγορεύονται αδιέξοδοι κλάδοι & φράξιμο άκρων (ούτε πόρτα)\n• Μελέτη αερισμού για στοές >80 μ.\n• Καμία πόρτα σε απόσταση >60 μ. από το πλησιέστερο άκρο\n• Χώροι υψηλού κινδύνου: χωρίς άνοιγμα προς στοά"},
   {n:"Άρθρο 17",t:"Πλάτη παρόδιων στοών",d:"Όπου δεν ορίζονται στο σχέδιο.",k:"παρόδια στοά πλάτος δρόμος",
    p:"• Δρόμος ≤7,30 μ. → στοά 2,50 μ.\n• 7,30-10,30 → 3,00 μ. | 10,30-14,30 → 3,50 μ. | 14,30-19,30 → 4,00 μ. | >19,30 → 4,50 μ.\n• Πλάτος δρόμου = απόσταση οικοδομικών γραμμών (μέσο πλάτος αν μεταβλητό)"},
   {n:"Άρθρο 18",t:"Προσπέλαση κτιρίων",d:"Πρόσβαση όταν η είσοδος απέχει.",k:"προσπέλαση πρόσβαση είσοδος πυροσβεστικό όχημα",
    p:"• Όταν η είσοδος απέχει >30 μ. από την είσοδο του οικοπέδου (ή είναι σε αίθριο): απαιτείται προσπέλαση πεζών & οχημάτων\n• Χαρακτηριστικά: ελεύθερο πλάτος ≥3,5 μ., ύψος ≥3,0 μ., ακτίνα καμπυλότητας ≥3,5 μ., κλίση ≤7% στα πρώτα 5 μ. & ≤17% μετά"},
   {n:"Άρθρο 19",t:"Φύτευση οικοπέδων",d:"Δένδρα ανά εμβαδόν, φυλάκια.",k:"φύτευση δένδρα προκήπιο πρασιά φυλάκιο",
    p:"• Οικόπεδα ≥200 m²: 1 δένδρο / 200 m² οικοπέδου (+1 αν υπόλοιπο ≥100 m²)\n• Προκήπια: 1 δένδρο / 25 m² προκηπίου (+1 αν υπόλοιπο >12 m²)\n• Κτίρια εκπαίδευσης: στο υποχρεωτικό ακάλυπτο μετρά έως 50% επιφάνεια υπαίθριων αθλητικών\n• Φυλάκια σε ακάλυπτο/προκήπιο: με γνώμη ΣΑ, ισόγεια ≤4 μ. ύψος, ≤5% ακαλύπτου, ≤150 m²\n• ΔΕΝ εφαρμόζεται εκτός σχεδίου"},
  ]},
  {title:"Ενότητα Γ · Εξυπηρέτηση χρηστών",items:[
   {n:"Άρθρο 20",t:"Φυσικός φωτισμός",d:"Ανοίγματα 10% — έμμεσος 15%.",k:"φωτισμός ανοίγματα 10% παράθυρα κλιμακοστάσιο",
    p:"• Όλοι οι χώροι κύριας χρήσης: επαρκής φυσικός φωτισμός\n• ΑΜΕΣΟΣ υποχρεωτικά: κατοικίες, υπνοδωμάτια ξενοδοχείων, αίθουσες διδασκαλίας, εστιατόρια, θάλαμοι νοσηλείας, εργαστήρια, γραφεία (πλην open-plan), μαγειρεία, φαρμακεία\n• Επαρκής άμεσος: ανοίγματα ≥10% του καθαρού εμβαδού του χώρου\n• Έμμεσος: ανοίγματα ≥15% προς χώρο με άμεσο φωτισμό\n• Κλιμακοστάσια κλειστά: 1 άνοιγμα/όροφο ≥0,50 m²\n• Εξαιρούνται: υπόγεια, σοφίτες, υπόσκαφα κατά ΝΟΚ"},
   {n:"Άρθρο 21",t:"Φυσικός αερισμός",d:"Ανοίγματα 5% — έμμεσος 7%.",k:"αερισμός 5% κλιμακοστάσιο μπάνιο WC",
    p:"• Επαρκής άμεσος αερισμός: ανοιγόμενα ανοίγματα ≥5% του καθαρού εμβαδού χώρου\n• Έμμεσος: ≥7% προς χώρο με άμεσο\n• Ισχύει ακόμη κι αν υπάρχει τεχνητός αερισμός (για κατοικίες)\n• Κλιμακοστάσιο: άνοιγμα ≥0,20 m² στην οροφή ή έως 1 μ. από αυτή\n• Χώροι υγιεινής: άμεσος φυσικός Ή τεχνητός αερισμός"},
   {n:"Άρθρο 22",t:"Ηχομόνωση — Ηχοπροστασία",d:"Κατηγορίες ακουστικής άνεσης Α/Β/Γ.",k:"ηχομόνωση ακουστική άνεση ντεσιμπέλ κατηγορία R'w",
    p:"• Παράμετροι: R'w (αερόφερτος), L'n,w (κτυπογενής), LAeq,h (εξωτερικός), LpA (εγκαταστάσεις)\n• Κατηγορίες: Α υψηλή / Β κανονική / Γ χαμηλή\n• ΟΛΑ τα νέα κτίρια: τουλάχιστον κατηγορία Β\n• Ενδεικτικά κατοικία (κατ. Β): R'w ≥50 dB μεταξύ διαμερισμάτων, L'n,w ≤60 dB, εξωτ. θόρυβος ≤35 dB(A), εγκαταστάσεις ≤30 dB(A)\n• Μετρήσεις/πιστοποίηση από εργαστήρια κατά ΕΛΟΤ"},
   {n:"Άρθρο 23",t:"Πεζοδρόμια",d:"Κατασκευή, υπόχρεοι, δαπάνες.",k:"πεζοδρόμιο υπόχρεοι κατασκευή δαπάνη",
    p:"• Στόχος: συνεχής, ασφαλής, χωρίς εμπόδια κυκλοφορία πεζών & ΑμεΑ\n• Υπόχρεοι κατασκευής/συντήρησης: οι ιδιοκτήτες των παρόδιων ακινήτων (κατά κανόνα), με προδιαγραφές δήμου\n• Τρόπος κατασκευής & αναλογισμός δαπανών ορίζονται αναλυτικά"},
  ]},

   {n:"Άρθρο 25",t:"Προσβασιμότητα",d:"ΑμεΑ σε συνδυασμό με ΝΟΚ 26.",k:"προσβασιμότητα ΑμεΑ οδεύσεις",
    p:"• Απαιτήσεις προσβασιμότητας σε συνδυασμό με ΝΟΚ άρθ. 26 και τις οδηγίες «Σχεδιάζοντας για Όλους»\n• Προσβάσιμες οδεύσεις, είσοδοι, χώροι υγιεινής ΑμεΑ σε ειδικά κτίρια, σήμανση"},
   {n:"Άρθρο 26",t:"Υποχρέωση μελετών υδραυλικών — Η/Μ",d:"Πότε απαιτούνται.",k:"μελέτες υδραυλικά ΗΜ ηλεκτρομηχανολογικά άδεια",

   {n:"Άρθρο 27",t:"Εσωτερικές υδραυλικές εγκαταστάσεις",d:"Ύδρευση, αποχέτευση, όμβρια, πυρόσβεση.",k:"ύδρευση αποχέτευση όμβρια πυρόσβεση μηχανοσίφωνας",

   {n:"Άρθρο 28",t:"Εγκαταστάσεις θέρμανσης",d:"Λεβητοστάσια, κεντρική θέρμανση.",k:"θέρμανση λεβητοστάσιο καυστήρας",
    p:"• Γενικές απαιτήσεις + ειδικές για κεντρική θέρμανση: χώροι λεβητοστασίων, αερισμός, καύσιμα, ασφάλεια, απαγωγή καυσαερίων"},
   {n:"Άρθρο 29",t:"Κλιματισμός — αερισμός",d:"Μηχανοστάσια, αεραγωγοί.",k:"κλιματισμός αεραγωγοί μηχανοστάσιο κραδασμοί",
    p:"• Μηχανοστάσια κλιματισμού: χωροθέτηση & ηχομόνωση\n• Σωληνώσεις/αεραγωγοί: μονώσεις, διελεύσεις\n• Θόρυβος-κραδασμοί: αντικραδασμικά, όρια προς χώρους κύριας χρήσης"},
   {n:"Άρθρο 30",t:"Ανελκυστήρες",d:"Πότε απαιτούνται, διαστάσεις.",k:"ανελκυστήρας ασανσέρ θάλαμος διαστάσεις προσβάσιμος",
    p:"• Πότε είναι υποχρεωτικός ανελκυστήρας (ανάλογα ορόφους/χρήση) και πότε προσβάσιμος ΑμεΑ\n• Ελάχιστες διαστάσεις θαλάμου (βλ. & εγκύκλιο ΥΠΕΝ 29640/1000/2022 για υφιστάμενες κατοικίες)\n• Μηχανοστάσια/φρεάτια: απαιτήσεις ασφαλείας"},
   {n:"Άρθρο 31",t:"Ηλεκτρικές εγκαταστάσεις",d:"Ισχυρά/ασθενή ρεύματα, υποσταθμοί.",k:"ηλεκτρικά ρεύματα υποσταθμός δίκτυα επικοινωνιών",
    p:"• Ισχυρά ρεύματα: κατά το ισχύον πρότυπο ηλεκτρικών εγκαταστάσεων (ΕΛΟΤ 60364/ΥΑ 101195/2021)\n• Υποσταθμοί: χωροθέτηση/προσβάσεις\n• Δίκτυα ηλεκτρονικών επικοινωνιών: κατά ΥΑ 41020/819/2012 (εσωτερικά δίκτυα)"},
   {n:"Άρθρο 32",t:"Αλεξικέραυνα",d:"Αντικεραυνική προστασία.",k:"αλεξικέραυνο αντικεραυνική",

   Endpoints: Edge Function (παραγωγή) → fallback direct (μέσα σε Claude).
===================================================================== */
const EDGE_URL  = "https://oucqqudfdimccgowvpqp.supabase.co/functions/v1/nomothesia-ai";
const DIRECT_URL = "https://api.anthropic.com/v1/messages";

async function askAI(payload){
  async function call(url){
    const res = await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    if(!res.ok) throw new Error("HTTP "+res.status);
    return res.json();
  }
  try{ return await call(EDGE_URL); }
  catch(e){ return await call(DIRECT_URL); }
}

// Πλήρης απάντηση: αν κοπεί στο όριο tokens, συνεχίζει αυτόματα (έως 3 γύροι)
async function askAIFull(payload, maxRounds=3){
  let msgs = payload.messages.slice();
  let full = "";
  for(let r=0; r<maxRounds; r++){
    const data = await askAI(Object.assign({}, payload, {messages:msgs}));
    const txt = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
    full += (full ? "\n" : "") + txt;
    if(data.stop_reason !== "max_tokens") break;
    msgs = msgs.concat([
      {role:"assistant", content:txt},
      {role:"user", content:"Η απάντηση κόπηκε. Συνέχισε ΑΚΡΙΒΩΣ από το σημείο που σταμάτησες, χωρίς καμία επανάληψη."}
    ]);
  }
  return full.trim();
}

      wrap.querySelector(".subline").addEventListener("click", ()=>{
        const idx = +wrap.dataset.sidx;
        const nowOpen = !wrap.classList.contains("open");
        wrap.classList.toggle("open", nowOpen);
        it._sub = it._sub || {}; it._sub[idx] = it._sub[idx] || {};
        it._sub[idx].open = nowOpen;
        if(nowOpen){
          const lineText = wrap.querySelector(".subline").textContent.replace(/^›\s*/,"").trim();
          loadSub(key, it, idx, lineText, wrap);
        }
      });
    });
  });
}

/* ---------- Γραμμές περιεχομένου: κάθε bullet ανοίγει inline εξήγηση ---------- */
function renderContentLines(it){
  const src = it.p || it.d;
  const lines = src.split("\n");
  let out = "", si = 0;
  for(const ln of lines){
    const t = ln.trim();
    if(!t){ continue; }
    if(t.startsWith("•")){
      const idx = si++;
      const cached = it._sub && it._sub[idx];
      const isOpen = cached && cached.open;
      out += `<div class="subwrap${isOpen?" open":""}" data-sidx="${idx}">
        <button type="button" class="subline"><span class="chev">›</span>${mdLite(t.replace(/^•\s*/,""))}</button>
        <div class="subans">${cached && cached.text ? mdLite(cached.text) : ""}</div>
      </div>`;
    } else {
      out += `<div class="artcontent" style="margin-bottom:7px">${mdLite(t)}</div>`;
    }
  }
  return `<div class="sublines">${out}</div>`;
}

async function loadSub(key, it, idx, lineText, wrap){
  it._sub = it._sub || {};
  it._sub[idx] = it._sub[idx] || {};
  const st = it._sub[idx];
  st.open = true;
  const ans = wrap.querySelector(".subans");
  if(st.text){ ans.innerHTML = mdLite(st.text); return; }
  if(st.loading) return;
  st.loading = true;
  ans.innerHTML = `<div class="subloading"><span class="dot"></span><span class="dot"></span><span class="dot"></span> Ερμηνεία…</div>`;
  try{
    const answer = await askAIFull({
      model:"claude-sonnet-4-6",
      max_tokens:1500,
      system:SYSTEM_ART,
      messages:[{role:"user", content:`${LAW_LABEL[key]} — ${it.n} («${it.t}»). Εξήγησέ μου αναλυτικά τη συγκεκριμένη διάταξη: «${lineText}»`}]
    });
    if(!answer) throw new Error("Κενή απάντηση");
    st.text = answer;
    ans.innerHTML = mdLite(answer);
  }catch(err){
    ans.innerHTML = `<span style="color:#7A2020">Σφάλμα (${esc(err.message)}). Πάτησε ξανά τη γραμμή.</span>`;
    st.text = null;
  }
  st.loading = false;
}

/* ---------- Μετάβαση σε συγκεκριμένο άρθρο από παραπομπή ---------- */
let backState = null; // {tab, q, label} — για το κουμπί «Πίσω»

function findItemByArt(key, num){
  const law = LAWS[key]; if(!law) return null;
  let best = null;
  law.chapters.forEach((ch,ci)=> ch.items.forEach((it,ii)=>{
    const ns = artNums(it.n);
    if(!ns.length) return;
    const a = ns[0], b = ns[ns.length-1];
    if(num>=a && num<=b){
      // προτίμησε το στενότερο εύρος (πιο συγκεκριμένο λήμμα)
      if(!best || (b-a) < best.span) best = {id:key+"|"+ci+"|"+ii, span:b-a};
    }
  }));
  return best ? best.id : null;
}

function showBackFab(){
  hideBackFab();
  if(!backState) return;
  const b = document.createElement("button");
  b.id = "backfab";
  b.textContent = "← " + backState.label;
  b.addEventListener("click", ()=>{
    const st = backState;
    backState = null; hideBackFab();
    switchTab(st.tab);
    if(st.tab==="corr" && st.q) renderCorr(st.q);
  });
  document.body.appendChild(b);
}
function hideBackFab(){ const e = document.getElementById("backfab"); if(e) e.remove(); }

function lineMatchesArt(text, num){
  // Κοιτάμε το προθεματικό τμήμα της γραμμής (π.χ. «Άρθ. 242-243:», «212↔ΝΟΚ 17:»)
  const head = text.slice(0, Math.max(text.indexOf(":"), 30) > 0 ? Math.max(text.indexOf(":"), 14) : 30);
  // εύρη τύπου 242-243 / 242–243
  const rr = head.match(/(\d+)\s*[–\-]\s*(\d+)/);
  if(rr && num >= +rr[1] && num <= +rr[2]) return true;
  // μεμονωμένοι αριθμοί
  const toks = head.match(/\d+/g) || [];
  return toks.some(t => +t === num);
}

function goToArticle(id, from, artNum){
  const found = getItem(id);
  if(!found) return;
  if(from){ backState = from; }
  openArts.add(id);
  switchTab(found.key);
  if(from) showBackFab();
  requestAnimationFrame(()=>{
    const card = main.querySelector(`.article[data-id="${CSS.escape(id)}"]`);
    if(!card) return;
    card.classList.add("open","flash");
    setTimeout(()=>card.classList.remove("flash"), 2500);
    // Ακριβής προσγείωση: άνοιξε τη συγκεκριμένη γραμμή του άρθρου μέσα στην ομάδα
    let target = null;
    if(artNum){
      for(const wrap of card.querySelectorAll(".subwrap")){
        const txt = wrap.querySelector(".subline").textContent.replace(/^›\s*/,"").trim();
        if(lineMatchesArt(txt, artNum)){ target = wrap; break; }
      }
    }
    if(target){
      if(!target.classList.contains("open")) target.querySelector(".subline").click();
      target.querySelector(".subline").classList.add("subflash");
      setTimeout(()=> target.querySelector(".subline").classList.remove("subflash"), 2600);
      target.scrollIntoView({behavior:"smooth", block:"center"});
    }else{
      card.scrollIntoView({behavior:"smooth", block:"start"});
    }
  });
}

async function verifyQuestion(q){
  if(busy) return;
  busy = true;
  document.getElementById("send").disabled = true;
  renderAI();
  try{
    let answer = await askAIFull({
      model:"claude-sonnet-4-6",
      max_tokens:1500,
      system:SYSTEM_REF + "\n\nΛΕΙΤΟΥΡΓΙΑ ΕΠΑΛΗΘΕΥΣΗΣ: Χρησιμοποίησε web search για να ΕΠΙΒΕΒΑΙΩΣΕΙΣ από επίσημες/έγκυρες πηγές (ΦΕΚ, et.gr, υπουργικές εγκυκλίους, έγκυρα νομικά sites) κάθε αριθμητικό μέγεθος της απάντησης. Διόρθωσε ό,τι διαφέρει και σημείωσε ρητά τι επιβεβαιώθηκε.",
      messages:[{role:"user", content:q + "\n\n(Επαλήθευσε τα μεγέθη με live αναζήτηση σε επίσημες πηγές.)"}],
      tools:[{type:"web_search_20250305",name:"web_search"}]
    });
    if(!answer) throw new Error("Κενή απάντηση");
    const refs = [];
    answer = answer.replace(/\[\[([a-z0-9]+\|\d+\|\d+)\]\]/g, (m,id)=>{ if(getItem(id) && !refs.includes(id)) refs.push(id); return ""; });
    answer = answer.replace(/^\s*ΣΧΕΤΙΚΑ:\s*$/gmi,"").replace(/\n{3,}/g,"\n\n").trim();
    chatHistory.push({role:"assistant", text:"✅ ΕΠΑΛΗΘΕΥΜΕΝΟ LIVE:\n"+answer, refs, verified:true});
  }catch(err){
    chatHistory.push({role:"assistant", err:true, text:"Σφάλμα επαλήθευσης ("+err.message+")."});
  }
  busy = false;
  document.getElementById("send").disabled = false;
  renderAI();
}

async function sendQuestion(){
  const ta = document.getElementById("q");
  const text = ta.value.trim();
  if(!text || busy) return;
  ta.value = "";
  chatHistory.push({role:"user", text});
  busy = true;
  document.getElementById("send").disabled = true;
  renderAI();

  try{
    const messages = chatHistory.filter(m=>!m.err).map(m=>({role:m.role==="user"?"user":"assistant", content:m.text}));
    let answer = await askAIFull({
      model:"claude-sonnet-4-6",
      max_tokens:1200,
      system:SYSTEM_REF,
      messages
    });
    if(!answer) throw new Error("Κενή απάντηση");
    // Εξαγωγή παραπομπών [[id]]
    const refs = [];
    answer = answer.replace(/\[\[([a-z0-9]+\|\d+\|\d+)\]\]/g, (m,id)=>{ if(getItem(id) && !refs.includes(id)) refs.push(id); return ""; });
    answer = answer.replace(/^\s*ΣΧΕΤΙΚΑ:\s*$/gmi,"").replace(/\n{3,}/g,"\n\n").trim();
    chatHistory.push({role:"assistant", text:answer, refs, q:text});
  }catch(err){
    chatHistory.push({role:"assistant", err:true,
      text:"Σφάλμα επικοινωνίας με το AI ("+err.message+"). Αν το τρέχεις στο hexis-app.gr, βεβαιώσου ότι έχει γίνει deploy η Edge Function «nomothesia-ai» στο Supabase."});
  }
  busy = false;
  document.getElementById("send").disabled = false;
  renderAI();
}

function renderCorr(q=""){
  const nq = norm(q.trim());
  let html = `
  <div class="lawmeta">
    <div class="fek">ΠΑΡΑΡΤΗΜΑΤΑ<br>Α–Β</div>
    <p>Το «κλειδί αποκωδικοποίησης» του Κώδικα 5306/2026: πού βρίσκεται σήμερα κάθε παλιά διάταξη και από πού προέρχεται κάθε νέο άρθρο. Ψάξε με οποιονδήποτε αριθμό (παλιό ή νέο) ή λέξη. Το ~ σημαίνει αντιστοίχιση κατά προσέγγιση — επιβεβαίωση από Παράρτημα ΦΕΚ Α΄88/2026.</p>
  </div>
  <div class="searchwrap">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="filter" type="search" placeholder="π.χ. 17, 212, βεβαίωση, κάλυψη, πισίνα…" value="${esc(q)}">
  </div>`;
  let any = false;
  for(const t of CORR_TABLES){
    const rows = t.rows.filter(r=> !nq || norm(r.slice(0,3).join(" ")).includes(nq));
    if(!rows.length) continue;
    any = true;
    html += `<table class="corrtable"><caption>${esc(t.title)}</caption>
      <thead><tr><th>${esc(t.head[0])}</th><th>${esc(t.head[1])}</th><th>${esc(t.head[2])}</th></tr></thead><tbody>`;
    for(const r of rows){
      const isNew = r[3]===1;
      const neu = String(r[1]).replace("~"," <span class='apx'>~</span>");
      const newTxt = neu.startsWith("→")||neu.startsWith("Ι")||neu.startsWith("Μ")?neu:"άρθ. "+neu;
      // Συνδέσιμα κελιά: παλιό → tab παλιού νόμου, νέο → tab Κώδικα
      let oldCell = esc(r[0]).replace("~","")+`<span class="apx">${r[0].includes("~")?" ~":""}</span>`;
      let newCell = newTxt;
      if(!t.noLink){
        const on = (String(r[0]).match(/\d+/)||[])[0];
        if(t.oldKey && on){
          const oid = findItemByArt(t.oldKey, +on);
          if(oid) oldCell = `<button type="button" class="linkcell" data-goid="${esc(oid)}" data-artnum="${on}">${oldCell}</button>`;
        }
        const nn = (String(r[1]).match(/\d+/)||[])[0];
        if(nn){
          const nid = findItemByArt("tagaras", +nn);
          if(nid) newCell = `<button type="button" class="linkcell" data-goid="${esc(nid)}" data-artnum="${nn}">${newTxt}</button>`;
        }
      }
      html += `<tr${isNew?' class="newrow"':''}><td class="old">${oldCell}</td><td class="new">${newCell}</td><td>${hl(r[2],q)}</td></tr>`;
    }
    html += `</tbody></table>`;
    if(t.note) html += `<div class="corrnote">ℹ️ ${esc(t.note)}</div>`;
  }
  if(!any) html += `<div class="noresults">Τίποτα για «${esc(q)}» στους πίνακες — δοκίμασε την AI Αναζήτηση.</div>`;
  html += `<div class="note"><b>Σημείωση:</b> Οι επίσημοι πλήρεις πίνακες βρίσκονται στα Παραρτήματα Α–Β του ΦΕΚ Α΄88/08.06.2026 (632 σελ.). Εδώ αποδίδονται οι αντιστοιχίσεις καθημερινής χρήσης· όσες σημειώνονται με ~ θέλουν επιβεβαίωση από το ΦΕΚ.</div>`;
  main.innerHTML = html;
  const filter = document.getElementById("filter");
  filter.addEventListener("input", e=> renderCorr(e.target.value));
  if(q){ filter.focus(); filter.setSelectionRange(filter.value.length, filter.value.length); }
  main.querySelectorAll(".linkcell").forEach(b=>{
    b.addEventListener("click", ()=> goToArticle(b.dataset.goid, {tab:"corr", q, label:"Αντιστοιχίσεις"}, +b.dataset.artnum || null));
  });
}

/* ---------- Tabs ---------- */
function switchTab(key){
  currentTab = key;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active", b.dataset.tab===key));
  askbar.classList.toggle("visible", key==="ai");
  if(key==="ai") renderAI(); else if(key==="corr") renderCorr(); else renderLaw(key);
  if(key!=="ai") window.scrollTo(0,0);
}
document.querySelectorAll("nav button").forEach(b=>{
  b.addEventListener("click", ()=>{ backState = null; hideBackFab(); switchTab(b.dataset.tab); });
});
document.getElementById("send").addEventListener("click", sendQuestion);
document.getElementById("q").addEventListener("keydown", e=>{
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); sendQuestion(); }
});

switchTab("tagaras");

/* ---------- Εβδομαδιαίος έλεγχος τροποποιήσεων νομοθεσίας ---------- */
const CONTENT_DATE = "2026-07-24"; // ημερομηνία τελευταίας ενημέρωσης του ενσωματωμένου περιεχομένου
const UPD_KEY = "hexis_nomo_updcheck_v1";
function safeGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function safeSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }

const updbar = document.getElementById("updbar");
const updtitle = document.getElementById("updtitle");
const updbody = document.getElementById("updbody");
const upddetail = document.getElementById("upddetail");
document.getElementById("upddismiss").addEventListener("click", ()=>{
  updbar.classList.add("hidden");
  const st = safeGet(UPD_KEY) || {};
  st.dismissed = st.resultHash || true;
  safeSet(UPD_KEY, st);
});
upddetail.addEventListener("click", ()=> updbody.classList.toggle("hidden"));

function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))|0; } return String(h); }

async function runUpdateCheck(auto){
  updbar.classList.remove("hidden","ok");
  upddetail.classList.add("hidden");
  updbody.classList.add("hidden");
  updtitle.textContent = "🔄 Έλεγχος τροποποιήσεων νομοθεσίας (live)…";
  try{
    const answer = await askAIFull({
      model:"claude-sonnet-4-6",
      max_tokens:900,
      system:"Είσαι ο μηχανισμός ελέγχου ενημερώσεων της εφαρμογής HEXIS Νομοθεσία. Με web search σε επίσημες/έγκυρες πηγές (ΦΕΚ/et.gr, ypen.gov.gr, e-nomothesia, b2green, michanikos) ελέγχεις αν υπάρχουν ΝΕΕΣ τροποποιήσεις ΜΕΤΑ τις "+CONTENT_DATE+" στα εξής: (1) Κώδικας Χωροταξίας-Πολεοδομίας ν.5306/2026 «Ταγαράς» (γνωστές ήδη: ν.5317/2026), (2) Κτιριοδομικός Κανονισμός 2023 (γνωστή ήδη: ΦΕΚ Β'6995/2025), (3) ν.4495/2017 (γνωστή ήδη: κωδικοποίηση έως ν.5297/2026), (4) προθεσμίες δηλώσεων αυθαιρέτων. ΜΟΡΦΗ ΑΠΑΝΤΗΣΗΣ, ΑΥΣΤΗΡΑ: Πρώτη γραμμή ΜΟΝΟ τη λέξη ΚΑΜΙΑ ή τη λέξη ΑΛΛΑΓΕΣ. Αν ΑΛΛΑΓΕΣ, ακολουθούν bullets: «• [νομοθέτημα] — άρθ. Χ: τι άλλαξε (ΦΕΚ/νόμος τροποποίησης, ημερομηνία)». Μόνο ΕΠΙΒΕΒΑΙΩΜΕΝΕΣ αλλαγές με πηγή — όχι σχέδια νόμων, όχι φήμες.",
      messages:[{role:"user", content:"Έλεγξε για τροποποιήσεις μετά τις "+CONTENT_DATE+". Σήμερα: "+new Date().toLocaleDateString("el-GR")+"."}],
      tools:[{type:"web_search_20250305",name:"web_search"}]
    });
    const clean = answer.trim();
    const changed = /^ΑΛΛΑΓΕΣ/i.test(clean);
    const body = clean.replace(/^(ΚΑΜΙΑ|ΑΛΛΑΓΕΣ)\s*/i,"").trim();
    const prev = safeGet(UPD_KEY) || {};
    const st = {last: Date.now(), status: changed?"changes":"ok", text: body, resultHash: hashStr(clean), dismissed: prev.dismissed};
    safeSet(UPD_KEY, st);
    showUpdResult(st, auto);
  }catch(err){
    if(auto){ updbar.classList.add("hidden"); }
    else{ updtitle.textContent = "⚠ Ο έλεγχος απέτυχε ("+err.message+") — δοκίμασε ξανά αργότερα."; }
  }
}

function showUpdResult(st, auto){
  if(st.status === "ok"){
    updbar.classList.remove("hidden"); updbar.classList.add("ok");
    updtitle.textContent = "✅ Νομοθεσία ενημερωμένη — κανένα νέο ΦΕΚ τροποποίησης (έλεγχος: "+new Date(st.last).toLocaleDateString("el-GR")+")";
    if(auto) setTimeout(()=> updbar.classList.add("hidden"), 6000);
  }else{
    if(st.dismissed && st.dismissed === st.resultHash){ updbar.classList.add("hidden"); return; }
    updbar.classList.remove("hidden","ok");
    updtitle.textContent = "🔔 Εντοπίστηκαν πιθανές τροποποιήσεις — έλεγξε πριν βασιστείς στα ενσωματωμένα μεγέθη";
    updbody.innerHTML = mdLite(st.text || "");
    upddetail.classList.remove("hidden");
  }
}

function scheduleUpdateCheck(){
  if(!safeSet("hexis_nomo_probe","1")){ return; } // χωρίς localStorage (π.χ. preview) → μόνο χειροκίνητος έλεγχος
  const st = safeGet(UPD_KEY);
  const wk = 7*24*3600*1000;
  if(!st || !st.last || (Date.now() - st.last) > wk){
    runUpdateCheck(true);
  }else if(st.status === "changes"){
    showUpdResult(st, true);
  }
}
scheduleUpdateCheck();
</script>
